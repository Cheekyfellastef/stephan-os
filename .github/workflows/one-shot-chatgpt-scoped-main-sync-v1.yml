name: One-shot ChatGPT Scoped Main Sync V1

on:
  push:
    branches:
      - fix/chatgpt-scoped-live-status-v1

permissions:
  contents: write

concurrency:
  group: one-shot-chatgpt-scoped-main-sync-v1
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sole canonical branch
        uses: actions/checkout@v4
        with:
          ref: fix/chatgpt-scoped-live-status-v1
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify exact sync starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0e78d229955e0e171ed517fa72f201eed9fd6678"
          git fetch origin main
          MAIN_HEAD="$(git rev-parse origin/main)"
          test "$MAIN_HEAD" = "1659e3bff271d7bd52b8297a0bc6cbbcfb7288f0"
          mapfile -t overlap < <(git diff --name-only 771d3da7457c41b5bc572a4c0dedf786f2c6162f..origin/main | grep -E '^(docs/operations/chatgpt-shared-workspace-live-status\.md|scripts/chatgpt-shared-workspace-github-relay(\.test)?\.mjs|shared/agents/chatGptParticipantBridgeV1(\.test)?\.mjs|shared/agents/sharedWorkspaceScopedDeliveryStatusV1(\.test)?\.mjs)$' || true)
          test "${#overlap[@]}" -eq 0

      - name: Merge current main without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff origin/main
          rm -f .github/workflows/one-shot-chatgpt-scoped-main-sync-v1.yml
          git add -A
          git diff --cached --check

      - name: Run focused scoped bridge regressions on merged tree
        run: >-
          node --test
          shared/agents/sharedWorkspaceScopedDeliveryStatusV1.test.mjs
          shared/agents/chatGptParticipantBridgeV1.test.mjs
          scripts/chatgpt-shared-workspace-github-relay.test.mjs

      - name: Run import guard on merged tree
        shell: bash
        run: |
          set -euo pipefail
          node scripts/guard-import-structure.mjs

      - name: Commit history-preserving main sync and publish exact permanent estate
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'Synchronize scoped live status with current main'
          test "$(git rev-parse HEAD^2)" = "1659e3bff271d7bd52b8297a0bc6cbbcfb7288f0"
          mapfile -t actual < <(git diff --name-only origin/main...HEAD | sort)
          expected=(
            'docs/operations/chatgpt-shared-workspace-live-status.md'
            'scripts/chatgpt-shared-workspace-github-relay.mjs'
            'scripts/chatgpt-shared-workspace-github-relay.test.mjs'
            'shared/agents/chatGptParticipantBridgeV1.mjs'
            'shared/agents/chatGptParticipantBridgeV1.test.mjs'
            'shared/agents/sharedWorkspaceScopedDeliveryStatusV1.mjs'
            'shared/agents/sharedWorkspaceScopedDeliveryStatusV1.test.mjs'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq 7
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          test ! -e .github/workflows/one-shot-chatgpt-scoped-main-sync-v1.yml
          git diff --check origin/main...HEAD
          git push origin HEAD:fix/chatgpt-scoped-live-status-v1
