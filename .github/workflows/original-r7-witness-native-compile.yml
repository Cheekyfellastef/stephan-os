name: Original r7 Windows witness native compile (source only)

on:
  pull_request:
    paths:
      - 'src/windows/Stephanos.OriginalR7CustodyWitness/**'
      - '.github/workflows/original-r7-witness-native-compile.yml'

permissions:
  contents: read

jobs:
  compile-only:
    name: Windows native witness compile only
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR source without persisted write credential
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned .NET SDK line
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows SCM host only
        shell: pwsh
        run: |
          dotnet build src/windows/Stephanos.OriginalR7CustodyWitness/Stephanos.OriginalR7CustodyWitness.csproj --configuration Release --nologo -p:Deterministic=true
      - name: Confirm no runtime commissioning executed
        shell: pwsh
        run: |
          Write-Output 'WINDOWS_R7_WITNESS_COMPILE_ONLY=true'
          Write-Output 'WINDOWS_R7_WITNESS_INSTALLED=false'
          Write-Output 'WINDOWS_R7_WITNESS_SIGNING_ENABLED=false'
          Write-Output 'ORIGINAL_R7_LEASE_RELEASED=false'
# TEMPORARY VALIDATION ONLY: remove before any protected source merge.
