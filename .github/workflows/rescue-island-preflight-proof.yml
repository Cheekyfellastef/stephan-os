name: Rescue Island Read-Only Preflight Proof

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'shared/agents/rescueIslandPreflightV1.mjs'
      - 'shared/agents/rescueIslandPreflightV1.test.mjs'
      - 'docs/architecture/rescue-builder-island-v1.md'
      - '.github/workflows/rescue-island-preflight-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rescue-island-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read source at exact proposed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Rescue Island read-only safety and separate identity
        run: |
          node --check shared/agents/rescueIslandPreflightV1.mjs
          node --test shared/agents/rescueIslandPreflightV1.test.mjs
      - name: Verify no source whitespace errors
        run: git diff --check HEAD~1 HEAD
