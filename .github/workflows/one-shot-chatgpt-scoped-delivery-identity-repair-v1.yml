name: One-shot ChatGPT Scoped Delivery Identity Repair V1

on:
  push:
    branches:
      - fix/chatgpt-scoped-live-status-v1

permissions:
  contents: write

concurrency:
  group: one-shot-chatgpt-scoped-delivery-identity-repair-v1
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sole canonical repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/chatgpt-scoped-live-status-v1
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bind evidence to exact scoped identity
        run: node scripts/repair-chatgpt-scoped-delivery-identity-v1.mjs

      - name: Run focused scoped bridge regressions
        run: >-
          node --test
          shared/agents/sharedWorkspaceScopedDeliveryStatusV1.test.mjs
          shared/agents/chatGptParticipantBridgeV1.test.mjs
          scripts/chatgpt-shared-workspace-github-relay.test.mjs

      - name: Run import guard and diff check
        shell: bash
        run: |
          set -euo pipefail
          node scripts/guard-import-structure.mjs
          git diff --check

      - name: Remove construction machinery and publish permanent repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/repair-chatgpt-scoped-delivery-identity-v1.mjs
          rm -f .github/workflows/one-shot-chatgpt-scoped-delivery-identity-repair-v1.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Bind scoped delivery evidence to exact identity'

          git fetch origin main
          mapfile -t actual < <(git diff --name-only origin/main...HEAD | sort)
          expected=(
            'docs/operations/chatgpt-shared-workspace-live-status.md'
            'scripts/chatgpt-shared-workspace-github-relay.mjs'
            'scripts/chatgpt-shared-workspace-github-relay.test.mjs'
            'shared/agents/chatGptParticipantBridgeV1.mjs'
            'shared/agents/chatGptParticipantBridgeV1.test.mjs'
            'shared/agents/sharedWorkspaceScopedDeliveryStatusV1.mjs'
            'shared/agents/sharedWorkspaceScopedDeliveryStatusV1.test.mjs'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq 7
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          test ! -e scripts/repair-chatgpt-scoped-delivery-identity-v1.mjs
          test ! -e .github/workflows/one-shot-chatgpt-scoped-delivery-identity-repair-v1.yml
          git diff --check origin/main...HEAD

          git push origin HEAD:fix/chatgpt-scoped-live-status-v1
