name: Windows Authority Specialist V1 Retry 2

on:
  push:
    branches:
      - fix/windows-authority-specialist-v1

permissions:
  contents: write

concurrency:
  group: windows-authority-specialist-v1-retry2
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact retry branch
        uses: actions/checkout@v4
        with:
          ref: fix/windows-authority-specialist-v1
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact retry checkpoint
        shell: bash
        run: |
          set -euo pipefail
          exact_main='2c9d5666839a1b31205d397baec075e4e758784d'
          test "$(git rev-parse origin/main)" = "$exact_main"
          git merge-base --is-ancestor "$exact_main" HEAD
          expected="$(printf '%s\n' \
            .github/workflows/windows-authority-specialist-v1-bootstrap.yml \
            .github/workflows/windows-authority-specialist-v1-retry.yml \
            .github/workflows/windows-authority-specialist-v1-retry2.yml | sort)"
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          printf 'EXPECTED\n%s\nACTUAL\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Extract and correct bounded constructor steps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/windows-authority-specialist-v1-bootstrap.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          names = [
              'Add the pure Windows authority specialist',
              'Wire deterministic specialist sealing into the trusted reviewer',
              'Remove bootstrap and verify exact six-file estate',
              'Parse and run specialist and protected boundary suites',
              'Prove the specialist against exact PR 1638 Windows sources',
              'Revalidate main, commit and push normally',
          ]

          def extract(name: str) -> str:
              marker = f'      - name: {name}'
              start = lines.index(marker)
              run_index = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
              body = []
              for line in lines[run_index + 1:]:
                  if line.startswith('      - name: ') or line.startswith('      - uses: '):
                      break
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif line == '':
                      body.append('')
                  else:
                      raise SystemExit(f'unexpected indentation in {name}: {line!r}')
              return '\n'.join(body).rstrip() + '\n'

          out = Path('.specialist-retry-steps')
          out.mkdir(exist_ok=True)
          for index, name in enumerate(names, start=1):
              script = extract(name)
              if name == 'Wire deterministic specialist sealing into the trusted reviewer':
                  old = '''            "  const candidates = (Array.isArray(input.reviews) ? input.reviews : [])\\n",
            `${deterministicBranch}  const candidates = (Array.isArray(input.reviews) ? input.reviews : [])\\n`,'''
                  new = '''            "  const reviews = Array.isArray(input.reviews) ? input.reviews : [];\\n",
            `${deterministicBranch}  const reviews = Array.isArray(input.reviews) ? input.reviews : [];\\n`,'''
                  if script.count(old) != 1:
                      raise SystemExit(f'adjudication seam count changed: {script.count(old)}')
                  script = script.replace(old, new)
              if name == 'Remove bootstrap and verify exact six-file estate':
                  old = 'rm -f .github/workflows/windows-authority-specialist-v1-bootstrap.yml'
                  new = 'rm -f .github/workflows/windows-authority-specialist-v1-bootstrap.yml .github/workflows/windows-authority-specialist-v1-retry.yml .github/workflows/windows-authority-specialist-v1-retry2.yml\nrm -rf .specialist-retry-steps'
                  if script.count(old) != 1:
                      raise SystemExit('bootstrap removal seam changed')
                  script = script.replace(old, new)
              (out / f'{index:02d}.sh').write_text(script, encoding='utf-8')
          PY

      - name: Run corrected construction and verification
        shell: bash
        run: |
          set -euo pipefail
          for script in .specialist-retry-steps/0{1..5}.sh; do
            echo "RUNNING_CONSTRUCTOR_STEP=$script"
            bash "$script"
          done

      - name: Publish exact six-file result
        shell: bash
        run: |
          set -euo pipefail
          bash .specialist-retry-steps/06.sh
