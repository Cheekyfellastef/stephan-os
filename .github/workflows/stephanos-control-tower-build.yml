name: Stephanos Control Tower - Sovereign Control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Choose the fixed request; observing does not start repair or building.'
        required: true
        default: BUILD_NEXT_ELIGIBLE_GOAL
        type: choice
        options:
          - BUILD_NEXT_ELIGIBLE_GOAL
          - OBSERVE_CONTROL_SYSTEM
  # Protected-main owner pushes can re-arm the EXISTING fixed build wake.
  # The producer still authenticates the exact sender, main HEAD and run.
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/stephanos-control-tower-build.yml'
      - 'shared/agents/controlTowerBuildRequestV1*'
      - 'shared/agents/controlTowerBuildReaderV1*'
      - 'shared/agents/controlTowerBuildBeaconFactsV1*'
      - 'shared/agents/sovereignControlSystemStatusV1*'
      - 'shared/agents/sovereignControlConversationV1*'
      - 'shared/agents/controlTowerRequestObservationV1*'
      - 'shared/agents/stephanosConversationRouterV1*'
      - 'stephanos-server/services/sovereignControlConversationService*'
      - 'stephanos-server/routes/ai.js'
      - 'apps/stephanos-ai/**'
      - 'tests/stephanos-ai-control*'
      - 'tests/stephanos-ai-sovereign-control*'
      - 'tests/stephanos-conversation-router-v1.test.mjs'
      - 'package.json'
      - 'shared/agents/fixtures/controlTowerBuildV1.mjs'
      - 'shared/agents/mailboxFreeGitHubEvidenceReaderV1.mjs'
      - 'shared/agents/mailboxFreeGoalNominationV1.mjs'
      - 'scripts/control-tower-build-request-v1.mjs'
      - 'scripts/control-tower-build-consumer-v1*'
      - 'scripts/sovereign-commander-native-inspect*'
      - 'scripts/canonical-mailbox-execution-ledger-v1.mjs'
      - 'scripts/canonical-mailbox-control-tower-observation.test.mjs'
      - 'scripts/battle-bridge-sovereign-relay-daemon.mjs'
      - 'docs/architecture/control-tower-build-start-v1.md'
      - 'docs/architecture/sovereign-conversational-control-v1.md'

permissions: {}

concurrency:
  group: stephanos-control-tower-build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  contract-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: >-
          node --experimental-vm-modules --test shared/agents/controlTowerBuildRequestV1.test.mjs
          shared/agents/controlTowerBuildReaderV1.test.mjs
          scripts/control-tower-build-consumer-v1.test.mjs
          shared/agents/controlTowerBuildBeaconFactsV1.test.mjs
          scripts/sovereign-commander-native-inspect.test.mjs
          shared/agents/sovereignControlSystemStatusV1.test.mjs
          shared/agents/sovereignControlConversationV1.test.mjs
          shared/agents/controlTowerRequestObservationV1.test.mjs
          scripts/canonical-mailbox-control-tower-observation.test.mjs
          stephanos-server/services/sovereignControlConversationService.test.js
          stephanos-server/services/sovereignCommanderStatusTool.test.js
          tests/stephanos-conversation-router-v1.test.mjs
          tests/stephanos-ai-control-surface.test.mjs
          tests/stephanos-ai-agent-router-integration.test.mjs
          tests/stephanos-ai-launcher-entry.test.mjs
          shared/agents/mailboxFreeGitHubEvidenceReaderV1.test.mjs
          shared/agents/mailboxFreeGoalNominationV1.test.mjs
          shared/agents/sovereignRelayMeshV1.test.mjs
          shared/agents/mailboxFreeGoalDiscoveryV1.test.mjs
          shared/agents/sovereignMaintenanceAdmissionV1.test.mjs
          scripts/canonical-mailbox-rotation-protocol.test.mjs
          scripts/battle-bridge-github-command-mailbox-outbox-guard-v1.test.mjs
      - name: Install declared browser-test dependency
        run: npm install --ignore-scripts --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.54.0
      - name: Install Chromium for interface proof
        run: npx playwright install --with-deps chromium
      - name: Exercise desktop and phone control conversations
        env:
          STEPHANOS_CONTROL_BROWSER_SCREENSHOT: ${{ runner.temp }}/sovereign-control-desktop.png
        run: npm run stephanos:control:browser:test
      - name: Retain interface proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-control-interface-${{ github.run_id }}
          path: ${{ runner.temp }}/sovereign-control-desktop.png
          if-no-files-found: ignore
          retention-days: 30

  request-build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor == 'Cheekyfellastef')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Authenticate owner and stage the selected fixed request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/control-tower-build-request-v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: stephanos-control-tower-build-${{ github.run_id }}
          path: ${{ runner.temp }}/control-tower-build-request.json
          retention-days: 30
          if-no-files-found: error
