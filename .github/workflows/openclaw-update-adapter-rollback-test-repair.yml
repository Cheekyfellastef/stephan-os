name: Repair OpenClaw Adapter Rollback Regression

on:
  pull_request:
    branches:
      - agent/1415-openclaw-staged-updater-v1
    types:
      - synchronize
    paths:
      - '.github/workflows/openclaw-update-adapter-rollback-test-repair.yml'
      - 'shared/agents/openClawUpdateBattleBridgeAdapterV1.test.mjs'

permissions:
  contents: write

concurrency:
  group: repair-openclaw-update-adapter-rollback-regression
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'Cheekyfellastef/stephan-os' &&
      github.event.pull_request.number == 1662 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/1415-openclaw-update-battle-bridge-adapter-v1' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact reviewed source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object shared/agents/openClawUpdateBattleBridgeAdapterV1.mjs)" = "b76bdd32c54f292e19ad4fd180f9d55027b7376e"
          test "$(git hash-object shared/agents/openClawUpdateBattleBridgeAdapterV1.test.mjs)" = "3d77660e415e0e0a04bee2d5b04c7df42ec655f3"

      - name: Repair automatic rollback failure regression setup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('shared/agents/openClawUpdateBattleBridgeAdapterV1.test.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "function handlers({ failAt = '', publishFails = false, calls = [] } = {}) {\n",
                  "function handlers({ failAt = '', publishFails = false, calls = [] } = {}) {\n  const failures = new Set(Array.isArray(failAt) ? failAt : [failAt].filter(Boolean));\n",
              ),
              (
                  "    const failed = failAt === name;\n",
                  "    const failed = failures.has(name);\n",
              ),
              (
                  "    handlers({ failAt: 'restoreProtectedBackup', calls }),\n",
                  "    handlers({ failAt: ['verifyPostUpdateHealth', 'restoreProtectedBackup'], calls }),\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one bounded replacement, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate fixed executor and mailbox contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check shared/agents/openClawUpdateBattleBridgeAdapterV1.mjs
          node --test \
            shared/agents/openClawUpdateBattleBridgeAdapterV1.test.mjs \
            scripts/openclaw-battle-bridge-update-adapter.test.mjs \
            shared/agents/battleBridgeGitHubCommandMailbox.test.mjs \
            scripts/battle-bridge-github-command-mailbox.test.mjs
          git diff --check

      - name: Commit bounded repair and remove one-shot workflow
        shell: bash
        env:
          TARGET_BRANCH: agent/1415-openclaw-update-battle-bridge-adapter-v1
        run: |
          set -euo pipefail
          git config user.name "stephanos-openclaw-update-builder[bot]"
          git config user.email "stephanos-openclaw-update-builder[bot]@users.noreply.github.com"
          git rm .github/workflows/openclaw-update-adapter-rollback-test-repair.yml
          git add shared/agents/openClawUpdateBattleBridgeAdapterV1.test.mjs
          git diff --cached --check
          git commit -m "Repair automatic rollback failure regression"
          git push origin "HEAD:${TARGET_BRANCH}"
