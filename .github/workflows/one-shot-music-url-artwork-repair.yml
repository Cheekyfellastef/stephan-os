name: One-shot Music URL Artwork Repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/one-shot-music-url-artwork-repair.mjs'
      - '.github/workflows/one-shot-music-url-artwork-repair.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-shot-music-url-artwork-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/music-tile-automatic-url-artwork-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/music-tile-automatic-url-artwork-v2
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Bind exact current main parent
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "e41d7a90da563fe1e54cc6c799b0a9c275c30592"
          git merge-base --is-ancestor e41d7a90da563fe1e54cc6c799b0a9c275c30592 HEAD

      - name: Apply bounded six-file repair
        run: node scripts/one-shot-music-url-artwork-repair.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install focused test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm --prefix stephanos-server install --ignore-scripts --no-audit --no-fund

      - name: Run focused source and provider tests
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/music-tile/engine/nativeCatalogSearch.js
          node --check apps/music-tile/engine/nativeCatalogAutoApply.js
          node --check stephanos-server/services/musicCatalogSearch.js
          node --test tests/music-provider-neutral-catalog-search.test.mjs
          node --test tests/music-intelligence-centre-vnext.test.mjs
          git diff --check

      - name: Publish only settled Music Tile source and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Stephanos GitHub Repair"
          git config user.email "actions@users.noreply.github.com"
          git restore -- package-lock.json stephanos-server/package.json stephanos-server/package-lock.json 2>/dev/null || true
          rm -f scripts/one-shot-music-url-artwork-repair.mjs
          rm -f .github/workflows/one-shot-music-url-artwork-repair.yml
          git add \
            apps/music-tile/engine/nativeCatalogSearch.js \
            apps/music-tile/engine/nativeCatalogAutoApply.js \
            stephanos-server/services/musicCatalogSearch.js \
            tests/music-intelligence-centre-vnext.test.mjs \
            tests/music-provider-neutral-catalog-search.test.mjs \
            tests/music-tile-rating-playback-browser.test.mjs \
            scripts/one-shot-music-url-artwork-repair.mjs \
            .github/workflows/one-shot-music-url-artwork-repair.yml
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "8"
          git diff --cached --check
          git commit -m "Automatically resolve Music Tile URLs and artwork"
          git push origin HEAD:fix/music-tile-automatic-url-artwork-v2
