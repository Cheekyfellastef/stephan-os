name: Repair goal admission provenance

on:
  push:
    branches:
      - openclaw/critical-2002-goal-building-self-hosting
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: openclaw/critical-2002-goal-building-self-hosting
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply bounded provenance repair
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-safe-same-branch-text-patch.mjs stephanos-server/services/githubPrEvidenceService.js "function normalizeGoalIssue(issue, repository, retrievedAt) {" "function issueHasTrustedAdmissionProvenance(issue) {\n  if (asText(issue?.author_association).toUpperCase() !== 'OWNER') return false;\n  const appSlug = asText(issue?.performed_via_github_app?.slug).toLowerCase();\n  if (!['chatgpt', 'openai-chatgpt'].includes(appSlug)) return false;\n  const createdAt = asText(issue?.created_at);\n  const updatedAt = asText(issue?.updated_at);\n  return Boolean(createdAt && updatedAt && createdAt === updatedAt);\n}\n\nfunction normalizeGoalIssue(issue, repository, retrievedAt) {"
          node scripts/apply-safe-same-branch-text-patch.mjs stephanos-server/services/githubPrEvidenceService.js "  const admission = parseGoalAdmission(issue, repository);\n  if (!admission) return null;" "  const admission = parseGoalAdmission(issue, repository);\n  if (!admission || !issueHasTrustedAdmissionProvenance(issue)) return null;"
          node scripts/apply-safe-same-branch-text-patch.mjs stephanos-server/services/githubGoalAdmissionSafety.test.js "    author_association: 'OWNER',\n    labels: [{ name: 'goal' }, { name: 'priority:high' }]," "    author_association: 'OWNER',\n    performed_via_github_app: { slug: 'chatgpt' },\n    labels: [{ name: 'goal' }, { name: 'priority:high' }],"
          cat >> stephanos-server/services/githubGoalAdmissionSafety.test.js <<'EOF'

test('trusted-app admission edited after creation remains discovery-only', async () => {
  const admission = {
    schemaVersion: 'stephanos.github-goal-admission.v1', issueNumber: 2314, repository: REPOSITORY,
    state: 'READY', route: 'OPENCLAW_LOCAL', prerequisites: [], sourceImplementationAllowed: true,
    mergeAuthority: false, deploymentAuthority: false, runtimeMutationAuthority: false, arbitraryShellAllowed: false,
  };
  const result = await observe(canonicalGoal({
    body: `Durable goal.\n\n\`\`\`stephanos-goal-admission-v1\n${JSON.stringify(admission)}\n\`\`\``,
    updated_at: '2026-09-21T00:05:00Z',
  }));
  assert.equal(result.discoveredIssues.length, 1);
  assert.equal(result.discoveredIssues[0].schedulerEligible, false);
  assert.deepEqual(result.issues, []);
});

test('owner association without trusted app provenance remains discovery-only', async () => {
  const admission = {
    schemaVersion: 'stephanos.github-goal-admission.v1', issueNumber: 2314, repository: REPOSITORY,
    state: 'READY', route: 'OPENCLAW_LOCAL', prerequisites: [], sourceImplementationAllowed: true,
    mergeAuthority: false, deploymentAuthority: false, runtimeMutationAuthority: false, arbitraryShellAllowed: false,
  };
  const result = await observe(canonicalGoal({
    body: `Durable goal.\n\n\`\`\`stephanos-goal-admission-v1\n${JSON.stringify(admission)}\n\`\`\``,
    performed_via_github_app: null,
  }));
  assert.equal(result.discoveredIssues.length, 1);
  assert.equal(result.discoveredIssues[0].schedulerEligible, false);
  assert.deepEqual(result.issues, []);
});
EOF
      - name: Run focused regression suite
        run: node --test stephanos-server/services/githubGoalAdmissionSafety.test.js stephanos-server/services/programmeAuthorityService.test.js
      - name: Commit repair when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stephanos-server/services/githubPrEvidenceService.js stephanos-server/services/githubGoalAdmissionSafety.test.js
          git commit -m 'Require trusted provenance for GitHub goal admission'
          git push origin HEAD:openclaw/critical-2002-goal-building-self-hosting
