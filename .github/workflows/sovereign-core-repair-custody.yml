name: Sovereign Core Repair Custody
on:
  pull_request:
    paths:
      - 'scripts/sovereign-commander-stephanos-repair*'
      - 'scripts/stephanos-core-daemon.mjs'
      - 'shared/agents/sovereignMaintenanceAdmissionV1*'
      - 'scripts/sovereign-commander-control-plane-repair*'
      - 'scripts/sovereign-core-job-custody*'
      - 'scripts/sovereign-fixed-runtime-job*'
      - 'scripts/windows/SovereignFixedRuntime*'
      - 'scripts/windows/test-sovereign-fixed-runtime*'
      - 'scripts/sovereign-core-directory-action*'
      - 'scripts/sovereign-commander-mcp.mjs'
      - 'scripts/sovereign-commander-http.mjs'
      - 'scripts/sovereign-maintenance-custody*'
      - 'scripts/sovereign-maintenance-os-anchor*'
      - 'scripts/sovereign-maintenance-owner-observation*'
      - 'scripts/sovereign-maintenance-retained-migration*'
      - 'scripts/sovereign-maintenance-journal-source-proof*'
      - 'scripts/sovereign-maintenance-installer-source*'
      - 'scripts/windows/*sovereign-maintenance*'
      - 'scripts/windows/MaintenanceJournalAclFixtureV2.cs'
      - 'scripts/sovereign-observation-offline-regression.test.mjs'
      - 'scripts/sovereign-frontend-start-only*'
      - 'scripts/battle-bridge-frontend-visibility-mailbox.test.mjs'
      - 'scripts/battle-bridge-github-command-mailbox.mjs'
      - 'shared/agents/battleBridgeGitHubCommandMailbox.mjs'
      - 'shared/agents/sovereignFrontendVisibility*'
      - 'shared/agents/sovereignMaintenanceRecovery*'
      - 'shared/agents/battleBridgeGitProbeContextV1*'
      - 'shared/agents/battleBridgeExecutionBoundaryV1*'
      - 'shared/agents/sovereignMaintenanceSourceDiagnosticV1*'
      - 'scripts/battle-bridge-ignition-supervisor*'
      - '.gitattributes'
      - 'scripts/serve-stephanos-dist*'
      - 'scripts/windows/read-stephanos-frontend-listener.ps1'
      - 'scripts/windows/read-sovereign-maintenance-boot-witness.ps1'
      - 'scripts/windows/sovereign-maintenance-audit-anchor.ps1'
      - 'shared/agents/sovereignCommanderV1*'
      - 'shared/agents/sovereignCommanderMcp*'
      - 'shared/agents/sovereignCommanderHttp*'
      - 'scripts/windows/SovereignCoreJobCustodyV1.cs'
      - 'scripts/windows/SovereignMaintenanceSourceJobV3.cs'
      - 'shared/agents/stephanosCoreDaemonV1*'
      - '.github/workflows/sovereign-core-repair-custody.yml'
permissions:
  contents: read
jobs:
  custody:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Register only the operator-approved isolated retained-journal fixture
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/windows/install-sovereign-maintenance-journal-v2.ps1 -Fixture -OperatorApproved
      - name: Bounded OS audit anchor proof before CPU-heavy native fixtures
        env:
          STEPHANOS_CUSTODY_NATIVE_FIXTURE: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: node --test scripts/sovereign-maintenance-os-anchor-v1.test.mjs
      - name: Native installer source Job and pinned bootstrap proof
        run: node --test scripts/sovereign-maintenance-installer-source-job-v3.test.mjs
      - name: Bootstrap-isolated source proof and native racy-index regression
        env:
          STEPHANOS_SHARED_WORKSPACE: ${{ runner.temp }}/stephanos-source-proof-fixture
        run: >-
          node --test
          shared/agents/battleBridgeGitProbeContextV1.test.mjs
          shared/agents/battleBridgeExecutionBoundaryV1.test.mjs
          scripts/battle-bridge-ignition-supervisor.test.mjs
          shared/agents/sovereignMaintenanceRecoveryMailboxV1.test.mjs
      - name: Retained migration and held-owner adversarial regressions
        run: node --test scripts/sovereign-maintenance-owner-observation-v2.test.mjs scripts/sovereign-maintenance-retained-migration-v2.test.mjs

      - name: Observation remains reachable without remote source proof
        run: node --test scripts/sovereign-observation-offline-regression.test.mjs
      - name: Disjoint constrained frontend start-only and existing server regression
        run: node --test scripts/sovereign-frontend-start-only.test.mjs scripts/serve-stephanos-dist.test.mjs
      - name: Fixed frontend mailbox authority and existing recovery regression
        run: >-
          node --test
          shared/agents/sovereignFrontendVisibilityMailboxV1.test.mjs
          shared/agents/sovereignMaintenanceRecoveryMailboxV1.test.mjs
          scripts/battle-bridge-frontend-visibility-mailbox.test.mjs
      - name: Core-only admission, held R7, gaming and Windows descendant denial
        run: node --test scripts/sovereign-maintenance-custody-store-v1.test.mjs scripts/sovereign-maintenance-custody-recovery.test.mjs scripts/sovereign-commander-stephanos-repair.test.mjs scripts/sovereign-commander-control-plane-repair.test.mjs scripts/sovereign-core-job-custody-preflight-v1.test.mjs scripts/sovereign-core-job-custody-native.test.mjs scripts/sovereign-fixed-runtime-job-v1.test.mjs scripts/sovereign-core-directory-action-v1.test.mjs shared/agents/stephanosCoreDaemonV1.test.mjs shared/agents/sovereignCommanderV1.test.mjs shared/agents/sovereignCommanderMcp.test.mjs shared/agents/sovereignCommanderHttp.test.mjs shared/agents/sovereignMaintenanceAdmissionV1.test.mjs
