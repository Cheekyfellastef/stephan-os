name: Sovereign Core Repair Custody
on:
  pull_request:
    paths:
      - 'scripts/sovereign-commander-stephanos-repair*'
      - 'scripts/sovereign-commander-control-plane-repair*'
      - 'scripts/sovereign-core-job-custody*'
      - 'scripts/sovereign-core-directory-action*'
      - 'scripts/sovereign-commander-mcp.mjs'
      - 'scripts/sovereign-commander-http.mjs'
      - 'scripts/sovereign-maintenance-custody*'
      - 'scripts/sovereign-maintenance-os-anchor*'
      - 'scripts/sovereign-observation-offline-regression.test.mjs'
      - 'scripts/sovereign-frontend-start-only*'
      - 'scripts/battle-bridge-frontend-visibility-mailbox.test.mjs'
      - 'scripts/battle-bridge-github-command-mailbox.mjs'
      - 'shared/agents/battleBridgeGitHubCommandMailbox.mjs'
      - 'shared/agents/sovereignFrontendVisibility*'
      - 'shared/agents/sovereignMaintenanceRecovery*'
      - '.gitattributes'
      - 'scripts/serve-stephanos-dist*'
      - 'scripts/windows/read-stephanos-frontend-listener.ps1'
      - 'scripts/windows/read-sovereign-maintenance-boot-witness.ps1'
      - 'scripts/windows/sovereign-maintenance-audit-anchor.ps1'
      - 'shared/agents/sovereignCommanderV1*'
      - 'shared/agents/sovereignCommanderMcp*'
      - 'shared/agents/sovereignCommanderHttp*'
      - 'scripts/windows/SovereignCoreJobCustodyV1.cs'
      - 'shared/agents/stephanosCoreDaemonV1*'
      - '.github/workflows/sovereign-core-repair-custody.yml'
permissions:
  contents: read
jobs:
  custody:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bounded OS audit anchor proof before CPU-heavy native fixtures
        run: node --test scripts/sovereign-maintenance-os-anchor-v1.test.mjs
      - name: Observation remains reachable without remote source proof
        run: node --test scripts/sovereign-observation-offline-regression.test.mjs
      - name: Disjoint constrained frontend start-only and existing server regression
        run: node --test scripts/sovereign-frontend-start-only.test.mjs scripts/serve-stephanos-dist.test.mjs
      - name: Fixed frontend mailbox authority and existing recovery regression
        run: >-
          node --test
          shared/agents/sovereignFrontendVisibilityMailboxV1.test.mjs
          shared/agents/sovereignMaintenanceRecoveryMailboxV1.test.mjs
          scripts/battle-bridge-frontend-visibility-mailbox.test.mjs
      - name: Core-only admission, held R7, gaming and Windows descendant denial
        run: node --test scripts/sovereign-maintenance-custody-store-v1.test.mjs scripts/sovereign-maintenance-custody-recovery.test.mjs scripts/sovereign-commander-stephanos-repair.test.mjs scripts/sovereign-commander-control-plane-repair.test.mjs scripts/sovereign-core-job-custody-preflight-v1.test.mjs scripts/sovereign-core-job-custody-native.test.mjs scripts/sovereign-core-directory-action-v1.test.mjs shared/agents/stephanosCoreDaemonV1.test.mjs shared/agents/sovereignCommanderV1.test.mjs shared/agents/sovereignCommanderMcp.test.mjs shared/agents/sovereignCommanderHttp.test.mjs
