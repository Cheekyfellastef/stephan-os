name: OpenClaw Staged Update Proof

on:
  pull_request:
    branches:
      - main
      - agent/1415-openclaw-update-preflight-v1
    paths:
      - 'shared/agents/openClawStagedUpdateV1.mjs'
      - 'shared/agents/openClawStagedUpdateV1.test.mjs'
      - 'scripts/openclaw-staged-update.mjs'
      - 'scripts/openclaw-staged-update.test.mjs'
      - '.github/workflows/openclaw-staged-update-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse staged-update sources
        run: |
          node --check shared/agents/openClawStagedUpdateV1.mjs
          node --check scripts/openclaw-staged-update.mjs

      - name: Run staged-update and rollback regressions
        run: node --test shared/agents/openClawStagedUpdateV1.test.mjs scripts/openclaw-staged-update.test.mjs

      - name: Check exact diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff --check HEAD^...HEAD
          fi
