name: Deploy Stephanos to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.comment.user.login == 'Cheekyfellastef' &&
       github.event.comment.body == '/stephanos-deploy-pages')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stephanos-ui/package-lock.json

      - name: Install UI dependencies
        working-directory: stephanos-ui
        run: npm ci

      - name: Build Stephanos UI dist
        run: npm run stephanos:build

      - name: Verify Stephanos dist
        run: npm run stephanos:verify

      - name: Prove hosted Flywheel artifact is current and complete
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'apps/stephanos/dist';
          const metadataPath = path.join(root, 'stephanos-build.json');
          const metadata = JSON.parse(fs.readFileSync(metadataPath, 'utf8'));
          const expectedCommit = String(process.env.GITHUB_SHA || '').slice(0, 8).toLowerCase();
          const builtCommit = String(metadata.gitCommit || '').toLowerCase();
          if (!expectedCommit || builtCommit !== expectedCommit) {
            throw new Error(`HOSTED_DIST_HEAD_MISMATCH expected=${expectedCommit} built=${builtCommit}`);
          }

          const assetRoot = path.join(root, 'assets');
          const bundle = fs.readdirSync(assetRoot)
            .filter((name) => /\.(?:js|css)$/.test(name))
            .map((name) => fs.readFileSync(path.join(assetRoot, name), 'utf8'))
            .join('\n');

          const requiredMarkers = [
            'flywheel-seed-canopy',
            'stephanos-runs-the-project',
            'stephanos-flywheel-conversational-intelligence',
            'flywheel-uplift-heatmap',
            'flywheel-learning-timeline',
            'stephanos.workspace-hydration.v1',
            'desktop-9flonkj.taild6f215.ts.net',
          ];
          const missing = requiredMarkers.filter((marker) => !bundle.includes(marker));
          if (missing.length) {
            throw new Error(`HOSTED_FLYWHEEL_CONTRACT_MISSING: ${missing.join(',')}`);
          }
          console.log(JSON.stringify({
            ok: true,
            gitCommit: builtCommit,
            markers: requiredMarkers,
          }, null, 2));
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact structure
        run: |
          rm -rf _site
          mkdir -p _site

          rsync -a ./ ./_site \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'node_modules/' \
            --exclude 'stephanos-ui/node_modules/' \
            --exclude 'stephanos-server/node_modules/' \
            --exclude '.DS_Store'

          touch _site/.nojekyll

      - name: Enable bounded remote Goal Dashboard projection
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = '_site/apps/goal-dashboard/index.html';
          const marker = '<script src="./remote-live.js"></script>';
          let html = fs.readFileSync(path, 'utf8');
          if (!html.includes(marker)) {
            if (!html.includes('</body>')) throw new Error('GOAL_DASHBOARD_BODY_CLOSE_NOT_FOUND');
            html = html.replace('</body>', `  ${marker}\n</body>`);
            fs.writeFileSync(path, html, 'utf8');
          }
          if (!fs.existsSync('_site/apps/goal-dashboard/remote-live.js')) {
            throw new Error('GOAL_DASHBOARD_REMOTE_LIVE_ADAPTER_MISSING');
          }
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
