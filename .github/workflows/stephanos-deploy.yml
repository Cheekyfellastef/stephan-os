name: Deploy Stephanos to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Full main SHA authorized for deployment
        required: true
        type: string
      approval_token:
        description: APPROVE_STEPHANOS_PAGES_DEPLOY:<full-main-sha>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stephanos-ui/package-lock.json

      - name: Verify exact deployment approval
        env:
          STEPHANOS_DEPLOY_EVENT_NAME: ${{ github.event_name }}
          STEPHANOS_DEPLOY_REPOSITORY: ${{ github.repository }}
          STEPHANOS_DEPLOY_ACTOR: ${{ github.actor }}
          STEPHANOS_DEPLOY_REF: ${{ github.ref }}
          STEPHANOS_DEPLOY_REF_NAME: ${{ github.ref_name }}
          STEPHANOS_DEPLOY_GITHUB_SHA: ${{ github.sha }}
          STEPHANOS_DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
          STEPHANOS_DEPLOY_EXPECTED_HEAD: ${{ inputs.expected_head }}
          STEPHANOS_DEPLOY_APPROVAL_TOKEN: ${{ inputs.approval_token }}
        run: node scripts/stephanos-pages-deployment-approval.mjs

      - name: Install UI dependencies
        working-directory: stephanos-ui
        run: npm ci

      - name: Build Stephanos UI dist
        run: npm run stephanos:build

      - name: Verify Stephanos dist
        run: npm run stephanos:verify

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact structure
        run: |
          rm -rf _site
          mkdir -p _site

          rsync -a ./ ./_site \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'node_modules/' \
            --exclude 'stephanos-ui/node_modules/' \
            --exclude 'stephanos-server/node_modules/' \
            --exclude '.DS_Store'

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
