name: Codex Patch Escrow Publisher

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/codex-patch-escrow-publisher.yml'
      - 'scripts/codex-patch-escrow-attest.mjs'
      - 'scripts/codex-patch-escrow-export.mjs'
      - 'scripts/codex-patch-escrow-finalize-validation.mjs'
      - 'scripts/codex-patch-escrow-prepare.mjs'
      - 'scripts/codex-patch-escrow-publisher.mjs'
      - 'scripts/codex-patch-escrow-publish-validated.mjs'
      - 'scripts/codex-patch-escrow-validate-prepared.mjs'
      - 'scripts/codex-patch-escrow-validated-artifact.mjs'
      - 'shared/agents/codexPatchEscrow.mjs'
      - 'shared/agents/codexPatchEscrowAuthorization.mjs'
      - 'shared/agents/codexPatchEscrow.test.mjs'
      - 'shared/agents/codexPatchEscrowIdentity.test.mjs'
      - 'shared/agents/codexPatchEscrowPreparedValidation.test.mjs'
      - 'shared/agents/codexPatchEscrowPublisher.test.mjs'
      - 'shared/agents/codexPatchEscrowWorkflowIsolation.test.mjs'
      - 'shared/agents/codexPatchEscrow.RUNBOOK.md'
  issue_comment:
    types:
      - created

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run deterministic escrow security tests
        run: >-
          node --test
          shared/agents/codexPatchEscrow.test.mjs
          shared/agents/codexPatchEscrowIdentity.test.mjs
          shared/agents/codexPatchEscrowPublisher.test.mjs
          shared/agents/codexPatchEscrowPreparedValidation.test.mjs
          shared/agents/codexPatchEscrowWorkflowIsolation.test.mjs

      - name: Parse escrow scripts
        run: |
          node --check scripts/codex-patch-escrow-attest.mjs
          node --check scripts/codex-patch-escrow-export.mjs
          node --check scripts/codex-patch-escrow-finalize-validation.mjs
          node --check scripts/codex-patch-escrow-prepare.mjs
          node --check scripts/codex-patch-escrow-publisher.mjs
          node --check scripts/codex-patch-escrow-publish-validated.mjs
          node --check scripts/codex-patch-escrow-validate-prepared.mjs
          node --check scripts/codex-patch-escrow-validated-artifact.mjs

      - name: Diff check
        run: git diff --check origin/main...HEAD

  prepare-publication:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, 'PATCH_ESCROW_PUBLISH_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out canonical main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch once and prepare the owner-authorised escrow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/codex-patch-escrow-prepare.mjs "${{ runner.temp }}/patch-escrow-prepared.json"

      - name: Upload prepared escrow for token-free validation
        uses: actions/upload-artifact@v4
        with:
          name: patch-escrow-prepared-${{ github.run_id }}-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/patch-escrow-prepared.json
          if-no-files-found: error
          retention-days: 1

  validate-publication:
    needs:
      - prepare-publication
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, 'PATCH_ESCROW_PUBLISH_V1') &&
      needs.prepare-publication.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out canonical main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download prepared escrow as untrusted input
        uses: actions/download-artifact@v4
        with:
          name: patch-escrow-prepared-${{ github.run_id }}-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/patch-escrow-prepared

      - name: Prepare disposable workspace and trusted output directories
        run: |
          rm -rf "${{ runner.temp }}/patch-escrow-isolated-workspace" "${{ runner.temp }}/patch-escrow-validation-report" "${{ runner.temp }}/patch-escrow-validated"
          mkdir -p "${{ runner.temp }}/patch-escrow-isolated-workspace" "${{ runner.temp }}/patch-escrow-validation-report" "${{ runner.temp }}/patch-escrow-validated"
          cp -a "$GITHUB_WORKSPACE/." "${{ runner.temp }}/patch-escrow-isolated-workspace/"

      - name: Revalidate and test inside a credential-free PID namespace
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --workdir /workspace \
            --mount type=bind,src="${{ runner.temp }}/patch-escrow-isolated-workspace",dst=/workspace \
            --mount type=bind,src="${{ runner.temp }}/patch-escrow-prepared",dst=/input,readonly \
            node:22-bookworm@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d \
            node scripts/codex-patch-escrow-validate-prepared.mjs \
              /input/patch-escrow-prepared.json \
            > "${{ runner.temp }}/patch-escrow-validation-report/validation-report.json"

      - name: Finalize the validated artifact after the isolated container has exited
        run: >-
          node scripts/codex-patch-escrow-finalize-validation.mjs
          "${{ runner.temp }}/patch-escrow-prepared/patch-escrow-prepared.json"
          "${{ runner.temp }}/patch-escrow-validation-report/validation-report.json"
          "${{ runner.temp }}/patch-escrow-validated/patch-escrow-validated.json"

      - name: Upload the exact token-free validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: patch-escrow-validated-${{ github.run_id }}-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/patch-escrow-validated/patch-escrow-validated.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - validate-publication
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, 'PATCH_ESCROW_PUBLISH_V1') &&
      needs.validate-publication.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: codex-patch-escrow-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out canonical main for publication
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the exact token-free validated artifact
        uses: actions/download-artifact@v4
        with:
          name: patch-escrow-validated-${{ github.run_id }}-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/patch-escrow-validated

      - name: Publish only the attested patch and tree without rerunning patched code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/codex-patch-escrow-publish-validated.mjs
          "${{ runner.temp }}/patch-escrow-validated/patch-escrow-validated.json"
