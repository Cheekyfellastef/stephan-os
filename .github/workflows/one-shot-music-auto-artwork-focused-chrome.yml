name: One-shot Music Auto Artwork Focused Chrome

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/one-shot-music-auto-artwork-focused-chrome.yml'
      - 'tests/music-tile-rating-playback-browser.test.mjs'
      - 'apps/music-tile/engine/nativeCatalogAutoApply.js'
      - 'apps/music-tile/engine/nativeCatalogSearch.js'

permissions: {}

concurrency:
  group: one-shot-music-auto-artwork-focused-chrome-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  focused-chrome:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/music-tile-automatic-url-artwork-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser-test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Instrument focused test in the disposable workspace
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'tests/music-tile-rating-playback-browser.test.mjs';
          const source = fs.readFileSync(path, 'utf8');
          const marker = "test('iPad-width existing card receives Spotify URL and artwork without manual search'";
          const start = source.indexOf(marker);
          if (start < 0) throw new Error('focused test marker missing');
          const prefix = source.slice(0, start);
          let block = source.slice(start);
          const edits = [
            ["  const server = await startRepositoryServer();", "  console.log('AUTO_ART_CHECKPOINT=before-server');\n  const server = await startRepositoryServer();\n  console.log('AUTO_ART_CHECKPOINT=after-server');"],
            ["    browser = await chromium.launch(", "    console.log('AUTO_ART_CHECKPOINT=before-browser-launch');\n    browser = await chromium.launch("],
            ["    const page = await browser.newPage({ viewport: { width: 820, height: 1180 } });", "    console.log('AUTO_ART_CHECKPOINT=after-browser-launch');\n    const page = await browser.newPage({ viewport: { width: 820, height: 1180 } });\n    console.log('AUTO_ART_CHECKPOINT=after-new-page');"],
            ["    await page.route('https://i.scdn.co/**', async (route) => {", "    console.log('AUTO_ART_CHECKPOINT=before-routes');\n    await page.route('https://i.scdn.co/**', async (route) => {"],
            ["    await page.addInitScript(({ key, trackId }) => {", "    console.log('AUTO_ART_CHECKPOINT=after-routes');\n    await page.addInitScript(({ key, trackId }) => {"],
            ["    await page.goto(`${server.origin}/apps/music-tile/index.html`);", "    console.log('AUTO_ART_CHECKPOINT=after-init-script');\n    await page.goto(`${server.origin}/apps/music-tile/index.html`);\n    console.log('AUTO_ART_CHECKPOINT=after-goto');"],
            ["    try {\n      await page.waitForFunction", "    console.log('AUTO_ART_CHECKPOINT=before-enrichment-wait');\n    try {\n      await page.waitForFunction"],
            ["    const proof = await page.evaluate", "    console.log('AUTO_ART_CHECKPOINT=after-enrichment-wait');\n    const proof = await page.evaluate"],
          ];
          for (const [needle, replacement] of edits) {
            const index = block.indexOf(needle);
            if (index < 0) throw new Error(`checkpoint anchor missing: ${needle.slice(0, 60)}`);
            block = `${block.slice(0, index)}${replacement}${block.slice(index + needle.length)}`;
          }
          fs.writeFileSync(path, prefix + block, 'utf8');
          NODE
          node --check tests/music-tile-rating-playback-browser.test.mjs

      - name: Run bounded no-click iPad card proof and expose output
        shell: bash
        env:
          STEPHANOS_BROWSER_CHANNEL: chrome
        run: |
          set +e
          timeout --signal=INT --kill-after=5s 45s \
            node --test --test-name-pattern="iPad-width existing card receives Spotify URL and artwork without manual search" \
            tests/music-tile-rating-playback-browser.test.mjs 2>&1 | tee focused-edge-output.log
          node_status=${PIPESTATUS[0]}
          echo "FOCUSED_TEST_EXIT_CODE=${node_status}"
          echo "FOCUSED_TEST_OUTPUT_BEGIN"
          cat focused-edge-output.log
          echo "FOCUSED_TEST_OUTPUT_END"
          exit 0
