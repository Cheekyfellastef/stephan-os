name: One-shot Music Auto Artwork Focused Chrome

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/one-shot-music-auto-artwork-focused-chrome.yml'
      - 'tests/music-tile-rating-playback-browser.test.mjs'
      - 'apps/music-tile/engine/nativeCatalogAutoApply.js'
      - 'apps/music-tile/engine/nativeCatalogSearch.js'

permissions: {}

concurrency:
  group: one-shot-music-auto-artwork-focused-chrome-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  focused-chrome:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/music-tile-automatic-url-artwork-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser-test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run bounded no-click iPad card proof and expose output
        shell: bash
        env:
          STEPHANOS_BROWSER_CHANNEL: chrome
        run: |
          set +e
          timeout --signal=INT --kill-after=5s 45s \
            node --test --test-name-pattern="iPad-width existing card receives Spotify URL and artwork without manual search" \
            tests/music-tile-rating-playback-browser.test.mjs 2>&1 | tee focused-edge-output.log
          node_status=${PIPESTATUS[0]}
          echo "FOCUSED_TEST_EXIT_CODE=${node_status}"
          echo "FOCUSED_TEST_OUTPUT_BEGIN"
          cat focused-edge-output.log
          echo "FOCUSED_TEST_OUTPUT_END"
          exit 0
