name: Codex Banked Reset Telemetry

on:
  pull_request:
    paths:
      - 'shared/agents/codexBankedResetTelemetryMirror.mjs'
      - 'shared/agents/codexBankedResetTelemetryMirror.test.mjs'
      - '.github/workflows/codex-banked-reset-telemetry.yml'
  issue_comment:
    types: [created, edited]
  push:
    branches: [main]
    paths:
      - 'shared/agents/codexBankedResetTelemetryMirror.mjs'
      - '.github/workflows/codex-banked-reset-telemetry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-banked-reset-telemetry-${{ github.event.pull_request.number || 'mirror' }}
  cancel-in-progress: true

jobs:
  proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reset telemetry projection proof
        run: node --test shared/agents/codexBankedResetTelemetryMirror.test.mjs
      - name: Import structure proof
        run: node scripts/guard-import-structure.mjs
      - name: Diff check
        if: always()
        run: git diff --check origin/main...HEAD

  mirror:
    if: >-
      github.event_name != 'pull_request' &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.number > 0 &&
          github.event.comment.user.login == github.repository_owner &&
          contains(github.event.comment.body, '<!-- stephanos-battle-bridge-command-receipt -->')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Recheck canonical owner event from trusted main
        if: github.event_name == 'issue_comment'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/canonical-mailbox-workflow-event-gate.mjs receipt
      - name: Replace compact telemetry issue body from trusted receipts
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const { assertMailboxRotationWorkflowAdmission } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/canonical-mailbox-workflow-admission-v1.mjs`);
            const recheck = () => assertMailboxRotationWorkflowAdmission({ mode: 'receipt' });
            await recheck();
            const path = await import('node:path');
            const { pathToFileURL } = await import('node:url');
            const moduleUrl = `${pathToFileURL(path.resolve('shared/agents/codexBankedResetTelemetryMirror.mjs')).href}?run=${Date.now()}`;
            const telemetry = await import(moduleUrl);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: telemetry.CODEX_BANKED_RESET_MAILBOX_ISSUE,
              per_page: 100,
            });
            const record = telemetry.createCodexBankedResetTelemetryRecord(comments, {
              ownerLogin: context.repo.owner,
              timestampUtc: new Date().toISOString(),
            });
            const body = telemetry.buildCodexBankedResetTelemetryIssueBodyV2(record);
            await recheck();
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: telemetry.CODEX_BANKED_RESET_TELEMETRY_ISSUE,
              body,
            });
            core.info(`Updated Codex banked reset telemetry issue #${telemetry.CODEX_BANKED_RESET_TELEMETRY_ISSUE} with ${record.status}.`);
