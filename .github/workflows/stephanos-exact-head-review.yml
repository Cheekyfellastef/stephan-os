name: Stephanos Exact-Head Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'pull_request_target' && format('stephanos-exact-head-review-pr-{0}', github.event.pull_request.number) || format('stephanos-exact-head-review-comment-{0}', github.event.comment.id) }}
  cancel-in-progress: true

jobs:
  exact-head-review:
    if: >-
      ${{
        (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         startsWith(github.event.comment.body, '/stephanos-review ') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve immutable review identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ISSUE_PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request_target" ]]; then
            pr_number="${EVENT_PR_NUMBER}"
            base_sha="${EVENT_BASE_SHA}"
            head_sha="${EVENT_HEAD_SHA}"
          else
            pr_number="${ISSUE_PR_NUMBER}"
            expected_head="${COMMENT_BODY#/stephanos-review }"
            expected_head="${expected_head%%[[:space:]]*}"
            [[ "${expected_head}" =~ ^[0-9a-fA-F]{40}$ ]]

            pr_json="$(gh api "/repos/${REPOSITORY}/pulls/${pr_number}")"
            base_sha="$(jq -r '.base.sha' <<<"${pr_json}")"
            head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
            test "${head_sha}" = "${expected_head}"
          fi

          [[ "${base_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${head_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout trusted reviewer
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.base_sha }}
          persist-credentials: false

      - name: Verify trusted reviewer source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.identity.outputs.base_sha }}"

      - name: Run trusted engine regressions
        run: node --test scripts/exact-head-review.test.mjs

      - name: Build immutable exact-head review input
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          HEAD_SHA: ${{ steps.identity.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-proof

          observed_before="$(gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "${observed_before}" = "${HEAD_SHA}"

          gh api --paginate "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > review-proof/changed-files.txt
          gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            -H 'Accept: application/vnd.github.v3.diff' > review-proof/pull-request.patch

          observed_after="$(gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "${observed_after}" = "${HEAD_SHA}"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const changedFiles = fs.readFileSync('review-proof/changed-files.txt', 'utf8').split(/\r?\n/).filter(Boolean);
          const patch = fs.readFileSync('review-proof/pull-request.patch', 'utf8');
          fs.writeFileSync('review-proof/input.json', JSON.stringify({
            repository: process.env.REPOSITORY,
            prNumber: Number(process.env.PR_NUMBER),
            baseSha: process.env.BASE_SHA,
            headSha: process.env.HEAD_SHA,
            changedFiles,
            patch,
          }));
          NODE

      - name: Review exact head with trusted engine
        run: node scripts/exact-head-review.mjs review-proof/input.json review-proof/receipt.json

      - name: Upload SHA-bound review receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: exact-head-review-${{ steps.identity.outputs.pr_number }}-${{ steps.identity.outputs.head_sha }}
          path: review-proof/
          if-no-files-found: error
          retention-days: 30
