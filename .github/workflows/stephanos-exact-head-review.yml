name: Stephanos Exact-Head Review
run-name: ${{ github.event_name == 'workflow_dispatch' && format('protected-ready-review-pr-{0}-head-{1}-ready-{2}-binding-{3}', inputs.pr_number, inputs.source_head, inputs.ready_run_id, inputs.ready_receipt_sha256) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      source_head:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      ready_run_id:
        required: true
        type: string
      ready_artifact_id:
        required: true
        type: string
      ready_receipt_sha256:
        required: true
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('stephanos-exact-head-review-ready-{0}-{1}', inputs.ready_run_id, inputs.ready_receipt_sha256) || (github.event_name == 'pull_request_target' && format('stephanos-exact-head-review-pr-{0}', github.event.pull_request.number) || format('stephanos-exact-head-review-comment-{0}', github.event.comment.id)) }}
  cancel-in-progress: true

jobs:
  exact-head-review:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == inputs.base_sha) ||
        (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         ((startsWith(github.event.comment.body, '<!-- stephanos:provider-neutral-assurance:v1 head=') &&
           contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
          (github.event.comment.user.login == 'Cheekyfellastef' &&
           github.event.comment.author_association == 'OWNER' &&
           startsWith(github.event.comment.body, '```stephanos-exact-head-qualified-review-v1'))))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate hosted review on its own GitHub installation API budget
        id: github_budget
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # GET /rate_limit does not spend primary/core quota. It can count
          # against secondary limits, so fail closed if it cannot be read.
          if ! quota="$(gh api rate_limit 2>/dev/null)"; then
            echo "::error::GITHUB_HOSTED_REVIEW_BUDGET_UNKNOWN"
            exit 1
          fi
          limit="$(jq -er '.resources.core.limit | select(type == "number" and . > 0)' <<< "$quota")" || exit 1
          remaining="$(jq -er '.resources.core.remaining | select(type == "number" and . >= 0)' <<< "$quota")" || exit 1
          reset="$(jq -er '.resources.core.reset | select(type == "number" and . > 0)' <<< "$quota")" || exit 1
          reserve=$(( (limit + 4) / 5 ))
          if (( reserve < 50 )); then reserve=50; fi
          echo "limit=$limit" >> "$GITHUB_OUTPUT"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          echo "reset_epoch=$reset" >> "$GITHUB_OUTPUT"
          echo "reserve=$reserve" >> "$GITHUB_OUTPUT"
          if (( remaining <= reserve )); then
            echo "::warning::GITHUB_HOSTED_REVIEW_BUDGET_HOLD remaining=$remaining limit=$limit reserve=$reserve reset_epoch=$reset"
            echo "GitHub hosted review is held: installation core REST budget under 20% reserve." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "GITHUB_HOSTED_REVIEW_BUDGET_READY remaining=$remaining limit=$limit reserve=$reserve reset_epoch=$reset"
      - name: Resolve immutable review identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ISSUE_PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          DISPATCH_HEAD_SHA: ${{ inputs.source_head }}
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            # A caller cannot choose reviewer code. Both the workflow and its
            # checkout must come from the event's exact trusted main source.
            test "${GITHUB_REF}" = 'refs/heads/main'
            test "${GITHUB_SHA}" = "${DISPATCH_BASE_SHA}"
            test "${GITHUB_WORKFLOW_SHA}" = "${GITHUB_SHA}"
            test "${GITHUB_WORKFLOW_REF}" = "${REPOSITORY}/.github/workflows/stephanos-exact-head-review.yml@refs/heads/main"
            [[ "${DISPATCH_PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
            pr_number="${DISPATCH_PR_NUMBER}"
            expected_head="${DISPATCH_HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == "pull_request_target" ]]; then
            pr_number="${EVENT_PR_NUMBER}"
            expected_head="${EVENT_HEAD_SHA}"
          else
            pr_number="${ISSUE_PR_NUMBER}"
            marker_prefix='<!-- stephanos:provider-neutral-assurance:v1 head='
            marker_suffix=' -->'
            first_line="${COMMENT_BODY%%$'\n'*}"
            first_line="${first_line%$'\r'}"
            if [[ "${first_line}" == "${marker_prefix}"*"${marker_suffix}" ]]; then
              expected_head="${first_line#${marker_prefix}}"
              expected_head="${expected_head%${marker_suffix}}"
            elif [[ "${first_line}" == '```stephanos-exact-head-qualified-review-v1' ]]; then
              # Owner-only job admission is not security approval. The trusted
              # adapter later verifies immutable comment provenance, expiry,
              # run/job/artifact identity and independent security proof.
              # Reject malformed input before spending further GitHub quota.
              expected_head="$(node --input-type=module <<'NODE'
              const text = String(process.env.COMMENT_BODY || '').replace(/\r\n/g, '\n');
              const m = text.match(/^```stephanos-exact-head-qualified-review-v1\n([\s\S]{1,5000}?)\n```(?:\n|$)/);
              if (!m) process.exit(1);
              let p;
              try { p = JSON.parse(m[1]); } catch { process.exit(1); }
              if (p?.schemaVersion !== 'stephanos.exact-head-qualified-escalation.v1'
                || p?.operation !== 'AUTHORIZE_EXACT_HEAD_REVIEW_ESCALATION'
                || p?.repository !== process.env.REPOSITORY
                || p?.prNumber !== Number(process.env.ISSUE_PR_NUMBER)
                || p?.scope !== 'exact-head-review-only'
                || !/^[a-f0-9]{40}$/.test(p?.expectedHead || '')) process.exit(1);
              process.stdout.write(p.expectedHead);
          NODE
              )"
            else
              exit 1
            fi
          fi

          [[ "${expected_head}" =~ ^[0-9a-fA-F]{40}$ ]]
          pr_json="$(gh api "/repos/${REPOSITORY}/pulls/${pr_number}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          base_ref="$(jq -r '.base.ref' <<<"${pr_json}")"
          current_main_sha="$(gh api "/repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"

          test "${head_sha}" = "${expected_head}"
          test "${base_ref}" = "main"
          [[ "${current_main_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${head_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            test "${current_main_sha}" = "${DISPATCH_BASE_SHA}"
          fi

          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${current_main_sha}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout trusted reviewer
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.base_sha }}
          persist-credentials: false

      - name: Verify trusted reviewer source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.identity.outputs.base_sha }}"

      - name: Authenticate immutable READY handoff before review reads
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/protected-ready-review-lifecycle-v1.mjs prepare

      - name: Admit exact current-main review target
        id: admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          export STEPHANOS_REVIEW_PLAN_TARGETS="[{\"prNumber\":${PR_NUMBER}}]"
          node scripts/exact-head-review-current-main-admission-v1.mjs

      - name: Require exact current-main admission
        env:
          PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
          ADMITTED_TARGETS: ${{ steps.admission.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          test "${ADMITTED_TARGETS}" = "[{\"prNumber\":${PR_NUMBER}}]"

      - name: Run trusted engine regressions
        run: node --test scripts/exact-head-review.test.mjs scripts/exact-head-qualified-escalation-v1.test.mjs shared/agents/protectedReadyReviewLifecycleV1.test.mjs scripts/protected-ready-review-lifecycle-v1.test.mjs

      - name: Build immutable exact-head review input
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          HEAD_SHA: ${{ steps.identity.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-proof

          observed_before="$(gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "${observed_before}" = "${HEAD_SHA}"

          gh api --paginate "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > review-proof/changed-files.txt
          gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            -H 'Accept: application/vnd.github.v3.diff' > review-proof/pull-request.patch

          observed_after="$(gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "${observed_after}" = "${HEAD_SHA}"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const changedFiles = fs.readFileSync('review-proof/changed-files.txt', 'utf8').split(/\r?\n/).filter(Boolean);
          const patch = fs.readFileSync('review-proof/pull-request.patch', 'utf8');
          fs.writeFileSync('review-proof/input.json', JSON.stringify({
            repository: process.env.REPOSITORY,
            prNumber: Number(process.env.PR_NUMBER),
            baseSha: process.env.BASE_SHA,
            headSha: process.env.HEAD_SHA,
            changedFiles,
            patch,
          }));
          NODE

      # P2 findings never become approval without independently pinned records.
      # This is an atomic fail-closed qualification check, not a waiver.
      - name: Review exact head and require independently qualified escalation
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/exact-head-qualified-escalation-v1.mjs review-proof/input.json review-proof/receipt.json

      - name: Review ready head with the unchanged engine and qualified escalation
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/protected-ready-review-lifecycle-v1.mjs review

      - name: Upload separate immutable lifecycle review proof
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: protected-ready-review-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: protected-ready-review-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload SHA-bound review receipt
        if: ${{ always() && steps.github_budget.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: exact-head-review-${{ steps.identity.outputs.pr_number }}-${{ steps.identity.outputs.head_sha }}
          path: review-proof/
          if-no-files-found: error
          retention-days: 30
