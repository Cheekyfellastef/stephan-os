name: Codex Capacity Governor Proof

on:
  pull_request:
    paths:
      - 'shared/agents/codexCapacityGovernorV1.mjs'
      - 'shared/agents/codexCapacityGovernorV1.test.mjs'
      - 'shared/agents/codexCapacityGovernorV1.regression.test.mjs'
      - 'shared/agents/meterAwareCodexDispatcher.mjs'
      - 'shared/agents/meterAwareCodexDispatcher.test.mjs'
      - 'shared/agents/codexCapacityDashboardProjection.mjs'
      - 'shared/agents/codexCapacityDashboardProjection.test.mjs'
      - 'shared/agents/codexBankedResetBattleBridgeExecutor.mjs'
      - 'shared/agents/codexBankedResetBattleBridgeExecutor.test.mjs'
      - 'shared/agents/battleBridgeGitHubCommandMailbox.mjs'
      - 'shared/agents/battleBridgeGitHubCommandMailbox.test.mjs'
      - 'scripts/windows/invoke-codex-banked-reset-ui.ps1'
      - '.codex/skills/redeem-banked-codex-reset/SKILL.md'
      - 'docs/CODEX_CAPACITY_GOVERNOR_V1.md'
      - '.github/workflows/codex-capacity-governor-proof.yml'

permissions:
  contents: read

concurrency:
  group: codex-capacity-governor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capacity governor and reset policy proof
        run: node --test shared/agents/codexCapacityGovernorV1.test.mjs shared/agents/codexCapacityGovernorV1.regression.test.mjs

      - name: Meter-aware dispatcher proof
        run: node --test shared/agents/meterAwareCodexDispatcher.test.mjs

      - name: Dashboard projection proof
        run: node --test shared/agents/codexCapacityDashboardProjection.test.mjs

      - name: Battle Bridge reset mailbox proof
        run: node --test shared/agents/battleBridgeGitHubCommandMailbox.test.mjs shared/agents/codexBankedResetBattleBridgeExecutor.test.mjs

      - name: Reset executor static safety proof
        run: |
          ! grep -nE 'Invoke-Expression|Start-Process|DownloadString|WebClient|HttpClient|--remote-debugging-port|javascript:|document\.' scripts/windows/invoke-codex-banked-reset-ui.ps1
          grep -q 'singlePressOnly = \$true' scripts/windows/invoke-codex-banked-reset-ui.ps1
          grep -q 'repeatedPressAllowed = \$false' scripts/windows/invoke-codex-banked-reset-ui.ps1
          grep -q '\$patternObject.Invoke()' scripts/windows/invoke-codex-banked-reset-ui.ps1
          test "$(grep -c '\$patternObject.Invoke()' scripts/windows/invoke-codex-banked-reset-ui.ps1)" -eq 1

      - name: Syntax proof
        run: node --check shared/agents/codexCapacityGovernorV1.mjs && node --check shared/agents/meterAwareCodexDispatcher.mjs && node --check shared/agents/codexCapacityDashboardProjection.mjs && node --check shared/agents/battleBridgeGitHubCommandMailbox.mjs && node --check shared/agents/codexBankedResetBattleBridgeExecutor.mjs

      - name: Diff check
        if: always()
        run: git diff --check origin/main...HEAD
