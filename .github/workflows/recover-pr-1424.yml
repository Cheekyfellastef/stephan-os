name: Recover PR 1424 queue repair

on:
  push:
    branches:
      - codex/implement-codex-dispatch-queue-v1-slice
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: recover-pr-1424
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/implement-codex-dispatch-queue-v1-slice

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Recover integrity-pinned Patch Courier packet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import urllib.request

          expected_sha = "64f5dbfdd6d9c2e611d4930ea46ef3fcb0d38d8e29a6edb6041abc5924842026"
          expected_length = 9855
          request = urllib.request.Request(
              "https://api.github.com/repos/Cheekyfellastef/stephan-os/issues/comments/4952660813",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "User-Agent": "stephan-os-pr-1424-recovery",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              body = json.load(response)["body"]

          match = re.search(r"BEGIN_DIFF_1424\s+```text\s+([A-Za-z0-9+/=\s]+?)\s+```\s+END_DIFF_1424", body, re.S)
          if not match:
              raise SystemExit("Patch Courier envelope not found")
          encoded = re.sub(r"\s+", "", match.group(1))
          patch = base64.b64decode(encoded, validate=True)
          observed_sha = hashlib.sha256(patch).hexdigest()
          if observed_sha != expected_sha or len(patch) != expected_length:
              raise SystemExit(f"Integrity mismatch: bytes={len(patch)} sha256={observed_sha}")
          with open("/tmp/pr-1424.patch", "wb") as handle:
              handle.write(patch)
          print(f"PATCH_SHA256={observed_sha}")
          print(f"PATCH_BYTES={len(patch)}")
          PY

          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/codex/implement-codex-dispatch-queue-v1-slice)"
          git apply --check /tmp/pr-1424.patch
          git apply /tmp/pr-1424.patch
          git diff --check

          cat > /tmp/expected-files.txt <<'EOF'
          shared/agents/automatedCodexDispatcher.mjs
          shared/agents/automatedCodexDispatcher.test.mjs
          shared/agents/codexDispatchQueue.mjs
          shared/agents/codexDispatchQueue.test.mjs
          EOF
          git diff --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

          node --test \
            shared/agents/codexDispatchQueue.test.mjs \
            shared/agents/automatedCodexDispatcher.test.mjs \
            shared/agents/verificationHarness.test.mjs \
            shared/agents/verificationHarnessWorkspace.test.mjs
          node --test shared/agents/*.test.mjs
          git diff --check

      - name: Publish verified repair and remove recovery workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/recover-pr-1424.yml
          git config user.name "stephan-os-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Repair Codex Dispatch Queue approval and proof gates"
          git push origin HEAD:codex/implement-codex-dispatch-queue-v1-slice
