name: Original R7 Windows SCM Preflight

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/windows/Stephanos.OriginalR7CustodyWitness/**'
      - 'src/windows/Stephanos.OriginalR7CustodyWitness.Tests/**'
      - 'scripts/windows/inspect-original-r7-witness-readiness-readonly.ps1'
      - 'shared/agents/originalR7WitnessReadinessRemote.test.mjs'
      - 'shared/agents/sovereignCommanderRemoteMailboxV1.mjs'
      - 'scripts/battle-bridge-github-command-mailbox.mjs'
      - '.github/workflows/original-r7-scm-preflight.yml'

permissions:
  contents: read

concurrency:
  group: original-r7-scm-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-scm-preflight:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile actual SCM witness service binary
        shell: pwsh
        run: |
          dotnet build src/windows/Stephanos.OriginalR7CustodyWitness/Stephanos.OriginalR7CustodyWitness.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute Windows native SCM registry and identity negative tests
        shell: pwsh
        run: |
          dotnet run --project src/windows/Stephanos.OriginalR7CustodyWitness.Tests/Stephanos.OriginalR7CustodyWitness.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute pinned read-only R7 commissioning census on actual hosted Windows
        shell: pwsh
        run: |
          # This is a disposable GitHub Actions Windows runner, not Battle Bridge.
          # No SCM registration, service start, ACL mutation, signing or lease release.
          $script = Join-Path $PWD 'scripts/windows/inspect-original-r7-witness-readiness-readonly.ps1'
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) { throw 'R7_READINESS_SCRIPT_NOT_FOUND' }
          $lines = @(& $script)
          if ($lines.Count -ne 1) { throw 'R7_READINESS_OUTPUT_COUNT_INVALID' }
          $report = $lines[0] | ConvertFrom-Json -ErrorAction Stop
          if ($report.schemaVersion -ne 'stephanos.original-r7-witness-commissioning-audit.v1') { throw 'R7_READINESS_SCHEMA_INVALID' }
          if ($report.inspectionMode -ne 'UNPRIVILEGED_READ_ONLY') { throw 'R7_READINESS_MODE_INVALID' }
          if ($report.originalLeaseId -ne 'critical-2962-elastic-goal-r7-lease') { throw 'R7_READINESS_LEASE_ID_INVALID' }
          if ($report.serviceName -ne 'StephanosOriginalR7CustodyWitness') { throw 'R7_READINESS_SERVICE_ID_INVALID' }
          if ($report.finalVerdict -ne 'COMMISSIONING_NOT_PROVEN') { throw 'R7_READINESS_NOT_HELD' }
          $neverAuthorize = @(
            'privilegedServiceSidVerified',
            'sourceAclDenialEnforced', 'outOfJobWritersExcluded',
            'wmiComRelaunchDenied', 'scheduledTaskRelaunchDenied',
            'trustRootsVerified', 'independentOperatorSignatureVerified',
            'leaseReleaseAuthorized', 'sourceMutationAuthorized'
          )
          foreach ($flag in $neverAuthorize) {
            if ($report.$flag -ne $false) { throw 'R7_READINESS_AUTHORITY_INFLATION' }
          }
          if ($report.serviceStatus -notin @('RUNNING','STOPPED','NOT_INSTALLED','UNKNOWN')) { throw 'R7_READINESS_SERVICE_STATUS_INVALID' }
          # Never display raw process, service user, path, task or SID information.
          Write-Output 'R7_READONLY_WINDOWS_RUNNER_PROBE_PASSED=true'
          Write-Output 'R7_READONLY_WINDOWS_RUNNER_IS_BATTLE_BRIDGE=false'
          Write-Output 'R7_PHYSICAL_EXCLUSION_PROVEN=false'
      - name: Test bounded Sovereign receipt against forged authority
        shell: pwsh
        run: |
          node --test shared/agents/originalR7WitnessReadinessRemote.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record custody authority boundary
        if: always()
        shell: pwsh
        run: |
          Write-Output 'HOSTED_WINDOWS_CI_SHAPE_ONLY=true'
          Write-Output 'ORIGINAL_R7_WRITER_DENIED=false'
          Write-Output 'BATTLE_BRIDGE_OS_WITNESS_SIGNER_COMMISSIONED=false'
          Write-Output 'R7_LEASE_RELEASED=false'
