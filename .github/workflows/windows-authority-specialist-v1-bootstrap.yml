name: Windows Authority Specialist V1 Bootstrap

on:
  push:
    branches:
      - fix/windows-authority-specialist-v1

permissions:
  contents: write

concurrency:
  group: windows-authority-specialist-v1-bootstrap
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact construction branch
        uses: actions/checkout@v4
        with:
          ref: fix/windows-authority-specialist-v1
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact base and bootstrap-only delta
        shell: bash
        run: |
          set -euo pipefail
          exact_main='2c9d5666839a1b31205d397baec075e4e758784d'
          bootstrap='.github/workflows/windows-authority-specialist-v1-bootstrap.yml'
          test "$(git rev-parse origin/main)" = "$exact_main"
          test "$(git rev-parse HEAD^)" = "$exact_main"
          test "$(git diff --name-only HEAD^..HEAD)" = "$bootstrap"

      - name: Add the pure Windows authority specialist
        shell: bash
        run: |
          set -euo pipefail
          cat > shared/agents/windowsAuthoritySpecialistReviewV1.mjs <<'EOF'
          import { createHash } from 'node:crypto';

          export const WINDOWS_AUTHORITY_SPECIALIST_SCHEMA = 'stephanos.windows-authority-specialist-review.v1';
          export const WINDOWS_AUTHORITY_SPECIALIST_KIND = 'stephanos.windows-authority-specialist.review';
          export const WINDOWS_AUTHORITY_SPECIALIST_REVIEWER_ID = 'source-controlled-windows-authority-specialist-v1';
          export const WINDOWS_AUTHORITY_SPECIALIST_REVIEWER_CLASS = 'deterministic-qualified';
          export const WINDOWS_AUTHORITY_SPECIALIST_PROVIDER = 'stephanos-windows-authority-specialist';
          export const WINDOWS_AUTHORITY_SPECIALIST_MODEL_CLASS = 'source-controlled-windows-authority-v1';

          export const WINDOWS_AUTHORITY_SPECIALIST_PATHS = Object.freeze([
            'scripts/windows/install-stephanos-backend-autostart.ps1',
            'scripts/windows/probe-battle-bridge-recovery-mesh.ps1',
            'scripts/windows/start-stephanos-backend.ps1',
          ]);

          const SHA40 = /^[a-f0-9]{40}$/;
          const SAFE_REPOSITORY = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;
          const MAX_SOURCE_BYTES = 256 * 1024;

          function text(value) {
            return String(value ?? '').trim();
          }

          function positiveInteger(value) {
            const parsed = Number.parseInt(String(value ?? ''), 10);
            return Number.isSafeInteger(parsed) && parsed > 0 ? parsed : 0;
          }

          function unique(values) {
            return [...new Set(values)];
          }

          function gitBlobSha(content) {
            const bytes = Buffer.from(content, 'utf8');
            return createHash('sha1')
              .update(`blob ${bytes.length}\0`, 'utf8')
              .update(bytes)
              .digest('hex');
          }

          function finding(code, summary, path) {
            return Object.freeze({ severity: 'P0', code, summary, path });
          }

          function requirePattern(findings, source, pattern, code, summary, path) {
            if (!pattern.test(source)) findings.push(finding(code, summary, path));
          }

          function rejectPattern(findings, source, pattern, code, summary, path) {
            if (pattern.test(source)) findings.push(finding(code, summary, path));
          }

          function validateCallOperators(findings, source, allowedVariables, path) {
            const observed = [...source.matchAll(/&\s+\$([A-Za-z_][A-Za-z0-9_]*)/g)]
              .map((match) => match[1]);
            for (const variable of unique(observed)) {
              if (!allowedVariables.includes(variable)) {
                findings.push(finding(
                  'windows-specialist-dynamic-executable-selection',
                  `Call operator uses non-canonical executable variable $${variable}.`,
                  path,
                ));
              }
            }
          }

          function validateGeneralAuthority(findings, source, path) {
            const forbidden = [
              [/\bInvoke-Expression\b|\biex\s+/i, 'windows-specialist-eval-authority', 'Dynamic PowerShell evaluation is forbidden.'],
              [/\bEncodedCommand\b|['"]-Command['"]/i, 'windows-specialist-command-string-authority', 'Encoded or command-string PowerShell execution is forbidden.'],
              [/\bStart-Job\b|\bInvoke-Command\b/i, 'windows-specialist-remote-or-background-command', 'Background or remoting command execution is forbidden.'],
              [/\bRestart-Computer\b|\bStop-Process\b/i, 'windows-specialist-broad-host-mutation', 'Broad computer or process mutation is forbidden.'],
              [/\bgit(?:\.exe)?\s+(?:reset|clean|checkout|switch|rebase|push|branch\s+-D)\b/i, 'windows-specialist-destructive-git', 'Destructive or publishing Git authority is forbidden.'],
              [/\bGet-Command\s+(?:git|git\.exe|npm|npm\.cmd|node|node\.exe|wscript|wscript\.exe|powershell|powershell\.exe)\b/i, 'windows-specialist-path-executable-selection', 'Executable selection through PATH is forbidden.'],
              [/\$env:(?:SystemRoot|ComSpec|PATH)\b/i, 'windows-specialist-mutable-host-root', 'Executable authority may not derive from mutable host-root environment state.'],
            ];
            for (const [pattern, code, summary] of forbidden) {
              rejectPattern(findings, source, pattern, code, summary, path);
            }
          }

          function validateInstaller(findings, source, path) {
            requirePattern(findings, source, /\$wscriptExe\s*=\s*'C:\\Windows\\System32\\wscript\.exe'/, 'windows-specialist-wscript-not-pinned', 'The Scheduled Task host must be the fixed Windows wscript executable.', path);
            requirePattern(findings, source, /Test-Path -LiteralPath \$wscriptExe -PathType Leaf/, 'windows-specialist-wscript-presence-not-proved', 'The fixed wscript executable must be proved before task registration.', path);
            requirePattern(findings, source, /New-ScheduledTaskAction -Execute \$wscriptExe -Argument \$taskArgs/, 'windows-specialist-task-action-not-fixed', 'The backend task action must use only the fixed windowless launcher.', path);
            requirePattern(findings, source, /\/\/B \/\/NoLogo[\s\S]{0,160}\bbackend\b/, 'windows-specialist-task-arguments-not-fixed', 'The backend task arguments must use the fixed hidden backend launcher identity.', path);
            requirePattern(findings, source, /New-ScheduledTaskPrincipal[^\r\n]*-LogonType Interactive[^\r\n]*-RunLevel Limited/, 'windows-specialist-task-principal-not-limited', 'The backend task principal must be interactive and limited.', path);
            requirePattern(findings, source, /New-ScheduledTaskSettingsSet[^\r\n]*-MultipleInstances IgnoreNew/, 'windows-specialist-task-overlap-not-blocked', 'The backend task must reject overlapping instances.', path);
            rejectPattern(findings, source, /RunLevel Highest|-MultipleInstances Parallel|Start-Process|Remove-Item/i, 'windows-specialist-installer-authority-too-broad', 'The task installer may not elevate, overlap, spawn arbitrary processes or delete files.', path);
            validateCallOperators(findings, source, [], path);
          }

          function validateProbe(findings, source, path) {
            for (const [pattern, code, summary] of [
              [/\[ValidateSet\('Inspect', 'Recover'\)\]/, 'windows-specialist-probe-mode-open', 'The recovery probe must expose only Inspect and Recover.'],
              [/\$wscriptPath\s*=\s*'C:\\Windows\\System32\\wscript\.exe'/, 'windows-specialist-probe-wscript-not-pinned', 'The probe must pin wscript.'],
              [/\$canonicalPowerShell\s*=\s*'C:\\Windows\\System32\\WindowsPowerShell\\v1\.0\\powershell\.exe'/, 'windows-specialist-probe-powershell-not-pinned', 'The probe must pin Windows PowerShell.'],
              [/\$canonicalNode\s*=\s*'C:\\Program Files\\nodejs\\node\.exe'/, 'windows-specialist-probe-node-not-pinned', 'The probe must pin Node.'],
              [/\$sourceControlExecutable\s*=\s*'C:\\Program Files\\Git\\cmd\\git\.exe'/, 'windows-specialist-probe-git-not-pinned', 'The probe must pin Git.'],
              [/Start-ScheduledTask -TaskName \$spec\.Name/, 'windows-specialist-probe-task-start-open', 'Recovery may start only the fixed task selected from the closed task catalogue.'],
              [/Principal\.LogonType[\s\S]{0,160}'Interactive'/, 'windows-specialist-probe-task-logon-unproved', 'Task authority must require interactive logon.'],
              [/Principal\.RunLevel[\s\S]{0,160}'Limited'/, 'windows-specialist-probe-task-runlevel-unproved', 'Task authority must require limited run level.'],
              [/Settings\.MultipleInstances[\s\S]{0,160}'IgnoreNew'/, 'windows-specialist-probe-task-overlap-unproved', 'Task authority must require IgnoreNew overlap policy.'],
              [/Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction Stop/, 'windows-specialist-listener-inspection-not-fail-closed', 'Backend listener inspection must fail closed.'],
              [/Get-CimInstance Win32_Process[^\r\n]*-ErrorAction Stop/, 'windows-specialist-process-inspection-not-fail-closed', 'Backend process inspection must fail closed.'],
              [/process\.ExecutablePath/, 'windows-specialist-listener-executable-unbound', 'Backend listener identity must bind the executable path.'],
              [/expectedQuotedCommand[\s\S]{0,400}expectedUnquotedCommand/, 'windows-specialist-listener-command-unbound', 'Backend listener identity must bind an exact command line.'],
              [/creationTimeUtc/, 'windows-specialist-listener-start-unbound', 'Backend listener identity must bind process creation time.'],
              [/receipt\.pid -eq \$listenerAfter\.pid/, 'windows-specialist-receipt-pid-unbound', 'Runtime receipt must bind the exact listener PID.'],
              [/receipt\.processStartTimeUtc -eq \$listenerAfter\.creationTimeUtc/, 'windows-specialist-receipt-start-unbound', 'Runtime receipt must bind process start time.'],
              [/receipt\.trackedWorktreeClean -eq \$true/, 'windows-specialist-receipt-cleanliness-unbound', 'Runtime receipt must bind tracked worktree cleanliness.'],
              [/BACKEND_LISTENER_IDENTITY_CHANGED/, 'windows-specialist-listener-race-unhandled', 'Listener replacement during proof must fail closed.'],
              [/BACKEND_TASK_PROCESS_LINEAGE_NOT_PROVEN/, 'windows-specialist-task-lineage-unhandled', 'Task-to-process lineage uncertainty must fail closed.'],
              [/Assert-CanonicalTrackedWorktreeClean/g, 'windows-specialist-clean-worktree-unproved', 'Tracked worktree cleanliness must be asserted before and after recovery.'],
            ]) {
              requirePattern(findings, source, pattern, code, summary, path);
            }
            const cleanChecks = (source.match(/Assert-CanonicalTrackedWorktreeClean -GitExecutable/g) || []).length;
            if (cleanChecks < 2) {
              findings.push(finding('windows-specialist-clean-worktree-recheck-missing', 'Tracked worktree cleanliness must be checked at least twice.', path));
            }
            for (const task of [
              'Stephanos Mission Orchestrator Worker Watchdog',
              'Stephanos Battle Bridge GitHub Command Mailbox',
              'Stephanos Battle Bridge Backend',
              'OpenClaw Gateway',
            ]) {
              if (!source.includes(task)) findings.push(finding('windows-specialist-fixed-task-catalogue-incomplete', `Missing fixed task ${task}.`, path));
            }
            rejectPattern(findings, source, /Start-Process|Remove-Item|RunLevel Highest|-MultipleInstances Parallel/i, 'windows-specialist-probe-authority-too-broad', 'The recovery probe may not spawn arbitrary processes, delete files or elevate tasks.', path);
            validateCallOperators(findings, source, ['canonicalNode', 'canonicalPowerShell', 'sourceControlExecutable'], path);
          }

          function validateStarter(findings, source, path) {
            for (const [pattern, code, summary] of [
              [/\$canonicalGit\s*=\s*'C:\\Program Files\\Git\\cmd\\git\.exe'/, 'windows-specialist-starter-git-not-pinned', 'Backend startup must pin Git.'],
              [/\$canonicalNpm\s*=\s*'C:\\Program Files\\nodejs\\npm\.cmd'/, 'windows-specialist-starter-npm-not-pinned', 'Backend startup must pin npm.'],
              [/\$canonicalNode\s*=\s*'C:\\Program Files\\nodejs\\node\.exe'/, 'windows-specialist-starter-node-not-pinned', 'Backend startup must pin Node.'],
              [/MaximumRedirection 0/, 'windows-specialist-health-redirect-not-blocked', 'Backend health proof must reject redirects.'],
              [/stephanos\.backend-health\.v1/, 'windows-specialist-health-schema-unbound', 'Backend health proof must bind the canonical schema.'],
              [/stephanos-battle-bridge-backend/, 'windows-specialist-health-runtime-unbound', 'Backend health proof must bind the runtime identity.'],
              [/backendIdentity\.sourceHead/, 'windows-specialist-health-head-unbound', 'Backend health proof must bind exact source head.'],
              [/process\.ExecutablePath/, 'windows-specialist-starter-listener-executable-unbound', 'Backend listener must bind the exact Node executable.'],
              [/expectedQuotedCommand[\s\S]{0,400}expectedUnquotedCommand/, 'windows-specialist-starter-listener-command-unbound', 'Backend listener must bind an exact command line.'],
              [/ProcessStartTimeUtc/, 'windows-specialist-starter-process-start-unbound', 'Backend listener and receipt must bind process start time.'],
              [/trackedWorktreeClean = \$true/, 'windows-specialist-starter-clean-receipt-missing', 'Backend runtime receipt must assert tracked worktree cleanliness.'],
              [/arbitraryShellAllowed = \$false/, 'windows-specialist-starter-shell-boundary-missing', 'Backend runtime receipt must deny arbitrary shell.'],
              [/sourceMutationAllowed = \$false/, 'windows-specialist-starter-source-boundary-missing', 'Backend runtime receipt must deny source mutation.'],
              [/Publish-VerifiedBackendRuntimeReceipt/, 'windows-specialist-starter-stable-publication-missing', 'Runtime receipt publication must revalidate listener identity.'],
              [/confirmedListener\.ProcessId -ne \$Listener\.ProcessId/, 'windows-specialist-starter-pid-race-unhandled', 'Receipt publication must fail on PID replacement.'],
              [/confirmedListener\.ProcessStartTimeUtc -ne \$Listener\.ProcessStartTimeUtc/, 'windows-specialist-starter-start-race-unhandled', 'Receipt publication must fail on process-start replacement.'],
              [/status '--porcelain=v1' '--untracked-files=no'/, 'windows-specialist-starter-clean-worktree-unproved', 'Backend startup must prove tracked worktree cleanliness.'],
              [/Backend startup requires an unmodified tracked worktree at exact head/, 'windows-specialist-starter-dirty-blocker-missing', 'Tracked source drift must block backend startup.'],
              [/\$env:STEPHANOS_BACKEND_SOURCE_HEAD = \$headSha/, 'windows-specialist-starter-child-head-unbound', 'The backend child must receive the exact source head.'],
              [/Start-Process -FilePath \$canonicalNpm/, 'windows-specialist-starter-process-host-open', 'Backend startup must spawn only fixed npm.'],
              [/\$existingListener[\s\S]*Publish-VerifiedBackendRuntimeReceipt[\s\S]*exit 0/, 'windows-specialist-starter-reuse-unreceipted', 'Existing exact backend reuse must refresh a verified receipt before success.'],
            ]) {
              requirePattern(findings, source, pattern, code, summary, path);
            }
            const starts = (source.match(/Start-Process\s+-FilePath/g) || []).length;
            if (starts !== 1) findings.push(finding('windows-specialist-starter-process-count-invalid', 'Backend startup must contain exactly one bounded Start-Process call.', path));
            rejectPattern(findings, source, /Start-Process\s+-FilePath\s+(?!\$canonicalNpm)/, 'windows-specialist-starter-process-target-open', 'Backend startup may spawn only fixed npm.', path);
            validateCallOperators(findings, source, ['canonicalGit', 'canonicalNpm'], path);
          }

          export function analyzeWindowsAuthoritySpecialistReviewV1(input = {}) {
            const repository = text(input.repository);
            const sourceHead = text(input.sourceHead).toLowerCase();
            const baseSha = text(input.baseSha).toLowerCase();
            const workflowRunId = positiveInteger(input.workflowRunId);
            const workflowRunAttempt = positiveInteger(input.workflowRunAttempt);
            const paths = unique((Array.isArray(input.paths) ? input.paths : []).map(text).filter(Boolean)).sort();
            const sourceFiles = Array.isArray(input.sourceFiles) ? input.sourceFiles : [];
            const findings = [];

            if (!SAFE_REPOSITORY.test(repository)) findings.push(finding('windows-specialist-repository-invalid', 'Repository identity is invalid.', ''));
            if (!SHA40.test(sourceHead)) findings.push(finding('windows-specialist-head-invalid', 'Exact source head is invalid.', ''));
            if (!SHA40.test(baseSha)) findings.push(finding('windows-specialist-base-invalid', 'Exact base SHA is invalid.', ''));
            if (!workflowRunId || !workflowRunAttempt) findings.push(finding('windows-specialist-run-identity-invalid', 'Workflow run identity is incomplete.', ''));
            if (paths.length < 1 || paths.length > WINDOWS_AUTHORITY_SPECIALIST_PATHS.length) {
              findings.push(finding('windows-specialist-path-count-invalid', 'Specialist path count is outside the closed bound.', ''));
            }
            for (const path of paths) {
              if (!WINDOWS_AUTHORITY_SPECIALIST_PATHS.includes(path)) {
                findings.push(finding('windows-specialist-path-unsupported', 'The Windows authority path is outside the specialist allowlist.', path));
              }
            }

            const byPath = new Map();
            for (const sourceFile of sourceFiles) {
              const path = text(sourceFile?.path);
              if (!path || byPath.has(path)) {
                findings.push(finding('windows-specialist-source-evidence-duplicate', 'Exact source evidence is duplicated or missing a path.', path));
                continue;
              }
              byPath.set(path, sourceFile);
            }
            if (sourceFiles.length !== paths.length) {
              findings.push(finding('windows-specialist-source-evidence-count-mismatch', 'Exact source evidence must match the escalation path set.', ''));
            }

            for (const path of paths) {
              const sourceFile = byPath.get(path);
              const content = typeof sourceFile?.content === 'string' ? sourceFile.content : '';
              const bytes = Buffer.byteLength(content, 'utf8');
              if (!sourceFile
                || sourceFile.exists !== true
                || text(sourceFile.ref).toLowerCase() !== sourceHead
                || text(sourceFile.path) !== path
                || bytes < 1
                || bytes > MAX_SOURCE_BYTES
                || Number(sourceFile.size) !== bytes
                || text(sourceFile.blobSha).toLowerCase() !== gitBlobSha(content)) {
                findings.push(finding('windows-specialist-exact-source-evidence-invalid', 'Exact final source evidence is missing, stale or digest-mismatched.', path));
                continue;
              }
              validateGeneralAuthority(findings, content, path);
              if (path === WINDOWS_AUTHORITY_SPECIALIST_PATHS[0]) validateInstaller(findings, content, path);
              if (path === WINDOWS_AUTHORITY_SPECIALIST_PATHS[1]) validateProbe(findings, content, path);
              if (path === WINDOWS_AUTHORITY_SPECIALIST_PATHS[2]) validateStarter(findings, content, path);
            }

            const uniqueFindings = unique(findings.map((item) => JSON.stringify(item))).map((item) => JSON.parse(item));
            const verdict = uniqueFindings.length ? 'findings' : 'clean';
            const proofRefs = [
              `proofs/windows-specialist/run-${workflowRunId}-attempt-${workflowRunAttempt}`,
              `proofs/windows-specialist/head-${sourceHead.slice(0, 12)}`,
              `proofs/windows-specialist/base-${baseSha.slice(0, 12)}`,
              ...paths.map((path) => `proofs/windows-specialist/path/${path}`),
              ...paths.map((path) => {
                const blobSha = text(byPath.get(path)?.blobSha).toLowerCase();
                return `proofs/windows-specialist/blob-${blobSha}`;
              }).filter((item) => /blob-[a-f0-9]{40}$/.test(item)),
            ];

            return Object.freeze({
              schemaVersion: WINDOWS_AUTHORITY_SPECIALIST_SCHEMA,
              kind: WINDOWS_AUTHORITY_SPECIALIST_KIND,
              repository,
              sourceHead,
              baseSha,
              workflowRunId,
              workflowRunAttempt,
              reviewerId: WINDOWS_AUTHORITY_SPECIALIST_REVIEWER_ID,
              reviewerClass: WINDOWS_AUTHORITY_SPECIALIST_REVIEWER_CLASS,
              provider: WINDOWS_AUTHORITY_SPECIALIST_PROVIDER,
              modelClass: WINDOWS_AUTHORITY_SPECIALIST_MODEL_CLASS,
              reviewerSessionId: `windows-authority-specialist-run-${workflowRunId}-attempt-${workflowRunAttempt}`,
              assuranceMode: 'specialist',
              reviewScope: Object.freeze(['complete-exact-head-diff', 'windows-authority-specialist', 'fixed-executable-and-task-authority']),
              paths: Object.freeze(paths),
              findings: Object.freeze(uniqueFindings),
              verdict,
              blocker: verdict === 'clean' ? '' : 'WINDOWS_AUTHORITY_SPECIALIST_FINDINGS',
              proofRefs: Object.freeze(unique(proofRefs)),
            });
          }
          EOF

          cat > shared/agents/windowsAuthoritySpecialistReviewV1.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import {
            WINDOWS_AUTHORITY_SPECIALIST_PATHS,
            analyzeWindowsAuthoritySpecialistReviewV1,
          } from './windowsAuthoritySpecialistReviewV1.mjs';

          const head = 'a'.repeat(40);
          const base = 'b'.repeat(40);

          function blobSha(content) {
            const bytes = Buffer.from(content, 'utf8');
            return createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
          }

          function sourceFile(path, content) {
            return { path, ref: head, exists: true, size: Buffer.byteLength(content), blobSha: blobSha(content), content };
          }

          const installer = String.raw`
          $wscriptExe = 'C:\Windows\System32\wscript.exe'
          if (-not (Test-Path -LiteralPath $wscriptExe -PathType Leaf)) { throw 'missing' }
          $taskArgs = "//B //NoLogo launcher backend"
          $action = New-ScheduledTaskAction -Execute $wscriptExe -Argument $taskArgs
          $principal = New-ScheduledTaskPrincipal -UserId $currentUser -LogonType Interactive -RunLevel Limited
          $settings = New-ScheduledTaskSettingsSet -MultipleInstances IgnoreNew
          `;

          const probe = String.raw`
          [ValidateSet('Inspect', 'Recover')]
          $wscriptPath = 'C:\Windows\System32\wscript.exe'
          $canonicalPowerShell = 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
          $canonicalNode = 'C:\Program Files\nodejs\node.exe'
          $sourceControlExecutable = 'C:\Program Files\Git\cmd\git.exe'
          Stephanos Mission Orchestrator Worker Watchdog
          Stephanos Battle Bridge GitHub Command Mailbox
          Stephanos Battle Bridge Backend
          OpenClaw Gateway
          Principal.LogonType -eq 'Interactive'
          Principal.RunLevel -eq 'Limited'
          Settings.MultipleInstances -eq 'IgnoreNew'
          Start-ScheduledTask -TaskName $spec.Name
          Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction Stop
          Get-CimInstance Win32_Process -ErrorAction Stop
          $process.ExecutablePath
          $expectedQuotedCommand = 'x'; $expectedUnquotedCommand = 'y'
          $creationTimeUtc = 'z'
          $receipt.pid -eq $listenerAfter.pid
          $receipt.processStartTimeUtc -eq $listenerAfter.creationTimeUtc
          $receipt.trackedWorktreeClean -eq $true
          BACKEND_LISTENER_IDENTITY_CHANGED
          BACKEND_TASK_PROCESS_LINEAGE_NOT_PROVEN
          Assert-CanonicalTrackedWorktreeClean -GitExecutable $sourceControlExecutable
          Assert-CanonicalTrackedWorktreeClean -GitExecutable $sourceControlExecutable
          & $canonicalNode x
          & $canonicalPowerShell x
          & $sourceControlExecutable x
          `;

          const starter = String.raw`
          $canonicalGit = 'C:\Program Files\Git\cmd\git.exe'
          $canonicalNpm = 'C:\Program Files\nodejs\npm.cmd'
          $canonicalNode = 'C:\Program Files\nodejs\node.exe'
          MaximumRedirection 0
          stephanos.backend-health.v1
          stephanos-battle-bridge-backend
          $body.backendIdentity.sourceHead
          $process.ExecutablePath
          $expectedQuotedCommand = 'x'; $expectedUnquotedCommand = 'y'
          ProcessStartTimeUtc
          trackedWorktreeClean = $true
          arbitraryShellAllowed = $false
          sourceMutationAllowed = $false
          Publish-VerifiedBackendRuntimeReceipt
          $confirmedListener.ProcessId -ne $Listener.ProcessId
          $confirmedListener.ProcessStartTimeUtc -ne $Listener.ProcessStartTimeUtc
          status '--porcelain=v1' '--untracked-files=no'
          Backend startup requires an unmodified tracked worktree at exact head
          $env:STEPHANOS_BACKEND_SOURCE_HEAD = $headSha
          $existingListener = 1
          Publish-VerifiedBackendRuntimeReceipt
          exit 0
          & $canonicalGit x
          & $canonicalNpm x
          Start-Process -FilePath $canonicalNpm
          `;

          function cleanInput() {
            const contents = [installer, probe, starter];
            return {
              repository: 'Cheekyfellastef/stephan-os',
              sourceHead: head,
              baseSha: base,
              workflowRunId: 123,
              workflowRunAttempt: 1,
              paths: WINDOWS_AUTHORITY_SPECIALIST_PATHS,
              sourceFiles: WINDOWS_AUTHORITY_SPECIALIST_PATHS.map((path, index) => sourceFile(path, contents[index])),
            };
          }

          test('closed exact Windows authority surface can receive a clean specialist result', () => {
            const result = analyzeWindowsAuthoritySpecialistReviewV1(cleanInput());
            assert.equal(result.verdict, 'clean');
            assert.deepEqual(result.findings, []);
            assert.equal(result.assuranceMode, 'specialist');
            assert.equal(result.blocker, '');
          });

          test('unsupported Windows paths remain escalated', () => {
            const input = cleanInput();
            input.paths = ['scripts/windows/arbitrary.ps1'];
            input.sourceFiles = [sourceFile(input.paths[0], installer)];
            const result = analyzeWindowsAuthoritySpecialistReviewV1(input);
            assert.equal(result.verdict, 'findings');
            assert.ok(result.findings.some((item) => item.code === 'windows-specialist-path-unsupported'));
          });

          test('source evidence is exact-head and blob bound', () => {
            for (const mutate of [
              (file) => ({ ...file, ref: 'c'.repeat(40) }),
              (file) => ({ ...file, blobSha: 'd'.repeat(40) }),
              (file) => ({ ...file, size: file.size + 1 }),
              (file) => ({ ...file, exists: false }),
            ]) {
              const input = cleanInput();
              input.paths = [WINDOWS_AUTHORITY_SPECIALIST_PATHS[0]];
              input.sourceFiles = [mutate(input.sourceFiles[0])];
              const result = analyzeWindowsAuthoritySpecialistReviewV1(input);
              assert.ok(result.findings.some((item) => item.code === 'windows-specialist-exact-source-evidence-invalid'));
            }
          });

          test('PATH-selected executables and dynamic command authority fail closed', () => {
            for (const hostile of [
              `${starter}\nGet-Command npm`,
              `${starter}\nInvoke-Expression $command`,
              `${starter}\n& $callerExecutable args`,
              `${starter}\nStart-Process -FilePath $untrusted`,
            ]) {
              const input = cleanInput();
              input.paths = [WINDOWS_AUTHORITY_SPECIALIST_PATHS[2]];
              input.sourceFiles = [sourceFile(input.paths[0], hostile)];
              const result = analyzeWindowsAuthoritySpecialistReviewV1(input);
              assert.equal(result.verdict, 'findings');
            }
          });

          test('missing listener, receipt, task and cleanliness invariants fail closed', () => {
            const cases = [
              [WINDOWS_AUTHORITY_SPECIALIST_PATHS[0], installer.replace('-RunLevel Limited', '-RunLevel Highest')],
              [WINDOWS_AUTHORITY_SPECIALIST_PATHS[1], probe.replace('BACKEND_LISTENER_IDENTITY_CHANGED', '')],
              [WINDOWS_AUTHORITY_SPECIALIST_PATHS[1], probe.replace(/Assert-CanonicalTrackedWorktreeClean -GitExecutable \$sourceControlExecutable\n/, '')],
              [WINDOWS_AUTHORITY_SPECIALIST_PATHS[2], starter.replace('Publish-VerifiedBackendRuntimeReceipt', 'Publish-UnverifiedReceipt')],
              [WINDOWS_AUTHORITY_SPECIALIST_PATHS[2], starter.replace('MaximumRedirection 0', '')],
            ];
            for (const [path, content] of cases) {
              const input = cleanInput();
              input.paths = [path];
              input.sourceFiles = [sourceFile(path, content)];
              const result = analyzeWindowsAuthoritySpecialistReviewV1(input);
              assert.equal(result.verdict, 'findings');
            }
          });
          EOF

      - name: Wire deterministic specialist sealing into the trusted reviewer
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          function replaceOnce(source, before, after, label) {
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: expected one seam, observed ${count}`);
            return source.replace(before, after);
          }

          const qualifiedPath = 'shared/agents/qualifiedSpecialistReviewV1.mjs';
          let qualified = readFileSync(qualifiedPath, 'utf8');
          const validator = `
          function validateSourceControlledSpecialistReport(report = {}, options = {}) {
            const repository = text(options.repository);
            const sourceHead = text(options.sourceHead).toLowerCase();
            const baseSha = text(options.baseSha).toLowerCase();
            const workflowRunId = positiveInteger(options.workflowRunId);
            const workflowRunAttempt = positiveInteger(options.workflowRunAttempt);
            const paths = Array.isArray(options.paths) ? [...options.paths].sort() : [];
            const blockers = [];
            if (report?.schemaVersion !== 'stephanos.windows-authority-specialist-review.v1'
              || report?.kind !== 'stephanos.windows-authority-specialist.review') blockers.push('source-controlled-specialist-schema-mismatch');
            if (text(report?.repository) !== repository) blockers.push('source-controlled-specialist-repository-mismatch');
            if (text(report?.sourceHead).toLowerCase() !== sourceHead) blockers.push('source-controlled-specialist-head-mismatch');
            if (text(report?.baseSha).toLowerCase() !== baseSha) blockers.push('source-controlled-specialist-base-mismatch');
            if (positiveInteger(report?.workflowRunId) !== workflowRunId
              || positiveInteger(report?.workflowRunAttempt) !== workflowRunAttempt) blockers.push('source-controlled-specialist-run-mismatch');
            if (report?.reviewerId !== 'source-controlled-windows-authority-specialist-v1'
              || report?.reviewerClass !== 'deterministic-qualified'
              || report?.provider !== 'stephanos-windows-authority-specialist'
              || report?.modelClass !== 'source-controlled-windows-authority-v1') blockers.push('source-controlled-specialist-identity-mismatch');
            if (report?.assuranceMode !== 'specialist'
              || report?.verdict !== 'clean'
              || !Array.isArray(report?.findings)
              || report.findings.length !== 0
              || report?.blocker !== '') blockers.push('source-controlled-specialist-not-clean');
            if (JSON.stringify(Array.isArray(report?.paths) ? [...report.paths].sort() : []) !== JSON.stringify(paths)) {
              blockers.push('source-controlled-specialist-path-set-mismatch');
            }
            if (!Array.isArray(report?.reviewScope)
              || !report.reviewScope.includes('complete-exact-head-diff')
              || !report.reviewScope.includes('windows-authority-specialist')
              || !report.reviewScope.includes('fixed-executable-and-task-authority')) blockers.push('source-controlled-specialist-scope-incomplete');
            const requiredProofs = [
              \`proofs/windows-specialist/run-\${workflowRunId}-attempt-\${workflowRunAttempt}\`,
              \`proofs/windows-specialist/head-\${sourceHead.slice(0, 12)}\`,
              \`proofs/windows-specialist/base-\${baseSha.slice(0, 12)}\`,
              ...paths.map((path) => \`proofs/windows-specialist/path/\${path}\`),
            ];
            for (const proof of requiredProofs) {
              if (!Array.isArray(report?.proofRefs) || !report.proofRefs.includes(proof)) blockers.push(\`source-controlled-specialist-proof-missing:\${proof}\`);
            }
            return Object.freeze({ valid: blockers.length === 0, blockers: Object.freeze(unique(blockers)) });
          }

          `;
          qualified = replaceOnce(
            qualified,
            'function validateSpecialistReviewCandidate(review = {}, options = {}) {',
            `${validator}function validateSpecialistReviewCandidate(review = {}, options = {}) {`,
            'source-controlled specialist validator insertion',
          );
          const deterministicBranch = `
            if (input.specialistReport) {
              const reportValidation = validateSourceControlledSpecialistReport(input.specialistReport, {
                repository: input.repository,
                sourceHead: input.sourceHead,
                baseSha: input.baseSha,
                workflowRunId: input.workflowRunId,
                workflowRunAttempt: input.workflowRunAttempt,
                paths,
              });
              if (!reportValidation.valid) {
                return Object.freeze({
                  required: true,
                  valid: false,
                  analysis,
                  receipt: null,
                  reviewId: 0,
                  specialistReport: input.specialistReport,
                  blockers: reportValidation.blockers,
                });
              }
              const reportDigest = createHash('sha256')
                .update(canonicalJson(input.specialistReport), 'utf8')
                .digest('hex');
              const proofRefs = unique([
                ...(Array.isArray(analysis.proofRefs) ? analysis.proofRefs : []),
                ...(Array.isArray(input.specialistReport.proofRefs) ? input.specialistReport.proofRefs : []),
                \`proofs/specialist-review/report-sha256-\${reportDigest}\`,
                'proofs/specialist-review/reviewer-source-controlled-windows-authority-specialist-v1',
              ]);
              const cleanAnalysis = Object.freeze({
                schemaVersion: 'stephanos.independent-security-analysis.v1',
                findings: Object.freeze([]),
                counts: Object.freeze({ P0: 0, P1: 0, P2: 0 }),
                verdict: 'clean',
                proofRefs: Object.freeze(proofRefs),
                finalVerdict: 'INDEPENDENT_SECURITY_REVIEW_CLEAN',
              });
              return Object.freeze({
                required: true,
                valid: true,
                analysis: cleanAnalysis,
                receipt: null,
                reviewId: 0,
                specialistReport: input.specialistReport,
                paths,
                blockers: Object.freeze([]),
              });
            }

          `;
          qualified = replaceOnce(
            qualified,
            "  const candidates = (Array.isArray(input.reviews) ? input.reviews : [])\n",
            `${deterministicBranch}  const candidates = (Array.isArray(input.reviews) ? input.reviews : [])\n`,
            'source-controlled specialist adjudication branch',
          );
          writeFileSync(qualifiedPath, qualified, 'utf8');

          const reviewerPath = 'scripts/independent-merge-security-review-v2.mjs';
          let reviewer = readFileSync(reviewerPath, 'utf8');
          reviewer = replaceOnce(
            reviewer,
            "import { adjudicateQualifiedSpecialistReview } from '../shared/agents/qualifiedSpecialistReviewV1.mjs';",
            "import { adjudicateQualifiedSpecialistReview, qualifiedSpecialistEscalationPaths } from '../shared/agents/qualifiedSpecialistReviewV1.mjs';\nimport { analyzeWindowsAuthoritySpecialistReviewV1 } from '../shared/agents/windowsAuthoritySpecialistReviewV1.mjs';",
            'reviewer specialist imports',
          );
          reviewer = replaceOnce(
            reviewer,
            '  const [{ verdict: workflowVerdict }, files, diff, threads, reviews] = await Promise.all([',
            '  const [{ verdict: workflowVerdict }, files, diff, threads] = await Promise.all([',
            'reviewer bounded collection destructuring',
          );
          reviewer = replaceOnce(
            reviewer,
            "    unresolvedThreadCount(owner, repo, prNumber),\n    githubPages(`/repos/${owner}/${repo}/pulls/${prNumber}/reviews`),\n  ]);",
            "    unresolvedThreadCount(owner, repo, prNumber),\n  ]);",
            'remove unusable review API dependency',
          );
          const oldAdjudication = `  const specialist = adjudicateQualifiedSpecialistReview({
            analysis: deterministicAnalysis,
            reviews,
            repository,
            prNumber,
            branch,
            sourceHead,
            baseSha,
          });`;
          const newAdjudication = `  const specialistPaths = qualifiedSpecialistEscalationPaths(deterministicAnalysis);
          const specialistSourceFiles = await Promise.all(specialistPaths.map((path) => (
            protectedWorkflowSourceAtHead(owner, repo, repository, path, sourceHead)
          )));
          const specialistReport = specialistPaths.length
            ? analyzeWindowsAuthoritySpecialistReviewV1({
              repository,
              sourceHead,
              baseSha,
              workflowRunId: runId,
              workflowRunAttempt: runAttempt,
              paths: specialistPaths,
              sourceFiles: specialistSourceFiles,
              diff,
            })
            : null;
          const specialist = adjudicateQualifiedSpecialistReview({
            analysis: deterministicAnalysis,
            specialistReport,
            repository,
            prNumber,
            branch,
            sourceHead,
            baseSha,
            workflowRunId: runId,
            workflowRunAttempt: runAttempt,
          });`;
          reviewer = replaceOnce(reviewer, oldAdjudication, newAdjudication, 'reviewer specialist analysis');
          reviewer = replaceOnce(
            reviewer,
            "  console.log(`SPECIALIST_REVIEW_ID=${specialist.reviewId || ''}`);",
            "  console.log(`SPECIALIST_REVIEW_ID=${specialist.specialistReport?.reviewerSessionId || specialist.reviewId || ''}`);",
            'reviewer specialist identity output',
          );
          writeFileSync(reviewerPath, reviewer, 'utf8');

          const boundaryPath = 'shared/agents/operatorMergeApprovalBoundaryV2.mjs';
          let boundary = readFileSync(boundaryPath, 'utf8');
          boundary = replaceOnce(
            boundary,
            "  'shared/agents/qualifiedSpecialistReviewV1.mjs',\n]);",
            "  'shared/agents/qualifiedSpecialistReviewV1.mjs',\n  'shared/agents/windowsAuthoritySpecialistReviewV1.mjs',\n]);",
            'protect Windows specialist implementation',
          );
          writeFileSync(boundaryPath, boundary, 'utf8');

          const boundaryTestPath = 'shared/agents/operatorMergeApprovalBoundaryV2.test.mjs';
          let boundaryTests = readFileSync(boundaryTestPath, 'utf8');
          boundaryTests = replaceOnce(
            boundaryTests,
            "    'shared/agents/qualifiedSpecialistReviewV1.mjs',\n  ]);",
            "    'shared/agents/qualifiedSpecialistReviewV1.mjs',\n    'shared/agents/windowsAuthoritySpecialistReviewV1.mjs',\n  ]);",
            'boundary inventory test',
          );
          const title = "test('trusted reviewer fetches exact PR reviews and seals only through the specialist adjudicator'";
          const start = boundaryTests.indexOf(title);
          if (start < 0) throw new Error('old specialist reviewer source test not found');
          const next = boundaryTests.indexOf("\ntest('", start + title.length);
          const end = next < 0 ? boundaryTests.length : next;
          const replacement = `test('trusted reviewer uses exact source-controlled Windows specialist evidence without review API dependency', () => {
            const source = readFileSync(new URL('../../scripts/independent-merge-security-review-v2.mjs', import.meta.url), 'utf8');
            assert.match(source, /analyzeWindowsAuthoritySpecialistReviewV1/);
            assert.match(source, /qualifiedSpecialistEscalationPaths/);
            assert.match(source, /protectedWorkflowSourceAtHead\(owner, repo, repository, path, sourceHead\)/);
            assert.match(source, /SPECIALIST_REVIEW_DECISION/);
            assert.doesNotMatch(source, /pulls\/\$\{prNumber\}\/reviews/);
            assert.doesNotMatch(source, /gh\s+pr\s+(?:merge|ready)/);
          });\n`;
          boundaryTests = boundaryTests.slice(0, start) + replacement + boundaryTests.slice(end);
          writeFileSync(boundaryTestPath, boundaryTests, 'utf8');
          NODE

      - name: Remove bootstrap and verify exact six-file estate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/windows-authority-specialist-v1-bootstrap.yml
          git add --all
          expected="$(printf '%s\n' \
            scripts/independent-merge-security-review-v2.mjs \
            shared/agents/operatorMergeApprovalBoundaryV2.mjs \
            shared/agents/operatorMergeApprovalBoundaryV2.test.mjs \
            shared/agents/qualifiedSpecialistReviewV1.mjs \
            shared/agents/windowsAuthoritySpecialistReviewV1.mjs \
            shared/agents/windowsAuthoritySpecialistReviewV1.test.mjs | sort)"
          actual="$(git diff --cached --name-only origin/main | sort)"
          printf 'EXPECTED\n%s\nACTUAL\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          git diff --cached --check origin/main

