      - name: Prove the specialist against exact PR 1638 Windows sources
        shell: bash
        run: |
          set -euo pipefail
          pr_head='208df2ca79a9067c36ceccf099e84c9db1322212'
          pr_base='2c9d5666839a1b31205d397baec075e4e758784d'
          git fetch origin fix/battle-bridge-recovery-health-authority
          test "$(git rev-parse origin/fix/battle-bridge-recovery-health-authority)" = "$pr_head"
          PR_HEAD="$pr_head" PR_BASE="$pr_base" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { Buffer } from 'node:buffer';
          import {
            WINDOWS_AUTHORITY_SPECIALIST_PATHS,
            analyzeWindowsAuthoritySpecialistReviewV1,
          } from './shared/agents/windowsAuthoritySpecialistReviewV1.mjs';
          const head = process.env.PR_HEAD;
          const base = process.env.PR_BASE;
          const sourceFiles = WINDOWS_AUTHORITY_SPECIALIST_PATHS.map((path) => {
            const content = execFileSync('git', ['show', `${head}:${path}`], { encoding: 'utf8' });
            const blobSha = execFileSync('git', ['rev-parse', `${head}:${path}`], { encoding: 'utf8' }).trim();
            return { path, ref: head, exists: true, size: Buffer.byteLength(content), blobSha, content };
          });
          const result = analyzeWindowsAuthoritySpecialistReviewV1({
            repository: 'Cheekyfellastef/stephan-os',
            sourceHead: head,
            baseSha: base,
            workflowRunId: 1,
            workflowRunAttempt: 1,
            paths: WINDOWS_AUTHORITY_SPECIALIST_PATHS,
            sourceFiles,
          });
          assert.equal(result.verdict, 'clean', JSON.stringify(result.findings, null, 2));
          assert.deepEqual(result.findings, []);
          console.log('PR_1638_WINDOWS_SPECIALIST_CURRENT_SOURCE_CLEAN=true');
          NODE

