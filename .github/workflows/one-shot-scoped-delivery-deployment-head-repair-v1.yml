name: One-shot Scoped Delivery Deployment Head Repair V1

on:
  push:
    branches:
      - fix/chatgpt-scoped-live-status-v1
    paths:
      - '.github/workflows/one-shot-scoped-delivery-deployment-head-repair-v1.yml'
      - 'scripts/patch-scoped-delivery-repair-*-v1.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scoped-delivery-deployment-head-repair-v1
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/fix/chatgpt-scoped-live-status-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out sole continuation branch
        uses: actions/checkout@v4
        with:
          ref: fix/chatgpt-scoped-live-status-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply bounded deployment-head identity repair
        run: |
          node scripts/patch-scoped-delivery-repair-source-v1.mjs
          node scripts/patch-scoped-delivery-repair-tests-v1.mjs
          node scripts/patch-scoped-delivery-repair-mailbox-v1.mjs
          node scripts/patch-scoped-delivery-repair-mailbox-tests-docs-v1.mjs

      - name: Parse permanent source
        run: |
          node --check shared/agents/sharedWorkspaceScopedDeliveryStatusV1.mjs
          node --check shared/agents/battleBridgeGitHubCommandMailbox.mjs
          node --check shared/agents/chatGptParticipantBridgeV1.mjs
          node --check scripts/chatgpt-shared-workspace-github-relay.mjs

      - name: Run focused regressions
        run: >-
          node --test
          shared/agents/sharedWorkspaceScopedDeliveryStatusV1.test.mjs
          shared/agents/chatGptParticipantBridgeV1.test.mjs
          shared/agents/battleBridgeGitHubCommandMailbox.test.mjs
          scripts/chatgpt-shared-workspace-github-relay.test.mjs

      - name: Verify exact final estate and whitespace
        shell: bash
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          actual="$(mktemp)"
          cat > "${expected}" <<'EOF'
          docs/operations/chatgpt-shared-workspace-live-status.md
          shared/agents/battleBridgeGitHubCommandMailbox.mjs
          shared/agents/battleBridgeGitHubCommandMailbox.test.mjs
          shared/agents/chatGptParticipantBridgeV1.test.mjs
          shared/agents/sharedWorkspaceScopedDeliveryStatusV1.mjs
          shared/agents/sharedWorkspaceScopedDeliveryStatusV1.test.mjs
          scripts/chatgpt-shared-workspace-github-relay.test.mjs
          EOF
          git diff --name-only --diff-filter=ACMRT HEAD | sort > "${actual}"
          diff -u "${expected}" "${actual}"
          test ! -e .github/workflows/one-shot-scoped-delivery-deployment-head-repair-v1.yml
          test ! -e scripts/patch-scoped-delivery-repair-lib-v1.mjs
          test ! -e scripts/patch-scoped-delivery-repair-source-v1.mjs
          test ! -e scripts/patch-scoped-delivery-repair-tests-v1.mjs
          test ! -e scripts/patch-scoped-delivery-repair-mailbox-v1.mjs
          test ! -e scripts/patch-scoped-delivery-repair-mailbox-tests-docs-v1.mjs
          git diff --check

      - name: Publish permanent repair and remove constructor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Separate scoped feature merge from deployment head'
          git push origin HEAD:fix/chatgpt-scoped-live-status-v1
