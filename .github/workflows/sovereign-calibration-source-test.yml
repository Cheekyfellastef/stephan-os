name: Sovereign calibration focused test (temporary source proof)
on:
  pull_request:
    paths:
      - 'shared/agents/sovereignCalibrationV1.mjs'
      - 'shared/agents/sovereignCalibrationV1.test.mjs'
      - '.github/workflows/sovereign-calibration-source-test.yml'
permissions:
  contents: read
jobs:
  test-only:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the exact source-only adversarial tests
        run: node --test shared/agents/sovereignCalibrationV1.test.mjs
      - name: Confirm no runtime or approval operations executed
        run: |
          echo "SOVEREIGN_CALIBRATION_FOCUSED_TEST_ONLY=true"
          echo "WINDOWS_REVIEWER_QUALIFIED=false"
          echo "SPECIALIST_APPROVAL_ISSUED=false"
          echo "ORIGINAL_R7_LEASE_RELEASED=false"
