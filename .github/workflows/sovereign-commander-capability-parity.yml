      - 'stephanos-server/services/missionOrchestratorWorkerConsumer*'
      - 'stephanos-server/services/missionOrchestratorWorkerService*'
      - 'shared/agents/stephanosCoreDaemonV1*'
      - 'scripts/mission-orchestrator-worker-heartbeat*'
      - 'scripts/stephanos-core-daemon.mjs'
      - 'scripts/battle-bridge-goal-discovery-heartbeat*'
      - 'shared/agents/sovereignWindowsQualificationWorkflow.test.mjs'
      - 'scripts/sovereign-goal-builder-worker-evidence.test.mjs'
      - 'scripts/sovereign-commander-goal-builder-repair*'
      - 'scripts/sovereign-commander-control-plane-repair*'
      - 'shared/agents/goalDiscoveryWorkspaceV1*'
      - 'shared/agents/sovereignCommanderV1.test.mjs'
      - 'scripts/sovereign-commander-mcp.mjs'
      - 'shared/agents/sovereignCommanderMcp.test.mjs'
      - 'scripts/sovereign-commander-http.mjs'
      - 'shared/agents/sovereignCommanderHttp.test.mjs'
      - 'scripts/battle-bridge-observation.mjs'
      - 'tests/battle-bridge-observation.test.mjs'
      - 'shared/agents/sovereignCommanderRemoteMailboxV1.mjs'
      - 'shared/agents/sovereignCommanderRemoteMailboxV1.test.mjs'
      - 'shared/agents/sovereignCommanderCpuPressure.test.mjs'
      - 'scripts/windows/read-battle-bridge-cpu-pressure.ps1'
      - 'scripts/windows/run-sovereign-commander-hidden.ps1'
      - 'shared/agents/sovereignCommanderWindows.test.mjs'
      - 'scripts/sovereign-commander-ignition-autoheal.mjs'
      - '.gitattributes'
      - '.github/workflows/sovereign-commander-capability-parity.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax proof
        run: |
          node --check shared/agents/sovereignCommanderCapabilityParityV1.mjs
          node --check shared/agents/sovereignCommanderCapabilityCompilerV1.mjs
          node --check shared/agents/sovereignCommanderNativeGapIntakeV1.mjs
          node --check scripts/sovereign-commander-capability-parity-reconcile.mjs
          node --check scripts/sovereign-commander-preservation-converge.mjs
          node --check scripts/sovereign-commander-mcp.mjs
          node --check scripts/sovereign-commander-http.mjs
          node --check scripts/battle-bridge-observation.mjs
          node --check shared/agents/sovereignCommanderRemoteMailboxV1.mjs
          node --check scripts/sovereign-commander-fleet-goal-supervisor.mjs
      - name: Parse Windows PowerShell CPU and watchdog scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('scripts/windows/run-sovereign-commander-hidden.ps1', 'scripts/windows/read-battle-bridge-cpu-pressure.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) { Write-Host ('{0}:{1}: {2}' -f $file, $parseError.Extent.StartLineNumber, $parseError.Message) }
              throw "PowerShell parse errors: $file"
            }
          }
      - name: Focused parity regression tests
        run: |
          node --test shared/agents/sovereignCommanderCapabilityParityV1.test.mjs
          node --test shared/agents/sovereignCommanderCapabilityCompilerV1.test.mjs
          node --test shared/agents/sovereignCommanderNativeGapIntakeV1.test.mjs
          node --test scripts/sovereign-commander-capability-parity-reconcile.test.mjs
          node --test scripts/sovereign-commander-preservation-converge.test.mjs
          node --test shared/agents/sovereignCommanderRepairVerbs.test.mjs
          node --test shared/agents/sovereignCommanderFleetGoalSupervisorV1.test.mjs
          node --test shared/agents/sovereignCommanderV1.test.mjs
          node --test shared/agents/sovereignCommanderMcp.test.mjs
          node --test shared/agents/sovereignCommanderHttp.test.mjs
          node --test shared/agents/sovereignWindowsQualificationWorkflow.test.mjs shared/agents/sovereignMaintenanceAdmissionV1.test.mjs scripts/sovereign-goal-builder-worker-evidence.test.mjs scripts/sovereign-commander-goal-builder-repair.test.mjs shared/agents/goalDiscoveryWorkspaceV1.test.mjs scripts/sovereign-commander-control-plane-repair.test.mjs
          node --test tests/battle-bridge-observation.test.mjs
          node --test shared/agents/sovereignCommanderRemoteMailboxV1.test.mjs
          node --test shared/agents/sovereignCommanderCpuPressure.test.mjs
          node --test scripts/sovereign-commander-ignition-autoheal.test.mjs
          node --test shared/agents/sovereignCommanderWindows.test.mjs

  windows-core-admission:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Actual Windows classifier, custody hold and shared admission regressions
        run: node --test --test-concurrency=1 stephanos-server/services/githubLifeboatLane7Service.test.js stephanos-server/services/githubLifeboatLane7ClaimAckKeeper.test.js stephanos-server/services/missionOrchestratorWorkerConsumer.test.js stephanos-server/services/missionOrchestratorWorkerService.test.js scripts/battle-bridge-goal-discovery-heartbeat.test.mjs shared/agents/stephanosCoreDaemonV1.test.mjs scripts/sovereign-commander-custody-recycle.test.mjs shared/agents/stephanosCoreProcessObservationV1.test.mjs shared/agents/sovereignCommanderWindows.test.mjs shared/agents/sovereignMaintenanceAdmissionV1.test.mjs scripts/sovereign-goal-builder-worker-evidence.test.mjs shared/agents/windowsAuthorityStephanosCoreDaemonReviewV1.test.mjs scripts/sovereign-commander-control-plane-repair.test.mjs
