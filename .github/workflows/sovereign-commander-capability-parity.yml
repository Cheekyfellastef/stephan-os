      - 'shared/agents/sovereignCommanderNativeGapIntakeV1.mjs'
      - 'shared/agents/sovereignCommanderNativeGapIntakeV1.test.mjs'
      - 'scripts/sovereign-commander-capability-parity-reconcile.mjs'
      - 'scripts/sovereign-commander-capability-parity-reconcile.test.mjs'
      - 'scripts/sovereign-commander-preservation-converge.mjs'
      - 'scripts/sovereign-commander-preservation-converge.test.mjs'
