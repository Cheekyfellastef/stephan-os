name: PR 1627 Meterless Main Sync

on:
  push:
    branches:
      - feat/goal-dashboard-truth-wow-v2
    paths:
      - '.github/workflows/pr1627-meterless-main-sync.yml'

permissions:
  contents: write

concurrency:
  group: pr1627-meterless-main-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Cheekyfellastef/stephan-os'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the existing Goal Dashboard branch
        uses: actions/checkout@v4
        with:
          ref: feat/goal-dashboard-truth-wow-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Merge current main without rewriting history
        shell: bash
        run: |
          git config user.name "stephanos-meterless-builder[bot]"
          git config user.email "stephanos-meterless-builder[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          git rm .github/workflows/pr1627-meterless-main-sync.yml

      - name: Validate the reconciled Goal Dashboard
        shell: bash
        run: |
          node --check stephanos-server/services/githubTelemetryService.js
          node --check stephanos-server/services/liveGoalProjectionService.js
          node --check stephanos-server/services/missionOperationsService.js
          node --test \
            tests/github-telemetry.test.mjs \
            tests/goal-dashboard-live-telemetry.test.mjs \
            tests/live-goal-projection.test.mjs
          npm run stephanos:guard:imports
          git diff --check origin/main...HEAD

      - name: Commit the bounded merge
        shell: bash
        run: |
          git add --all
          git commit -m "Merge current main into Goal Dashboard V2"
          python3 - <<'PY'
          import subprocess
          expected = {
              'apps/goal-dashboard/index.html',
              'shared/agents/battleBridgeBuildConciergeV2.mjs',
              'stephanos-server/services/buildConciergeGoalService.js',
              'stephanos-server/services/githubTelemetryService.js',
              'stephanos-server/services/liveGoalProjectionService.js',
              'stephanos-server/services/missionOperationsService.js',
              'tests/github-telemetry.test.mjs',
              'tests/goal-dashboard-live-telemetry.test.mjs',
              'tests/live-goal-projection.test.mjs',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'],
              text=True,
          ).splitlines())
          if actual != expected:
              raise SystemExit(f'Unexpected final PR estate: {sorted(actual)}')
          PY
          git diff --check origin/main...HEAD
          git push origin HEAD:feat/goal-dashboard-truth-wow-v2
