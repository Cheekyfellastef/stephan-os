name: PR 1644 Independent Review Retry

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - '.github/workflows/pr1644-independent-review-retry.yml'

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pr1644-independent-review-retry
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.repository == 'Cheekyfellastef/stephan-os' &&
      github.event.pull_request.number == 1638 &&
      github.event.pull_request.head.ref == 'fix/battle-bridge-recovery-health-authority' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_PR: '1644'
      EXPECTED_HEAD: '99a84e33ccad2e26a51d1b966ec43e2d1600da02'
      EXPECTED_BASE: 'ff03adcbe7eddfaf7846fa3da5e31b78dcbe337e'
      EXPECTED_BRANCH: 'codex/fix-independent-security-review-bootstrap'
      MIN_CREATED_AT: '2026-08-02T21:25:00Z'
    steps:
      - name: Verify exact PR identity
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}")
          test "$(jq -r '.state' <<<"$pr")" = 'open'
          test "$(jq -r '.draft' <<<"$pr")" = 'false'
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r '.head.ref' <<<"$pr")" = "$EXPECTED_BRANCH"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_BASE"
          test "$(jq -r '.base.ref' <<<"$pr")" = 'main'

      - name: Locate and rerun only the current failed deterministic review
        id: retry
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/independent-merge-security-review.yml/runs" \
            -f event='pull_request_target' \
            -f per_page='100')
          run=$(jq -c \
            --argjson pr "$EXPECTED_PR" \
            --arg min "$MIN_CREATED_AT" \
            '[.workflow_runs[]
              | select(.event == "pull_request_target")
              | select(.created_at >= $min)
              | select(
                  any(.pull_requests[]?; .number == $pr)
                  or (.display_title == "Fix independent security review handoff")
                )]
             | sort_by(.created_at, .id)
             | last // empty' <<<"$runs")
          test -n "$run"
          run_id=$(jq -r '.id' <<<"$run")
          status=$(jq -r '.status' <<<"$run")
          conclusion=$(jq -r '.conclusion // ""' <<<"$run")
          event=$(jq -r '.event' <<<"$run")
          workflow_id=$(jq -r '.workflow_id' <<<"$run")
          test "$event" = 'pull_request_target'
          test "$status" = 'completed'
          if [ "$conclusion" = 'success' ]; then
            action='already-successful'
          else
            test "$conclusion" = 'failure'
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/rerun-failed-jobs"
            action='rerun-failed-jobs-requested'
          fi
          {
            echo "run_id=${run_id}"
            echo "workflow_id=${workflow_id}"
            echo "prior_conclusion=${conclusion}"
            echo "action=${action}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish bounded retry receipt
        shell: bash
        run: |
          body=$(cat <<EOF
          <!-- stephanos:pr1644-independent-review-retry -->
          ## Deterministic independent-review retry

          - exact PR head: \`${EXPECTED_HEAD}\`
          - exact PR base: \`${EXPECTED_BASE}\`
          - workflow run: ${{ steps.retry.outputs.run_id }}
          - workflow id: ${{ steps.retry.outputs.workflow_id }}
          - prior conclusion: \`${{ steps.retry.outputs.prior_conclusion }}\`
          - action: \`${{ steps.retry.outputs.action }}\`

          This one-shot controller reran only failed jobs in the existing deterministic \`pull_request_target\` security-review run. It did not request or invoke Codex, modify source, approve, mark ready, merge, deploy, or touch runtime state.
          EOF
          )
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${EXPECTED_PR}/comments" -f body="$body"
