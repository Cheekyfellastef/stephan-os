name: Exact-Head Review Dispatch

on:
  pull_request:
    branches:
      - main
  workflow_run:
    workflows:
      - OpenClaw GitHub Operator
      - PR Clean Guard
      - Build Stephanos UI
      - Battle Bridge Publisher Proof
      - Codex Dispatch Queue Proof
    types:
      - completed
  issue_comment:
    types:
      - created
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number to evaluate; canonical-lane proof is still required
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: exact-head-review-dispatch-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('verify-pr-{0}', github.event.pull_request.number) || github.event_name == 'issue_comment' && format('mutate-pr-{0}', github.event.issue.number) || github.event_name == 'workflow_dispatch' && inputs.pr_number && format('mutate-pr-{0}', inputs.pr_number) || github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[1].number && 'mutate-coordinator' || github.event_name == 'workflow_run' && format('mutate-pr-{0}', github.event.workflow_run.pull_requests[0].number) || 'mutate-coordinator' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run coordinator regressions
        run: |
          npm run stephanos:exact-head-review:test
          node --test shared/agents/exactHeadReviewCoordinatorAuthority.test.mjs
          node --test shared/agents/independentReviewRetryPlanner.test.mjs

      - name: Parse review coordinator sources
        run: |
          node --check shared/agents/exactHeadReviewDispatchCoordinator.mjs
          node --check shared/agents/exactHeadReviewCoordinatorAuthority.mjs
          node --check shared/agents/independentReviewRetryPlanner.mjs
          node --check scripts/exact-head-review-dispatch.mjs
          node --check scripts/retry-independent-review.mjs

      - name: Diff check
        if: always()
        run: git diff --check origin/main...HEAD

      - name: Publish verification-only truth
        if: always()
        run: |
          {
            echo '## Exact-head review dispatch'
            echo
            echo 'Progress: `VERIFIED_ONLY`'
            echo
            echo 'This pull-request job verifies coordinator source and does not claim that a review was dispatched or received.'
          } >> "$GITHUB_STEP_SUMMARY"

  coordinate:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted default-branch coordinator
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Evaluate and advance exact-head review state
        id: coordinate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_REVIEW_DISPATCH_TOKEN: ${{ secrets.STEPHANOS_REVIEW_DISPATCH_TOKEN }}
          STEPHANOS_EXACT_HEAD_REVIEW_PR: ${{ inputs.pr_number || '' }}
          STEPHANOS_REVIEW_LANE_AUTHORITY_LOGIN: ${{ github.repository_owner }}
          STEPHANOS_REVIEW_RECEIPT_TIMEOUT_MINUTES: '10'
        run: node scripts/exact-head-review-dispatch.mjs

      - name: Retry only the exact failed canonical independent review
        if: >-
          always() &&
          steps.coordinate.outputs.decision != 'MULTIPLE_PR_RESULTS' &&
          (steps.coordinate.outputs.decision == 'DISPATCH_REVIEW' ||
           steps.coordinate.outputs.decision == 'WAIT_REVIEW_RECEIPT' ||
           steps.coordinate.outputs.decision == 'ESCALATE_MISSING_RECEIPT' ||
           steps.coordinate.outputs.decision == 'STALLED_MISSING_RECEIPT')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_INDEPENDENT_REVIEW_RETRY_PR: ${{ steps.coordinate.outputs.pr_number }}
          STEPHANOS_INDEPENDENT_REVIEW_RETRY_HEAD: ${{ steps.coordinate.outputs.exact_head }}
        run: node scripts/retry-independent-review.mjs

      - name: Retry exact failed reviews from a bounded batch
        if: >-
          always() &&
          steps.coordinate.outputs.decision == 'MULTIPLE_PR_RESULTS' &&
          steps.coordinate.outputs.retry_targets != '' &&
          steps.coordinate.outputs.retry_targets != '[]'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_REVIEW_RETRY_TARGETS: ${{ steps.coordinate.outputs.retry_targets }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          const targets = JSON.parse(process.env.STEPHANOS_REVIEW_RETRY_TARGETS || '[]');
          if (!Array.isArray(targets) || targets.length > 20) throw new Error('bounded retry target inventory required');
          let failed = false;
          for (const target of targets) {
            if (!Number.isSafeInteger(target?.prNumber) || target.prNumber <= 0 || !/^[0-9a-f]{40}$/.test(String(target?.exactHead || ''))) {
              throw new Error('invalid exact-head retry target');
            }
            const result = spawnSync(process.execPath, ['scripts/retry-independent-review.mjs'], {
              stdio: 'inherit',
              env: {
                ...process.env,
                STEPHANOS_INDEPENDENT_REVIEW_RETRY_PR: String(target.prNumber),
                STEPHANOS_INDEPENDENT_REVIEW_RETRY_HEAD: String(target.exactHead),
              },
            });
            if (result.status !== 0) failed = true;
          }
          if (failed) process.exitCode = 1;
          NODE
