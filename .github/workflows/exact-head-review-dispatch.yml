name: Exact-Head Review Dispatch

on:
  pull_request:
    branches:
      - main
  workflow_run:
    workflows:
      - OpenClaw GitHub Operator
      - PR Clean Guard
      - Build Stephanos UI
      - Battle Bridge Publisher Proof
      - Codex Dispatch Queue Proof
      - Independent Merge Security Review
    types:
      - completed
  issue_comment:
    types:
      - created
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number to evaluate; canonical-lane proof is still required
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: exact-head-review-dispatch-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'coordinator' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run coordinator regressions
        run: |
          npm run stephanos:exact-head-review:test
          node --test shared/agents/exactHeadReviewCoordinatorAuthority.test.mjs
          node --test shared/agents/independentReviewRetryPlanner.test.mjs

      - name: Parse review coordinator sources
        run: |
          node --check shared/agents/exactHeadReviewDispatchCoordinator.mjs
          node --check shared/agents/exactHeadReviewCoordinatorAuthority.mjs
          node --check shared/agents/independentReviewRetryPlanner.mjs
          node --check scripts/exact-head-review-dispatch.mjs
          node --check scripts/retry-independent-review.mjs

      - name: Diff check
        if: always()
        run: git diff --check origin/main...HEAD

      - name: Publish verification-only truth
        if: always()
        run: |
          {
            echo '## Exact-head review dispatch'
            echo
            echo 'Progress: `VERIFIED_ONLY`'
            echo
            echo 'This pull-request job verifies coordinator source and does not claim that a review was dispatched or received.'
          } >> "$GITHUB_STEP_SUMMARY"

  coordinate:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    outputs:
      retry_targets: ${{ steps.coordinate.outputs.retry_targets }}
    steps:
      - name: Check out trusted default-branch coordinator
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the exact triggering independent-review artifact
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'Independent Merge Security Review' &&
          github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v4
        with:
          name: stephanos-independent-review-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/triggering-independent-review
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Evaluate and advance exact-head review state
        id: coordinate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_REVIEW_DISPATCH_TOKEN: ${{ secrets.STEPHANOS_REVIEW_DISPATCH_TOKEN }}
          STEPHANOS_EXACT_HEAD_REVIEW_PR: ${{ inputs.pr_number || '' }}
          STEPHANOS_REVIEW_LANE_AUTHORITY_LOGIN: ${{ github.repository_owner }}
          STEPHANOS_REVIEW_RECEIPT_TIMEOUT_MINUTES: '10'
          STEPHANOS_TRIGGER_REVIEW_ARTIFACT_REQUIRED: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Independent Merge Security Review' && github.event.workflow_run.conclusion == 'success' }}
          STEPHANOS_TRIGGER_REVIEW_ARTIFACT_PATH: ${{ runner.temp }}/triggering-independent-review/independent-review-result.json
          STEPHANOS_TRIGGER_REVIEW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          STEPHANOS_TRIGGER_REVIEW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
        run: node scripts/exact-head-review-dispatch.mjs

  retry:
    needs: coordinate
    if: >-
      always() &&
      needs.coordinate.outputs.retry_targets != '' &&
      needs.coordinate.outputs.retry_targets != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.coordinate.outputs.retry_targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out trusted default-branch retry controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Retry one exact failed canonical independent review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_INDEPENDENT_REVIEW_RETRY_PR: ${{ matrix.target.prNumber }}
          STEPHANOS_INDEPENDENT_REVIEW_RETRY_HEAD: ${{ matrix.target.exactHead }}
        run: node scripts/retry-independent-review.mjs
