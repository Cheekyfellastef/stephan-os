name: Exact-Head Review Dispatch

on:
  pull_request:
    branches:
      - main
  workflow_run:
    workflows:
      - OpenClaw GitHub Operator
      - PR Clean Guard
      - Build Stephanos UI
      - Battle Bridge Publisher Proof
      - Codex Dispatch Queue Proof
      - Independent Merge Security Review
    types:
      - completed
  issue_comment:
    types:
      - created
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number to evaluate; canonical-lane proof is still required
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run coordinator regressions
        run: |
          npm run stephanos:exact-head-review:test
          node --test shared/agents/codexReviewCapacityFailoverV1.test.mjs
          node --test shared/agents/exactHeadReviewCoordinatorAuthority.test.mjs
          node --test shared/agents/independentReviewRetryPlanner.test.mjs
          node --test shared/agents/exactHeadReviewDispatchWorkflow.test.mjs
          node --test shared/agents/exactHeadReviewWorkflowRunArtifactIntakeV1.test.mjs
          node --test shared/agents/independentReviewSuccessfulArtifactRecoveryWorkflowV1.test.mjs
          node --test shared/agents/independentReviewHandoffProvenanceV1.test.mjs
          node --test shared/agents/independentReviewHandoffRunReceiptV1.test.mjs
          node --test shared/agents/independentReviewHandoffIdentityV1.test.mjs
          node --test shared/agents/independentReviewWorkflowDispatchAdmissionV1.test.mjs
          node --test shared/agents/independentReviewMissingRunLaunchV1.test.mjs
          node --test shared/agents/independentReviewWorkflowDispatchLaunchReceiptV1.test.mjs
          node --test shared/agents/independentReviewWorkflowDispatchRunDiscoveryV1.test.mjs
          node --test scripts/bind-independent-review-handoff-provenance-v1.test.mjs
          node --test scripts/exact-head-review-current-main-admission-v1.test.mjs
          node --test scripts/launch-missing-independent-review-v1.test.mjs
          node --test scripts/recover-successful-independent-review-v1.test.mjs

      - name: Parse review coordinator sources
        run: |
          node --check shared/agents/codexReviewCapacityFailoverV1.mjs
          node --check shared/agents/exactHeadReviewDispatchCoordinator.mjs
          node --check shared/agents/exactHeadReviewCoordinatorAuthority.mjs
          node --check shared/agents/independentReviewRetryPlanner.mjs
          node --check shared/agents/independentReviewHandoffProvenanceV1.mjs
          node --check shared/agents/independentReviewHandoffRunReceiptV1.mjs
          node --check shared/agents/independentReviewHandoffIdentityV1.mjs
          node --check shared/agents/independentReviewWorkflowDispatchAdmissionV1.mjs
          node --check shared/agents/independentReviewMissingRunLaunchV1.mjs
          node --check shared/agents/independentReviewWorkflowDispatchLaunchReceiptV1.mjs
          node --check shared/agents/independentReviewWorkflowDispatchRunDiscoveryV1.mjs
          node --check scripts/bind-independent-review-handoff-provenance-v1.mjs
          node --check scripts/exact-head-review-current-main-admission-v1.mjs
          node --check scripts/exact-head-review-dispatch.mjs
          node --check scripts/retry-independent-review.mjs
          node --check scripts/launch-missing-independent-review-v1.mjs
          node --check scripts/recover-successful-independent-review-v1.mjs

      - name: Diff check
        if: always()
        run: git diff --check origin/main...HEAD

      - name: Publish verification-only truth
        if: always()
        run: |
          {
            echo '## Exact-head review dispatch'
            echo
            echo 'Progress: `VERIFIED_ONLY`'
            echo
            echo 'This pull-request job verifies coordinator source and does not claim that a review was dispatched or received.'
          } >> "$GITHUB_STEP_SUMMARY"

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      targets: ${{ steps.admit.outputs.targets }}
    steps:
      - name: Publish pull-request neutral planning truth
        if: github.event_name == 'pull_request'
        run: |
          {
            echo '## Exact-head review planning'
            echo
            echo 'Progress: `PULL_REQUEST_PLAN_NEUTRAL`'
            echo
            echo 'Canonical-target discovery and every coordinator mutation are disabled for pull-request verification.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out trusted default-branch planner
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Classify trusted Codex review-capacity outage
        id: provider_failover
        if: >-
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null
        run: node shared/agents/codexReviewCapacityFailoverV1.mjs

      - name: Download the exact triggering independent-review artifact
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.workflow_id == 318073448 &&
          contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)
        uses: actions/download-artifact@v4
        with:
          name: stephanos-independent-review-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/triggering-independent-review
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Discover canonical PR targets without mutation
        id: plan
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_EXACT_HEAD_REVIEW_PLAN_ONLY: 'true'
          STEPHANOS_EXACT_HEAD_REVIEW_PR: ${{ inputs.pr_number || '' }}
          STEPHANOS_REVIEW_LANE_AUTHORITY_LOGIN: ${{ github.repository_owner }}
          STEPHANOS_TRIGGER_REVIEW_ARTIFACT_REQUIRED: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.workflow_id == 318073448 && contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion) }}
          STEPHANOS_TRIGGER_REVIEW_ARTIFACT_PATH: ${{ runner.temp }}/triggering-independent-review/independent-review-result.json
          STEPHANOS_TRIGGER_REVIEW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          STEPHANOS_TRIGGER_REVIEW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
        run: node scripts/exact-head-review-dispatch.mjs

      - name: Admit only exact-current-main review targets
        id: admit
        if: >-
          steps.plan.outcome == 'success' &&
          github.event_name != 'pull_request' &&
          (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_REVIEW_PLAN_TARGETS: ${{ steps.plan.outputs.targets }}
        run: node scripts/exact-head-review-current-main-admission-v1.mjs

  coordinate:
    needs: plan
    if: >-
      needs.plan.outputs.targets != '' &&
      needs.plan.outputs.targets != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    concurrency:
      group: exact-head-review-dispatch-${{ github.repository }}-pr-${{ matrix.target.prNumber }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted default-branch coordinator
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recheck target exact-current-main admission
        id: recheck_current_main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_REVIEW_PLAN_TARGETS: '[{"prNumber":${{ matrix.target.prNumber }}}]'
        run: node scripts/exact-head-review-current-main-admission-v1.mjs

      - name: Download the exact triggering independent-review artifact
        if: >-
          steps.recheck_current_main.outputs.targets != '[]' &&
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.workflow_id == 318073448 &&
          contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)
        uses: actions/download-artifact@v4
        with:
          name: stephanos-independent-review-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/triggering-independent-review
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Evaluate and advance one PR-scoped exact-head review state
        id: coordinate
        if: steps.recheck_current_main.outputs.targets != '[]'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_EXACT_HEAD_REVIEW_PR: ${{ matrix.target.prNumber }}
          STEPHANOS_REVIEW_LANE_AUTHORITY_LOGIN: ${{ github.repository_owner }}
          STEPHANOS_REVIEW_RECEIPT_TIMEOUT_MINUTES: '10'
          STEPHANOS_TRIGGER_REVIEW_ARTIFACT_REQUIRED: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.workflow_id == 318073448 && contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion) }}
          STEPHANOS_TRIGGER_REVIEW_ARTIFACT_PATH: ${{ runner.temp }}/triggering-independent-review/independent-review-result.json
          STEPHANOS_TRIGGER_REVIEW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          STEPHANOS_TRIGGER_REVIEW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
          STEPHANOS_DEFER_MISSING_RECEIPT_ESCALATION: 'true'
        run: node scripts/exact-head-review-dispatch.mjs

      - name: Bind exact coordinator-run provenance to the exact review handoff
        id: bind_handoff
        if: >-
          always() &&
          steps.coordinate.outputs.retry_targets != '' &&
          steps.coordinate.outputs.retry_targets != '[]'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_REVIEW_HANDOFF_PR: ${{ matrix.target.prNumber }}
          STEPHANOS_REVIEW_HANDOFF_HEAD: ${{ steps.coordinate.outputs.exact_head }}
          STEPHANOS_REVIEW_HANDOFF_RUN_RECEIPT_PATH: ${{ runner.temp }}/independent-review-handoff-run-receipt.json
        run: node scripts/bind-independent-review-handoff-provenance-v1.mjs

      - name: Upload immutable coordinator-to-handoff run receipt
        id: upload_handoff
        if: >-
          always() &&
          steps.bind_handoff.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: stephanos-independent-review-handoff-${{ github.run_id }}-attempt-${{ github.run_attempt }}-comment-${{ steps.bind_handoff.outputs.handoff_comment_id }}
          path: ${{ runner.temp }}/independent-review-handoff-run-receipt.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false

      - name: Retry one exact failed canonical independent review
        id: retry
        if: >-
          always() &&
          steps.coordinate.outputs.retry_targets != '' &&
          steps.coordinate.outputs.retry_targets != '[]'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_INDEPENDENT_REVIEW_RETRY_PR: ${{ matrix.target.prNumber }}
          STEPHANOS_INDEPENDENT_REVIEW_RETRY_HEAD: ${{ fromJSON(steps.coordinate.outputs.retry_targets)[0].exactHead }}
        run: node scripts/retry-independent-review.mjs

      - name: Launch one exact missing canonical independent review
        id: launch_missing
        if: >-
          always() &&
          steps.bind_handoff.outcome == 'success' &&
          steps.upload_handoff.outcome == 'success' &&
          steps.retry.outcome == 'success' &&
          steps.retry.outputs.decision == 'NO_MATCHING_RUN'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_INDEPENDENT_REVIEW_RETRY_PR: ${{ matrix.target.prNumber }}
          STEPHANOS_INDEPENDENT_REVIEW_RETRY_HEAD: ${{ fromJSON(steps.coordinate.outputs.retry_targets)[0].exactHead }}
          STEPHANOS_REVIEW_HANDOFF_RUN_RECEIPT_PATH: ${{ runner.temp }}/independent-review-handoff-run-receipt.json
        run: node scripts/launch-missing-independent-review-v1.mjs

      - name: Discover successful review result for receipt recovery
        id: recover_successful
        if: >-
          always() &&
          steps.bind_handoff.outcome == 'success' &&
          steps.upload_handoff.outcome == 'success' &&
          steps.retry.outcome == 'success' &&
          steps.retry.outputs.decision == 'NO_MATCHING_RUN' &&
          steps.launch_missing.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_INDEPENDENT_REVIEW_RECOVERY_PR: ${{ matrix.target.prNumber }}
          STEPHANOS_INDEPENDENT_REVIEW_RECOVERY_HEAD: ${{ fromJSON(steps.coordinate.outputs.retry_targets)[0].exactHead }}
        run: node scripts/recover-successful-independent-review-v1.mjs

      - name: Download recovered successful independent review result
        id: download_recovered_review
        if: >-
          always() &&
          steps.recover_successful.outcome == 'success' &&
          steps.recover_successful.outputs.recovery_required == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.recover_successful.outputs.artifact_name }}
          path: ${{ runner.temp }}/recovered-independent-review
          github-token: ${{ github.token }}
          run-id: ${{ steps.recover_successful.outputs.run_id }}

      - name: Consume recovered successful independent review result
        id: consume_recovered_review
        if: >-
          always() &&
          steps.download_recovered_review.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_EXACT_HEAD_REVIEW_PR: ${{ matrix.target.prNumber }}
          STEPHANOS_REVIEW_LANE_AUTHORITY_LOGIN: ${{ github.repository_owner }}
          STEPHANOS_REVIEW_RECEIPT_TIMEOUT_MINUTES: '10'
          STEPHANOS_TRIGGER_REVIEW_ARTIFACT_REQUIRED: 'true'
          STEPHANOS_TRIGGER_REVIEW_ARTIFACT_PATH: ${{ runner.temp }}/recovered-independent-review/independent-review-result.json
          STEPHANOS_TRIGGER_REVIEW_RUN_ID: ${{ steps.recover_successful.outputs.run_id }}
          STEPHANOS_TRIGGER_REVIEW_RUN_ATTEMPT: ${{ steps.recover_successful.outputs.run_attempt }}
        run: node scripts/exact-head-review-dispatch.mjs

      - name: Finalize a genuinely unrecoverable missing receipt
        if: >-
          always() &&
          steps.coordinate.outputs.recovery_deferred == 'true' &&
          (
            steps.retry.outcome == 'failure' ||
            steps.retry.outputs.decision == 'ALREADY_SUCCESSFUL' ||
            steps.launch_missing.outcome == 'failure' ||
            (steps.launch_missing.outputs.decision == 'ALREADY_SUCCESSFUL' && steps.consume_recovered_review.outcome != 'success')
          )
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_EXACT_HEAD_REVIEW_PR: ${{ matrix.target.prNumber }}
          STEPHANOS_REVIEW_LANE_AUTHORITY_LOGIN: ${{ github.repository_owner }}
          STEPHANOS_REVIEW_RECEIPT_TIMEOUT_MINUTES: '10'
          STEPHANOS_TRIGGER_REVIEW_ARTIFACT_REQUIRED: 'false'
        run: node scripts/exact-head-review-dispatch.mjs
