name: Apply freshness state-change fix

on:
  push:
    branches:
      - fix/fresh-current-affairs-state-change-routing
    paths:
      - '.github/workflows/apply-freshness-state-change-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fresh-current-affairs-state-change-routing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact classifier repair
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'stephanos-ui/src/ai/freshnessRouting.js';
          const source = await readFile(path, 'utf8');
          const needle = "  /\\b(who is|who's)\\s+(the\\s+)?(prime minister|president)\\b/i,\n];";
          const replacement = "  /\\b(who is|who's)\\s+(the\\s+)?(prime minister|president)\\b/i,\n  /\\b(has|have|had|did|was|were|is|are)\\b.{0,80}\\b(resign(?:ed|ing|ation)?|step(?:ped)? down|removed from office|ousted|dismissed|appointed|elected|died)\\b/i,\n];";
          if (!source.includes(needle)) throw new Error('Freshness classifier anchor changed; refusing broad rewrite.');
          const updated = source.replace(needle, replacement);
          if (updated === source) throw new Error('Freshness classifier was not changed.');
          await writeFile(path, updated, 'utf8');
          NODE
      - name: Run focused freshness tests
        run: node --test stephanos-ui/src/ai/freshnessRouting.test.mjs stephanos-ui/src/ai/freshnessRouting.stateChange.test.mjs
      - name: Remove one-shot workflow and commit verified repair
        run: |
          rm .github/workflows/apply-freshness-state-change-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stephanos-ui/src/ai/freshnessRouting.js stephanos-ui/src/ai/freshnessRouting.stateChange.test.mjs .github/workflows/apply-freshness-state-change-fix.yml
          git commit -m "Route current-affairs state changes through fresh providers"
          git push origin HEAD:fix/fresh-current-affairs-state-change-routing
