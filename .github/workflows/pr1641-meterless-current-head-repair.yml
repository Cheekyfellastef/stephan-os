name: PR 1641 Meterless Current-Head Repair

on:
  push:
    branches:
      - agent/music-tile-conversational-intelligence
    paths:
      - '.github/workflows/pr1641-meterless-current-head-repair.yml'

permissions:
  contents: write

concurrency:
  group: pr1641-meterless-current-head-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'Cheekyfellastef/stephan-os'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify reviewed source identities
        shell: bash
        run: |
          test "$(git hash-object apps/music-tile/main.js)" = "37dd0e4817cbace72c00847ca19e1cdeadd2b44c"
          test "$(git hash-object shared/runtime/stephanosMemory.mjs)" = "761d2805b5009e6317c98dcbc10f277e03fc1ee5"

      - name: Apply bounded P1 repairs
        run: python3 scripts/pr1641-meterless-current-head-repair.py

      - name: Validate focused repairs
        shell: bash
        run: |
          node --check apps/music-tile/main.js
          node --check shared/runtime/stephanosMemory.mjs
          node --test \
            tests/music-tile-conversation-intelligence.test.mjs \
            tests/music-tile-current-head-safety.test.mjs \
            shared/runtime/stephanosMemory.test.mjs \
            shared/runtime/stephanosMemory.authoritative-listing.test.mjs
          git diff --check

      - name: Commit repaired source and regressions
        shell: bash
        run: |
          git config user.name "stephanos-meterless-builder[bot]"
          git config user.email "stephanos-meterless-builder[bot]@users.noreply.github.com"
          git add \
            apps/music-tile/main.js \
            shared/runtime/stephanosMemory.mjs \
            tests/music-tile-current-head-safety.test.mjs \
            shared/runtime/stephanosMemory.authoritative-listing.test.mjs
          git diff --cached --check
          git commit -m "Fix current Music Intelligence concurrency findings"
          git push origin HEAD:${{ github.ref_name }}
