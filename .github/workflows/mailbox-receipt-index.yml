          shared/agents/operatorPersonalRepositoryMergeV1.test.mjs
          shared/agents/operatorPersonalRepositoryProvenanceBootstrapV1.test.mjs
          shared/agents/operatorProtectedMergeConfigurationActivationV1.test.mjs
          shared/agents/postSyncCodexDispatchMcpNaturalReloadV1.test.mjs
          shared/agents/postSyncEdgeLauncherNaturalReloadV1.test.mjs
          shared/agents/postSyncExecutionSurfaceQuarantineHardeningV1.test.mjs
          shared/agents/postSyncGoalDiscoveryHeartbeatRuntimeV1.test.mjs
          shared/agents/postSyncMailboxReceiptIndexNaturalReloadV1.test.mjs
          shared/agents/postSyncProtectedMergeNoRuntimeV1.test.mjs
          shared/agents/postSyncRuntimeRefreshControlPlaneClassification.test.mjs
          shared/agents/postSyncRuntimeRefreshCoordinator.test.mjs
          shared/agents/postSyncRuntimeRefreshCoordinator.workerWatchdogProbe.test.mjs
          shared/agents/postSyncServerOpenClawClassificationV1.test.mjs
