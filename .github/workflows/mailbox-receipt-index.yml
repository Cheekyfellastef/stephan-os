          shared/agents/sovereignCommanderCanonicalGitConfigRepairV1.test.mjs
          shared/agents/sovereignCommanderCpuPressure.test.mjs
          shared/agents/sovereignCommanderRemoteMailboxV1.test.mjs
          shared/agents/sovereignCommanderTailscale.test.mjs
          shared/agents/sovereignFrontendVisibilityMailboxV1.test.mjs
          shared/agents/sovereignMaintenanceRecoveryMailboxV1.test.mjs
          shared/agents/starfieldVrBattleBridgeMailboxV1.test.mjs
          shared/agents/starfieldVrBattleBridgeReadinessV1.test.mjs
          shared/agents/stephanosChatUpdate.test.mjs
          shared/agents/windowsAuthorityMailboxCadenceReviewV1.test.mjs
          shared/agents/windowsAuthorityMailboxCadenceRouterV1.test.mjs
          shared/agents/windowsAuthorityMailboxRecoveryGuardianReviewV1.test.mjs
          shared/agents/windowsAuthorityMailboxRolloverExecutionScanV1.test.mjs

      - name: Import structure proof
        run: node scripts/guard-import-structure.mjs

      - name: Diff check
        if: always()
        run: git diff --check origin/main...HEAD

  mirror:
    if: >-
      github.event_name != 'pull_request' &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.number > 0 &&
          github.event.comment.user.login == github.repository_owner &&
          contains(github.event.comment.body, '<!-- stephanos-battle-bridge-command-receipt -->')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Recheck canonical owner event from trusted main
        if: github.event_name == 'issue_comment'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/canonical-mailbox-workflow-event-gate.mjs receipt
      - name: Update compact receipt truth surfaces
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const { assertMailboxRotationWorkflowAdmission } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/canonical-mailbox-workflow-admission-v1.mjs`);
            const recheck = () => assertMailboxRotationWorkflowAdmission({ mode: 'receipt' });
            await recheck();
            const path = await import('node:path');
            const { pathToFileURL } = await import('node:url');
            const moduleUrl = `${pathToFileURL(path.resolve('shared/agents/mailboxReceiptIndexGitHubMirror.mjs')).href}?run=${Date.now()}`;
            const receiptIndexMirror = await import(moduleUrl);
            const mailboxIssueNumber = receiptIndexMirror.MAILBOX_RECEIPT_GITHUB_ISSUE;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: mailboxIssueNumber,
              per_page: 100,
            });
            const truthIssueNumber = receiptIndexMirror.MAILBOX_RECEIPT_GITHUB_TRUTH_ISSUE;
            const predecessorComments = [];
            const predecessor = receiptIndexMirror.MAILBOX_RECEIPT_GITHUB_PREDECESSOR;
            if (predecessor) {
              const issue = await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number: predecessor });
              const latest = Math.max(1, Math.ceil(issue.data.comments / 100));
              for (const page of [...new Set([Math.max(1, latest - 1), latest])]) {
                const response = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: predecessor, per_page: 100, page });
                predecessorComments.push(...response.data);
              }
            }
            const previousTruth = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: truthIssueNumber,
            });
            const record = receiptIndexMirror.createTrustedMailboxReceiptIndexFromGitHubComments(comments, {
              ownerLogin: context.repo.owner,
              timestampUtc: new Date().toISOString(),
              priorTruthIssueBody: previousTruth.data.body,
              predecessorComments,
            });
            const commentBody = receiptIndexMirror.buildTrustedMailboxReceiptIndexGitHubBodyV2(record);
            const existing = receiptIndexMirror.findTrustedMailboxReceiptIndexComment(comments);
            if (existing) {
              await recheck();
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
              core.info(`Updated receipt index comment ${existing.id}.`);
            } else {
              await recheck();
              const created = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: mailboxIssueNumber,
                body: commentBody,
              });
              core.info(`Created receipt index comment ${created.data.id}.`);
            }

            const truthBody = receiptIndexMirror.buildTrustedMailboxReceiptTruthIssueBody(record);
            await recheck();
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: truthIssueNumber,
              title: receiptIndexMirror.MAILBOX_RECEIPT_GITHUB_TRUTH_TITLE,
              body: truthBody,
              state: 'open',
            });
            core.info(`Updated receipt truth issue ${truthIssueNumber}.`);

      - name: Observe capacity and prepare one inactive successor through existing owner
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const { assertMailboxRotationWorkflowAdmission } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/canonical-mailbox-workflow-admission-v1.mjs`);
            const recheck = () => assertMailboxRotationWorkflowAdmission({ mode: 'receipt' });
            await recheck();
            const { pathToFileURL } = await import('node:url');
            const { resolve } = await import('node:path');
            const { observeCanonicalMailboxRolloverOnGitHub } = await import(
              pathToFileURL(resolve('scripts/canonical-mailbox-rollover-github-adapter.mjs')).href);
            const result = await observeCanonicalMailboxRolloverOnGitHub({ github, context });
            core.info(JSON.stringify(result));
            if (!result.ok) core.setFailed(result.blocker);
