          shared/agents/protectedOpenClawMergeMailboxAdapterSuccessorBoundary.test.mjs
          shared/agents/protectedOpenClawMergeMailboxCanonicalProvenance.test.mjs
          shared/agents/protectedOpenClawMergeWorkflowDispatch.contract.test.mjs
