name: Mailbox Receipt Index

on:
  pull_request:
    paths:
      - 'shared/agents/mailboxReceiptIndex.mjs'
      - 'shared/agents/mailboxReceiptIndex.test.mjs'
      - 'shared/agents/mailboxReceiptIndexAccess.mjs'
      - 'shared/agents/mailboxReceiptIndexAccess.test.mjs'
      - 'shared/agents/mailboxReceiptIndexGitHubMirror.mjs'
      - 'shared/agents/mailboxReceiptIndexGitHubMirror.test.mjs'
      - 'shared/agents/mailboxReceiptIndexWorkflow.test.mjs'
      - 'shared/agents/mailboxReceiptTruthIssue.test.mjs'
      - 'shared/agents/canonicalMailboxRolloverConsumerV1.mjs'
      - 'shared/agents/canonicalMailboxRolloverConsumerV1.test.mjs'
      - 'shared/agents/canonicalMailboxRotation*.mjs'
      - 'scripts/canonical-mailbox-rotation*.mjs'
      - 'scripts/canonical-mailbox-action-evidence-v2*.mjs'
      - 'tests/fixtures/canonical-mailbox-rotation/**'
      - 'scripts/canonical-mailbox-execution-ledger-v1.mjs'
      - 'scripts/canonical-mailbox-workflow*.mjs'
      - 'shared/agents/codexDispatchHostOps.mjs'
      - 'shared/agents/postSyncRuntimeRefreshCoordinator.mjs'
      - 'scripts/stephanos-codex-dispatch-mcp.mjs'
      - 'scripts/stephanos-codex-dispatch-host-operation-v1*.mjs'
      - 'scripts/battle-bridge-github-sync-executor*.mjs'
      - 'scripts/battle-bridge-github-command-mailbox.mjs'
      - 'scripts/battle-bridge-github-command-mailbox-outbox-guard-v1.mjs'
      - 'scripts/canonical-mailbox-rollover-github-adapter.mjs'
      - 'scripts/canonical-mailbox-rollover-github-adapter.test.mjs'
      - 'scripts/battle-bridge-github-command-mailbox-with-receipt-index.mjs'
      - 'scripts/battle-bridge-github-command-mailbox-with-receipt-index.test.mjs'
      - 'scripts/windows/install-battle-bridge-github-command-mailbox.ps1'
      - '.github/workflows/mailbox-receipt-index.yml'
  issue_comment:
    types: [created, edited]
  push:
    branches: [main]
    paths:
      - 'shared/agents/mailboxReceiptIndex.mjs'
      - 'shared/agents/mailboxReceiptIndexGitHubMirror.mjs'
      - 'shared/agents/canonicalMailboxAuthorityV1.mjs'
      - 'shared/agents/canonicalMailboxRolloverConsumerV1.mjs'
      - 'scripts/canonical-mailbox-rollover-github-adapter.mjs'
      - '.github/workflows/mailbox-receipt-index.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailbox-receipt-index-${{ github.event.pull_request.number || 'mirror' }}
  cancel-in-progress: false

jobs:
  proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Shared Workspace receipt index proof
        run: >-
          node --test --test-concurrency=1
          scripts/battle-bridge-fleet-receipt-projection.test.mjs
          scripts/battle-bridge-frontend-visibility-mailbox.test.mjs
          scripts/battle-bridge-github-command-mailbox-accepted-lease.test.mjs
