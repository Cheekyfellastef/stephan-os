name: One-shot Music Auto Artwork Focused Edge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/one-shot-music-auto-artwork-focused-edge.yml'
      - 'tests/music-tile-rating-playback-browser.test.mjs'
      - 'apps/music-tile/engine/nativeCatalogAutoApply.js'
      - 'apps/music-tile/engine/nativeCatalogSearch.js'

permissions: {}

concurrency:
  group: one-shot-music-auto-artwork-focused-edge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  focused-edge:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/music-tile-automatic-url-artwork-v2'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser-test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run only the no-click iPad card proof
        shell: pwsh
        env:
          STEPHANOS_BROWSER_CHANNEL: msedge
        run: node --test --test-name-pattern="iPad-width existing card receives Spotify URL and artwork without manual search" tests/music-tile-rating-playback-browser.test.mjs
