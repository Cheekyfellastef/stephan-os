name: One-shot Music Search Proof Settle

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/one-shot-music-search-proof-settle.mjs'
      - '.github/workflows/one-shot-music-search-proof-settle.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-shot-music-search-proof-settle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  settle:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/music-tile-automatic-url-artwork-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/music-tile-automatic-url-artwork-v2
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply settled search proof
        run: node scripts/one-shot-music-search-proof-settle.mjs

      - name: Verify browser proof syntax
        run: node --check tests/music-tile-rating-playback-browser.test.mjs

      - name: Publish permanent test and remove runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Stephanos GitHub Repair"
          git config user.email "actions@users.noreply.github.com"
          rm -f scripts/one-shot-music-search-proof-settle.mjs
          rm -f .github/workflows/one-shot-music-search-proof-settle.yml
          git add \
            tests/music-tile-rating-playback-browser.test.mjs \
            scripts/one-shot-music-search-proof-settle.mjs \
            .github/workflows/one-shot-music-search-proof-settle.yml
          git diff --cached --check
          git commit -m "Settle Music Tile automatic search proof"
          git push origin HEAD:fix/music-tile-automatic-url-artwork-v2
