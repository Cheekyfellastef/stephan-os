name: One-shot Music AI Routing Settlement

on:
  push:
    branches:
      - fix/music-ai-canonical-routing-truth
    paths:
      - .github/workflows/one-shot-music-ai-routing-settlement.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  settle:
    if: github.ref_name == 'fix/music-ai-canonical-routing-truth' || github.head_ref == 'fix/music-ai-canonical-routing-truth'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out existing Music AI branch
        uses: actions/checkout@v4
        with:
          ref: fix/music-ai-canonical-routing-truth
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge repaired main without discarding branch work
        shell: bash
        run: |
          git config user.name "Stephanos GitHub Repair"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge -X theirs --no-edit origin/main

      - name: Apply bounded canonical routing settlement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(source, start, end, replacement, label):
              start_index = source.find(start)
              if start_index < 0:
                  raise SystemExit(f'Missing {label} start anchor')
              end_index = source.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f'Missing {label} end anchor')
              return source[:start_index] + replacement.rstrip() + '\n\n' + source[end_index:]

          bridge_path = Path('apps/music-tile/engine/musicAiBridge.js')
          bridge = bridge_path.read_text(encoding='utf-8')

          settings = r'''function musicAiRouterSettings() {
            const status = parentRuntimeStatus() || {};
            const runtimeContext = status.runtimeContext || {};
            const runtimeTruth = status.runtimeTruth || {};
            const finalRouteTruth = status.finalRouteTruth || {};
            const persistedPreferences = readPersistedStephanosSessionMemory(globalThis?.localStorage)
              ?.session?.providerPreferences || {};
            const preferences = {
              ...persistedPreferences,
              ...(runtimeTruth.providerPreferences && typeof runtimeTruth.providerPreferences === 'object'
                ? runtimeTruth.providerPreferences
                : {}),
              ...(runtimeContext.providerPreferences && typeof runtimeContext.providerPreferences === 'object'
                ? runtimeContext.providerPreferences
                : {}),
              ...(status.providerPreferences && typeof status.providerPreferences === 'object'
                ? status.providerPreferences
                : {}),
            };
            const provider = String(firstValue(
              preferences.provider,
              finalRouteTruth.requestedProvider,
              finalRouteTruth.selectedProvider,
              status.provider,
              'ollama',
            )).toLowerCase();
            return {
              provider,
              routeMode: String(firstValue(preferences.routeMode, finalRouteTruth.requestedRouteMode, status.routeMode, 'auto')),
              fallbackEnabled: firstValue(preferences.fallbackEnabled, status.fallbackEnabled, true) !== false,
              fallbackOrder: firstValue(preferences.fallbackOrder, status.fallbackOrder, undefined),
              providerConfigs: firstValue(
                preferences.providerConfigs,
                runtimeContext.providerConfigs,
                runtimeTruth.providerConfigs,
                persistedPreferences.providerConfigs,
                undefined,
              ),
            };
          }'''
          bridge = replace_between(
              bridge,
              'function musicAiRouterSettings() {',
              'export function getMusicAiStatus()',
              settings,
              'musicAiRouterSettings',
          )

          normalizer = r'''export function normalizeMusicAiResponse(response = {}) {
            const data = response?.data && typeof response.data === 'object' ? response.data : {};
            const execution = data.execution_metadata && typeof data.execution_metadata === 'object'
              ? data.execution_metadata
              : {};
            const raw = response?.raw && typeof response.raw === 'object'
              ? response.raw
              : (data.raw && typeof data.raw === 'object' ? data.raw : {});
            const router = raw.router && typeof raw.router === 'object' ? raw.router : {};
            const text = String(
              response?.output_text
              || data.output_text
              || data.reply
              || response?.reply
              || response?.text
              || '',
            ).trim();
            return {
              text,
              requestedProvider: String(firstValue(
                execution.requested_provider,
                data.requested_provider,
                router.requested_provider,
                'unknown',
              )),
              selectedProvider: String(firstValue(
                execution.selected_provider,
                data.selected_provider,
                router.selected_provider,
                'unknown',
              )),
              actualProvider: String(firstValue(
                execution.actual_provider_used,
                data.actual_provider_used,
                router.actual_provider_used,
                'unknown',
              )),
              actualModel: String(firstValue(
                execution.model_used,
                data.model_used,
                router.model_used,
                'unknown',
              )),
              fallbackUsed: firstValue(execution.fallback_used, data.fallback_used, router.fallback_used, false) === true,
              fallbackReason: String(firstValue(
                execution.fallback_reason,
                data.fallback_reason,
                router.fallback_reason,
                'none',
              )),
              routeStatus: String(firstValue(
                execution.route_status,
                data.route_status,
                response?.route_status,
                router.status,
                'unknown',
              )),
              routeError: String(firstValue(
                execution.route_error,
                data.route_error,
                response?.route_error,
                router.error,
                '',
              )),
            };
          }'''
          bridge = replace_between(
              bridge,
              'export function normalizeMusicAiResponse(response = {}) {',
              'export async function askMusicAi',
              normalizer,
              'normalizeMusicAiResponse',
          )

          route_test = r'''export async function testMusicAiRoute({ fetchImpl = globalThis.fetch } = {}) {
            const diagnostics = getMusicAiRuntimeDiagnostics();
            const routerSettings = musicAiRouterSettings();
            const safeProviderConfigs = sanitizeStephanosProviderConfigsForTransport(routerSettings.providerConfigs || {});
            const payload = {
              prompt: 'Reply with: MUSIC_AI_ROUTE_OK',
              provider: routerSettings.provider,
              routeMode: routerSettings.routeMode,
              fallbackEnabled: routerSettings.fallbackEnabled,
              ...(Array.isArray(routerSettings.fallbackOrder) ? { fallbackOrder: routerSettings.fallbackOrder } : {}),
              providerConfig: safeProviderConfigs[routerSettings.provider] || {},
              providerConfigs: safeProviderConfigs,
              runtimeContext: { ...aiRouteContext(), tileContext: { tile: 'music-tile', task: 'echo-test' } },
            };
            try {
              const res = await fetchImpl(diagnostics.endpointUrl, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify(payload),
              });
              const text = await res.text();
              const snippet = String(text || '').slice(0, 180);
              let normalized = normalizeMusicAiResponse({});
              try { normalized = normalizeMusicAiResponse(JSON.parse(text)); } catch {}
              const routeUnavailable = normalized.routeStatus === 'route_unavailable';
              const ok = res.ok && !routeUnavailable;
              const failureReason = routeUnavailable
                ? (normalized.routeError || 'route_unavailable')
                : (res.ok ? '' : classifyAiFailure({ status: res.status }));
              return {
                ok,
                status: res.status,
                snippet,
                parsedText: normalized.text,
                requestUrl: diagnostics.endpointUrl,
                method: 'POST',
                failureReason,
                diagnostics: {
                  ...diagnostics,
                  lastStatus: res.status,
                  backendResponded: true,
                  requestReachedBackend: true,
                  responseKind: 'http-response',
                  requestedProvider: normalized.requestedProvider,
                  selectedProvider: normalized.selectedProvider,
                  actualProvider: normalized.actualProvider,
                  actualModel: normalized.actualModel,
                  fallbackUsed: normalized.fallbackUsed,
                  fallbackReason: normalized.fallbackReason,
                  routeStatus: normalized.routeStatus,
                  routeError: normalized.routeError,
                },
              };
            } catch (error) {
              return {
                ok: false,
                status: 0,
                snippet: String(error?.message || 'fetch failed'),
                parsedText: '',
                requestUrl: diagnostics.endpointUrl,
                method: 'POST',
                failureReason: classifyAiFailure(error),
                diagnostics: {
                  ...diagnostics,
                  lastStatus: 0,
                  backendResponded: false,
                  requestReachedBackend: false,
                  responseKind: 'network-failure',
                  lastError: String(error?.message || 'fetch failed'),
                  routeStatus: 'transport_unreachable',
                  routeError: String(error?.message || 'fetch failed'),
                },
              };
            }
          }'''
          route_start = bridge.find('export async function testMusicAiRoute')
          if route_start < 0:
              raise SystemExit('Missing testMusicAiRoute anchor')
          bridge = bridge[:route_start] + route_test.rstrip() + '\n'
          bridge_path.write_text(bridge, encoding='utf-8')

          main_path = Path('apps/music-tile/main.js')
          main = main_path.read_text(encoding='utf-8')
          route_action = r'''async function testAiRouteAction() {
            setAiAction('Contacting Stephanos AI for smarter journey…');
            emitPresenceEvent({ kind: 'music.ai_smarter_journey_started', severity: 'info', summary: 'AI smarter journey started', impact: 'Waiting for AI candidates.' });
            state.aiSmarterJourney = [{ id: `ai-loading-${Date.now()}`, title: 'AI Smarter Journey', summary: 'Contacting Stephanos AI for smarter journey…', badge: 'loading' }];
            renderAiSuggestions();
            const result = await testMusicAiRoute();
            const routeUnavailable = result.status === 404 || result.diagnostics?.routeStatus === 'route_unavailable';
            const routeReachable = result.diagnostics?.requestReachedBackend === true && !routeUnavailable;
            if (routeReachable) {
              const outcome = result.ok ? 'succeeded' : `reached the backend with status ${result.status}`;
              setAiAction(`AI router reachable. Test AI route ${outcome}.`, result.diagnostics);
              emitPresenceEvent({
                kind: 'music.ai_transport_ready',
                severity: result.ok ? 'info' : 'warning',
                summary: 'Music Tile AI router reachable',
                impact: `AI transport reached the canonical backend: status ${result.status}.`,
                suggestedAction: result.ok ? 'Use AI journey tools.' : 'Inspect provider diagnostics; the route itself is reachable.',
              });
            } else {
              setAiAction(`AI transport failed: ${result.failureReason || result.status || result.snippet}. Rule-based mode active.`, result.diagnostics);
              emitPresenceEvent({ kind: 'music.ai_route_unavailable', severity: 'warning', summary: 'Music Tile AI router unavailable', impact: 'AI journey building and interpretation degraded; rule-based mode remains active.', suggestedAction: 'Test or repair the Music AI bridge.' });
            }
          }'''
          main = replace_between(main, 'async function testAiRouteAction() {', 'function buildMusicAiStatusView', route_action, 'testAiRouteAction')

          status_view = r'''function buildMusicAiStatusView(diagnostics = {}) {
            const status = getMusicAiStatus();
            const runtime = getMusicAiRuntimeDiagnostics();
            const lastStatus = diagnostics.lastStatus == null ? null : Number(diagnostics.lastStatus);
            const lastError = String(diagnostics.lastError || diagnostics.routeError || '').trim();
            const reached = diagnostics.requestReachedBackend;
            const responded = diagnostics.backendResponded;
            const responseMode = diagnostics.responseKind || 'n/a';
            const requestedProvider = diagnostics.requestedProvider || 'unknown';
            const selectedProvider = diagnostics.selectedProvider || 'unknown';
            const actualProvider = diagnostics.actualProvider || 'unknown';
            const actualModel = diagnostics.actualModel || 'unknown';
            const fallbackUsed = diagnostics.fallbackUsed === true;
            const fallbackReason = diagnostics.fallbackReason || 'none';
            const routeStatus = diagnostics.routeStatus || 'unknown';
            let statusKind = 'unknown'; let headline = 'AI transport status unknown. Press Test AI route.'; let badge = 'music-badge';
            if ((lastStatus == null || Number.isNaN(lastStatus) || lastStatus <= 0) && reached !== true && !lastError) { statusKind = 'not-tested'; headline = 'AI transport not tested yet. Press Test AI route.'; badge = 'music-badge'; }
            else if (lastError && (reached === false || lastStatus === 0)) { statusKind = 'network-error'; headline = `AI backend unreachable/network error. ${lastError}`; badge = 'music-badge music-badge--warning'; }
            else if (routeStatus === 'route_unavailable' || lastStatus === 404) { statusKind = 'route-missing'; headline = `AI route unavailable. ${lastError || 'No canonical provider route is ready.'}`; badge = 'music-badge music-badge--warning'; }
            else if (lastStatus === 405) { statusKind = 'method-mismatch'; headline = 'AI backend reached, but the method was rejected: 405.'; badge = 'music-badge music-badge--warning'; }
            else if (lastStatus === 400) { statusKind = 'payload-invalid'; headline = 'AI backend reached, but the payload was rejected: 400.'; badge = 'music-badge music-badge--warning'; }
            else if (lastStatus >= 500) { statusKind = 'backend-error'; headline = `AI backend reached; provider execution failed: ${lastStatus}.`; badge = 'music-badge music-badge--warning'; }
            else if (responded === true) { statusKind = actualProvider === 'unknown' ? 'degraded' : 'ready'; headline = actualProvider === 'unknown' ? 'AI transport reachable. Execution provider was not reported.' : `AI ready — ${actualProvider}/${actualModel} answered${fallbackUsed ? ' via fallback' : ''}.`; badge = 'music-badge music-badge--success'; }
            if (responseMode === 'text-fallback') headline += ' Text fallback mode active.';
            return {
              statusKind,
              headline,
              details: 'Canonical router pool active; rule-based parser remains available. OpenClaw agents are a separate route.',
              badge,
              providerMetadataHelp: 'Requested, selected, and executed provider truth comes from the canonical Stephanos AI response. A fallback provider may answer when policy permits.',
              shouldShowRuleFallback: true,
              diagnosticsRows: [
                `Endpoint: ${runtime.endpointUrl}`,
                `Backend base: ${runtime.backendBaseUrl}`,
                `Last HTTP status: ${lastStatus ?? 'n/a'}`,
                `Last error: ${lastError || 'none'}`,
                `Request reached backend: ${reached === true ? 'yes' : reached === false ? 'no' : 'unknown'}`,
                `Backend responded: ${responded === true ? 'yes' : responded === false ? 'no' : 'unknown'}`,
                `Response mode: ${responseMode}`,
                `Canonical route status: ${routeStatus}`,
                `Runtime route/provider: ${status.routeKind}/${status.provider}`,
                `Requested provider: ${requestedProvider}`,
                `Router-selected provider: ${selectedProvider}`,
                `Executed provider/model: ${actualProvider}/${actualModel}`,
                `Fallback used/reason: ${fallbackUsed ? 'yes' : 'no'} / ${fallbackReason}`,
              ],
            };
          }'''
          main = replace_between(main, 'function buildMusicAiStatusView', 'const state =', status_view, 'buildMusicAiStatusView')

          update_status = r'''function updateAiStatus(extra = {}) {
            if (!ui.aiStatusText) return;
            const view = buildMusicAiStatusView(extra);
            const providerMetaBadge = view.statusKind === 'degraded'
              ? '<span class="music-badge" title="The backend response did not report the executed provider/model.">execution_metadata_unavailable · info</span>'
              : '';
            ui.aiStatusText.innerHTML = `<span class="${view.badge}">${escapeHtml(view.statusKind)}</span> ${escapeHtml(view.headline)} ${escapeHtml(view.details)} ${providerMetaBadge} ${view.providerMetadataHelp ? `<span class="meta" title="${escapeHtml(view.providerMetadataHelp)}">ⓘ</span>` : ''}`;
            if (ui.aiLastAction) ui.aiLastAction.innerHTML = `<details class="music-diagnostics"><summary>Show diagnostics</summary>${view.diagnosticsRows.map((lineText) => `<div class="meta">${escapeHtml(lineText)}</div>`).join('')}</details>`;
          }'''
          main = replace_between(main, 'function updateAiStatus', 'function setAiAction', update_status, 'updateAiStatus')
          main_path.write_text(main, encoding='utf-8')

          test_path = Path('tests/music-tile-ai-routing-settlement.test.mjs')
          test_path.write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {
            normalizeMusicAiResponse,
            testMusicAiRoute,
          } from '../apps/music-tile/engine/musicAiBridge.js';
          import { sanitizeStephanosProviderConfigsForTransport } from '../shared/ai/stephanosClient.mjs';

          test('nested canonical router errors survive route_unavailable normalization', () => {
            const normalized = normalizeMusicAiResponse({
              raw: { router: { status: 'route_unavailable', error: 'No approved provider route is ready.' } },
            });
            assert.equal(normalized.routeStatus, 'route_unavailable');
            assert.equal(normalized.routeError, 'No approved provider route is ready.');
          });

          test('route probe reports a reached backend separately from route availability', async () => {
            const result = await testMusicAiRoute({
              fetchImpl: async () => ({
                ok: false,
                status: 503,
                text: async () => JSON.stringify({
                  raw: { router: { status: 'route_unavailable', error: 'Fallback disabled and requested provider is unavailable.' } },
                }),
              }),
            });
            assert.equal(result.ok, false);
            assert.equal(result.status, 503);
            assert.equal(result.diagnostics.requestReachedBackend, true);
            assert.equal(result.diagnostics.routeStatus, 'route_unavailable');
            assert.equal(result.failureReason, 'Fallback disabled and requested provider is unavailable.');
          });

          test('provider config transport strips credentials and unknown draft fields', () => {
            assert.deepEqual(sanitizeStephanosProviderConfigsForTransport({
              groq: { apiKey: 'secret', baseURL: 'https://api.groq.com', model: 'test', surprise: 'drop-me' },
            }), {
              groq: { baseURL: 'https://api.groq.com', model: 'test' },
            });
          });

          test('Music Tile route action treats reached non-route-unavailable responses as transport-ready', () => {
            const source = fs.readFileSync(new URL('../apps/music-tile/main.js', import.meta.url), 'utf8');
            assert.match(source, /const routeReachable = result\.diagnostics\?\.requestReachedBackend === true && !routeUnavailable/);
            assert.match(source, /music\.ai_transport_ready/);
            assert.match(source, /escapeHtml\(lineText\)/);
          });

          test('standalone routing preferences merge persisted truth before runtime overrides', () => {
            const source = fs.readFileSync(new URL('../apps/music-tile/engine/musicAiBridge.js', import.meta.url), 'utf8');
            assert.match(source, /const preferences = \{\s*\.\.\.persistedPreferences/);
            assert.match(source, /sanitizeStephanosProviderConfigsForTransport/);
          });
          ''', encoding='utf-8')
          PY
          node --check apps/music-tile/engine/musicAiBridge.js
          node --check apps/music-tile/main.js
          node --check shared/ai/stephanosClient.mjs
          node --check tests/music-tile-ai-routing-settlement.test.mjs
          git diff --check

      - name: Run focused and journey regression tests
        shell: bash
        run: |
          node --test \
            shared/ai/stephanosClient.test.mjs \
            tests/music-tile-ai-router-connection.test.mjs \
            tests/music-tile-ai-routing-settlement.test.mjs \
            tests/music-intelligence-centre-vnext.test.mjs \
            tests/music-tile-journey-function-audit.test.mjs \
            tests/music-tile-candidate-verification-init-order.test.mjs

      - name: Publish settled branch and self-remove
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-music-ai-routing-settlement.yml
          git diff --check
          git add -A
          git commit -m "Settle Music Tile canonical AI routing truth"
          git fetch origin fix/music-ai-canonical-routing-truth
          git rebase origin/fix/music-ai-canonical-routing-truth
          git push origin HEAD:fix/music-ai-canonical-routing-truth
