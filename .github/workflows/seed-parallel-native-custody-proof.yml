name: Seed Parallel Native Custody Proof

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/windows/Stephanos.SeedParallelCustody/**'
      - 'src/windows/Stephanos.SeedParallelCustody.Tests/**'
      - 'scripts/seed-canopy-parallel-builder.mjs'
      - 'shared/runtime/seedCanopyParallelResourceV1.mjs'
      - 'docs/architecture/seed-parallel-target-write-custody.md'
      - '.github/workflows/seed-parallel-native-custody-proof.yml'

permissions:
  contents: read

concurrency:
  group: seed-parallel-native-custody-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-new-file-custody:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # verified v4
        with:
          dotnet-version: '8.0.415'
      - name: Exercise actual native new-file handles against disposable replacement attempts
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
        run: |
          dotnet run --project src/windows/Stephanos.SeedParallelCustody.Tests --configuration Release -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'SEED_NATIVE_PROOF_IS_DISPOSABLE_FIXTURE=true'
          Write-Output 'SEED_PHYSICAL_BUILD_PICKUP_PROVEN=false'
          Write-Output 'SEED_PRODUCTION_WORKER_COMMISSIONED=false'
          Write-Output 'R7_ORIGINAL_LEASE_RELEASED=false'
