name: Music Tile Auto Spotify Card URL Repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/music-tile-auto-spotify-card-url-repair.yml

concurrency:
  group: music-tile-auto-spotify-card-url-repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/music-tile-auto-spotify-card-url'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/music-tile-auto-spotify-card-url
          fetch-depth: 3
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify bounded starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD f17766c182364428f0f72aee796223e38011a153)" = "f17766c182364428f0f72aee796223e38011a153"
          test "$(git diff --name-only f17766c182364428f0f72aee796223e38011a153...HEAD)" = ".github/workflows/music-tile-auto-spotify-card-url-repair.yml"
      - name: Apply exact bounded repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          main_path = Path('apps/music-tile/main.js')
          native_path = Path('apps/music-tile/engine/nativeCatalogSearch.js')
          integration_test_path = Path('tests/music-tile-spotify-resolver-integration.test.mjs')
          save_test_path = Path('tests/music-tile-save-resolve-spotify-flow.test.mjs')
          new_test_path = Path('tests/music-tile-auto-spotify-card-url.test.mjs')

          main = main_path.read_text(encoding='utf-8')
          native = native_path.read_text(encoding='utf-8')

          old_import = "import { catalogResultActionKey, catalogResultToMusicTileTrack, findExistingCatalogTrack, requestNativeCatalogSearch } from './engine/nativeCatalogSearch.js';"
          new_import = "import { catalogResultActionKey, catalogResultToMusicTileTrack, findExistingCatalogTrack, requestNativeCatalogSearch, selectAutomaticSpotifyTrackMatch } from './engine/nativeCatalogSearch.js';"
          if main.count(old_import) != 1:
            raise SystemExit('expected native-catalog import not found exactly once')
          main = main.replace(old_import, new_import)

          old_render_all = "function renderAll() { renderTasteDNA(); renderCandidates(); renderListeningDeck(); renderDiscoveryResults(); renderAiSuggestions(); renderPendingTasteDnaChanges(); renderAppliedTasteDnaChanges(); renderImmersionSession(); renderJourneyQueue(); renderActiveJourneySummary(); renderMusicIntelligenceCentre(); }"
          new_render_all = "function renderAll() { renderTasteDNA(); renderCandidates(); renderListeningDeck(); renderDiscoveryResults(); renderAiSuggestions(); renderPendingTasteDnaChanges(); renderAppliedTasteDnaChanges(); renderImmersionSession(); renderJourneyQueue(); renderActiveJourneySummary(); renderMusicIntelligenceCentre(); queueAutomaticSpotifyCardResolution(); }"
          if main.count(old_render_all) != 1:
            raise SystemExit('renderAll contract changed')
          main = main.replace(old_render_all, new_render_all)

          old_open_setup = "const spotifyOpenUrl = hasReachableSpotifyTrack ? spotifyRef.openUrl : '';  const youtubeUrl"
          new_open_setup = "const spotifyOpenUrl = hasReachableSpotifyTrack ? spotifyRef.openUrl : ''; const spotifyPrimaryAction = spotifyOpenUrl ? `<a class=\"media-btn spotify\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"${spotifyOpenUrl}\">Open in Spotify</a>` : `<button type=\"button\" class=\"media-btn spotify resolve\" data-action=\"resolve-spotify-link\" data-id=\"${escapeHtml(track.id)}\">Get Spotify link automatically</button>`; const youtubeUrl"
          if main.count(old_open_setup) != 1:
            raise SystemExit('listening card Spotify setup changed')
          main = main.replace(old_open_setup, new_open_setup)

          old_primary_actions = "${spotifyOpenUrl ? `<a class=\"media-btn spotify\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"${spotifyOpenUrl}\">Open in Spotify</a>` : ''}<a class=\"media-btn spotify\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"${buildSpotifySearchUrl(track)}\">Find on Spotify</a>"
          if main.count(old_primary_actions) != 1:
            raise SystemExit('listening card primary Spotify actions changed')
          main = main.replace(old_primary_actions, "${spotifyPrimaryAction}")

          old_editor_resolve = "${spotifyOpenUrl ? '' : `<button data-action=\"resolve-spotify-link\" data-id=\"${safeTrackId}\">Resolve Spotify Link</button>`}"
          new_editor_resolve = "${spotifyOpenUrl ? '' : `<div class=\"meta\">Stephanos normally fills this automatically. Paste a direct track URL only as a fallback.</div>`}"
          if main.count(old_editor_resolve) != 1:
            raise SystemExit('links editor resolver changed')
          main = main.replace(old_editor_resolve, new_editor_resolve)

          old_media_action = re.search(r"function mediaActionLinks\(track\) \{.*?\nfunction normalizeYouTubeUrl", main, re.S)
          if not old_media_action:
            raise SystemExit('mediaActionLinks block not found')
          new_media_action = '''function mediaActionLinks(track) { const spotifyState = getSpotifyLinkState(track); const youtubeUrl = normalizeYouTubeUrl(track.youtubeUrl || ''); const spotifyAction = spotifyState.canOpenSpotify ? `<a class="media-btn spotify" target="_blank" rel="noopener noreferrer" href="${spotifyState.openUrl}">Open in Spotify</a>` : `<span class="media-btn spotify blocked" title="Stephanos will resolve a verified Spotify track URL inside the tile.">Needs verified Spotify link</span><button type="button" class="media-btn spotify resolve" data-action="resolve-spotify-link" data-id="${track.id}">Get Spotify link automatically</button>`; const youtubeLabel = youtubeUrl ? 'Open in YouTube' : 'Find on YouTube'; const youtubeHref = youtubeUrl || buildYouTubeSearchUrl(track); return `${spotifyAction}<a class="media-btn youtube" target="_blank" rel="noopener noreferrer" href="${youtubeHref}">${youtubeLabel}</a>`; }
function normalizeYouTubeUrl'''
          main = main[:old_media_action.start()] + new_media_action + main[old_media_action.end():]

          main = main.replace(
            "Spotify search link or invalid link. Open a result in Spotify and paste the track URL.",
            "That is a Spotify search link, not a direct track URL. Use automatic lookup; paste only as a fallback.",
          )

          resolver_block = re.search(r"async function searchSpotifyCatalogForTrack\(track\).*?\nfunction resolveYouTubeLink", main, re.S)
          if not resolver_block:
            raise SystemExit('Spotify resolver block not found')
          new_resolver_block = '''async function searchSpotifyCatalogForTrack(track) { const query = `${track.artist || ''} ${track.title || track.name || ''}`.trim(); const payload = await requestNativeCatalogSearch(query, { limit: 10 }); return { query, payload }; }
function applyResolvedSpotifyTrack(track, candidate) { const parsed = resolveSpotifyReference(candidate.spotifyUrl || candidate.url || candidate.spotifyUri || candidate.uri || ''); if (!parsed.valid || parsed.type !== 'track') return false; track.spotifyUrl = parsed.openUrl; track.spotifyUri = parsed.uri; track.candidateVerificationStatus = track.aiSuggested ? AI_CANDIDATE_STATUSES.userConfirmed : AI_CANDIDATE_STATUSES.verified; return true; }
const automaticSpotifyResolutionInFlight = new Set();
function shouldAutomaticallyResolveSpotifyTrack(track) { const current = resolveSpotifyReference(track?.spotifyUrl || track?.spotifyUri || ''); if (current.valid && current.type === 'track') return false; const artist = String(track?.artist || '').trim().toLowerCase(); const title = String(track?.title || track?.name || '').trim().toLowerCase(); if (!artist || !title || artist === 'unknown' || artist === 'unknown artist' || title === 'unknown' || title === 'untitled') return false; return !track.spotifyAutoResolutionState; }
function queueAutomaticSpotifyCardResolution() { if (automaticSpotifyResolutionInFlight.size) return; const next = (state.listeningDeck || []).find(shouldAutomaticallyResolveSpotifyTrack); if (!next) return; next.spotifyAutoResolutionState = 'pending'; next.spotifyAutoResolutionAttemptedAt = new Date().toISOString(); saveState(); queueMicrotask(() => resolveSpotifyLink(next.id, { automatic: true })); }
async function resolveSpotifyLink(trackId, { automatic = false } = {}) { const track = state.listeningDeck.find((item) => `${item.id}` === `${trackId}`); if (!track) return;
  state.linkMessages = state.linkMessages || {};
  const existing = resolveSpotifyReference(track.spotifyUrl || track.spotifyUri || '');
  if (existing.valid && existing.type === 'track') { track.spotifyAutoResolutionState = 'resolved'; state.linkMessages[trackId] = 'Spotify link already present.'; saveState(); renderListeningDeck(); return; }
  if (automaticSpotifyResolutionInFlight.has(String(trackId))) return;
  automaticSpotifyResolutionInFlight.add(String(trackId));
  track.spotifyAutoResolutionState = 'pending';
  track.spotifyAutoResolutionAttemptedAt = new Date().toISOString();
  state.linkMessages[trackId] = automatic ? 'Stephanos is finding and adding the exact Spotify track URL…' : 'Finding the exact Spotify track URL inside Stephanos…';
  saveState(); renderListeningDeck();
  try {
    const { payload } = await searchSpotifyCatalogForTrack(track);
    if (!payload?.ok) { track.spotifyAutoResolutionState = 'blocked'; state.linkMessages[trackId] = payload?.error || 'Automatic Spotify lookup is temporarily unavailable.'; return; }
    const match = selectAutomaticSpotifyTrackMatch(track, Array.isArray(payload.results) ? payload.results : []);
    if (!match) { track.spotifyAutoResolutionState = 'blocked'; state.linkMessages[trackId] = 'Stephanos did not receive one exact Spotify title-and-artist match. Nothing was pasted or guessed; retry later or paste a direct track URL only as a fallback.'; return; }
    const applied = applyResolvedSpotifyTrack(track, match);
    if (!applied) { track.spotifyAutoResolutionState = 'blocked'; state.linkMessages[trackId] = 'The catalogue result did not contain a valid direct Spotify track URL.'; return; }
    track.catalogProvider = 'spotify';
    track.catalogProviderLabel = String(match.providerLabel || 'Spotify');
    track.catalogProviderItemId = String(match.providerItemId || '');
    track.catalogProviderUrl = String(match.providerUrl || match.spotifyUrl || '');
    track.catalogVerificationStatus = String(match.verificationStatus || 'metadata_verified');
    track.catalogPlaybackAvailability = String(match.playbackAvailability || 'playback_unverified');
    track.spotifySearchUrl = String(match.spotifySearchUrl || '');
    track.spotifyAutoResolutionState = 'resolved';
    track.spotifyAutoResolvedAt = new Date().toISOString();
    state.linkMessages[trackId] = 'Stephanos found the exact Spotify track and added its URL to this song card automatically.';
  } catch (error) {
    track.spotifyAutoResolutionState = 'blocked';
    state.linkMessages[trackId] = `Automatic Spotify lookup failed safely: ${String(error?.message || error)}. The card stayed unchanged.`;
  } finally {
    automaticSpotifyResolutionInFlight.delete(String(trackId));
    saveState();
    renderListeningDeck();
    queueAutomaticSpotifyCardResolution();
  }
}
function resolveYouTubeLink'''
          main = main[:resolver_block.start()] + new_resolver_block + main[resolver_block.end():]

          helper = r'''
function normalizeAutomaticMatchText(value = '') {
  return String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

function automaticArtistParts(value = '') {
  return String(value || '')
    .split(/\s*(?:,|&|\bfeat\.?\b|\bfeaturing\b|\bwith\b|\bx\b)\s*/i)
    .map(normalizeAutomaticMatchText)
    .filter(Boolean);
}

export function selectAutomaticSpotifyTrackMatch(track = {}, results = []) {
  const targetTitle = normalizeAutomaticMatchText(track.title || track.name || '');
  const targetArtists = automaticArtistParts(track.artist || '');
  if (!targetTitle || !targetArtists.length) return null;
  return (Array.isArray(results) ? results : []).find((result) => {
    const provider = String(result?.provider || '').toLowerCase();
    const providerItemId = String(result?.providerItemId || '').trim();
    if (provider !== 'spotify' || !/^[A-Za-z0-9]{22}$/.test(providerItemId)) return false;
    if (String(result?.verificationStatus || '') !== 'metadata_verified') return false;
    const canonicalUrl = `https://open.spotify.com/track/${providerItemId}`;
    if (String(result?.spotifyUrl || '') !== canonicalUrl) return false;
    const resultTitle = normalizeAutomaticMatchText(result?.title || '');
    if (resultTitle !== targetTitle) return false;
    const resultArtists = automaticArtistParts(result?.artist || '');
    return targetArtists.some((artist) => resultArtists.includes(artist));
  }) || null;
}
'''
          marker = '\nexport function findExistingCatalogTrack'
          if marker not in native or 'selectAutomaticSpotifyTrackMatch' in native:
            raise SystemExit('native helper insertion boundary changed')
          native = native.replace(marker, helper + marker, 1)

          integration_test_path.write_text("""import test from 'node:test';
import assert from 'node:assert/strict';
import fs from 'node:fs';

const source = fs.readFileSync(new URL('../apps/music-tile/main.js', import.meta.url), 'utf8');
const resolverStart = source.indexOf('async function resolveSpotifyLink');
const resolverEnd = source.indexOf('function resolveYouTubeLink', resolverStart);
const resolver = source.slice(resolverStart, resolverEnd);

test('Resolve Spotify Link uses the canonical provider-neutral catalogue route.', () => {
  assert.match(source, /requestNativeCatalogSearch\(query, \{ limit: 10 \}\)/);
  assert.doesNotMatch(resolver, /\/api\/music\/spotify\/search/);
});

test('exact catalogue match saves canonical spotifyUrl and spotifyUri automatically.', () => {
  assert.match(source, /selectAutomaticSpotifyTrackMatch\(track/);
  assert.match(source, /track\.spotifyUrl = parsed\.openUrl/);
  assert.match(source, /track\.spotifyUri = parsed\.uri/);
  assert.match(source, /added its URL to this song card automatically/);
});

test('resolver never opens Spotify or asks for clipboard confirmation.', () => {
  assert.doesNotMatch(resolver, /window\.open\(/);
  assert.doesNotMatch(resolver, /window\.confirm\(/);
  assert.match(source, /Get Spotify link automatically/);
});

test('ambiguous or non-Spotify results fail closed without guessing.', () => {
  assert.match(resolver, /did not receive one exact Spotify title-and-artist match/);
  assert.match(resolver, /Nothing was pasted or guessed/);
});

test('existing unresolved cards are queued for one automatic attempt.', () => {
  assert.match(source, /queueAutomaticSpotifyCardResolution\(\)/);
  assert.match(source, /spotifyAutoResolutionState = 'pending'/);
  assert.match(source, /automaticSpotifyResolutionInFlight/);
});
""", encoding='utf-8')

          save_test = save_test_path.read_text(encoding='utf-8')
          save_test = save_test.replace(
            "  assert.match(js, /Spotify catalog search is not configured\\. Use Spotify search and paste a confirmed track URL\\./);",
            "  assert.match(js, /Get Spotify link automatically/);\n  assert.match(js, /Stephanos normally fills this automatically/);",
          )

          new_test_path.write_text("""import test from 'node:test';
import assert from 'node:assert/strict';
import { selectAutomaticSpotifyTrackMatch } from '../apps/music-tile/engine/nativeCatalogSearch.js';

const TRACK_ID = '4uLU6hMCjMI75M1A2tKUQC';
const exactSpotifyResult = {
  provider: 'spotify',
  providerLabel: 'Spotify',
  providerItemId: TRACK_ID,
  providerUrl: `https://open.spotify.com/track/${TRACK_ID}`,
  spotifyUrl: `https://open.spotify.com/track/${TRACK_ID}`,
  spotifyUri: `spotify:track:${TRACK_ID}`,
  title: 'Enjoy the Silence',
  artist: 'Depeche Mode',
  verificationStatus: 'metadata_verified',
  playbackAvailability: 'playback_unverified',
};

test('automatic resolver selects one canonical exact Spotify title and artist match', () => {
  const match = selectAutomaticSpotifyTrackMatch({ title: 'Enjoy the Silence', artist: 'Depeche Mode' }, [exactSpotifyResult]);
  assert.equal(match, exactSpotifyResult);
});

test('automatic resolver accepts the primary artist when provider metadata includes a featured artist', () => {
  const featured = { ...exactSpotifyResult, artist: 'Depeche Mode, Guest Artist' };
  assert.equal(selectAutomaticSpotifyTrackMatch({ title: 'Enjoy the Silence', artist: 'Depeche Mode' }, [featured]), featured);
});

test('automatic resolver rejects metadata-only and near-title results', () => {
  const musicBrainz = { ...exactSpotifyResult, provider: 'musicbrainz' };
  const wrongTitle = { ...exactSpotifyResult, title: 'Enjoy the Silence Remix' };
  assert.equal(selectAutomaticSpotifyTrackMatch({ title: 'Enjoy the Silence', artist: 'Depeche Mode' }, [musicBrainz, wrongTitle]), null);
});

test('automatic resolver rejects noncanonical Spotify URLs and malformed IDs', () => {
  assert.equal(selectAutomaticSpotifyTrackMatch({ title: 'Enjoy the Silence', artist: 'Depeche Mode' }, [{ ...exactSpotifyResult, spotifyUrl: 'https://example.com/track' }]), null);
  assert.equal(selectAutomaticSpotifyTrackMatch({ title: 'Enjoy the Silence', artist: 'Depeche Mode' }, [{ ...exactSpotifyResult, providerItemId: 'short' }]), null);
});
""", encoding='utf-8')

          main_path.write_text(main, encoding='utf-8')
          native_path.write_text(native, encoding='utf-8')
          save_test_path.write_text(save_test, encoding='utf-8')
          PY
      - name: Validate focused and affected Music Tile behaviour
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/music-tile/main.js
          node --check apps/music-tile/engine/nativeCatalogSearch.js
          node --test \
            tests/music-tile-auto-spotify-card-url.test.mjs \
            tests/music-tile-spotify-resolver-integration.test.mjs \
            tests/music-tile-save-resolve-spotify-flow.test.mjs \
            tests/music-tile-native-catalog-ui.test.mjs \
            tests/music-provider-neutral-catalog-search.test.mjs
          node --test tests/music*.test.mjs
          git diff --check
          npm run stephanos:build
          npm run stephanos:verify
      - name: Publish final source-only repair and remove one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/music-tile-auto-spotify-card-url-repair.yml
          git status --short
          test -z "$(git status --short | awk '$2 ~ /^apps\/stephanos\/dist\// {print}')"
          git config user.name "stephanos-meterless-repair"
          git config user.email "267490109+Cheekyfellastef@users.noreply.github.com"
          git add apps/music-tile/main.js apps/music-tile/engine/nativeCatalogSearch.js tests/music-tile-auto-spotify-card-url.test.mjs tests/music-tile-spotify-resolver-integration.test.mjs tests/music-tile-save-resolve-spotify-flow.test.mjs .github/workflows/music-tile-auto-spotify-card-url-repair.yml
          git commit -m "Fix automatic Spotify URL insertion on song cards"
          git push origin HEAD:fix/music-tile-auto-spotify-card-url
