name: Battle Bridge Out-of-Band Observer V1

on:
  pull_request:
    paths:
      - '.github/workflows/battle-bridge-out-of-band-observer-v1.yml'
      - 'shared/agents/battleBridgeOutOfBandObserverReceiptV1.mjs'
      - 'shared/agents/battleBridgeOutOfBandObserverReceiptV1.test.mjs'
      - 'scripts/battle-bridge-out-of-band-observer-workflow.test.mjs'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: battle-bridge-out-of-band-observer-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  contract-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove bounded terminal observer receipts
        run: >-
          node --test
          shared/agents/battleBridgeOutOfBandObserverReceiptV1.test.mjs
          scripts/battle-bridge-out-of-band-observer-workflow.test.mjs

      - name: Parse observer source
        run: node --check shared/agents/battleBridgeOutOfBandObserverReceiptV1.mjs

      - name: Diff check
        if: always()
        run: git diff --check origin/main...HEAD

  observe:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1507 &&
      github.actor == 'Cheekyfellastef' &&
      contains(github.event.comment.body, '```stephanos-battle-bridge-tailscale-bootstrap-prerequisites')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      BOOTSTRAP_HOST: ${{ vars.STEPHANOS_BATTLE_BRIDGE_TAILSCALE_HOST }}
      BOOTSTRAP_USER: ${{ vars.STEPHANOS_BATTLE_BRIDGE_SSH_USER }}
    steps:
      - name: Check out trusted canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate exact owner-authored read-only request
        id: request
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          MAIN_HEAD="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          REQUEST_PATH="$RUNNER_TEMP/out-of-band-observer-request.json"
          node scripts/battle-bridge-tailscale-prerequisite-proof.mjs validate-event "$GITHUB_EVENT_PATH" "$MAIN_HEAD" > "$REQUEST_PATH"
          EXPECTED_HEAD="$(node -e "const r=require(process.argv[1]); process.stdout.write(r.request.expectedHead)" "$REQUEST_PATH")"
          REQUEST_ID="$(node -e "const r=require(process.argv[1]); process.stdout.write(r.request.requestId)" "$REQUEST_PATH")"
          test "$EXPECTED_HEAD" = "$MAIN_HEAD"
          echo "expected_head=$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"
          echo "request_path=$REQUEST_PATH" >> "$GITHUB_OUTPUT"

      - name: Build redacted settings proof
        if: steps.request.outcome == 'success'
        id: settings
        continue-on-error: true
        shell: bash
        env:
          TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE_VALUE: ${{ secrets.TS_AUDIENCE }}
          SSH_PRIVATE_KEY: ${{ secrets.STEPHANOS_BATTLE_BRIDGE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STEPHANOS_BATTLE_BRIDGE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          SETTINGS_PROOF="$RUNNER_TEMP/out-of-band-observer-settings.json"
          node scripts/battle-bridge-tailscale-prerequisite-proof.mjs settings-proof "${{ steps.request.outputs.expected_head }}" > "$SETTINGS_PROOF"
          READY="$(node -e "const r=require(process.argv[1]); process.stdout.write(String(r.ready))" "$SETTINGS_PROOF")"
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "proof_path=$SETTINGS_PROOF" >> "$GITHUB_OUTPUT"

      - name: Join tailnet as fixed ephemeral observer identity
        if: steps.settings.outputs.ready == 'true'
        id: tailnet
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:stephanos-github-recovery
          ping: ${{ vars.STEPHANOS_BATTLE_BRIDGE_TAILSCALE_HOST }}

      - name: Read exact Battle Bridge head without mutation
        if: steps.settings.outputs.ready == 'true' && steps.tailnet.outcome == 'success'
        id: remote
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_HEAD: ${{ steps.request.outputs.expected_head }}
          SSH_PRIVATE_KEY: ${{ secrets.STEPHANOS_BATTLE_BRIDGE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STEPHANOS_BATTLE_BRIDGE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/stephanos-battle-bridge-observer-key"
          KNOWN_HOSTS_FILE="$RUNNER_TEMP/stephanos-battle-bridge-observer-known-hosts"
          RAW_REMOTE_RECEIPT="$RUNNER_TEMP/out-of-band-observer-raw.txt"
          VALIDATED_RECEIPT="$RUNNER_TEMP/out-of-band-observer-remote.json"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          ENCODED_COMMAND="$(node scripts/battle-bridge-tailscale-prerequisite-proof.mjs encoded-command "$EXPECTED_HEAD")"
          ssh \
            -i "$KEY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o ConnectTimeout=15 \
            -l "$BOOTSTRAP_USER" \
            "$BOOTSTRAP_HOST" \
            powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand "$ENCODED_COMMAND" \
            > "$RAW_REMOTE_RECEIPT"
          node scripts/battle-bridge-tailscale-prerequisite-proof.mjs validate-receipt \
            "$EXPECTED_HEAD" \
            "${{ steps.settings.outputs.proof_path }}" \
            "$RAW_REMOTE_RECEIPT" \
            > "$VALIDATED_RECEIPT"
          echo "receipt_path=$VALIDATED_RECEIPT" >> "$GITHUB_OUTPUT"

      - name: Publish terminal external observer receipt
        id: terminal
        if: always()
        uses: actions/github-script@v7
        env:
          SETTINGS_PATH: ${{ steps.settings.outputs.proof_path }}
          REMOTE_RECEIPT_PATH: ${{ steps.remote.outputs.receipt_path }}
          TAILNET_OUTCOME: ${{ steps.tailnet.outcome }}
          REMOTE_OUTCOME: ${{ steps.remote.outcome }}
        with:
          script: |
            const fs = await import('node:fs');
            const path = await import('node:path');
            const { pathToFileURL } = await import('node:url');
            const prereqUrl = `${pathToFileURL(path.resolve('shared/agents/battleBridgeTailscalePrerequisiteProofV1.mjs')).href}?run=${Date.now()}`;
            const receiptUrl = `${pathToFileURL(path.resolve('shared/agents/battleBridgeOutOfBandObserverReceiptV1.mjs')).href}?run=${Date.now()}`;
            const prereq = await import(prereqUrl);
            const observer = await import(receiptUrl);
            const extracted = prereq.extractBattleBridgeTailscalePrerequisiteCheck(context.payload.comment?.body || '');
            const request = extracted?.ok ? extracted.command : {};
            const readJson = (filePath) => {
              if (!filePath || !fs.existsSync(filePath)) return null;
              try { return JSON.parse(fs.readFileSync(filePath, 'utf8')); }
              catch { return null; }
            };
            const settingsProof = readJson(process.env.SETTINGS_PATH);
            const remoteReceipt = readJson(process.env.REMOTE_RECEIPT_PATH);
            const receipt = observer.buildBattleBridgeOutOfBandObserverReceipt({
              request,
              settingsProof,
              remoteReceipt,
              workflowRunId: context.runId,
              observedAtUtc: new Date().toISOString(),
              tailnetOutcome: process.env.TAILNET_OUTCOME || '',
              remoteOutcome: process.env.REMOTE_OUTCOME || '',
            });
            const body = observer.buildBattleBridgeOutOfBandObserverReceiptBody(receipt);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1507,
              body,
            });
            core.setOutput('state', receipt.state);
            core.info(`Published terminal observer state ${receipt.state}.`);

      - name: Fail workflow closed after publishing non-DONE receipt
        if: always() && steps.terminal.outputs.state != 'DONE'
        shell: bash
        run: |
          echo "BATTLE_BRIDGE_OUT_OF_BAND_OBSERVER_${{ steps.terminal.outputs.state || 'BLOCKED' }}"
          exit 2
