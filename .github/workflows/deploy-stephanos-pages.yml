name: Deploy Stephanos Pages

on:
  push:
    branches:
      - main
    paths:
      - 'stephanos-ui/**'
      - 'apps/spatial-bridge/**'
      - '.github/workflows/deploy-stephanos-pages.yml'
      - 'shared/ai/**'
      - 'shared/runtime/**'
      - 'shared/agents/**'
      - 'shared/agents/vrResearchAgentV1*.mjs'
      - 'shared/agents/vrResearchWorkspaceProjectionV1*.mjs'
      - 'VR-Research-Lab/lab-workspace.json'
      - 'system/apps/app_validator.js'
      - 'scripts/**'
      - 'windows/**'
      - '!scripts/codex-patch-escrow-attest.mjs'
      - '!scripts/codex-patch-escrow-export.mjs'
      - '!scripts/codex-patch-escrow-prepare.mjs'
      - '!scripts/codex-patch-escrow-publish-validated.mjs'
      - '!scripts/codex-patch-escrow-publisher.mjs'
      - '!scripts/codex-patch-escrow-validate-prepared.mjs'
      - '!scripts/codex-patch-escrow-validated-artifact.mjs'
      - '!scripts/battle-bridge-github-sync-*.mjs'
      - '!scripts/windows/install-battle-bridge-github-sync.ps1'
      - '!scripts/windows/status-battle-bridge-github-sync.ps1'
      - '!scripts/windows/uninstall-battle-bridge-github-sync.ps1'
      - 'package.json'
      - 'apps/stephanos/app.json'
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages-deploy:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == 'Cheekyfellastef' &&
       github.event.comment.body == '/stephanos-deploy-pages')
    runs-on: ubuntu-latest
    concurrency:
      group: stephanos-pages-live
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: stephanos-ui/package-lock.json

      - name: Install UI dependencies
        working-directory: stephanos-ui
        run: npm ci

      - name: Prove Flywheel hydration and deluxe surface contracts
        run: |
          node --test \
            tests/workspace-hydration-bridge.test.mjs \
            stephanos-ui/src/components/FlywheelPanel.render.test.mjs \
            stephanos-ui/src/components/upliftWorkspaceSurfaces.test.mjs

      - name: Build current Stephanos UI
        run: npm run stephanos:build

      - name: Verify current Stephanos dist
        run: npm run stephanos:verify

      - name: Prove hosted Flywheel artifact is current and complete
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const root = 'apps/stephanos/dist';
          const metadata = JSON.parse(fs.readFileSync(path.join(root, 'stephanos-build.json'), 'utf8'));
          const expectedCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim().toLowerCase();
          const builtCommit = String(metadata.gitCommit || '').toLowerCase();
          if (builtCommit !== expectedCommit) {
            throw new Error(`HOSTED_DIST_HEAD_MISMATCH expected=${expectedCommit} built=${builtCommit}`);
          }

          const assetRoot = path.join(root, 'assets');
          const bundle = fs.readdirSync(assetRoot)
            .filter((name) => /\.(?:js|css)$/.test(name))
            .map((name) => fs.readFileSync(path.join(assetRoot, name), 'utf8'))
            .join('\n');

          const requiredMarkers = [
            'flywheel-seed-canopy',
            'stephanos-runs-the-project',
            'stephanos-flywheel-conversational-intelligence',
            'sovereign-commander-safe-parity',
            'stephanos-full-sovereignty-every-function',
            'flywheel-uplift-heatmap',
            'flywheel-learning-timeline',
            'stephanos.workspace-hydration.v1',
            'desktop-9flonkj.taild6f215.ts.net',
          ];
          const missing = requiredMarkers.filter((marker) => !bundle.includes(marker));
          if (missing.length) {
            throw new Error(`HOSTED_FLYWHEEL_CONTRACT_MISSING: ${missing.join(',')}`);
          }
          NODE

      - name: Prepare Pages artifact structure
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a ./ ./_site \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'node_modules/' \
            --exclude 'stephanos-ui/node_modules/' \
            --exclude 'stephanos-server/node_modules/' \
            --exclude '.DS_Store'
          touch _site/.nojekyll

      - name: Generate and verify hosted Spatial Workspace PWA icons
        run: |
          node apps/spatial-bridge/tools/build-icons.mjs --output-dir _site/apps/spatial-bridge/icons
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const siteRoot = '_site/apps/spatial-bridge';
          const manifest = JSON.parse(readFileSync(join(siteRoot, 'manifest.webmanifest'), 'utf8'));
          const signature = Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]);
          for (const size of [192, 512]) {
            const src = `./icons/icon-${size}.png`;
            const entry = manifest.icons?.find((icon) =>
              icon.src === src && icon.type === 'image/png' && icon.sizes === `${size}x${size}`);
            if (!entry) throw new Error(`SPATIAL_PWA_MANIFEST_ICON_MISSING:${size}`);
            const png = readFileSync(join(siteRoot, 'icons', `icon-${size}.png`));
            if (png.length < 33 || !png.subarray(0, 8).equals(signature)) {
              throw new Error(`SPATIAL_PWA_ICON_PNG_INVALID:${size}`);
            }
            if (png.toString('latin1', 12, 16) !== 'IHDR'
                || png.readUInt32BE(16) !== size || png.readUInt32BE(20) !== size
                || png[24] !== 8 || png[25] !== 6) {
              throw new Error(`SPATIAL_PWA_ICON_DIMENSIONS_INVALID:${size}`);
            }
          }
          NODE
          node apps/spatial-bridge/tools/verify-hosted-icons.mjs --site-root _site/apps/spatial-bridge

      - name: Enable bounded remote Goal Dashboard projection
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = '_site/apps/goal-dashboard/index.html';
          const marker = '<script src="./remote-live.js"></script>';
          let html = fs.readFileSync(path, 'utf8');
          if (!html.includes(marker)) {
            if (!html.includes('</body>')) throw new Error('GOAL_DASHBOARD_BODY_CLOSE_NOT_FOUND');
            html = html.replace('</body>', `  ${marker}\n</body>`);
            fs.writeFileSync(path, html, 'utf8');
          }
          if (!fs.existsSync('_site/apps/goal-dashboard/remote-live.js')) {
            throw new Error('GOAL_DASHBOARD_REMOTE_LIVE_ADAPTER_MISSING');
          }
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy current main to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
