name: Qualified Specialist Review Inventory Bootstrap

on:
  push:
    branches:
      - fix/qualified-specialist-review-inventory-v1

permissions:
  contents: write

concurrency:
  group: qualified-specialist-review-inventory-bootstrap
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qualified-specialist-review-inventory-v1
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'a1334cbf4ce9e031bc22c17cf464db42748dac53'
          test "$(git rev-parse origin/main)" = 'a1334cbf4ce9e031bc22c17cf464db42748dac53'
          test "$(git diff --name-only HEAD^..HEAD)" = '.github/workflows/qualified-specialist-review-inventory-bootstrap.yml'
      - name: Protect the specialist validator path
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          function replaceOnce(source, before, after, label) {
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: expected one seam, observed ${count}`);
            return source.replace(before, after);
          }
          const sourcePath = 'shared/agents/operatorMergeApprovalBoundaryV2.mjs';
          let source = readFileSync(sourcePath, 'utf8');
          source = replaceOnce(
            source,
            "  'shared/agents/providerNeutralReviewV1.mjs',\n]);",
            "  'shared/agents/providerNeutralReviewV1.mjs',\n  'shared/agents/qualifiedSpecialistReviewV1.mjs',\n]);",
            'approval boundary inventory',
          );
          writeFileSync(sourcePath, source, 'utf8');

          const testPath = 'shared/agents/operatorMergeApprovalBoundaryV2.test.mjs';
          let tests = readFileSync(testPath, 'utf8');
          tests = replaceOnce(
            tests,
            "    'shared/agents/providerNeutralReviewV1.mjs',\n  ]);",
            "    'shared/agents/providerNeutralReviewV1.mjs',\n    'shared/agents/qualifiedSpecialistReviewV1.mjs',\n  ]);",
            'approval boundary test inventory',
          );
          writeFileSync(testPath, tests, 'utf8');
          NODE
          rm -f .github/workflows/qualified-specialist-review-inventory-bootstrap.yml
          git add --all
          expected="$(printf '%s\n' \
            shared/agents/operatorMergeApprovalBoundaryV2.mjs \
            shared/agents/operatorMergeApprovalBoundaryV2.test.mjs | sort)"
          actual="$(git diff --cached --name-only origin/main | sort)"
          test "$actual" = "$expected"
          git diff --cached --check origin/main
      - name: Run protected boundary tests
        shell: bash
        run: |
          set -euo pipefail
          node --check shared/agents/operatorMergeApprovalBoundaryV2.mjs
          node --check shared/agents/operatorMergeApprovalBoundaryV2.test.mjs
          npm run stephanos:operator-merge-approval:test
      - name: Commit and push normally
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = 'a1334cbf4ce9e031bc22c17cf464db42748dac53'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Protect qualified specialist review validator'
          git push origin HEAD:fix/qualified-specialist-review-inventory-v1
          echo "SPECIALIST_INVENTORY_HEAD=$(git rev-parse HEAD)"
