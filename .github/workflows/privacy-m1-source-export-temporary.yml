name: One-shot Privacy M1 Recursive Snapshot Repair

on:
  push:
    branches:
      - agent/privacy-m1-evidence-projection-v1

permissions:
  contents: write

concurrency:
  group: privacy-m1-recursive-snapshot-repair-final
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'Cheekyfellastef/stephan-os'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact pre-repair identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object shared/agents/privacyTileEvidenceProjectionV1.mjs)" = "ff5151130846836ef0ed36522e7866604ffd5fd7"
          test "$(git hash-object shared/agents/privacyTileEvidenceProjectionV1.test.mjs)" = "865199b8b83cb7ab61a81eeb18b9db04e095c712"
          test "$(git hash-object docs/architecture/privacy-tile-evidence-projection-v1.md)" = "0952c8bbb9784763c76780a1fca68c624d1498ba"
          test "$(git hash-object .github/privacy-m1-recursive-snapshot.patch)" = "6c19981660e8978bed1a5536eb2bd1aeb5b02988"
          test -L stephanos-ui/public/privacy-m1-source-export/privacyTileEvidenceProjectionV1.mjs
          test -L stephanos-ui/public/privacy-m1-source-export/privacyTileEvidenceProjectionV1.test.mjs
          test -L stephanos-ui/public/privacy-m1-source-export/privacy-tile-evidence-projection-v1.md

      - name: Apply fixed recursive snapshot patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/privacy-m1-recursive-snapshot.patch
          git apply .github/privacy-m1-recursive-snapshot.patch

      - name: Prove exact repaired product blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object shared/agents/privacyTileEvidenceProjectionV1.mjs)" = "7e1c4dcea7b50a881ce3f5836858800d2d869bd7"
          test "$(git hash-object shared/agents/privacyTileEvidenceProjectionV1.test.mjs)" = "9698ef2cf3f2a692a8d32266f35e8f74e0f63b9e"
          test "$(git hash-object docs/architecture/privacy-tile-evidence-projection-v1.md)" = "17c14b2da9fbbe3ce01d57f27ff39cc6f9ac2602"
          node --check shared/agents/privacyTileEvidenceProjectionV1.mjs
          proof_log="${RUNNER_TEMP}/privacy-m1-recursive-snapshot-proof.log"
          node --test shared/agents/privacyTileEvidenceProjectionV1.test.mjs | tee "$proof_log"
          grep -F '# tests 29' "$proof_log"
          grep -F '# pass 29' "$proof_log"
          grep -F '# fail 0' "$proof_log"

      - name: Remove temporary repair machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -r -- \
            .github/privacy-m1-recursive-snapshot.patch \
            .github/workflows/privacy-m1-source-export-temporary.yml \
            stephanos-ui/public/privacy-m1-source-export

      - name: Verify exact bounded final estate
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/expected-paths.txt" <<'EOF'
          .github/privacy-m1-recursive-snapshot.patch
          .github/workflows/privacy-m1-source-export-temporary.yml
          docs/architecture/privacy-tile-evidence-projection-v1.md
          shared/agents/privacyTileEvidenceProjectionV1.mjs
          shared/agents/privacyTileEvidenceProjectionV1.test.mjs
          stephanos-ui/public/privacy-m1-source-export/privacy-tile-evidence-projection-v1.md
          stephanos-ui/public/privacy-m1-source-export/privacyTileEvidenceProjectionV1.mjs
          stephanos-ui/public/privacy-m1-source-export/privacyTileEvidenceProjectionV1.test.mjs
          EOF
          git diff HEAD --name-only | sort > "${RUNNER_TEMP}/actual-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-paths.txt" "${RUNNER_TEMP}/actual-paths.txt"
          git diff HEAD --check
          git fetch origin refs/heads/agent/privacy-m1-evidence-projection-v1
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"

      - name: Commit and non-force publish exact repair
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Recursively snapshot Privacy records before serialization'
          repaired_head="$(git rev-parse HEAD)"
          repaired_tree="$(git rev-parse HEAD^{tree})"
          test "$(git hash-object shared/agents/privacyTileEvidenceProjectionV1.mjs)" = "7e1c4dcea7b50a881ce3f5836858800d2d869bd7"
          test "$(git hash-object shared/agents/privacyTileEvidenceProjectionV1.test.mjs)" = "9698ef2cf3f2a692a8d32266f35e8f74e0f63b9e"
          test "$(git hash-object docs/architecture/privacy-tile-evidence-projection-v1.md)" = "17c14b2da9fbbe3ce01d57f27ff39cc6f9ac2602"
          test ! -e .github/privacy-m1-recursive-snapshot.patch
          test ! -e .github/workflows/privacy-m1-source-export-temporary.yml
          test ! -e stephanos-ui/public/privacy-m1-source-export
          git push --porcelain origin HEAD:refs/heads/agent/privacy-m1-evidence-projection-v1
          printf 'repaired_head=%s\n' "$repaired_head" >> "$GITHUB_OUTPUT"
          printf 'repaired_tree=%s\n' "$repaired_tree" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"

      - name: Upload terminal repair receipt
        uses: actions/upload-artifact@v4
        with:
          name: privacy-m1-recursive-snapshot-repair-${{ steps.publish.outputs.repaired_head }}
          path: ${{ runner.temp }}/privacy-m1-recursive-snapshot-proof.log
          if-no-files-found: error
          retention-days: 7
