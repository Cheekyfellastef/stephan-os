name: Protected Operator Merge Source Proof

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  protected-merge-source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prove protected merge boundary
        run: |
          set -o pipefail
          npm run stephanos:operator-merge-approval:test 2>&1 | tee operator-merge-test.log
      - name: Prove bounded native ready lifecycle and mailbox provenance source
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const completeWorkflow = readFileSync('.github/workflows/operator-merge-approval-gate.yml', 'utf8').replace(/\r\n/g, '\n');
          const legacyRoles = ['merge-group-evidence', 'operator-merge-queue-boundary', 'personal-repository-evidence',
            'operator-personal-repository-approval', 'operator-personal-repository-squash-merge'];
          const peerRole = 'r7-first-root-peer-evidence', issuerRole = 'r7-first-root-owner-intake';
          assert.equal((completeWorkflow.match(/^jobs:\n/gm) || []).length, 1);
          const headerEnd = completeWorkflow.indexOf('\njobs:\n') + '\njobs:\n'.length;
          const jobsSource = completeWorkflow.slice(headerEnd);
          const declarations = [...jobsSource.matchAll(/^  ([a-z0-9_-]+):\n/gm)];
          assert.deepEqual(declarations.map(match => match[1]), [...legacyRoles, peerRole, issuerRole]);
          const jobs = new Map(declarations.map((match, index) => [match[1],
            jobsSource.slice(match.index, declarations[index + 1]?.index ?? jobsSource.length)]));
          // Keep the original exact five-role assertions below. The appended
          // R7 roles are independently constrained, not allowed by looser totals.
          const workflow = completeWorkflow.slice(0, headerEnd) + legacyRoles.map(role => jobs.get(role)).join('');
          const proofWorkflow = readFileSync('.github/workflows/operator-merge-approval-gate-test.yml', 'utf8');
          const mailboxPolicy = readFileSync('shared/agents/protectedWorkflowDispatchMailboxV1.mjs', 'utf8');
          const personalPolicy = readFileSync('shared/agents/operatorPersonalRepositoryMergeV1.mjs', 'utf8');
          const mailboxDispatch = readFileSync('scripts/dispatch-protected-merge-from-mailbox.mjs', 'utf8');
          const mergeExecutor = readFileSync('scripts/operator-protected-personal-repository-merge.mjs', 'utf8');
          const actorHandoff = readFileSync('scripts/prove-protected-workflow-actor-handoff.mjs', 'utf8');

          assert.match(workflow, /user-owned-pr-ready/);
          assert.match(workflow, /markPullRequestReadyForReview/);
          assert.doesNotMatch(workflow, /fullDatabaseId/);
          assert.match(workflow, /READY_MUTATION='mutation\(\$pullRequestId:ID!\)\{markPullRequestReadyForReview/);
          assert.match(workflow, /pullRequestId="\$\{node_id\}"/);
          assert.match(workflow, /TRIGGERING_ACTOR/);
          assert.match(workflow, /test "\$\{TRIGGERING_ACTOR\}" = 'Cheekyfellastef'/);
          assert.match(workflow, /observed_main=.*branches\/main/);
          assert.match(workflow, /observed_tree=.*git\/commits\/\$\{EXPECTED_HEAD\}/);
          assert.match(workflow, /test "\$\{after_main\}" = "\$\{EXPECTED_BASE\}"/);
          assert.match(workflow, /ALREADY_READY/);
          assert.match(workflow, /mergeAuthority:false/);
          assert.match(workflow, /deploymentAuthority:false/);
          assert.match(workflow, /runtimeMutationAuthority:false/);
          assert.match(workflow, /providerQualificationAuthority:false/);
          assert.match(workflow, /inputs\.mode == 'user-owned-protected-squash'/);
          assert.match(workflow, /inputs\.mode == 'user-owned-pr-ready'/);
          assert.match(workflow, /user-owned-protected-squash\|user-owned-pr-ready/);

          // Mailbox transport provenance is a separate, event-derived authority proof.
          assert.match(workflow, /authorization_comment_id:/);
          assert.match(workflow, /Prove exact owner-authored mailbox authorization/);
          assert.match(workflow, /node scripts\/prove-protected-workflow-actor-handoff\.mjs/);
          assert.match(actorHandoff, /validateProtectedWorkflowActorHandoff/);
          const authorizationStepStart = workflow.indexOf('- name: Prove exact owner-authored mailbox authorization');
          const authorizationStepEnd = workflow.indexOf('- name: Collect exact personal-repository evidence after protected admission');
          assert.ok(authorizationStepStart >= 0 && authorizationStepEnd > authorizationStepStart);
          const authorizationStep = workflow.slice(authorizationStepStart, authorizationStepEnd);
          assert.match(authorizationStep, /GH_TOKEN: \$\{\{ github\.token \}\}/);
          assert.match(actorHandoff, /Authorization: `Bearer \$\{process\.env\.GH_TOKEN\}`/);
          assert.match(workflow, /test "\$\{OPERATOR_AUTHOR\}" = 'Cheekyfellastef'/);
          assert.match(actorHandoff, /run\?\.run_attempt !== 1/);
          assert.match(workflow, /STEPHANOS_AUTHORIZATION_COMMENT_SHA256/);
          assert.doesNotMatch(workflow, /test "\$\{TRANSPORT_ACTOR\}" = 'github-actions\[bot\]'/);
          assert.match(workflow, /STEPHANOS_AUTHORIZATION_COMMENT_ID/);
          assert.doesNotMatch(workflow, /CANONICAL_OPERATOR='github-actions\[bot\]'/);
          assert.doesNotMatch(workflow, /gh api[^\n]*\/pulls\/[^\n]*\/merge/);

          assert.match(mailboxPolicy, /validateProtectedWorkflowAuthorizationComment/);
          assert.match(mailboxPolicy, /PROTECTED_WORKFLOW_AUTHORIZATION_COMMENT_AUTHOR_MISMATCH/);
          assert.match(mailboxPolicy, /PROTECTED_WORKFLOW_AUTHORIZATION_COMMENT_IDENTITY_MISMATCH/);
          assert.match(mailboxPolicy, /authorization_comment_id: String\(commentId\)/);
          assert.doesNotMatch(mailboxPolicy, /'authorizationCommentId'/);
          assert.doesNotMatch(mailboxPolicy, /'authorization_comment_id'/);
          assert.doesNotMatch(mailboxPolicy, /'operator'/);

          assert.match(mailboxDispatch, /event\?\.comment\?\.id/);
          assert.match(mailboxDispatch, /buildProtectedWorkflowDispatchRequest\(command, \{ authorizationCommentId \}\)/);
          assert.doesNotMatch(mailboxDispatch, /\/pulls\/\$\{[^}]+\}\/merge/);

          assert.match(mergeExecutor, /proveProtectedWorkflowActorHandoff/);
          assert.match(mergeExecutor, /expectedCommentSha256: context\.authorizationCommentSha256/);
          assert.match(mergeExecutor, /STEPHANOS_AUTHORIZATION_COMMENT_ID/);
          assert.match(mergeExecutor, /execution\.authorization\.operatorAuthor/);
          assert.match(personalPolicy, /mailboxAuthorization/);
          assert.match(personalPolicy, /SHA256_PATTERN\.test\(text\(mailboxAuthorization\.commentSha256\)\)/);
          assert.match(personalPolicy, /\[nativeOwnerActor, PROTECTED_WORKFLOW_MAILBOX_TRANSPORT_ACTOR\]/);
          assert.doesNotMatch(personalPolicy, /github-actions\[bot\]/);
          assert.match(personalPolicy, /OPERATOR_MERGE_REVIEWER/);
          assert.match(personalPolicy, /strictPositiveInteger\(mailboxAuthorization\.commentId\)/);
          assert.match(personalPolicy, /personal-repository-mailbox-authorization-provenance-invalid/);
          assert.match(mergeExecutor, /mailboxAuthorization: authorization/);
          assert.doesNotMatch(mergeExecutor, /item !== 'triggering-actor'/);
          assert.doesNotMatch(mergeExecutor, /actorMismatchCount/);
          assert.doesNotMatch(mergeExecutor, /mailboxPriorRuns/);
          assert.match(mergeExecutor, /personal-repository-prior-attempt-exists/);
          assert.doesNotMatch(mergeExecutor, /operatorAuthor:\s*MAILBOX_TRANSPORT_ACTOR/);

          assert.equal([...workflow.matchAll(/^  [a-z0-9_-]+:\s*$/gm)].filter((match) => {
            const name = match[0].trim().slice(0, -1);
            return [
              'merge-group-evidence',
              'operator-merge-queue-boundary',
              'personal-repository-evidence',
              'operator-personal-repository-approval',
              'operator-personal-repository-squash-merge',
            ].includes(name);
          }).length, 5);
          assert.equal((workflow.match(/pull-requests: write/g) || []).length, 1);
          assert.equal((workflow.match(/contents: write/g) || []).length, 1);
          assert.equal((workflow.match(/persist-credentials: false/g) || []).length, 5);
          assert.equal((workflow.match(/^    environment:\n      name: operator-merge-approval$/gm) || []).length, 1);
          const mergeQueueStart = workflow.indexOf('  operator-merge-queue-boundary:');
          const personalStart = workflow.indexOf('  personal-repository-evidence:');
          const approvalStart = workflow.indexOf('  operator-personal-repository-approval:');
          const finalStart = workflow.indexOf('  operator-personal-repository-squash-merge:');
          assert.ok(mergeQueueStart >= 0 && personalStart > mergeQueueStart && approvalStart > personalStart && finalStart > approvalStart);
          assert.match(workflow.slice(mergeQueueStart, personalStart), /environment:\n      name: operator-merge-approval/);
          assert.doesNotMatch(workflow.slice(personalStart, approvalStart), /environment:\n      name: operator-merge-approval/);
          assert.doesNotMatch(workflow.slice(approvalStart, finalStart), /environment:\n      name: operator-merge-approval/);
          assert.doesNotMatch(workflow.slice(finalStart), /environment:\n      name: operator-merge-approval/);
          assert.match(workflow.slice(personalStart), /CANONICAL_OPERATOR='Cheekyfellastef'/);
          assert.match(workflow.slice(approvalStart), /test "\$\{TRIGGERING_ACTOR\}" = 'Cheekyfellastef'/);
          assert.match(proofWorkflow, /ready_for_review/);
          assert.doesNotMatch(workflow, /query:\s*\$\{\{/);

          const peer = jobs.get(peerRole), issuer = jobs.get(issuerRole);
          const readPermissions = ['actions: read', 'checks: read', 'contents: read', 'deployments: read', 'issues: read', 'pull-requests: read'];
          function permissions(job) {
            const block = job.match(/^    permissions:\n((?:      [a-z-]+: (?:read|write)\n)+)/m);
            assert.ok(block, 'explicit role permissions required');
            return block[1].trim().split('\n').map(line => line.trim());
          }
          assert.deepEqual(permissions(peer), readPermissions);
          assert.deepEqual(permissions(issuer), [...readPermissions, 'id-token: write']);
          for (const job of [peer, issuer]) {
            assert.match(job, /github\.event_name == 'workflow_dispatch' && inputs\.mode == 'user-owned-r7-first-root-policy-intake'/);
            assert.match(job, /^    runs-on: ubuntu-latest$/m);
            assert.match(job, /^    timeout-minutes: 5$/m);
            assert.equal((job.match(/ref: \$\{\{ github\.sha \}\}/g) || []).length, 1);
            assert.equal((job.match(/persist-credentials: false/g) || []).length, 1);
            const actions = [...job.matchAll(/uses: ([^\s]+)@([^\s]+)/g)];
            assert.deepEqual(actions.map(match => match[1]), ['actions/checkout', 'actions/setup-node', 'actions/upload-artifact']);
            for (const action of actions) assert.match(action[2], /^[a-f0-9]{40}$/);
            assert.match(job, /node-version: '24\.21\.0'/);
            assert.doesNotMatch(job, /STEPHANOS_RULESET_PROOF|permission-administration|create-github-app-token|contents: write|issues: write|pull-requests: write/);
            assert.doesNotMatch(job, /operator-protected-(?:merge-gate-v2|personal-repository-merge)\.mjs|gh api|gh pr|repository_dispatch|workflow_call|continue-on-error/);
          }
          assert.doesNotMatch(peer, /^    (?:environment|needs):|id-token:|issue-owner-envelope/m);
          assert.match(peer, /operator-protected-r7-first-root\.mjs prepare-peer/);
          assert.match(peer, /GITHUB_STEP_SUMMARY/);
          assert.match(peer, /ENROLL_EPHEMERAL_R7_OWNER_POLICY_PEER_ONLY:/);
          assert.match(issuer, /needs: \[r7-first-root-peer-evidence\]/);
          assert.match(issuer, /needs\.r7-first-root-peer-evidence\.result == 'success'/);
          assert.match(issuer, /environment:\n      name: operator-merge-approval/);
          assert.match(issuer, /url: https:\/\/github\.com\/Cheekyfellastef\/stephan-os\/actions\/runs\/\$\{\{ github\.run_id \}\}\/attempts\/1/);
          assert.match(issuer, /operator-protected-r7-first-root\.mjs issue-owner-envelope/);
          for (const role of legacyRoles.slice(2)) assert.match(jobs.get(role), /inputs\.mode != 'user-owned-r7-first-root-policy-intake'/);
          assert.equal((completeWorkflow.match(/id-token: write/g) || []).length, 1);
          assert.doesNotMatch(completeWorkflow, /\b(?:actions|deployments|statuses|checks): write\b|pull_request_target:|repository_dispatch|workflow_call|continue-on-error/);
          assert.doesNotMatch(completeWorkflow, /STEPHANOS_RULESET_PROOF_TOKEN[^\n]*(?:GITHUB_OUTPUT|GITHUB_ENV|upload-artifact)/i);
          assert.doesNotMatch(completeWorkflow, /query:\s*\$\{\{/);
          NODE
      - name: Upload bounded test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-merge-test-log
          path: operator-merge-test.log
          if-no-files-found: error
          retention-days: 3
      - name: Check changed-file whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
