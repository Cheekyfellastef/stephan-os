name: Protected Operator Merge Source Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  protected-merge-source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prove protected merge boundary
        run: npm run stephanos:operator-merge-approval:test
      - name: Check changed-file whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
