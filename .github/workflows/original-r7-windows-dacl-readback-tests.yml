name: Original r7 Windows ACL readback tests (isolated CI only)

on:
  pull_request:
    paths:
      - 'src/windows/Stephanos.OriginalR7DaclReadback/**'
      - 'src/windows/Stephanos.OriginalR7DaclReadback.Tests/**'
      - '.github/workflows/original-r7-windows-dacl-readback-tests.yml'

permissions:
  contents: read

jobs:
  native-acl-readback:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run isolated synthetic SID ACL readback tests only
        shell: pwsh
        run: |
          dotnet run --project src/windows/Stephanos.OriginalR7DaclReadback.Tests/Stephanos.OriginalR7DaclReadback.Tests.csproj --configuration Release --nologo
      - name: Refuse treating scratch ACL tests as real custody
        shell: pwsh
        run: |
          Write-Output 'ORIGINAL_R7_NATIVE_DACL_TEST_ONLY=true'
          Write-Output 'ORIGINAL_R7_WRITER_ACCESS_DENIAL_PROVEN=false'
          Write-Output 'WINDOWS_R7_WITNESS_INSTALLED=false'
          Write-Output 'ORIGINAL_R7_LEASE_RELEASED=false'
