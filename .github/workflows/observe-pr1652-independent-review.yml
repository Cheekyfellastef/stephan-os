name: Observe PR 1652 Independent Review

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/observe-pr1652-independent-review.yml'

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  observe:
    name: observe-pr1652-independent-review
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Wait for exact-head immutable review artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_PR: '1652'
          TARGET_HEAD: '4a4b84f205177bdc77d6d05cfe3f31a0180b11ef'
          WORKFLOW_ID: '318073448'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { setTimeout as sleep } from 'node:timers/promises';

          const token = String(process.env.GH_TOKEN || '');
          const repository = String(process.env.REPOSITORY || '');
          const targetPr = Number(process.env.TARGET_PR || 0);
          const targetHead = String(process.env.TARGET_HEAD || '');
          const workflowId = Number(process.env.WORKFLOW_ID || 0);
          const apiRoot = `https://api.github.com/repos/${repository}`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'stephanos-pr1652-review-observer',
          };

          async function request(path) {
            const response = await fetch(`${apiRoot}${path}`, { headers });
            const body = await response.text();
            if (!response.ok) throw new Error(`GET ${path} failed (${response.status}): ${body.slice(0, 300)}`);
            return JSON.parse(body);
          }

          for (let attempt = 1; attempt <= 90; attempt += 1) {
            const payload = await request(`/actions/workflows/${workflowId}/runs?event=pull_request_target&per_page=50`);
            const run = payload.workflow_runs.find((candidate) => (
              candidate.head_sha === targetHead
              && Array.isArray(candidate.pull_requests)
              && candidate.pull_requests.some((pr) => Number(pr.number) === targetPr)
            ));

            if (!run || run.status !== 'completed') {
              console.log(`REVIEW_OBSERVATION_PENDING attempt=${attempt} run=${run?.id ?? 'NONE'} status=${run?.status ?? 'MISSING'}`);
              await sleep(10_000);
              continue;
            }

            const jobsPayload = await request(`/actions/runs/${run.id}/jobs?filter=all&per_page=100`);
            const artifactsPayload = await request(`/actions/runs/${run.id}/artifacts?per_page=100`);
            const report = {
              schema: 'stephanos.pr1652-independent-review-observation.v1',
              repository,
              targetPr,
              targetHead,
              run: {
                id: run.id,
                runNumber: run.run_number,
                attempt: run.run_attempt,
                event: run.event,
                status: run.status,
                conclusion: run.conclusion,
                createdAt: run.created_at,
                updatedAt: run.updated_at,
                headSha: run.head_sha,
                headBranch: run.head_branch,
              },
              jobs: jobsPayload.jobs.map((job) => ({
                id: job.id,
                name: job.name,
                status: job.status,
                conclusion: job.conclusion,
                startedAt: job.started_at,
                completedAt: job.completed_at,
                steps: Array.isArray(job.steps) ? job.steps.map((step) => ({
                  name: step.name,
                  status: step.status,
                  conclusion: step.conclusion,
                  number: step.number,
                })) : [],
              })),
              artifacts: artifactsPayload.artifacts.map((artifact) => ({
                id: artifact.id,
                name: artifact.name,
                sizeInBytes: artifact.size_in_bytes,
                expired: artifact.expired,
                digest: artifact.digest || null,
              })),
            };

            fs.writeFileSync('pr1652-independent-review-observation.json', `${JSON.stringify(report, null, 2)}\n`);
            console.log(JSON.stringify(report, null, 2));
            const expectedArtifact = `stephanos-independent-review-${run.id}-attempt-${run.run_attempt}`;
            const job = report.jobs.find((item) => item.name === 'independent-security-review');
            const artifact = report.artifacts.find((item) => item.name === expectedArtifact);
            if (run.conclusion !== 'success' || job?.conclusion !== 'success' || !artifact || artifact.expired) {
              throw new Error(`REVIEW_NOT_ACCEPTABLE run=${run.id} conclusion=${run.conclusion} job=${job?.conclusion ?? 'MISSING'} artifact=${artifact?.id ?? 'MISSING'}`);
            }
            process.exit(0);
          }

          throw new Error(`REVIEW_OBSERVATION_TIMEOUT head=${targetHead}`);
          NODE

      - name: Upload bounded observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1652-independent-review-observation-${{ github.run_id }}
          path: pr1652-independent-review-observation.json
          if-no-files-found: warn
          retention-days: 3
