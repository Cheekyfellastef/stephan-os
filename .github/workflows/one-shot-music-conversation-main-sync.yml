name: One-shot Music Conversation Conflict Microscope

on:
  push:
    branches:
      - agent/music-tile-conversational-intelligence
    paths:
      - .github/workflows/one-shot-music-conversation-main-sync.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out existing conversational Music Tile branch
        uses: actions/checkout@v4
        with:
          ref: agent/music-tile-conversational-intelligence
          fetch-depth: 0

      - name: Print exact three-way conflict regions
        shell: bash
        run: |
          git fetch origin main
          git config merge.conflictstyle zdiff3
          git merge --no-commit --no-edit origin/main || true
          echo 'UNMERGED_FILES_BEGIN'
          git diff --name-only --diff-filter=U
          echo 'UNMERGED_FILES_END'
          python - <<'PY'
          from pathlib import Path

          for name in [
              'apps/music-tile/main.js',
              'tests/music-intelligence-centre-vnext.test.mjs',
          ]:
              text = Path(name).read_text(encoding='utf-8')
              lines = text.splitlines()
              print(f'CONFLICT_FILE_BEGIN {name}')
              inside = False
              chunk = []
              for line in lines:
                  if line.startswith('<<<<<<< '):
                      inside = True
                      chunk = [line]
                      continue
                  if inside:
                      chunk.append(line)
                      if line.startswith('>>>>>>> '):
                          print('\n'.join(chunk))
                          print('CONFLICT_CHUNK_END')
                          inside = False
                          chunk = []
              print(f'CONFLICT_FILE_END {name}')
          PY
          git merge --abort
