name: PR 1638 Current Main Sync

on:
  push:
    branches:
      - fix/battle-bridge-recovery-health-authority

permissions:
  contents: write

concurrency:
  group: pr-1638-current-main-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/battle-bridge-recovery-health-authority
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact branch and current main
        shell: bash
        run: |
          set -euo pipefail
          old_head='7e33908ed29afb27541bbd77ad884f147a074e5c'
          main_head='245d53ba4e7caa91307859af6b7126b0a96b8faa'
          bootstrap='.github/workflows/pr-1638-current-main-sync.yml'

          test "$(git branch --show-current)" = 'fix/battle-bridge-recovery-health-authority'
          test "$(git rev-parse HEAD^)" = "$old_head"
          test "$(git diff --name-only HEAD^..HEAD)" = "$bootstrap"
          test "$(git rev-parse origin/main)" = "$main_head"
          git merge-base --is-ancestor b7f5c8120f23e41a8669b7dffed00fd1c0de42f9 HEAD

      - name: Merge exact current main without rebase or force
        shell: bash
        run: |
          set -euo pipefail
          main_head='245d53ba4e7caa91307859af6b7126b0a96b8faa'
          bootstrap_head="$(git rev-parse HEAD)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-edit "$main_head" -m 'Merge current main into PR #1638 recovery authority lane'

          read -r merge_sha first_parent second_parent extra < <(git rev-list --parents -n 1 HEAD)
          test -n "$merge_sha"
          test "$first_parent" = "$bootstrap_head"
          test "$second_parent" = "$main_head"
          test -z "${extra:-}"

      - name: Remove bootstrap and verify exact ten-file estate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr-1638-current-main-sync.yml
          git add --all

          expected="$(
            printf '%s\n' \
              .github/workflows/battle-bridge-resilience-proof.yml \
              scripts/battle-bridge-backend-freshness-probe.mjs \
              scripts/battle-bridge-backend-freshness-probe.test.mjs \
              scripts/battle-bridge-recovery-mesh-installer.test.mjs \
              scripts/windows/install-stephanos-backend-autostart.ps1 \
              scripts/windows/probe-battle-bridge-recovery-mesh.ps1 \
              scripts/windows/start-stephanos-backend.ps1 \
              shared/agents/backendFreshnessSupervisor.mjs \
              stephanos-server/server.js \
              tests/mission-operations-dashboard.test.mjs |
              sort
          )"
          actual="$(git diff --cached --name-only origin/main | sort)"
          printf 'EXPECTED NET ESTATE\n%s\nACTUAL NET ESTATE\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          git diff --cached --check origin/main

      - name: Parse and run focused recovery regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/battle-bridge-backend-freshness-probe.mjs
          node --check shared/agents/backendFreshnessSupervisor.mjs
          node --check stephanos-server/server.js

          tests=(
            shared/agents/backendFreshnessSupervisor.test.mjs
            scripts/battle-bridge-backend-freshness-probe.test.mjs
            scripts/battle-bridge-recovery-mesh-installer.test.mjs
            tests/mission-operations-dashboard.test.mjs
          )
          for candidate in \
            scripts/battle-bridge-recovery-mesh.test.mjs \
            scripts/battle-bridge-github-command-mailbox.test.mjs \
            scripts/windows-launcher-supervisor-freshness.test.mjs \
            scripts/windows-launcher-defaults.test.mjs \
            tests/windows-launcher-ignition.test.mjs; do
            if [[ -f "$candidate" ]]; then tests+=("$candidate"); fi
          done
          node --test "${tests[@]}"

      - name: Revalidate main, commit cleanup and push normally
        shell: bash
        run: |
          set -euo pipefail
          main_head='245d53ba4e7caa91307859af6b7126b0a96b8faa'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$main_head"

          git commit -m 'Remove PR 1638 current-main sync bootstrap'
          git push origin HEAD:fix/battle-bridge-recovery-health-authority

          expected="$(
            printf '%s\n' \
              .github/workflows/battle-bridge-resilience-proof.yml \
              scripts/battle-bridge-backend-freshness-probe.mjs \
              scripts/battle-bridge-backend-freshness-probe.test.mjs \
              scripts/battle-bridge-recovery-mesh-installer.test.mjs \
              scripts/windows/install-stephanos-backend-autostart.ps1 \
              scripts/windows/probe-battle-bridge-recovery-mesh.ps1 \
              scripts/windows/start-stephanos-backend.ps1 \
              shared/agents/backendFreshnessSupervisor.mjs \
              stephanos-server/server.js \
              tests/mission-operations-dashboard.test.mjs |
              sort
          )"
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          test "$actual" = "$expected"
          echo "PR_1638_SYNCED_HEAD=$(git rev-parse HEAD)"
          echo 'PR_1638_CURRENT_MAIN_SYNC_COMPLETE=true'
