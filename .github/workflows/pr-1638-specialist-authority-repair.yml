name: PR 1638 Specialist Authority Repair

on:
  push:
    branches:
      - fix/battle-bridge-recovery-health-authority

permissions:
  contents: write

concurrency:
  group: pr-1638-specialist-authority-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/battle-bridge-recovery-health-authority
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact repair checkpoint
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='cd861988880a0b960172ec56fa4b12bb45acf9d3'
          expected_main='5272af4d998d3a4f82841ddf735d0850e97f09a6'
          workflow='.github/workflows/pr-1638-specialist-authority-repair.yml'
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git rev-parse origin/main)" = "$expected_main"
          test "$(git diff --name-only HEAD^..HEAD)" = "$workflow"

      - name: Apply bounded fixed-host repair
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          function replaceOnce(source, before, after, label) {
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: expected one seam, observed ${count}`);
            return source.replace(before, after);
          }

          const installerPath = 'scripts/windows/install-stephanos-backend-autostart.ps1';
          let installer = readFileSync(installerPath, 'utf8');
          installer = replaceOnce(
            installer,
            "$wscriptExe = Join-Path $env:SystemRoot 'System32\\wscript.exe'",
            "$wscriptExe = 'C:\\Windows\\System32\\wscript.exe'",
            'fixed wscript host',
          );
          writeFileSync(installerPath, installer, 'utf8');

          const starterPath = 'scripts/windows/start-stephanos-backend.ps1';
          let starter = readFileSync(starterPath, 'utf8');
          starter = replaceOnce(
            starter,
            "$ErrorActionPreference = 'Stop'\n",
            "$ErrorActionPreference = 'Stop'\n\n$gitExecutable = 'C:\\Program Files\\Git\\cmd\\git.exe'\n$npmCommand = 'C:\\Program Files\\nodejs\\npm.cmd'\n$canonicalNode = 'C:\\Program Files\\nodejs\\node.exe'\nforeach ($requiredExecutable in @($gitExecutable, $npmCommand, $canonicalNode)) {\n    if (-not (Test-Path -LiteralPath $requiredExecutable -PathType Leaf)) {\n        throw \"Required fixed backend executable is missing: $requiredExecutable\"\n    }\n}\n",
            'fixed executable constants',
          );
          starter = replaceOnce(
            starter,
            "    $name = ([string]$process.Name).ToLowerInvariant()\n    $commandLine = ([string]$process.CommandLine).Replace('\\', '/').ToLowerInvariant()\n    if ($name -notin @('node.exe', 'node')) { return $null }\n    if (-not $commandLine.Contains('stephanos-server/server.js')) { return $null }\n    return [PSCustomObject]@{ ProcessId = $processId }",
            "    $executable = [System.IO.Path]::GetFullPath([string]$process.ExecutablePath)\n    if (-not [string]::Equals($executable, $canonicalNode, [System.StringComparison]::OrdinalIgnoreCase)) { return $null }\n    $commandLine = ([string]$process.CommandLine).Trim()\n    $expectedQuotedCommand = \"`\"$canonicalNode`\" stephanos-server/server.js\"\n    $expectedUnquotedCommand = \"$canonicalNode stephanos-server/server.js\"\n    if (-not [string]::Equals($commandLine, $expectedQuotedCommand, [System.StringComparison]::OrdinalIgnoreCase) `\n        -and -not [string]::Equals($commandLine, $expectedUnquotedCommand, [System.StringComparison]::OrdinalIgnoreCase)) { return $null }\n    return [PSCustomObject]@{ ProcessId = $processId }",
            'exact backend listener identity',
          );
          starter = replaceOnce(
            starter,
            "$git = Get-Command git.exe -ErrorAction SilentlyContinue\nif (-not $git) { $git = Get-Command git -ErrorAction Stop }\n$branch = (& $git.Source -C $repoRoot branch --show-current).Trim()\n$headSha = (& $git.Source -C $repoRoot rev-parse HEAD).Trim().ToLowerInvariant()",
            "$branch = (& $gitExecutable -C $repoRoot branch --show-current).Trim()\n$headSha = (& $gitExecutable -C $repoRoot rev-parse HEAD).Trim().ToLowerInvariant()",
            'fixed git identity host',
          );
          starter = starter.replaceAll('& $git.Source -C $repoRoot', '& $gitExecutable -C $repoRoot');
          starter = replaceOnce(
            starter,
            "$npmCommand = if (Get-Command npm.cmd -ErrorAction SilentlyContinue) { 'npm.cmd' } elseif (Get-Command npm -ErrorAction SilentlyContinue) { 'npm' } else { $null }\nif (-not $npmCommand) {\n    Write-Log 'ERROR: npm was not found in PATH.'\n    exit 1\n}\n\n",
            '',
            'remove PATH npm selection',
          );
          writeFileSync(starterPath, starter, 'utf8');

          const testPath = 'scripts/battle-bridge-backend-freshness-probe.test.mjs';
          let tests = readFileSync(testPath, 'utf8');
          tests = replaceOnce(
            tests,
            "import assert from 'node:assert/strict';\n",
            "import assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\n",
            'test fs import',
          );
          tests += `\n\ntest('Windows backend recovery authority pins every executable and listener identity', async () => {\n  const installer = await readFile(new URL('./windows/install-stephanos-backend-autostart.ps1', import.meta.url), 'utf8');\n  const starter = await readFile(new URL('./windows/start-stephanos-backend.ps1', import.meta.url), 'utf8');\n  assert.match(installer, /\\$wscriptExe = 'C:\\\\Windows\\\\System32\\\\wscript\\.exe'/);\n  assert.doesNotMatch(installer, /env:SystemRoot/);\n  assert.match(starter, /\\$gitExecutable = 'C:\\\\Program Files\\\\Git\\\\cmd\\\\git\\.exe'/);\n  assert.match(starter, /\\$npmCommand = 'C:\\\\Program Files\\\\nodejs\\\\npm\\.cmd'/);\n  assert.match(starter, /\\$canonicalNode = 'C:\\\\Program Files\\\\nodejs\\\\node\\.exe'/);\n  assert.match(starter, /process\\.ExecutablePath/);\n  assert.match(starter, /StringComparison\\]::OrdinalIgnoreCase/);\n  assert.match(starter, /expectedQuotedCommand/);\n  assert.match(starter, /expectedUnquotedCommand/);\n  assert.doesNotMatch(starter, /Get-Command (?:git|npm)/i);\n  assert.doesNotMatch(starter, /npm was not found in PATH/i);\n});\n`;
          writeFileSync(testPath, tests, 'utf8');
          NODE

      - name: Remove bootstrap and verify exact source estate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr-1638-specialist-authority-repair.yml
          git add --all
          expected="$(printf '%s\n' \
            .github/workflows/battle-bridge-resilience-proof.yml \
            scripts/battle-bridge-backend-freshness-probe.mjs \
            scripts/battle-bridge-backend-freshness-probe.test.mjs \
            scripts/battle-bridge-recovery-mesh-installer.test.mjs \
            scripts/windows/install-stephanos-backend-autostart.ps1 \
            scripts/windows/probe-battle-bridge-recovery-mesh.ps1 \
            scripts/windows/start-stephanos-backend.ps1 \
            shared/agents/backendFreshnessSupervisor.mjs \
            stephanos-server/server.js \
            tests/mission-operations-dashboard.test.mjs | sort)"
          actual="$(git diff --cached --name-only origin/main | sort)"
          test "$actual" = "$expected"
          git diff --cached --check origin/main

      - name: Run focused recovery regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/battle-bridge-backend-freshness-probe.mjs
          node --check scripts/battle-bridge-backend-freshness-probe.test.mjs
          node --test \
            scripts/battle-bridge-backend-freshness-probe.test.mjs \
            scripts/battle-bridge-recovery-mesh-installer.test.mjs

      - name: Commit and push normally
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = '5272af4d998d3a4f82841ddf735d0850e97f09a6'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Pin Battle Bridge backend recovery executables'
          git push origin HEAD:fix/battle-bridge-recovery-health-authority
          echo "PR_1638_REPAIRED_HEAD=$(git rev-parse HEAD)"
