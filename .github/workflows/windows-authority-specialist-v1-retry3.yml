name: Windows Authority Specialist V1 Retry 3

on:
  push:
    branches:
      - fix/windows-authority-specialist-v1

permissions:
  contents: write

concurrency:
  group: windows-authority-specialist-v1-retry3
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact retry branch
        uses: actions/checkout@v4
        with:
          ref: fix/windows-authority-specialist-v1
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact branch and base identities
        shell: bash
        run: |
          set -euo pipefail
          exact_main='b83f7df46d9d52233f0b4f5dc2e034f50c0bae93'
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fix/windows-authority-specialist-v1)"
          test "$(git rev-parse origin/main)" = "$exact_main"
          git merge-base --is-ancestor "$exact_main" HEAD

      - name: Extract corrected constructor outside the repository
        shell: bash
        env:
          CONSTRUCTOR_DIR: ${{ runner.temp }}/windows-specialist-constructor
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/windows-authority-specialist-v1-bootstrap.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          names = [
              'Add the pure Windows authority specialist',
              'Wire deterministic specialist sealing into the trusted reviewer',
              'Remove bootstrap and verify exact six-file estate',
              'Parse and run specialist and protected boundary suites',
              'Prove the specialist against exact PR 1638 Windows sources',
              'Revalidate main, commit and push normally',
          ]
          old_main = '2c9d5666839a1b31205d397baec075e4e758784d'
          current_main = 'b83f7df46d9d52233f0b4f5dc2e034f50c0bae93'
          old_pr_head = '208df2ca79a9067c36ceccf099e84c9db1322212'
          current_pr_head = '81f01edde49ed73b60be9886c75eaddbc6101614'

          def extract(name: str) -> str:
              marker = f'      - name: {name}'
              start = lines.index(marker)
              run_index = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
              body = []
              for line in lines[run_index + 1:]:
                  if line.startswith('      - name: ') or line.startswith('      - uses: '):
                      break
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif line == '':
                      body.append('')
                  else:
                      raise SystemExit(f'unexpected indentation in {name}: {line!r}')
              return '\n'.join(body).rstrip() + '\n'

          out = Path(os.environ['CONSTRUCTOR_DIR'])
          out.mkdir(parents=True, exist_ok=False)
          for index, name in enumerate(names, start=1):
              script = extract(name)
              script = script.replace(old_main, current_main)
              script = script.replace(old_pr_head, current_pr_head)
              if name == 'Wire deterministic specialist sealing into the trusted reviewer':
                  old_start = script.index('const oldAdjudication = `')
                  old_end = script.index('const newAdjudication = `', old_start)
                  old_block = script[old_start:old_end]
                  old_block, count = re.subn(
                      r'(?m)^(\s*)baseSha,\n\1workflowRunId: runId,\n\1workflowRunAttempt: runAttempt,\n',
                      r'\1baseSha,\n',
                      old_block,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit(f'reviewer stale workflow identity fields changed: {count}')
                  script = script[:old_start] + old_block + script[old_end:]
              if name == 'Remove bootstrap and verify exact six-file estate':
                  old = 'rm -f .github/workflows/windows-authority-specialist-v1-bootstrap.yml'
                  new = 'rm -f .github/workflows/windows-authority-specialist-v1-bootstrap.yml .github/workflows/windows-authority-specialist-v1-retry.yml .github/workflows/windows-authority-specialist-v1-retry2.yml .github/workflows/windows-authority-specialist-v1-retry3.yml'
                  if script.count(old) != 1:
                      raise SystemExit('bootstrap removal seam changed')
                  script = script.replace(old, new)
              (out / f'{index:02d}.sh').write_text(script, encoding='utf-8')
          PY

      - name: Construct source and verify exact estate
        shell: bash
        env:
          CONSTRUCTOR_DIR: ${{ runner.temp }}/windows-specialist-constructor
        run: |
          set -euo pipefail
          bash "$CONSTRUCTOR_DIR/01.sh"
          bash "$CONSTRUCTOR_DIR/02.sh"
          bash "$CONSTRUCTOR_DIR/03.sh"

      - name: Run protected suites and exact PR 1638 specialist proof
        shell: bash
        env:
          CONSTRUCTOR_DIR: ${{ runner.temp }}/windows-specialist-constructor
        run: |
          set -euo pipefail
          bash "$CONSTRUCTOR_DIR/04.sh"
          bash "$CONSTRUCTOR_DIR/05.sh"

      - name: Publish exact six-file result
        shell: bash
        env:
          CONSTRUCTOR_DIR: ${{ runner.temp }}/windows-specialist-constructor
        run: |
          set -euo pipefail
          bash "$CONSTRUCTOR_DIR/06.sh"
