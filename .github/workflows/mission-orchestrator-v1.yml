name: Mission Orchestrator V1

on:
  pull_request:
    paths:
      - '.github/workflows/mission-orchestrator-v1.yml'
      - 'shared/agents/missionOrchestrator.mjs'
      - 'shared/agents/missionOrchestrator.test.mjs'
      - 'shared/agents/missionOrchestratorWorker.mjs'
      - 'shared/agents/missionOrchestratorWorker.test.mjs'
      - 'shared/agents/missionOrchestratorWorkerResult.mjs'
      - 'shared/agents/missionOrchestratorWorkerResult.test.mjs'
      - 'shared/agents/coBuilderOperationalPacket.mjs'
      - 'shared/agents/missionControllerCapacityRouterV1.mjs'
      - 'shared/agents/missionControllerCapacityRouterV1.test.mjs'
      - 'shared/agents/stephanosNativeCapacityRoutingAdmissionV1.mjs'
      - 'shared/agents/stephanosNativeCapacityRoutingAdmissionV1.security.test.mjs'
      - 'shared/runtime/missionOperationsProjection.mjs'
      - 'stephanos-server/services/missionOperationsService.js'
      - 'stephanos-server/services/missionOrchestrator*.js'
      - 'stephanos-server/services/missionWorker*.js'
      - 'stephanos-server/services/providerNeutralSourceBuilder*.js'
      - 'stephanos-server/services/providerNeutralTerminalOrphanReconciliationV1*.js'
      - 'stephanos-server/services/providerNeutralSourceMutationCheckpointV1*.js'
      - 'stephanos-server/services/sourceArtifactEscrowStore.js'
      - 'scripts/mission-orchestrator-worker.mjs'
      - 'scripts/mission-orchestrator-worker.test.mjs'
      - 'scripts/windows/*mission-orchestrator-worker*.ps1'
      - 'integrations/openclaw/stephanos-builder-provider/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse Mission Orchestrator source and worker
        run: |
          node --check shared/agents/missionOrchestrator.mjs
          node --check shared/agents/missionOrchestratorWorker.mjs
          node --check shared/agents/missionOrchestratorWorkerResult.mjs
          node --check shared/agents/stephanosNativeCapacityRoutingAdmissionV1.mjs
          node --check scripts/mission-orchestrator-worker.mjs
          node --check integrations/openclaw/stephanos-builder-provider/lib/oc1-repository-scout.mjs
          node --check integrations/openclaw/stephanos-builder-provider/lib/oc1-gateway-provider.mjs
      - name: Parse Mission Orchestrator durable runtime services
        run: |
          node --check stephanos-server/services/missionOrchestratorStore.js
          node --check stephanos-server/services/missionOrchestratorControlService.js
          node --check stephanos-server/services/missionOrchestratorWorkerService.js
          node --check stephanos-server/services/missionOrchestratorWorkerConsumer.js
          node --check stephanos-server/services/missionWorkerClaimOwnershipV1.js
          node --check stephanos-server/services/missionWorkerResultPublicationV1.js
          node --check stephanos-server/services/providerNeutralSourceBuilderService.js
          node --check stephanos-server/services/providerNeutralSourceBuilderActiveOrphanRecoveryV1.js
          node --check stephanos-server/services/providerNeutralTerminalOrphanReconciliationV1.js
          node --check stephanos-server/services/providerNeutralSourceMutationCheckpointV1.js
          node --check stephanos-server/services/sourceArtifactEscrowStore.js
          node --check stephanos-server/services/missionOrchestratorStephanosNativeExecutor.js
      - name: Parse Windows worker scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/windows/*mission-orchestrator-worker*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $errors += @($parseErrors)
          }
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
      - name: Run Mission Orchestrator lifecycle and worker planner tests
        run: node --test shared/agents/missionOrchestrator.test.mjs shared/agents/missionOrchestratorWorker.test.mjs shared/agents/missionOrchestratorWorkerResult.test.mjs
      - name: Run Stephanos-native routing trust regressions
        run: node --test shared/agents/missionControllerCapacityRouterV1.test.mjs shared/agents/stephanosNativeCapacityRoutingAdmissionV1.security.test.mjs
      - name: Run Mission Orchestrator durable runtime and worker queue tests
        run: node --test stephanos-server/services/missionOrchestratorStore.test.js stephanos-server/services/missionOrchestratorControlService.test.js stephanos-server/services/missionOrchestratorWorkerService.test.js stephanos-server/services/missionOrchestratorWorkerConsumer.test.js stephanos-server/services/missionWorkerClaimOwnershipV1.test.js stephanos-server/services/missionWorkerResultPublicationV1.test.js stephanos-server/services/missionWorkerOrphanClaimRecoveryV1.test.js stephanos-server/services/providerNeutralSourceBuilderLifecycle.test.js stephanos-server/services/providerNeutralSourceBuilderActiveOrphanRecoveryV1.test.js stephanos-server/services/providerNeutralSourceMutationCheckpointV1.test.js stephanos-server/services/providerNeutralTerminalOrphanReconciliationV1.test.js stephanos-server/services/missionOrchestratorGitHubInspection.test.js stephanos-server/services/missionOrchestratorStephanosNativeExecutor.test.js
      - name: Run persistent worker and OC1 provider adapter tests
        run: node --test scripts/mission-orchestrator-worker.test.mjs integrations/openclaw/stephanos-builder-provider/oc1-repository-scout.test.mjs integrations/openclaw/stephanos-builder-provider/oc1-gateway-provider.test.mjs
      - name: Run signed authorization and executor regressions
        run: node --test shared/agents/openClawGitHubAuthorization.test.mjs shared/agents/openClawGitHubOperator.test.mjs shared/agents/openClawGitHubExecutorPreflight.test.mjs
      - name: Run ownership and Mission Operations regression tests
        run: node --test shared/agents/coBuilderOperationalPacket.test.mjs tests/mission-operations-dashboard.test.mjs
