name: Build protected OpenClaw merge mailbox adapter

on:
  push:
    branches:
      - fix/protected-openclaw-merge-mailbox-adapter-v1
    paths:
      - .github/workflows/protected-openclaw-merge-mailbox-adapter-builder.yml
      - scripts/apply-protected-openclaw-merge-mailbox-adapter.mjs
      - scripts/repair-protected-merge-field-overlap.mjs

permissions:
  contents: write

jobs:
  build-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/protected-openclaw-merge-mailbox-adapter-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply bounded adapter patch
        run: node scripts/apply-protected-openclaw-merge-mailbox-adapter.mjs

      - name: Remove shared prNumber field collision
        run: node scripts/repair-protected-merge-field-overlap.mjs

      - name: Parse changed source
        run: |
          node --check shared/agents/battleBridgeGitHubCommandMailbox.mjs
          node --check shared/agents/protectedOpenClawMergeMailboxAdapter.mjs
          node --check shared/agents/openClawGitHubOperator.mjs
          node --check scripts/openclaw-github-operator.mjs

      - name: Run focused hostile regressions
        run: |
          node --test shared/agents/battleBridgeGitHubCommandMailboxProtectedMerge.test.mjs
          node --test shared/agents/battleBridgeGitHubCommandMailbox.test.mjs
          node --test shared/agents/openClawGitHubOperator.test.mjs shared/agents/openClawGitHubAuthorization.test.mjs shared/agents/openClawGitHubExecutorPreflight.test.mjs

      - name: Verify final estate
        run: |
          git diff --check
          test ! -e .github/workflows/protected-openclaw-merge-mailbox-adapter-builder.yml
          test ! -e scripts/apply-protected-openclaw-merge-mailbox-adapter.mjs
          test ! -e scripts/repair-protected-merge-field-overlap.mjs
          git status --short

      - name: Publish settled source
        run: |
          git config user.name "Cheekyfellastef"
          git config user.email "stef.stef@hotmail.co.uk"
          git add --all
          git commit -m "Add protected OpenClaw merge mailbox adapter"
          git push origin HEAD:fix/protected-openclaw-merge-mailbox-adapter-v1
