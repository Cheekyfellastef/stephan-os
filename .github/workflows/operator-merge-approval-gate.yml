name: Protected Operator Merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: protected-operator-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  operator-approval-head-status-pending:
    name: operator-approval-head-status-pending
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out trusted default-branch status publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish pending protected-approval status on the exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/operator-protected-merge-head-status-v1.mjs pending

  operator-approval-gate:
    name: operator-approval-gate
    needs: [operator-approval-head-status-pending]
    runs-on: ubuntu-latest
    environment:
      name: operator-merge-approval
    permissions:
      actions: read
      contents: read
      deployments: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted default-branch gate code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate protected environment, exact head, exact base, specialist review and threads
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/operator-protected-merge-gate-v2.mjs approve

  operator-approval-head-status-success:
    name: operator-approval-head-status-success
    needs: [operator-approval-gate]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out trusted default-branch status publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish successful protected-approval status on the exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/operator-protected-merge-head-status-v1.mjs success

  operator-approved-exact-head-merge:
    name: operator-approved-exact-head-merge
    needs: [operator-approval-head-status-success]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      deployments: read
      issues: read
      pull-requests: write
    steps:
      - name: Check out trusted default-branch merge code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Revalidate the unchanged exact head and exact base and merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/operator-protected-merge-gate-v2.mjs merge
