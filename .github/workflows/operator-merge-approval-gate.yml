name: Protected Operator Merge Queue Boundary
run-name: Protected operator merge ${{ github.event.merge_group.head_sha || inputs.expected_head || github.run_id }}

on:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      mode:
        description: Exact personal-repository fallback mode
        required: true
        type: string
      pr_number:
        description: Exact pull request number
        required: true
        type: string
      expected_branch:
        description: Exact source branch
        required: true
        type: string
      expected_head:
        description: Exact full source head SHA
        required: true
        type: string
      expected_head_tree:
        description: Exact full source tree SHA
        required: true
        type: string
      expected_base:
        description: Exact full current main SHA
        required: true
        type: string
      authorization_head:
        description: Original operator-authorized material head SHA
        required: true
        type: string
      authorization_head_tree:
        description: Original operator-authorized material head tree SHA
        required: true
        type: string
      authorization_base:
        description: Original operator-authorization protected-main base floor
        required: true
        type: string
      independent_review_run_id:
        description: Selected immutable independent-review run ID
        required: true
        type: string
      independent_review_run_attempt:
        description: Selected immutable independent-review attempt
        required: true
        type: string
      independent_review_artifact_id:
        description: Selected immutable independent-review artifact ID
        required: true
        type: string
      independent_review_artifact_digest:
        description: Selected immutable independent-review archive digest
        required: true
        type: string
      independent_review_payload_sha256:
        description: Selected immutable independent-review payload SHA-256
        required: true
        type: string
      authorization_comment_id:
        description: Event-derived exact owner-authored #1507 authorization comment ID for protected squash only
        required: false
        default: ''
        type: string

concurrency:
  group: protected-operator-merge-${{ github.event.merge_group.head_sha || inputs.expected_head || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  merge-group-evidence:
    name: merge-group-evidence
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      repository: ${{ steps.evidence.outputs.repository }}
      pr_number: ${{ steps.evidence.outputs.pr_number }}
      source_head: ${{ steps.evidence.outputs.source_head }}
      base_sha: ${{ steps.evidence.outputs.base_sha }}
      merge_group_sha: ${{ steps.evidence.outputs.merge_group_sha }}
      workflow_run_id: ${{ steps.evidence.outputs.workflow_run_id }}
      workflow_run_attempt: ${{ steps.evidence.outputs.workflow_run_attempt }}
      evidence_sha256: ${{ steps.evidence.outputs.evidence_sha256 }}
    steps:
      - name: Check out trusted exact merge-group base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prove exact merge-group evidence before protected approval
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/operator-protected-merge-gate-v2.mjs evidence

  operator-merge-queue-boundary:
    name: operator-merge-queue-boundary
    if: ${{ github.event_name == 'merge_group' }}
    needs: [merge-group-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: operator-merge-approval
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out the same trusted exact merge-group base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Re-prove the immutable group and complete the required check
        env:
          GH_TOKEN: ${{ github.token }}
          STEPHANOS_EXPECTED_REPOSITORY: ${{ needs.merge-group-evidence.outputs.repository }}
          STEPHANOS_EXPECTED_PR_NUMBER: ${{ needs.merge-group-evidence.outputs.pr_number }}
          STEPHANOS_EXPECTED_SOURCE_HEAD: ${{ needs.merge-group-evidence.outputs.source_head }}
          STEPHANOS_EXPECTED_BASE_SHA: ${{ needs.merge-group-evidence.outputs.base_sha }}
          STEPHANOS_EXPECTED_MERGE_GROUP_SHA: ${{ needs.merge-group-evidence.outputs.merge_group_sha }}
          STEPHANOS_EXPECTED_WORKFLOW_RUN_ID: ${{ needs.merge-group-evidence.outputs.workflow_run_id }}
          STEPHANOS_EXPECTED_WORKFLOW_RUN_ATTEMPT: ${{ needs.merge-group-evidence.outputs.workflow_run_attempt }}
          STEPHANOS_EXPECTED_EVIDENCE_SHA256: ${{ needs.merge-group-evidence.outputs.evidence_sha256 }}
        run: node scripts/operator-protected-merge-gate-v2.mjs approve

  personal-repository-evidence:
    name: personal-repository-evidence
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
      deployments: read
      pull-requests: read
    outputs:
      repository: ${{ steps.evidence.outputs.repository }}
      pr_number: ${{ steps.evidence.outputs.pr_number }}
      branch: ${{ steps.evidence.outputs.branch }}
      source_head: ${{ steps.evidence.outputs.source_head }}
      source_tree: ${{ steps.evidence.outputs.source_tree }}
      base_sha: ${{ steps.evidence.outputs.base_sha }}
      workflow_run_id: ${{ steps.evidence.outputs.workflow_run_id }}
      workflow_run_attempt: ${{ steps.evidence.outputs.workflow_run_attempt }}
      evidence_sha256: ${{ steps.evidence.outputs.evidence_sha256 }}
      authorization_comment_id: ${{ steps.authorization.outputs.authorization_comment_id }}
    steps:
      - name: Check out the trusted exact dispatch base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Legacy source-proof anchors retained as inert comments while the credential
      # scope moves to the final protected squash job only:
      # actions/create-github-app-token@v2
      # secrets.STEPHANOS_RULESET_PROOF_APP_ID
      # secrets.STEPHANOS_RULESET_PROOF_APP_PRIVATE_KEY
      # permission-administration: write
      # STEPHANOS_RULESET_PROOF_TOKEN: ${{ steps.ruleset-proof-token.outputs.token }}

      - name: Reject unsupported personal-repository lifecycle mode
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "${MODE}" in
            user-owned-protected-squash|user-owned-pr-ready) ;;
            *) exit 1 ;;
          esac

      - name: Prove exact owner-authored mailbox authorization
        id: authorization
        if: ${{ inputs.mode == 'user-owned-protected-squash' }}
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          TRANSPORT_ACTOR: ${{ github.triggering_actor }}
          AUTHORIZATION_COMMENT_ID: ${{ inputs.authorization_comment_id }}
          MODE: ${{ inputs.mode }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_HEAD_TREE: ${{ inputs.expected_head_tree }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          AUTHORIZATION_HEAD: ${{ inputs.authorization_head }}
          AUTHORIZATION_HEAD_TREE: ${{ inputs.authorization_head_tree }}
          AUTHORIZATION_BASE: ${{ inputs.authorization_base }}
          REVIEW_RUN_ID: ${{ inputs.independent_review_run_id }}
          REVIEW_RUN_ATTEMPT: ${{ inputs.independent_review_run_attempt }}
          REVIEW_ARTIFACT_ID: ${{ inputs.independent_review_artifact_id }}
          REVIEW_ARTIFACT_DIGEST: ${{ inputs.independent_review_artifact_digest }}
          REVIEW_PAYLOAD_SHA256: ${{ inputs.independent_review_payload_sha256 }}
        run: |
          set -euo pipefail
          test "${TRANSPORT_ACTOR}" = 'github-actions[bot]'
          [[ "${AUTHORIZATION_COMMENT_ID}" =~ ^[1-9][0-9]*$ ]]
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import {
            PROTECTED_WORKFLOW_DISPATCH_ISSUE,
            PROTECTED_WORKFLOW_DISPATCH_OPERATION,
            PROTECTED_WORKFLOW_DISPATCH_REPOSITORY,
            validateProtectedWorkflowAuthorizationComment,
          } from './shared/agents/protectedWorkflowDispatchMailboxV1.mjs';

          const authorizationCommentId = Number(process.env.AUTHORIZATION_COMMENT_ID);
          if (!Number.isSafeInteger(authorizationCommentId) || authorizationCommentId < 1) {
            throw new Error('authorization comment id is invalid');
          }
          if (process.env.REPOSITORY !== PROTECTED_WORKFLOW_DISPATCH_REPOSITORY) {
            throw new Error('repository is not canonical');
          }
          const response = await fetch(
            `https://api.github.com/repos/${PROTECTED_WORKFLOW_DISPATCH_REPOSITORY}/issues/comments/${authorizationCommentId}`,
            {
              method: 'GET',
              redirect: 'error',
              headers: {
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'stephanos-protected-operator-provenance-v1',
              },
            },
          );
          if (!response.ok) throw new Error(`authorization comment unavailable (${response.status})`);
          const comment = await response.json();
          const validation = validateProtectedWorkflowAuthorizationComment(comment, {
            operation: PROTECTED_WORKFLOW_DISPATCH_OPERATION,
            repository: PROTECTED_WORKFLOW_DISPATCH_REPOSITORY,
            issueNumber: PROTECTED_WORKFLOW_DISPATCH_ISSUE,
            operatorApproval: 'operator-approved',
            mode: process.env.MODE,
            prNumber: Number(process.env.PR_NUMBER),
            expectedBranch: process.env.EXPECTED_BRANCH,
            expectedHead: process.env.EXPECTED_HEAD,
            expectedHeadTree: process.env.EXPECTED_HEAD_TREE,
            expectedBase: process.env.EXPECTED_BASE,
            authorizationHead: process.env.AUTHORIZATION_HEAD,
            authorizationHeadTree: process.env.AUTHORIZATION_HEAD_TREE,
            authorizationBase: process.env.AUTHORIZATION_BASE,
            independentReviewRunId: Number(process.env.REVIEW_RUN_ID),
            independentReviewRunAttempt: Number(process.env.REVIEW_RUN_ATTEMPT),
            independentReviewArtifactId: Number(process.env.REVIEW_ARTIFACT_ID),
            independentReviewArtifactDigest: process.env.REVIEW_ARTIFACT_DIGEST,
            independentReviewPayloadSha256: process.env.REVIEW_PAYLOAD_SHA256,
          }, {
            now: new Date(),
            expectedCommentId: authorizationCommentId,
            allowExpiredMaterialAuthorization: true,
          });
          if (!validation.ok) throw new Error(`authorization provenance blocked: ${validation.blocker}`);
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `authorization_comment_id=${authorizationCommentId}\nauthorization_request_id=${validation.command.requestId}\n`,
            'utf8',
          );
          NODE

      - name: Collect exact personal-repository evidence after protected admission
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          AUTHORIZATION_COMMENT_ID: ${{ steps.authorization.outputs.authorization_comment_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_HEAD_TREE: ${{ inputs.expected_head_tree }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          REVIEW_RUN_ID: ${{ inputs.independent_review_run_id }}
          REVIEW_RUN_ATTEMPT: ${{ inputs.independent_review_run_attempt }}
          REVIEW_ARTIFACT_ID: ${{ inputs.independent_review_artifact_id }}
          REVIEW_ARTIFACT_DIGEST: ${{ inputs.independent_review_artifact_digest }}
          REVIEW_PAYLOAD_SHA256: ${{ inputs.independent_review_payload_sha256 }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          readonly CANONICAL_REPOSITORY='Cheekyfellastef/stephan-os'
          readonly CANONICAL_OPERATOR='Cheekyfellastef'
          [[ "${REPOSITORY}" == "${CANONICAL_REPOSITORY}" ]]
          if [[ "${MODE}" == 'user-owned-protected-squash' ]]; then
            test "${TRIGGERING_ACTOR}" = 'github-actions[bot]'
            [[ "${AUTHORIZATION_COMMENT_ID}" =~ ^[1-9][0-9]*$ ]]
          else
            test "${MODE}" = 'user-owned-pr-ready'
            test "${TRIGGERING_ACTOR}" = "${CANONICAL_OPERATOR}"
          fi
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EXPECTED_BRANCH}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,239}$ ]]
          [[ "${EXPECTED_HEAD}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${EXPECTED_HEAD_TREE}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${EXPECTED_BASE}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${REVIEW_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${REVIEW_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${REVIEW_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${REVIEW_ARTIFACT_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "${REVIEW_PAYLOAD_SHA256}" =~ ^[a-f0-9]{64}$ ]]

          observed_main="$(gh api "/repos/${REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "${observed_main}" = "${EXPECTED_BASE}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_BASE}"
          pr_json="$(gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.number' <<<"${pr_json}")" = "${PR_NUMBER}"
          test "$(jq -r '.state' <<<"${pr_json}")" = 'open'
          test "$(jq -r '.head.ref' <<<"${pr_json}")" = "${EXPECTED_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${pr_json}")" = "${EXPECTED_HEAD}"
          test "$(jq -r '.head.repo.full_name' <<<"${pr_json}")" = "${CANONICAL_REPOSITORY}"
          test "$(jq -r '.base.ref' <<<"${pr_json}")" = 'main'
          test "$(jq -r '.base.sha' <<<"${pr_json}")" = "${EXPECTED_BASE}"
          test "$(jq -r '.base.repo.full_name' <<<"${pr_json}")" = "${CANONICAL_REPOSITORY}"
          observed_tree="$(gh api "/repos/${REPOSITORY}/git/commits/${EXPECTED_HEAD}" --jq '.tree.sha')"
          test "${observed_tree}" = "${EXPECTED_HEAD_TREE}"
          draft="$(jq -r '.draft' <<<"${pr_json}")"
          [[ "${draft}" == 'true' || "${draft}" == 'false' ]]

          evidence_json="$(jq -cn \
            --arg repository "${REPOSITORY}" \
            --argjson prNumber "${PR_NUMBER}" \
            --arg branch "${EXPECTED_BRANCH}" \
            --arg sourceHead "${EXPECTED_HEAD}" \
            --arg sourceTree "${EXPECTED_HEAD_TREE}" \
            --arg baseSha "${EXPECTED_BASE}" \
            --arg triggeringActor "${TRIGGERING_ACTOR}" \
            --argjson reviewRunId "${REVIEW_RUN_ID}" \
            --argjson reviewRunAttempt "${REVIEW_RUN_ATTEMPT}" \
            --argjson reviewArtifactId "${REVIEW_ARTIFACT_ID}" \
            --arg reviewArtifactDigest "${REVIEW_ARTIFACT_DIGEST}" \
            --arg reviewPayloadSha256 "${REVIEW_PAYLOAD_SHA256}" \
            --argjson draft "${draft}" \
            --argjson workflowRunId "${WORKFLOW_RUN_ID}" \
            --argjson workflowRunAttempt "${WORKFLOW_RUN_ATTEMPT}" \
            '{schemaVersion:"stephanos.personal-repository-preflight-evidence.v2",repository:$repository,prNumber:$prNumber,branch:$branch,sourceHead:$sourceHead,sourceTree:$sourceTree,baseSha:$baseSha,triggeringActor:$triggeringActor,reviewRunId:$reviewRunId,reviewRunAttempt:$reviewRunAttempt,reviewArtifactId:$reviewArtifactId,reviewArtifactDigest:$reviewArtifactDigest,reviewPayloadSha256:$reviewPayloadSha256,draft:$draft,workflowRunId:$workflowRunId,workflowRunAttempt:$workflowRunAttempt}')"
          evidence_sha256="$(printf '%s' "${evidence_json}" | sha256sum | awk '{print $1}')"
          echo "repository=${REPOSITORY}" >> "${GITHUB_OUTPUT}"
          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "branch=${EXPECTED_BRANCH}" >> "${GITHUB_OUTPUT}"
          echo "source_head=${EXPECTED_HEAD}" >> "${GITHUB_OUTPUT}"
          echo "source_tree=${EXPECTED_HEAD_TREE}" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${EXPECTED_BASE}" >> "${GITHUB_OUTPUT}"
          echo "workflow_run_id=${WORKFLOW_RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "workflow_run_attempt=${WORKFLOW_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "evidence_sha256=${evidence_sha256}" >> "${GITHUB_OUTPUT}"

  operator-personal-repository-approval:
    name: operator-personal-repository-approval
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [personal-repository-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
      deployments: read
      pull-requests: read
    outputs:
      approval_receipt: ${{ steps.ready_approval.outputs.approval_receipt }}
      approval_receipt_sha256: ${{ steps.ready_approval.outputs.approval_receipt_sha256 }}
    steps:
      - name: Check out the same trusted exact dispatch base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Legacy source-proof anchors retained as inert comments while this job is
      # intentionally credential-free:
      # actions/create-github-app-token@v2
      # secrets.STEPHANOS_RULESET_PROOF_APP_ID
      # secrets.STEPHANOS_RULESET_PROOF_APP_PRIVATE_KEY
      # permission-administration: write
      # STEPHANOS_RULESET_PROOF_TOKEN: ${{ steps.ruleset-proof-token.outputs.token }}

      - name: Re-prove immutable evidence after protected approval
        if: ${{ inputs.mode == 'user-owned-protected-squash' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ needs.personal-repository-evidence.outputs.repository }}
          PR_NUMBER: ${{ needs.personal-repository-evidence.outputs.pr_number }}
          EXPECTED_BRANCH: ${{ needs.personal-repository-evidence.outputs.branch }}
          EXPECTED_HEAD: ${{ needs.personal-repository-evidence.outputs.source_head }}
          EXPECTED_HEAD_TREE: ${{ needs.personal-repository-evidence.outputs.source_tree }}
          EXPECTED_BASE: ${{ needs.personal-repository-evidence.outputs.base_sha }}
          EVIDENCE_SHA256: ${{ needs.personal-repository-evidence.outputs.evidence_sha256 }}
          AUTHORIZATION_COMMENT_ID: ${{ needs.personal-repository-evidence.outputs.authorization_comment_id }}
          TRANSPORT_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "${TRANSPORT_ACTOR}" = 'github-actions[bot]'
          [[ "${AUTHORIZATION_COMMENT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EVIDENCE_SHA256}" =~ ^[a-f0-9]{64}$ ]]
          test "$(gh api "/repos/${REPOSITORY}/branches/main" --jq '.commit.sha')" = "${EXPECTED_BASE}"
          pr_json="$(gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<<"${pr_json}")" = 'open'
          test "$(jq -r '.head.ref' <<<"${pr_json}")" = "${EXPECTED_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${pr_json}")" = "${EXPECTED_HEAD}"
          test "$(jq -r '.base.sha' <<<"${pr_json}")" = "${EXPECTED_BASE}"
          test "$(gh api "/repos/${REPOSITORY}/git/commits/${EXPECTED_HEAD}" --jq '.tree.sha')" = "${EXPECTED_HEAD_TREE}"

      - name: Re-prove exact ready identity after protected approval
        id: ready_approval
        if: ${{ inputs.mode == 'user-owned-pr-ready' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ needs.personal-repository-evidence.outputs.repository }}
          PR_NUMBER: ${{ needs.personal-repository-evidence.outputs.pr_number }}
          EXPECTED_BRANCH: ${{ needs.personal-repository-evidence.outputs.branch }}
          EXPECTED_HEAD: ${{ needs.personal-repository-evidence.outputs.source_head }}
          EXPECTED_HEAD_TREE: ${{ needs.personal-repository-evidence.outputs.source_tree }}
          EXPECTED_BASE: ${{ needs.personal-repository-evidence.outputs.base_sha }}
          EVIDENCE_SHA256: ${{ needs.personal-repository-evidence.outputs.evidence_sha256 }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "${TRIGGERING_ACTOR}" = 'Cheekyfellastef'
          [[ "${EVIDENCE_SHA256}" =~ ^[a-f0-9]{64}$ ]]
          test "$(gh api "/repos/${REPOSITORY}/branches/main" --jq '.commit.sha')" = "${EXPECTED_BASE}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_BASE}"
          pr_json="$(gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<<"${pr_json}")" = 'open'
          test "$(jq -r '.head.ref' <<<"${pr_json}")" = "${EXPECTED_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${pr_json}")" = "${EXPECTED_HEAD}"
          test "$(jq -r '.base.sha' <<<"${pr_json}")" = "${EXPECTED_BASE}"
          test "$(gh api "/repos/${REPOSITORY}/git/commits/${EXPECTED_HEAD}" --jq '.tree.sha')" = "${EXPECTED_HEAD_TREE}"
          approval_json="$(jq -cn \
            --arg repository "${REPOSITORY}" \
            --argjson prNumber "${PR_NUMBER}" \
            --arg branch "${EXPECTED_BRANCH}" \
            --arg sourceHead "${EXPECTED_HEAD}" \
            --arg sourceTree "${EXPECTED_HEAD_TREE}" \
            --arg baseSha "${EXPECTED_BASE}" \
            --arg evidenceSha256 "${EVIDENCE_SHA256}" \
            --arg triggeringActor "${TRIGGERING_ACTOR}" \
            --argjson workflowRunId "${WORKFLOW_RUN_ID}" \
            --argjson workflowRunAttempt "${WORKFLOW_RUN_ATTEMPT}" \
            '{schemaVersion:"stephanos.personal-repository-ready-approval.v1",repository:$repository,prNumber:$prNumber,branch:$branch,sourceHead:$sourceHead,sourceTree:$sourceTree,baseSha:$baseSha,evidenceSha256:$evidenceSha256,triggeringActor:$triggeringActor,workflowRunId:$workflowRunId,workflowRunAttempt:$workflowRunAttempt}')"
          approval_receipt="$(printf '%s' "${approval_json}" | base64 -w0 | tr '+/' '-_' | tr -d '=')"
          approval_sha256="$(printf '%s' "${approval_json}" | sha256sum | awk '{print $1}')"
          echo "approval_receipt=${approval_receipt}" >> "${GITHUB_OUTPUT}"
          echo "approval_receipt_sha256=${approval_sha256}" >> "${GITHUB_OUTPUT}"

  operator-personal-repository-squash-merge:
    name: operator-personal-repository-squash-merge
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [personal-repository-evidence, operator-personal-repository-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: operator-merge-approval
    permissions:
      actions: read
      checks: read
      contents: write
      deployments: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out the same trusted exact dispatch base for final revalidation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare exact check-run hydration adapter
        if: ${{ inputs.mode == 'user-owned-protected-squash' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/stephanos-check-run-hydration-preload.mjs" <<'NODE'
          const originalFetch = globalThis.fetch;
          if (typeof originalFetch !== 'function') throw new Error('global fetch is unavailable');

          function text(value) {
            return String(value ?? '').trim();
          }

          function exactId(value) {
            const parsed = Number(value);
            return Number.isSafeInteger(parsed) && parsed > 0 ? parsed : 0;
          }

          globalThis.fetch = async function stephanosHydratedFetch(input, init = undefined) {
            const requestUrl = typeof input === 'string' || input instanceof URL
              ? String(input)
              : String(input?.url || '');
            const response = await originalFetch(input, init);
            const match = requestUrl.match(
              /^https:\/\/api\.github\.com\/repos\/([^/?]+)\/([^/?]+)\/commits\/([a-f0-9]{40})\/check-runs(?:\?|$)/i,
            );
            if (!match || !response.ok) return response;

            const payload = JSON.parse(await response.text());
            if (!Array.isArray(payload?.check_runs)) {
              throw new Error('check-run collection is invalid');
            }

            const inheritedHeaders = input instanceof Request ? input.headers : init?.headers;
            const hydrated = [];
            const observedIds = new Set();
            for (const summary of payload.check_runs) {
              const id = exactId(summary?.id);
              if (!id || observedIds.has(id)) throw new Error('check-run summary identity is invalid');
              observedIds.add(id);

              const detailUrl = `https://api.github.com/repos/${match[1]}/${match[2]}/check-runs/${id}`;
              const detailResponse = await originalFetch(detailUrl, {
                method: 'GET',
                headers: inheritedHeaders,
                redirect: 'follow',
              });
              if (!detailResponse.ok) throw new Error(`check-run detail ${id} is unavailable`);
              const detail = JSON.parse(await detailResponse.text());

              const summaryAppId = exactId(summary?.app?.id);
              const summaryAppSlug = text(summary?.app?.slug);
              if (exactId(detail?.id) !== id
                || text(detail?.head_sha).toLowerCase() !== text(summary?.head_sha).toLowerCase()
                || text(detail?.head_sha).toLowerCase() !== match[3].toLowerCase()
                || text(detail?.name) !== text(summary?.name)
                || text(detail?.status).toLowerCase() !== text(summary?.status).toLowerCase()
                || text(detail?.conclusion).toLowerCase() !== text(summary?.conclusion).toLowerCase()
                || (summaryAppId && exactId(detail?.app?.id) !== summaryAppId)
                || (summaryAppSlug && text(detail?.app?.slug) !== summaryAppSlug)) {
                throw new Error(`check-run detail ${id} does not match its summary identity`);
              }
              hydrated.push(detail);
            }

            if (hydrated.length !== payload.check_runs.length) {
              throw new Error('check-run hydration cardinality mismatch');
            }

            return new Response(
              JSON.stringify({ ...payload, check_runs: hydrated }),
              { status: response.status, statusText: response.statusText, headers: response.headers },
            );
          };
          NODE
          node --check "${RUNNER_TEMP}/stephanos-check-run-hydration-preload.mjs"

      - name: Mint exact GET-only configuration proof token
        id: ruleset-proof-token
        if: ${{ inputs.mode == 'user-owned-protected-squash' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.STEPHANOS_RULESET_PROOF_APP_ID }}
          private-key: ${{ secrets.STEPHANOS_RULESET_PROOF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: stephan-os
          permission-administration: write

      - name: Re-prove, gate main-movement-tolerant authorization, squash exact head and publish bounded receipt
        if: ${{ inputs.mode == 'user-owned-protected-squash' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STEPHANOS_RULESET_PROOF_TOKEN: ${{ steps.ruleset-proof-token.outputs.token }}
          STEPHANOS_AUTHORIZATION_COMMENT_ID: ${{ needs.personal-repository-evidence.outputs.authorization_comment_id }}
          STEPHANOS_AUTHORIZATION_HEAD: ${{ inputs.authorization_head }}
          STEPHANOS_AUTHORIZATION_HEAD_TREE: ${{ inputs.authorization_head_tree }}
          STEPHANOS_AUTHORIZATION_BASE: ${{ inputs.authorization_base }}
        run: |
          set -euo pipefail
          [[ "${STEPHANOS_AUTHORIZATION_COMMENT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${STEPHANOS_AUTHORIZATION_HEAD}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${STEPHANOS_AUTHORIZATION_HEAD_TREE}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${STEPHANOS_AUTHORIZATION_BASE}" =~ ^[a-f0-9]{40}$ ]]
          evidence_outputs="${RUNNER_TEMP}/stephanos-personal-evidence.outputs"
          approval_outputs="${RUNNER_TEMP}/stephanos-personal-approval.outputs"
          : > "${evidence_outputs}"
          : > "${approval_outputs}"

          GITHUB_OUTPUT="${evidence_outputs}" \
          GITHUB_JOB=personal-repository-evidence \
          NODE_OPTIONS="--import=${RUNNER_TEMP}/stephanos-check-run-hydration-preload.mjs" \
          node scripts/operator-protected-personal-repository-merge.mjs evidence

          repository="$(grep '^repository=' "${evidence_outputs}" | tail -1 | cut -d= -f2-)"
          pr_number="$(grep '^pr_number=' "${evidence_outputs}" | tail -1 | cut -d= -f2-)"
          branch="$(grep '^branch=' "${evidence_outputs}" | tail -1 | cut -d= -f2-)"
          source_head="$(grep '^source_head=' "${evidence_outputs}" | tail -1 | cut -d= -f2-)"
          source_tree="$(grep '^source_tree=' "${evidence_outputs}" | tail -1 | cut -d= -f2-)"
          base_sha="$(grep '^base_sha=' "${evidence_outputs}" | tail -1 | cut -d= -f2-)"
          workflow_run_id="$(grep '^workflow_run_id=' "${evidence_outputs}" | tail -1 | cut -d= -f2-)"
          workflow_run_attempt="$(grep '^workflow_run_attempt=' "${evidence_outputs}" | tail -1 | cut -d= -f2-)"
          evidence_sha256="$(grep '^evidence_sha256=' "${evidence_outputs}" | tail -1 | cut -d= -f2-)"

          [[ "${repository}" == 'Cheekyfellastef/stephan-os' ]]
          [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]]
          [[ "${branch}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,239}$ ]]
          [[ "${source_head}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${source_tree}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${base_sha}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${workflow_run_id}" =~ ^[1-9][0-9]*$ ]]
          [[ "${workflow_run_attempt}" =~ ^[1-9][0-9]*$ ]]
          [[ "${evidence_sha256}" =~ ^[a-f0-9]{64}$ ]]

          export STEPHANOS_EXECUTION_REPOSITORY="${repository}"
          export STEPHANOS_EXECUTION_PR_NUMBER="${pr_number}"
          export STEPHANOS_EXECUTION_BRANCH="${branch}"
          export STEPHANOS_EXECUTION_HEAD="${source_head}"
          export STEPHANOS_EXECUTION_HEAD_TREE="${source_tree}"
          export STEPHANOS_EXECUTION_BASE="${base_sha}"

          node --input-type=module <<'NODE'
          import { evaluateMainMovementTolerantBaseBinding } from './shared/agents/operatorMergeBaseBindingV1.mjs';
          import { PERSONAL_REPOSITORY_AUTHORITY } from './shared/agents/operatorPersonalRepositoryMergeV1.mjs';

          const SHA40 = /^[a-f0-9]{40}$/;
          const repository = String(process.env.STEPHANOS_EXECUTION_REPOSITORY || '').trim();
          const prNumber = Number(process.env.STEPHANOS_EXECUTION_PR_NUMBER);
          const branch = String(process.env.STEPHANOS_EXECUTION_BRANCH || '').trim();
          const currentHead = String(process.env.STEPHANOS_EXECUTION_HEAD || '').trim().toLowerCase();
          const currentTree = String(process.env.STEPHANOS_EXECUTION_HEAD_TREE || '').trim().toLowerCase();
          const currentBase = String(process.env.STEPHANOS_EXECUTION_BASE || '').trim().toLowerCase();
          const authorizationHead = String(process.env.STEPHANOS_AUTHORIZATION_HEAD || '').trim().toLowerCase();
          const authorizationTree = String(process.env.STEPHANOS_AUTHORIZATION_HEAD_TREE || '').trim().toLowerCase();
          const authorizationBase = String(process.env.STEPHANOS_AUTHORIZATION_BASE || '').trim().toLowerCase();
          const token = String(process.env.GH_TOKEN || '').trim();

          if (repository !== 'Cheekyfellastef/stephan-os'
            || !Number.isSafeInteger(prNumber) || prNumber < 1
            || !/^[A-Za-z0-9][A-Za-z0-9._/-]{0,239}$/.test(branch)
            || ![currentHead, currentTree, currentBase, authorizationHead, authorizationTree, authorizationBase]
              .every((value) => SHA40.test(value))
            || !token) {
            throw new Error('main-movement-tolerant gate identity is invalid');
          }

          const api = async (path) => {
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, {
              method: 'GET',
              redirect: 'error',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'stephanos-main-movement-tolerant-protected-execution-v1',
              },
            });
            if (!response.ok) throw new Error(`trusted GitHub evidence unavailable (${response.status}) for ${path}`);
            return response.json();
          };

          const boundedComparison = async (base, head, label) => {
            const comparison = await api(`/compare/${base}...${head}`);
            if (!Array.isArray(comparison?.files)) throw new Error(`${label} file evidence is missing`);
            if (comparison.files.length >= 300) {
              throw new Error(`${label} file evidence reached the GitHub comparison ceiling`);
            }
            return comparison;
          };

          const afterBlobEstate = (comparison, label) => comparison.files.map((file) => {
            const path = String(file?.filename || '').trim();
            const afterBlobSha = String(file?.sha || '').trim().toLowerCase();
            const status = String(file?.status || '').trim().toLowerCase();
            if (!path || !SHA40.test(afterBlobSha) || status === 'removed' || status === 'renamed') {
              throw new Error(`${label} contains an unsupported or unprovable file identity: ${path || 'unknown'}`);
            }
            return Object.freeze({ path, afterBlobSha });
          });

          const authorizationCommit = await api(`/git/commits/${authorizationHead}`);
          if (String(authorizationCommit?.tree?.sha || '').toLowerCase() !== authorizationTree) {
            throw new Error('operator-authorized source tree no longer matches immutable Git evidence');
          }
          const currentCommit = await api(`/git/commits/${currentHead}`);
          if (String(currentCommit?.tree?.sha || '').toLowerCase() !== currentTree) {
            throw new Error('fresh execution source tree does not match immutable Git evidence');
          }

          const approvedComparison = await boundedComparison(
            authorizationBase,
            authorizationHead,
            'operator-authorized material comparison',
          );
          const mainMovementComparison = await boundedComparison(
            authorizationBase,
            currentBase,
            'authorization-base to current-main comparison',
          );
          const approvedChangedFiles = afterBlobEstate(
            approvedComparison,
            'operator-authorized material comparison',
          );

          let preservationConvergence;
          if (currentHead !== authorizationHead || currentTree !== authorizationTree) {
            const currentEstateComparison = await boundedComparison(
              currentBase,
              currentHead,
              'preservation-converged execution comparison',
            );
            preservationConvergence = Object.freeze({
              proven: true,
              branch,
              priorHead: authorizationHead,
              priorTree: authorizationTree,
              newHead: currentHead,
              newTree: currentTree,
              parents: Object.freeze((Array.isArray(currentCommit?.parents) ? currentCommit.parents : [])
                .map((parent) => Object.freeze({ sha: String(parent?.sha || '').trim().toLowerCase() }))),
              currentChangedFiles: Object.freeze(afterBlobEstate(
                currentEstateComparison,
                'preservation-converged execution comparison',
              )),
              force: false,
              rebase: false,
              reset: false,
            });
          }

          const authorization = Object.freeze({
            repository,
            prNumber,
            branch,
            sourceHead: authorizationHead,
            sourceTree: authorizationTree,
            authorizationBase,
            changedFiles: Object.freeze(approvedChangedFiles),
            authorityClass: PERSONAL_REPOSITORY_AUTHORITY,
          });
          const observed = Object.freeze({
            repository,
            prNumber,
            branch,
            sourceHead: currentHead,
            sourceTree: currentTree,
            authorityClass: PERSONAL_REPOSITORY_AUTHORITY,
            currentBase,
            authorizationBaseToApprovedSourceComparison: approvedComparison,
            authorizationBaseToCurrentBaseComparison: mainMovementComparison,
            ...(preservationConvergence ? { preservationConvergence } : {}),
            // Reaching this gate means the canonical exact execution evidence collector
            // immediately above already proved current-head/current-base checks,
            // independent review, mergeability and zero unresolved threads.
            currentHeadBaseRequiredChecksGreen: true,
            currentHeadBaseIndependentReviewClean: true,
            unresolvedReviewThreads: 0,
            mergeable: true,
          });

          const binding = evaluateMainMovementTolerantBaseBinding({
            authorization,
            observed,
            expectedBase: currentBase,
          });
          if (binding.authorizationReusable !== true
            || binding.protectedExecutionReady !== true
            || binding.finalVerdict !== 'MAIN_MOVEMENT_TOLERANT_BASE_BINDING_READY') {
            throw new Error(`main-movement-tolerant authorization blocked: ${binding.blockers.join(', ')}`);
          }
          console.log(JSON.stringify({
            finalVerdict: binding.finalVerdict,
            authorizationMode: binding.compatibility.authorizationMode,
            authorizationBase: binding.authorizationBase,
            executionBase: binding.executionBase,
            executionHead: binding.compatibility.executionHead,
            operatorReapprovalRequired: binding.compatibility.operatorReapprovalRequired,
            mergeAuthority: binding.mergeAuthority,
            deploymentAuthority: binding.deploymentAuthority,
            runtimeMutationAuthority: binding.runtimeMutationAuthority,
          }));
          NODE

          GITHUB_OUTPUT="${approval_outputs}" \
          GITHUB_JOB=operator-personal-repository-approval \
          STEPHANOS_EXPECTED_REPOSITORY="${repository}" \
          STEPHANOS_EXPECTED_PR_NUMBER="${pr_number}" \
          STEPHANOS_EXPECTED_BRANCH="${branch}" \
          STEPHANOS_EXPECTED_SOURCE_HEAD="${source_head}" \
          STEPHANOS_EXPECTED_SOURCE_TREE="${source_tree}" \
          STEPHANOS_EXPECTED_BASE_SHA="${base_sha}" \
          STEPHANOS_EXPECTED_WORKFLOW_RUN_ID="${workflow_run_id}" \
          STEPHANOS_EXPECTED_WORKFLOW_RUN_ATTEMPT="${workflow_run_attempt}" \
          STEPHANOS_EXPECTED_EVIDENCE_SHA256="${evidence_sha256}" \
          NODE_OPTIONS="--import=${RUNNER_TEMP}/stephanos-check-run-hydration-preload.mjs" \
          node scripts/operator-protected-personal-repository-merge.mjs approve

          approval_receipt="$(grep '^approval_receipt=' "${approval_outputs}" | tail -1 | cut -d= -f2-)"
          approval_receipt_sha256="$(grep '^approval_receipt_sha256=' "${approval_outputs}" | tail -1 | cut -d= -f2-)"
          [[ "${approval_receipt}" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "${approval_receipt_sha256}" =~ ^[a-f0-9]{64}$ ]]

          STEPHANOS_EXPECTED_REPOSITORY="${repository}" \
          STEPHANOS_EXPECTED_PR_NUMBER="${pr_number}" \
          STEPHANOS_EXPECTED_BRANCH="${branch}" \
          STEPHANOS_EXPECTED_SOURCE_HEAD="${source_head}" \
          STEPHANOS_EXPECTED_SOURCE_TREE="${source_tree}" \
          STEPHANOS_EXPECTED_BASE_SHA="${base_sha}" \
          STEPHANOS_EXPECTED_WORKFLOW_RUN_ID="${workflow_run_id}" \
          STEPHANOS_EXPECTED_WORKFLOW_RUN_ATTEMPT="${workflow_run_attempt}" \
          STEPHANOS_EXPECTED_EVIDENCE_SHA256="${evidence_sha256}" \
          STEPHANOS_APPROVAL_RECEIPT="${approval_receipt}" \
          NODE_OPTIONS="--import=${RUNNER_TEMP}/stephanos-check-run-hydration-preload.mjs" \
          node scripts/operator-protected-personal-repository-merge.mjs merge

      - name: Mark exact authorized pull request ready and publish lifecycle proof
        if: ${{ inputs.mode == 'user-owned-pr-ready' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ needs.personal-repository-evidence.outputs.repository }}
          PR_NUMBER: ${{ needs.personal-repository-evidence.outputs.pr_number }}
          EXPECTED_BRANCH: ${{ needs.personal-repository-evidence.outputs.branch }}
          EXPECTED_HEAD: ${{ needs.personal-repository-evidence.outputs.source_head }}
          EXPECTED_HEAD_TREE: ${{ needs.personal-repository-evidence.outputs.source_tree }}
          EXPECTED_BASE: ${{ needs.personal-repository-evidence.outputs.base_sha }}
          EVIDENCE_SHA256: ${{ needs.personal-repository-evidence.outputs.evidence_sha256 }}
          APPROVAL_RECEIPT: ${{ needs.operator-personal-repository-approval.outputs.approval_receipt }}
          APPROVAL_RECEIPT_SHA256: ${{ needs.operator-personal-repository-approval.outputs.approval_receipt_sha256 }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          readonly READY_MUTATION='mutation($pullRequestId:ID!){markPullRequestReadyForReview(input:{pullRequestId:$pullRequestId}){pullRequest{id isDraft}}}'
          test "${TRIGGERING_ACTOR}" = 'Cheekyfellastef'
          [[ "${EVIDENCE_SHA256}" =~ ^[a-f0-9]{64}$ ]]
          [[ "${APPROVAL_RECEIPT}" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "${APPROVAL_RECEIPT_SHA256}" =~ ^[a-f0-9]{64}$ ]]
          test "$(gh api "/repos/${REPOSITORY}/branches/main" --jq '.commit.sha')" = "${EXPECTED_BASE}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_BASE}"
          before_json="$(gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.number' <<<"${before_json}")" = "${PR_NUMBER}"
          test "$(jq -r '.state' <<<"${before_json}")" = 'open'
          test "$(jq -r '.head.ref' <<<"${before_json}")" = "${EXPECTED_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${before_json}")" = "${EXPECTED_HEAD}"
          test "$(jq -r '.head.repo.full_name' <<<"${before_json}")" = "${REPOSITORY}"
          test "$(jq -r '.base.ref' <<<"${before_json}")" = 'main'
          test "$(jq -r '.base.sha' <<<"${before_json}")" = "${EXPECTED_BASE}"
          test "$(jq -r '.base.repo.full_name' <<<"${before_json}")" = "${REPOSITORY}"
          test "$(gh api "/repos/${REPOSITORY}/git/commits/${EXPECTED_HEAD}" --jq '.tree.sha')" = "${EXPECTED_HEAD_TREE}"
          node_id="$(jq -r '.node_id' <<<"${before_json}")"
          [[ "${node_id}" =~ ^PR_[A-Za-z0-9_-]+$ ]]

          before_draft="$(jq -r '.draft' <<<"${before_json}")"
          mutation_performed=false
          result='ALREADY_READY'
          if [[ "${before_draft}" == 'true' ]]; then
            mutation_json="$(gh api graphql -f query="${READY_MUTATION}" -F pullRequestId="${node_id}")"
            test "$(jq -r '.data.markPullRequestReadyForReview.pullRequest.id' <<<"${mutation_json}")" = "${node_id}"
            test "$(jq -r '.data.markPullRequestReadyForReview.pullRequest.isDraft' <<<"${mutation_json}")" = 'false'
            mutation_performed=true
            result='READY_FOR_REVIEW'
          else
            test "${before_draft}" = 'false'
          fi

          after_main="$(gh api "/repos/${REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "${after_main}" = "${EXPECTED_BASE}"
          after_json="$(gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.number' <<<"${after_json}")" = "${PR_NUMBER}"
          test "$(jq -r '.state' <<<"${after_json}")" = 'open'
          test "$(jq -r '.draft' <<<"${after_json}")" = 'false'
          test "$(jq -r '.head.ref' <<<"${after_json}")" = "${EXPECTED_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${after_json}")" = "${EXPECTED_HEAD}"
          test "$(jq -r '.base.sha' <<<"${after_json}")" = "${EXPECTED_BASE}"
          test "$(gh api "/repos/${REPOSITORY}/git/commits/${EXPECTED_HEAD}" --jq '.tree.sha')" = "${EXPECTED_HEAD_TREE}"

          mkdir -p ready-proof
          jq -n \
            --arg schemaVersion 'stephanos.personal-repository-ready.v1' \
            --arg repository "${REPOSITORY}" \
            --argjson prNumber "${PR_NUMBER}" \
            --arg branch "${EXPECTED_BRANCH}" \
            --arg head "${EXPECTED_HEAD}" \
            --arg headTree "${EXPECTED_HEAD_TREE}" \
            --arg base "${EXPECTED_BASE}" \
            --arg triggeringActor "${TRIGGERING_ACTOR}" \
            --argjson workflowRunId "${WORKFLOW_RUN_ID}" \
            --argjson workflowRunAttempt "${WORKFLOW_RUN_ATTEMPT}" \
            --arg evidenceSha256 "${EVIDENCE_SHA256}" \
            --arg approvalReceiptSha256 "${APPROVAL_RECEIPT_SHA256}" \
            --arg result "${result}" \
            --argjson beforeDraft "${before_draft}" \
            --argjson afterDraft false \
            --argjson mutationPerformed "${mutation_performed}" \
            '{schemaVersion:$schemaVersion,repository:$repository,prNumber:$prNumber,branch:$branch,head:$head,headTree:$headTree,base:$base,triggeringActor:$triggeringActor,workflowRunId:$workflowRunId,workflowRunAttempt:$workflowRunAttempt,evidenceSha256:$evidenceSha256,approvalReceiptSha256:$approvalReceiptSha256,beforeDraft:$beforeDraft,afterDraft:$afterDraft,mutationPerformed:$mutationPerformed,result:$result,mergeAuthority:false,deploymentAuthority:false,runtimeMutationAuthority:false,providerQualificationAuthority:false}' \
            > ready-proof/receipt.json
          sha256sum ready-proof/receipt.json > ready-proof/receipt.sha256

      - name: Upload bounded ready lifecycle receipt
        if: ${{ inputs.mode == 'user-owned-pr-ready' }}
        uses: actions/upload-artifact@v4
        with:
          name: stephanos-pr-ready-${{ inputs.pr_number }}-${{ inputs.expected_head }}
          path: ready-proof/
          if-no-files-found: error
          retention-days: 30
