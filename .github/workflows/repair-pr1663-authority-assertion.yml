name: Repair PR 1663 Authority Assertion

on:
  push:
    branches:
      - fix/provider-neutral-independent-review-retry-v1
    paths:
      - .github/workflows/repair-pr1663-authority-assertion.yml

permissions:
  contents: write

concurrency:
  group: repair-pr1663-authority-assertion
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/provider-neutral-independent-review-retry-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact assertion repair
        run: node scripts/repair-pr1663-authority-assertion.mjs

      - name: Validate focused and full shared-agent gates
        run: |
          npm run stephanos:exact-head-review:test
          node --test shared/agents/independentReviewRetryPlanner.test.mjs
          node --check scripts/exact-head-review-dispatch.mjs
          node --check shared/agents/exactHeadReviewCoordinatorAuthority.mjs
          node --check shared/agents/independentReviewRetryPlanner.mjs
          node --check scripts/retry-independent-review.mjs
          node --test --test-reporter=dot shared/agents/*.test.mjs
          git diff --check

      - name: Remove temporary repair machinery
        run: |
          rm .github/workflows/repair-pr1663-authority-assertion.yml
          rm scripts/repair-pr1663-authority-assertion.mjs
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' '.github/workflows/repair-pr1663-authority-assertion.yml' 'scripts/repair-pr1663-authority-assertion.mjs' 'shared/agents/exactHeadReviewDispatchCoordinator.test.mjs' | sort)"
          test "$changed" = "$expected"

      - name: Commit bounded repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shared/agents/exactHeadReviewDispatchCoordinator.test.mjs
          git add -u .github/workflows/repair-pr1663-authority-assertion.yml scripts/repair-pr1663-authority-assertion.mjs
          git commit -m "Repair coordinator authority wiring assertion"
          git push origin HEAD:fix/provider-neutral-independent-review-retry-v1
