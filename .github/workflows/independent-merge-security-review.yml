name: Independent Merge Security Review
run-name: stephanos-independent-review-pr-${{ inputs.pr_number || github.event.pull_request.number }}-head-${{ inputs.source_head || github.event.pull_request.head.sha }}-binding-${{ inputs.handoff_binding_sha256 || 'legacy-pull-request-target' }}

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact pull request number admitted by the provider-neutral review coordinator
        required: true
        type: string
      source_head:
        description: Exact pull request head SHA admitted by the provider-neutral review coordinator
        required: true
        type: string
      base_sha:
        description: Exact canonical main SHA admitted by the provider-neutral review coordinator
        required: true
        type: string
      head_branch:
        description: Exact same-repository pull request head branch
        required: true
        type: string
      handoff_binding_sha256:
        description: Exact Stage-1 provider-neutral handoff binding SHA-256
        required: true
        type: string
      handoff_run_receipt_sha256:
        description: Exact immutable coordinator handoff-run receipt SHA-256
        required: true
        type: string

concurrency:
  group: independent-merge-security-review-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  independent-security-review:
    name: independent-security-review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Gate hosted review on its own GitHub installation API budget
        id: github_budget
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # GET /rate_limit does not spend primary/core quota. It can count
          # against secondary limits, so fail closed if it cannot be read.
          if ! quota="$(gh api rate_limit 2>/dev/null)"; then
            echo "::error::GITHUB_HOSTED_REVIEW_BUDGET_UNKNOWN"
            exit 1
          fi
          limit="$(jq -er '.resources.core.limit | select(type == "number" and . > 0)' <<< "$quota")" || exit 1
          remaining="$(jq -er '.resources.core.remaining | select(type == "number" and . >= 0)' <<< "$quota")" || exit 1
          reset="$(jq -er '.resources.core.reset | select(type == "number" and . > 0)' <<< "$quota")" || exit 1
          reserve=$(( (limit + 4) / 5 ))
          if (( reserve < 50 )); then reserve=50; fi
          echo "limit=$limit" >> "$GITHUB_OUTPUT"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          echo "reset_epoch=$reset" >> "$GITHUB_OUTPUT"
          echo "reserve=$reserve" >> "$GITHUB_OUTPUT"
          if (( remaining <= reserve )); then
            echo "::warning::GITHUB_HOSTED_REVIEW_BUDGET_HOLD remaining=$remaining limit=$limit reserve=$reserve reset_epoch=$reset"
            echo "GitHub hosted review is held: installation core REST budget under 20% reserve." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "GITHUB_HOSTED_REVIEW_BUDGET_READY remaining=$remaining limit=$limit reserve=$reserve reset_epoch=$reset"
      - name: Check out trusted exact-base reviewer
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        timeout-minutes: 4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Check out trusted current-main reviewer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        timeout-minutes: 4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        timeout-minutes: 4
        with:
          node-version: 24

      - name: Resolve exact immutable coordinator handoff artifact
        id: handoff
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/resolve-independent-review-handoff-artifact-v1.mjs

      - name: Download exact immutable coordinator handoff receipt
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        timeout-minutes: 4
        with:
          name: ${{ steps.handoff.outputs.artifact_name }}
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.handoff.outputs.coordinator_run_id }}

      - name: Build exact workflow-dispatch review preflight
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_REVIEW_HANDOFF_RUN_RECEIPT_PATH: ${{ runner.temp }}/independent-review-handoff-run-receipt.json
          STEPHANOS_INDEPENDENT_REVIEW_DISPATCH_PREFLIGHT_PATH: ${{ runner.temp }}/independent-review-workflow-dispatch-preflight.json
        run: node scripts/prepare-independent-review-workflow-dispatch-v1.mjs

      - name: Prove bounded specialist policy
        timeout-minutes: 5
        run: >-
          node --test
          shared/agents/windowsAuthoritySpecialistReviewV1.test.mjs
          shared/agents/windowsAuthoritySpecialistBoundaryV1.test.mjs
          shared/agents/qualifiedSpecialistReviewArtifactV1.test.mjs
          shared/agents/openClawBuilderProviderSpecialistReviewV1.test.mjs
          scripts/independent-merge-security-review-with-windows-specialist-v1.test.mjs
          scripts/independent-merge-security-review-with-openclaw-specialist-v1.test.mjs

      - name: Review the complete exact-head and exact-base diff without mutation authority
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          STEPHANOS_INDEPENDENT_REVIEW_ARTIFACT_PATH: ${{ runner.temp }}/independent-review-result.json
          STEPHANOS_INDEPENDENT_REVIEW_DISPATCH_PREFLIGHT_PATH: ${{ runner.temp }}/independent-review-workflow-dispatch-preflight.json
        run: node scripts/independent-merge-security-review-entry-v1.mjs

      - name: Upload the exact-run immutable independent review result
        id: independent-review-artifact
        if: ${{ always() && steps.github_budget.outcome == 'success' }}
        timeout-minutes: 4
        uses: actions/upload-artifact@v4
        with:
          name: stephanos-independent-review-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/independent-review-result.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false

      - name: Surface terminal exact-head findings or pre-artifact failure
        id: terminal_findings
        if: ${{ always() && steps.github_budget.outcome == 'success' }}
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_INDEPENDENT_REVIEW_ARTIFACT_PATH: ${{ runner.temp }}/independent-review-result.json
          STEPHANOS_TERMINAL_REVIEW_PR: ${{ inputs.pr_number || github.event.pull_request.number }}
          STEPHANOS_TERMINAL_REVIEW_BRANCH: ${{ inputs.head_branch || github.event.pull_request.head.ref }}
          STEPHANOS_TERMINAL_REVIEW_HEAD: ${{ inputs.source_head || github.event.pull_request.head.sha }}
          STEPHANOS_TERMINAL_REVIEW_BASE: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
        run: node scripts/publish-independent-review-terminal-findings-v1.mjs

      - name: Upload exact-run pre-artifact failure receipt
        if: ${{ always() && steps.terminal_findings.outputs.decision == 'PUBLISH_PRE_ARTIFACT_FAILURE_RECEIPT' }}
        timeout-minutes: 4
        uses: actions/upload-artifact@v4
        with:
          name: stephanos-independent-review-pre-artifact-failure-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/independent-review-pre-artifact-failure.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
