name: Independent Merge Security Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: independent-merge-security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  independent-security-review:
    name: independent-security-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted default-branch reviewer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Review the complete exact-head diff without mutation authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/independent-merge-security-review.mjs
