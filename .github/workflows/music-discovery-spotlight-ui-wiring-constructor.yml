name: Music Discovery Spotlight UI Wiring M2 Constructor

on:
  push:
    branches:
      - agent/music-discovery-spotlight-ui-wiring-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  construct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/music-discovery-spotlight-ui-wiring-v1

      - name: Verify exact construction basis
        shell: bash
        run: |
          set -euo pipefail
          base="7f9d76a3bd472d4e451a25a2553b530bb386c357"
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git rev-parse HEAD:apps/music-tile/main.js)" = "e2c34ae964b9d7ca18a4679b8e1dcd90efd73188"
          test "$(git rev-parse HEAD:apps/music-tile/engine/musicDiscoverySpotlightPresenter.js)" = "7181670ab34ee92ef95ecfc8347743dc0dbad7a7"
          test "$(git diff --name-only "$base" HEAD)" = ".github/workflows/music-discovery-spotlight-ui-wiring-constructor.yml"

      - name: Apply bounded Music UI wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/music-tile/main.js')
          source = path.read_text(encoding='utf-8')

          import_anchor = "import { applyTasteTeachingContribution, buildConversationAiPayload, buildMusicConversationPlan, removeTasteTeachingContribution, retainConversationTeachingHistory, summarizeTasteEvidence } from './engine/musicConversationPlanner.js';\n"
          presenter_import = "import { buildMusicDiscoverySpotlightView } from './engine/musicDiscoverySpotlightPresenter.js';\n"
          if presenter_import in source:
              raise SystemExit('presenter import already present; refusing duplicate wiring')
          if source.count(import_anchor) != 1:
              raise SystemExit('music conversation import anchor drifted')
          source = source.replace(import_anchor, import_anchor + presenter_import, 1)

          function_anchor = 'function renderMusicIntelligenceCentre() {'
          helper = '''function buildMusicDiscoverySpotlightPresentation(artistName) {
            return buildMusicDiscoverySpotlightView({
              surface: 'DISCOVERY_SPOTLIGHT',
              artistName: String(artistName || '').trim(),
              maxCards: 4,
              catalogueEvidence: [],
              tasteEvidence: [],
            });
          }

          function renderMusicDiscoverySpotlightConnections(view = {}) {
            const status = String(view.status || 'EVIDENCE_UNAVAILABLE');
            const cards = Array.isArray(view.cards) ? view.cards : [];
            if (status !== 'READY' || !cards.length) {
              return `<section class="music-card discovery-spotlight-connections" data-music-discovery-status="${escapeHtml(status)}">
                <div class="music-card-header"><strong>Discovery connections</strong><span class="music-badge">evidence unavailable</span></div>
                <div class="music-card-meta">${escapeHtml(view.message || 'No governed discovery connection is available yet.')}</div>
              </section>`;
            }
            return `<section class="discovery-spotlight-connections" data-music-discovery-status="READY">
              <div class="music-card-header"><div><strong>${escapeHtml(view.headline || 'Discovery connections')}</strong><div class="music-card-meta">${escapeHtml(view.message || '')}</div></div><span class="music-badge">${cards.length} connection${cards.length === 1 ? '' : 's'}</span></div>
              ${cards.map((card) => `<article class="music-card discovery-spotlight-connection" data-evidence-class="${escapeHtml(card.evidenceClass || 'EVIDENCE_UNAVAILABLE')}">
                <div class="music-card-header"><strong>${escapeHtml(card.title || card.artistName || 'Discovery connection')}</strong><span class="music-badge">${escapeHtml(card.evidenceLabel || 'Evidence unavailable')}</span></div>
                <div class="music-card-meta">${escapeHtml(card.whyInteresting || 'Evidence unavailable.')}</div>
                <div class="music-card-meta">${escapeHtml(card.evidenceReason || 'No stronger evidence is available yet.')}</div>
                <div class="actions"><button type="button" data-action="spotlight-search-catalogue" data-query="${escapeHtml(card.action?.query || '')}"${card.action?.type === 'SEARCH_EXISTING_CATALOGUE' && card.action?.query ? '' : ' disabled'}>Search existing catalogue</button></div>
              </article>`).join('')}
            </section>`;
          }

          '''
          if source.count(function_anchor) != 1:
              raise SystemExit('Music Intelligence render anchor drifted')
          source = source.replace(function_anchor, helper + function_anchor, 1)

          start = source.index(function_anchor)
          end_marker = '\n}\n\nfunction enhanceListeningDeckCards()'
          end = source.index(end_marker, start)
          render_block = source[start:end]
          spotlight_anchor = '  intelligenceUi.spotlight.innerHTML = `\n'
          if render_block.count(spotlight_anchor) != 1:
              raise SystemExit('spotlight markup anchor drifted')
          render_block = render_block.replace(
              spotlight_anchor,
              "  const discoverySpotlight = buildMusicDiscoverySpotlightPresentation(artist);\n  const discoveryConnectionsMarkup = renderMusicDiscoverySpotlightConnections(discoverySpotlight);\n\n" + spotlight_anchor,
              1,
          )
          closing = '    </article>`;'
          if render_block.count(closing) != 1:
              raise SystemExit('spotlight closing anchor drifted')
          render_block = render_block.replace(closing, '    </article>\n    ${discoveryConnectionsMarkup}`;', 1)
          source = source[:start] + render_block + source[end:]

          old_listener = '''  intelligenceUi.spotlight?.addEventListener('click', (event) => {
            const addButton = event.target.closest('[data-action="spotlight-add"]');
            if (!addButton) return;
            const track = (state.candidates || []).find((candidate) => `${candidate.id}` === `${addButton.dataset.id}`);
            if (!track) return;
            if (!state.listeningDeck.some((candidate) => `${candidate.id}` === `${track.id}`)) {
              state.listeningDeck.unshift(track);
              ui.status.textContent = `${track.title || 'Track'} added to your Listening Room.`;
              saveState();
              renderAll();
            }
          });'''
          new_listener = '''  intelligenceUi.spotlight?.addEventListener('click', (event) => {
            const searchButton = event.target.closest('[data-action="spotlight-search-catalogue"]');
            if (searchButton) {
              const query = String(searchButton.dataset.query || '').trim();
              if (!query) return;
              if (intelligenceUi.nativeSearchInput) {
                intelligenceUi.nativeSearchInput.value = query;
                intelligenceUi.nativeSearchInput.focus();
              }
              void performNativeCatalogSearch(query, { operationGeneration: musicOperationGeneration });
              return;
            }
            const addButton = event.target.closest('[data-action="spotlight-add"]');
            if (!addButton) return;
            const track = (state.candidates || []).find((candidate) => `${candidate.id}` === `${addButton.dataset.id}`);
            if (!track) return;
            if (!state.listeningDeck.some((candidate) => `${candidate.id}` === `${track.id}`)) {
              state.listeningDeck.unshift(track);
              ui.status.textContent = `${track.title || 'Track'} added to your Listening Room.`;
              saveState();
              renderAll();
            }
          });'''
          if source.count(old_listener) != 1:
              raise SystemExit('spotlight delegated listener anchor drifted')
          source = source.replace(old_listener, new_listener, 1)
          path.write_text(source, encoding='utf-8')
          PY

          cat > tests/music-discovery-spotlight-ui-wiring.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          import { buildMusicDiscoverySpotlightView } from '../apps/music-tile/engine/musicDiscoverySpotlightPresenter.js';

          const source = await readFile(new URL('../apps/music-tile/main.js', import.meta.url), 'utf8');

          test('wires the merged Discovery Spotlight presenter into the existing Music Intelligence surface', () => {
            assert.match(source, /import \{ buildMusicDiscoverySpotlightView \} from '\.\/engine\/musicDiscoverySpotlightPresenter\.js';/);
            assert.match(source, /buildMusicDiscoverySpotlightView\(\{[\s\S]*surface: 'DISCOVERY_SPOTLIGHT'/);
            assert.match(source, /intelligenceUi\.spotlight\.innerHTML =/);
            assert.match(source, /data-music-discovery-status=/);
            assert.match(source, /data-evidence-class=/);
            assert.match(source, /escapeHtml\(card\.evidenceLabel/);
            assert.match(source, /escapeHtml\(card\.whyInteresting/);
            assert.match(source, /escapeHtml\(card\.evidenceReason/);
          });

          test('discovery connection actions delegate to the existing native catalogue path only', () => {
            const start = source.indexOf('const searchButton = event.target.closest');
            const end = source.indexOf('const addButton = event.target.closest', start);
            assert.ok(start > 0 && end > start);
            const actionBlock = source.slice(start, end);
            assert.match(actionBlock, /data-action="spotlight-search-catalogue"/);
            assert.match(actionBlock, /performNativeCatalogSearch\(query, \{ operationGeneration: musicOperationGeneration \}\)/);
            assert.doesNotMatch(actionBlock, /requestNativeCatalogSearch|fetch\(|askMusicAi|state\.listeningDeck|saveState\(/);
            assert.match(source, /findExistingCatalogTrack\(state\.listeningDeck, result\)/);
            assert.match(source, /insertListeningDeckCardWithoutPlaybackReset\(track\)/);
          });

          test('presenter continuity remains non-mutating and unavailable evidence stays explicit', () => {
            const ready = buildMusicDiscoverySpotlightView({
              surface: 'DISCOVERY_SPOTLIGHT',
              artistName: 'Anyma',
              maxCards: 4,
              catalogueEvidence: [],
              tasteEvidence: [],
            });
            assert.equal(ready.status, 'READY');
            assert.ok(ready.cards.length > 0 && ready.cards.length <= 4);
            assert.equal(ready.cards.every((card) => card.action.type === 'SEARCH_EXISTING_CATALOGUE'), true);
            assert.deepEqual(ready.continuityPolicy, {
              replacesPlayerDom: false,
              changesCurrentTrack: false,
              changesRatings: false,
              changesTeachingState: false,
            });

            const unavailable = buildMusicDiscoverySpotlightView({
              surface: 'DISCOVERY_SPOTLIGHT',
              artistName: 'Definitely Unknown Artist 271828',
              maxCards: 4,
              catalogueEvidence: [],
              tasteEvidence: [],
            });
            assert.equal(unavailable.status, 'EVIDENCE_UNAVAILABLE');
            assert.deepEqual(unavailable.cards, []);
          });

          test('repeated renders replace the same spotlight connection section rather than append duplicate owners', () => {
            const renderStart = source.indexOf('function renderMusicIntelligenceCentre()');
            const renderEnd = source.indexOf('function enhanceListeningDeckCards()', renderStart);
            const renderBlock = source.slice(renderStart, renderEnd);
            assert.equal((renderBlock.match(/intelligenceUi\.spotlight\.innerHTML =/g) || []).length, 1);
            assert.equal((renderBlock.match(/buildMusicDiscoverySpotlightPresentation\(artist\)/g) || []).length, 1);
            assert.match(source, /findExistingCatalogTrack\(state\.listeningDeck, result\)/);
          });
          EOF

          cat > docs/architecture/music-discovery-spotlight-ui-wiring-v1.md <<'EOF'
          # Music Discovery Spotlight UI Wiring V1

          ## Purpose

          This bounded #1624 M2 slice connects the already-merged Music Discovery Spotlight presenter to the existing Music Intelligence Centre. It does not create another tile, player, catalogue provider, AI router, memory store, worker, scheduler, API route or runtime lane.

          ## Existing surface and action canon

          The implementation renders presenter output inside the existing `#discovery-spotlight` surface. The existing doorway-track card remains the primary recommendation; a bounded Discovery Connections section is composed below it in the same surface.

          Every discovery connection retains the presenter's explicit evidence class and reason. `LOCAL_SEED_INFERENCE` remains visibly inference, `OPERATOR_TASTE_EVIDENCE` remains distinct from external verification, and `EVIDENCE_UNAVAILABLE` is rendered honestly. This slice supplies no new catalogue relationship evidence, so it cannot upgrade local hints into external facts.

          `SEARCH_EXISTING_CATALOGUE` buttons delegate to the existing `performNativeCatalogSearch()` path. The existing native catalogue adapters, result rendering, stable identity check and `insertListeningDeckCardWithoutPlaybackReset()` path remain the only way those search results enter the Listening Room.

          ## Continuity boundary

          Rendering discovery connections mutates no Music state. Searching is ephemeral and does not change Taste DNA, ratings, Teach/Forget state, conversation state, the current track or the mounted player. Selecting an actual catalogue result continues through the existing duplicate check and no-playback-reset insertion path.

          The presenter continuity contract remains:

          ```text
          replacesPlayerDom=false
          changesCurrentTrack=false
          changesRatings=false
          changesTeachingState=false
          ```

          Spotify/provider catalogue payloads are not sent to AI by this slice. No account, credential, autoplay, provider-write, deployment, merge or runtime authority is added.

          ## Source proof

          The bounded constructor requires the exact protected base and exact pre-change Music host/presenter blobs. The final PR estate is exactly:

          1. `apps/music-tile/main.js`
          2. `tests/music-discovery-spotlight-ui-wiring.test.mjs`
          3. `docs/architecture/music-discovery-spotlight-ui-wiring-v1.md`

          Focused proof covers presenter/connection contracts, existing native catalogue UI, conversational continuity, Music Intelligence Centre regressions and the new wiring contract.

          ## Acceptance boundary

          This is standard-risk browser-visible source work. Independent exact-head review and separate operator merge approval remain required. Source merge alone is not live acceptance. The existing #1507/#1622 Battle Bridge lane must subsequently prove exact merged-main sync/build/served head plus desktop/iPad and real Windows Edge search, card insertion, playback/rating continuity, conversation, Teach, Forget and Reset before #1624 may be called complete/live.
          EOF

      - name: Focused source proof
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/music-tile/main.js
          node --test \
            tests/music-discovery-connections.test.mjs \
            tests/music-discovery-spotlight-presenter.test.mjs \
            tests/music-discovery-spotlight-ui-wiring.test.mjs \
            tests/music-tile-native-catalog-ui.test.mjs \
            tests/music-tile-conversation-intelligence.test.mjs \
            tests/music-intelligence-centre-vnext.test.mjs
          git diff --check

      - name: Verify exact final estate and publish source commit
        shell: bash
        run: |
          set -euo pipefail
          base="7f9d76a3bd472d4e451a25a2553b530bb386c357"
          workflow=".github/workflows/music-discovery-spotlight-ui-wiring-constructor.yml"
          rm "$workflow"
          git diff --check "$base"
          expected="$(printf '%s\n' \
            'apps/music-tile/main.js' \
            'docs/architecture/music-discovery-spotlight-ui-wiring-v1.md' \
            'tests/music-discovery-spotlight-ui-wiring.test.mjs' | sort)"
          actual="$(git diff --name-only "$base" | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire Music Discovery Spotlight into existing catalogue flow'
          git push origin HEAD:agent/music-discovery-spotlight-ui-wiring-v1
