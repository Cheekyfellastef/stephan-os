name: Shrink protected OpenClaw merge adapter scope

on:
  push:
    branches:
      - fix/protected-openclaw-merge-mailbox-adapter-v1
    paths:
      - .github/workflows/shrink-protected-openclaw-merge-adapter.yml
      - scripts/shrink-protected-openclaw-merge-adapter.mjs

permissions:
  contents: write

jobs:
  shrink-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/protected-openclaw-merge-mailbox-adapter-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore generic OpenClaw executor from exact base
        run: |
          git checkout c82bfdd1639558ecb24f75d5a845f6ce39ba9af0 -- \
            scripts/openclaw-github-operator.mjs \
            scripts/stephanos-issue-openclaw-github-authorization.mjs \
            shared/agents/openClawGitHubOperator.mjs
      - name: Shrink bounded adapter scope
        run: node scripts/shrink-protected-openclaw-merge-adapter.mjs
      - name: Parse final source
        run: |
          node --check shared/agents/battleBridgeGitHubCommandMailbox.mjs
          node --check shared/agents/protectedOpenClawMergeMailboxAdapter.mjs
      - name: Run final focused suites
        run: |
          node --test shared/agents/battleBridgeGitHubCommandMailboxProtectedMerge.test.mjs
          node --test shared/agents/battleBridgeGitHubCommandMailbox.test.mjs
          node --test shared/agents/openClawGitHubOperator.test.mjs shared/agents/openClawGitHubAuthorization.test.mjs shared/agents/openClawGitHubExecutorPreflight.test.mjs
      - name: Verify exact three-file estate
        run: |
          git diff --check
          test ! -e .github/workflows/shrink-protected-openclaw-merge-adapter.yml
          test ! -e scripts/shrink-protected-openclaw-merge-adapter.mjs
          test "$(git diff --name-only c82bfdd1639558ecb24f75d5a845f6ce39ba9af0...HEAD | wc -l)" -ge 3
      - name: Publish narrowed source
        run: |
          git config user.name "Cheekyfellastef"
          git config user.email "stef.stef@hotmail.co.uk"
          git add --all
          git commit -m "Keep protected merge logic inside bounded mailbox adapter"
          git push origin HEAD:fix/protected-openclaw-merge-mailbox-adapter-v1
