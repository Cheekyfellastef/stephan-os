name: Battle Bridge Worker Watchdog Proof

on:
  pull_request:
    paths:
      - 'scripts/battle-bridge-worker-watchdog*.mjs'
      - 'scripts/battle-bridge-github-command-mailbox*.mjs'
      - 'scripts/chatgpt-shared-workspace-github-relay*.mjs'
      - 'scripts/remote-codex-task-visibility-observer*.mjs'
      - 'scripts/remote-codex-github-mirror-publisher*.mjs'
      - 'shared/agents/battleBridgeGitHubCommandMailbox*.mjs'
      - 'shared/agents/stephanosCapabilityRegistry*.mjs'
      - 'shared/agents/chatGptParticipantBridgeV1*.mjs'
      - 'shared/agents/remoteCodexTaskVisibility*.mjs'
      - 'scripts/mission-orchestrator-worker-heartbeat*.mjs'
      - 'scripts/mission-orchestrator-worker-supervised*.mjs'
      - 'scripts/windows/*worker-watchdog.ps1'
      - 'scripts/windows/start-mission-orchestrator-worker.ps1'
      - '.github/workflows/battle-bridge-worker-watchdog-proof.yml'
  push:
    paths:
      - 'scripts/battle-bridge-worker-watchdog*.mjs'
      - 'scripts/battle-bridge-github-command-mailbox*.mjs'
      - 'scripts/chatgpt-shared-workspace-github-relay*.mjs'
      - 'scripts/remote-codex-task-visibility-observer*.mjs'
      - 'scripts/remote-codex-github-mirror-publisher*.mjs'
      - 'shared/agents/battleBridgeGitHubCommandMailbox*.mjs'
      - 'shared/agents/stephanosCapabilityRegistry*.mjs'
      - 'shared/agents/chatGptParticipantBridgeV1*.mjs'
      - 'shared/agents/remoteCodexTaskVisibility*.mjs'
      - 'scripts/mission-orchestrator-worker-heartbeat*.mjs'
      - 'scripts/mission-orchestrator-worker-supervised*.mjs'
      - 'scripts/windows/*worker-watchdog.ps1'
      - 'scripts/windows/start-mission-orchestrator-worker.ps1'
      - '.github/workflows/battle-bridge-worker-watchdog-proof.yml'

permissions:
  contents: read

jobs:
  worker-watchdog-proof:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse Node sources
        run: |
          node --check scripts/battle-bridge-worker-watchdog-policy.mjs
          node --check scripts/battle-bridge-worker-watchdog.mjs
          node --check scripts/battle-bridge-worker-watchdog-acceptance.mjs
          node --check scripts/battle-bridge-worker-watchdog-runner.mjs
          node --check scripts/battle-bridge-github-command-mailbox.mjs
          node --check scripts/chatgpt-shared-workspace-github-relay.mjs
          node --check scripts/remote-codex-task-visibility-observer.mjs
          node --check scripts/remote-codex-github-mirror-publisher.mjs
          node --check shared/agents/battleBridgeGitHubCommandMailbox.mjs
          node --check shared/agents/battleBridgeGitHubCommandMailboxAdmin.mjs
          node --check shared/agents/stephanosCapabilityRegistry.mjs
          node --check shared/agents/chatGptParticipantBridgeV1.mjs
          node --check shared/agents/remoteCodexTaskVisibility.mjs
          node --check scripts/mission-orchestrator-worker-heartbeat.mjs
          node --check scripts/mission-orchestrator-worker-supervised.mjs

      - name: Parse Windows watchdog scripts
        shell: pwsh
        run: |
          $allErrors = @()
          @(
            'scripts/windows/install-battle-bridge-worker-watchdog.ps1',
            'scripts/windows/status-battle-bridge-worker-watchdog.ps1',
            'scripts/windows/uninstall-battle-bridge-worker-watchdog.ps1',
            'scripts/windows/probe-mission-orchestrator-worker-watchdog.ps1',
            'scripts/windows/start-mission-orchestrator-worker.ps1'
          ) | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $_), [ref]$tokens, [ref]$parseErrors) | Out-Null
            $allErrors += $parseErrors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Test watchdog policy
        run: node --test scripts/battle-bridge-worker-watchdog-policy.test.mjs

      - name: Test worker heartbeat
        run: node --test scripts/mission-orchestrator-worker-heartbeat.test.mjs

      - name: Test supervised worker
        run: node --test scripts/mission-orchestrator-worker-supervised.test.mjs

      - name: Test watchdog executor and acceptance lane
        run: node --test scripts/battle-bridge-worker-watchdog.test.mjs scripts/battle-bridge-worker-watchdog-acceptance.test.mjs

      - name: Test mailbox command contract
        id: mailbox-contract
        shell: bash
        run: |
          set +e
          node --test shared/agents/battleBridgeGitHubCommandMailbox*.test.mjs 2>&1 | tee mailbox-command-contract.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload mailbox command contract failure
        if: failure() && steps.mailbox-contract.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mailbox-command-contract-failure
          path: mailbox-command-contract.log
          if-no-files-found: error
          retention-days: 3

      - name: Test capability registry
        run: node --test shared/agents/stephanosCapabilityRegistry.test.mjs

      - name: Test mailbox Windows runner
        run: node --test scripts/battle-bridge-github-command-mailbox.test.mjs

      - name: Test participant bridge contract and live relay
        run: node --test shared/agents/chatGptParticipantBridgeV1.test.mjs scripts/chatgpt-shared-workspace-github-relay.test.mjs

      - name: Test visibility observer, mirror and combined runner
        run: node --test shared/agents/remoteCodexTaskVisibility.test.mjs scripts/remote-codex-task-visibility-observer.test.mjs scripts/remote-codex-github-mirror-publisher.test.mjs scripts/battle-bridge-worker-watchdog-runner.test.mjs

      - name: Test Windows script guards
        run: node --test scripts/battle-bridge-worker-watchdog-installer.test.mjs

      - name: Check pull request patch whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Check pushed patch whitespace
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: git diff --check "${{ github.event.before }}...${{ github.sha }}"
