name: One-shot VR Research Main Convergence

on:
  push:
    branches:
      - agent/vr-research-participant-qa-v1

permissions:
  contents: write

concurrency:
  group: vr-research-main-convergence-once
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact repaired product blobs
        run: |
          set -euo pipefail
          test "$(git hash-object shared/agents/vrResearchParticipantQaV1.mjs)" = "4c45f9d4a96d1946d35392afc778e62910f93b2f"
          test "$(git hash-object shared/agents/vrResearchParticipantQaV1.test.mjs)" = "5d3ed9bc67689dd2107847cb525ef718fbd071d8"
          test "$(git hash-object docs/architecture/vr-research-participant-qa-v1.md)" = "661638b89b4f22ec906ee25bf35ad30d7b3d7630"
      - name: Merge exact current main without rewriting product history
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "e42dc932196eeffce37ed0af3e5bc367bb37212e"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-edit origin/main
          test "$(git hash-object shared/agents/vrResearchParticipantQaV1.mjs)" = "4c45f9d4a96d1946d35392afc778e62910f93b2f"
          test "$(git hash-object shared/agents/vrResearchParticipantQaV1.test.mjs)" = "5d3ed9bc67689dd2107847cb525ef718fbd071d8"
          test "$(git hash-object docs/architecture/vr-research-participant-qa-v1.md)" = "661638b89b4f22ec906ee25bf35ad30d7b3d7630"
      - name: Run focused three-suite proof after convergence
        run: |
          set -euo pipefail
          node --check shared/agents/vrResearchParticipantQaV1.mjs
          node --test shared/agents/vrResearchWorkspaceProjectionV1.test.mjs shared/agents/vrResearchAgentV1.test.mjs shared/agents/vrResearchParticipantQaV1.test.mjs
          git diff origin/main...HEAD --check
      - name: Remove temporary workflow and publish
        run: |
          set -euo pipefail
          git rm .github/workflows/vr-research-main-convergence-temporary.yml
          git commit -m 'Remove one-shot VR Research main convergence workflow'
          git fetch origin refs/heads/agent/vr-research-participant-qa-v1
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git push --porcelain origin HEAD:refs/heads/agent/vr-research-participant-qa-v1
