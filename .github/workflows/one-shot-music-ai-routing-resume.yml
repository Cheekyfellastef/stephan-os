name: One-shot Music AI Routing Resume

on:
  push:
    branches:
      - fix/music-ai-canonical-routing-truth
    paths:
      - .github/workflows/one-shot-music-ai-routing-resume.yml

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out existing Music AI branch
        uses: actions/checkout@v4
        with:
          ref: fix/music-ai-canonical-routing-truth
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge current main without rewriting branch history
        shell: bash
        run: |
          git config user.name "Stephanos GitHub Repair"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge -X theirs --no-edit origin/main

      - name: Reuse the reviewed bounded settlement script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/one-shot-music-ai-routing-settlement.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = workflow.find(start_marker)
          if start < 0:
              raise SystemExit('Reviewed settlement Python start marker not found')
          start += len(start_marker)
          end = workflow.find(end_marker, start)
          if end < 0:
              raise SystemExit('Reviewed settlement Python end marker not found')
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'reviewed-music-ai-routing-settlement.py', 'exec'), {})

          legacy_test = Path('tests/music-tile-ai-router-connection.test.mjs')
          source = legacy_test.read_text(encoding='utf-8')
          source = source.replace('/AI route missing\\./', '/AI route unavailable\\./')
          legacy_test.write_text(source, encoding='utf-8')
          PY
          node --check apps/music-tile/engine/musicAiBridge.js
          node --check apps/music-tile/main.js
          node --check shared/ai/stephanosClient.mjs
          node --check tests/music-tile-ai-router-connection.test.mjs
          node --check tests/music-tile-ai-routing-settlement.test.mjs
          git diff --check

      - name: Run routing and journey regressions
        shell: bash
        run: |
          node --test \
            shared/ai/stephanosClient.test.mjs \
            tests/music-tile-ai-router-connection.test.mjs \
            tests/music-tile-ai-routing-settlement.test.mjs \
            tests/music-intelligence-centre-vnext.test.mjs \
            tests/music-tile-journey-function-audit.test.mjs \
            tests/music-tile-candidate-verification-init-order.test.mjs

      - name: Publish settled branch and remove temporary runners
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-music-ai-routing-settlement.yml
          rm -f .github/workflows/one-shot-music-ai-routing-resume.yml
          git diff --check
          git add -A
          git commit -m "Settle Music Tile canonical AI routing truth"
          git push origin HEAD:fix/music-ai-canonical-routing-truth
