name: Battle Bridge Main Advance Express Sync V1
run-name: Signal Battle Bridge main advance for PR ${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: battle-bridge-main-advance-${{ github.event.pull_request.number }}-${{ github.event.pull_request.merge_commit_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  publish-main-advance:
    name: publish-main-advance
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out exact merged main head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish bounded canonical-main signal
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPHANOS_MAIN_ADVANCE_PR: ${{ github.event.pull_request.number }}
          STEPHANOS_MAIN_ADVANCE_HEAD: ${{ github.event.pull_request.merge_commit_sha }}
          STEPHANOS_MAIN_ADVANCE_MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: node scripts/publish-battle-bridge-main-advance-signal.mjs
