name: PR 1638 Meterless Exact-Head Repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/pr1638-meterless-exact-head-repair.yml'
      - 'scripts/pr1638-meterless-exact-head-repair.py'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr1638-meterless-exact-head-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'Cheekyfellastef/stephan-os' &&
      github.event.pull_request.number == 1638 &&
      github.event.pull_request.head.ref == 'fix/battle-bridge-recovery-health-authority' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify reviewed source identities
        shell: bash
        run: |
          test "$(git hash-object scripts/windows/start-stephanos-backend.ps1)" = "9c209daebcd08a9b5b5822ebf9f777f91afdbc88"
          test "$(git hash-object scripts/windows/probe-battle-bridge-recovery-mesh.ps1)" = "e9a1587ce71d22159d0abc1ca2544a7418423f3a"
          test "$(git hash-object scripts/battle-bridge-recovery-mesh-installer.test.mjs)" = "2779de753bb86f0486c51d728ae3843030939b53"

      - name: Apply bounded exact-head repairs
        id: apply
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/pr1638-meterless-exact-head-repair.py 2>&1 | tee repair.log
          git diff --check 2>&1 | tee -a repair.log
          if git diff --quiet -- \
            scripts/windows/start-stephanos-backend.ps1 \
            scripts/windows/probe-battle-bridge-recovery-mesh.ps1 \
            scripts/battle-bridge-recovery-mesh-installer.test.mjs; then
            echo 'repair produced no source diff' | tee -a repair.log
            exit 1
          fi

      - name: Publish bounded failure diagnostic
        if: failure() && steps.apply.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 80 repair.log > repair-tail.log || true
          {
            echo '<!-- stephanos:pr1638-meterless-repair-diagnostic -->'
            echo '## Meterless PR #1638 repair diagnostic'
            echo
            echo 'The bounded source transformer failed before publication. No source repair commit was pushed.'
            echo
            echo '```text'
            cat repair-tail.log
            echo '```'
          } > repair-comment.md
          gh api --method POST "repos/${{ github.repository }}/issues/1638/comments" -f body="$(cat repair-comment.md)"

      - name: Commit repaired source and regressions
        shell: bash
        run: |
          git config user.name "stephanos-meterless-builder[bot]"
          git config user.email "stephanos-meterless-builder[bot]@users.noreply.github.com"
          git add \
            scripts/windows/start-stephanos-backend.ps1 \
            scripts/windows/probe-battle-bridge-recovery-mesh.ps1 \
            scripts/battle-bridge-recovery-mesh-installer.test.mjs
          git diff --cached --check
          git commit -m "Bind backend recovery to exact clean source"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
