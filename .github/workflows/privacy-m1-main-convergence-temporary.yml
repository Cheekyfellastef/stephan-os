name: One-shot Privacy M1 Main Convergence

on:
  push:
    branches:
      - agent/privacy-m1-evidence-projection-v1

permissions:
  contents: write

concurrency:
  group: privacy-m1-main-convergence-final
  cancel-in-progress: false

jobs:
  converge:
    if: github.repository == 'Cheekyfellastef/stephan-os'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify repaired product identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object shared/agents/privacyTileEvidenceProjectionV1.mjs)" = "7e1c4dcea7b50a881ce3f5836858800d2d869bd7"
          test "$(git hash-object shared/agents/privacyTileEvidenceProjectionV1.test.mjs)" = "9698ef2cf3f2a692a8d32266f35e8f74e0f63b9e"
          test "$(git hash-object docs/architecture/privacy-tile-evidence-projection-v1.md)" = "17c14b2da9fbbe3ce01d57f27ff39cc6f9ac2602"

      - name: Merge exact current main without rewriting product history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "e42dc932196eeffce37ed0af3e5bc367bb37212e"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-edit origin/main
          test "$(git hash-object shared/agents/privacyTileEvidenceProjectionV1.mjs)" = "7e1c4dcea7b50a881ce3f5836858800d2d869bd7"
          test "$(git hash-object shared/agents/privacyTileEvidenceProjectionV1.test.mjs)" = "9698ef2cf3f2a692a8d32266f35e8f74e0f63b9e"
          test "$(git hash-object docs/architecture/privacy-tile-evidence-projection-v1.md)" = "17c14b2da9fbbe3ce01d57f27ff39cc6f9ac2602"

      - name: Run focused proof after convergence
        shell: bash
        run: |
          set -euo pipefail
          node --check shared/agents/privacyTileEvidenceProjectionV1.mjs
          node --test shared/agents/privacyTileEvidenceProjectionV1.test.mjs
          git diff origin/main...HEAD --check

      - name: Remove temporary convergence workflow and publish
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/privacy-m1-main-convergence-temporary.yml
          git commit -m 'Remove one-shot Privacy main convergence workflow'
          git fetch origin refs/heads/agent/privacy-m1-evidence-projection-v1
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git push --porcelain origin HEAD:refs/heads/agent/privacy-m1-evidence-projection-v1
          test -z "$(git status --porcelain)"
