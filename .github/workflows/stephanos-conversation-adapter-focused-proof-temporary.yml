name: One-shot Stephanos Conversation Adapter Focused Proof

on:
  push:
    branches:
      - agent/stephanos-shared-workspace-conversation-adapter-v1

permissions:
  contents: write

concurrency:
  group: stephanos-conversation-adapter-focused-proof-once
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused parent and child proof
        run: |
          set -euo pipefail
          node --check shared/agents/stephanosSharedWorkspaceConversationAdapterV1.mjs
          node --test shared/agents/stephanosConversationalCapabilityLadderV1.test.mjs shared/agents/stephanosSharedWorkspaceConversationAdapterV1.test.mjs
          git diff origin/agent/stephanos-ten-question-evaluation-contract-v1...HEAD --check
      - name: Remove temporary proof workflow and publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stephanos-conversation-adapter-focused-proof-temporary.yml
          git commit -m 'Remove one-shot conversation adapter focused proof workflow'
          git fetch origin refs/heads/agent/stephanos-shared-workspace-conversation-adapter-v1
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git push --porcelain origin HEAD:refs/heads/agent/stephanos-shared-workspace-conversation-adapter-v1
