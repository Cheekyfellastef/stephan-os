name: Battle Bridge Tailscale Bootstrap Pipe

on:
  pull_request:
    paths:
      - '.github/workflows/battle-bridge-tailscale-bootstrap-pipe.yml'
      - 'scripts/battle-bridge-tailscale-bootstrap-pipe.mjs'
      - 'scripts/battle-bridge-tailscale-bootstrap-pipe.test.mjs'
      - 'scripts/battle-bridge-tailscale-prerequisite-proof.mjs'
      - 'scripts/battle-bridge-tailscale-prerequisite-proof.test.mjs'
      - 'shared/agents/battleBridgeTailscaleBootstrapPipeV1.mjs'
      - 'shared/agents/battleBridgeTailscaleBootstrapPipeV1.test.mjs'
      - 'shared/agents/battleBridgeTailscalePrerequisiteProofV1.mjs'
      - 'shared/agents/battleBridgeTailscalePrerequisiteProofV1.test.mjs'
      - 'docs/architecture/battle-bridge-tailscale-bootstrap-pipe-v1.md'
      - 'docs/architecture/battle-bridge-tailscale-prerequisite-proof-v1.md'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: battle-bridge-tailscale-bootstrap-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  contract-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run bounded bootstrap and prerequisite contract tests
        run: |
          node --test shared/agents/battleBridgeTailscaleBootstrapPipeV1.test.mjs
          node --test scripts/battle-bridge-tailscale-bootstrap-pipe.test.mjs
          node --test shared/agents/battleBridgeTailscalePrerequisiteProofV1.test.mjs
          node --test scripts/battle-bridge-tailscale-prerequisite-proof.test.mjs

      - name: Parse bounded runners and contracts
        run: |
          node --check scripts/battle-bridge-tailscale-bootstrap-pipe.mjs
          node --check shared/agents/battleBridgeTailscaleBootstrapPipeV1.mjs
          node --check scripts/battle-bridge-tailscale-prerequisite-proof.mjs
          node --check shared/agents/battleBridgeTailscalePrerequisiteProofV1.mjs

      - name: Diff check
        run: git diff --check origin/main...HEAD

  bootstrap-canonical-github-sync:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1507 &&
      github.actor == 'Cheekyfellastef' &&
      contains(github.event.comment.body, '```stephanos-battle-bridge-tailscale-bootstrap') &&
      !contains(github.event.comment.body, '```stephanos-battle-bridge-tailscale-bootstrap-prerequisites')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      BOOTSTRAP_HOST: ${{ vars.STEPHANOS_BATTLE_BRIDGE_TAILSCALE_HOST }}
      BOOTSTRAP_USER: ${{ vars.STEPHANOS_BATTLE_BRIDGE_SSH_USER }}
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate exact owner-authored bootstrap request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          MAIN_HEAD="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          node scripts/battle-bridge-tailscale-bootstrap-pipe.mjs validate-event "$GITHUB_EVENT_PATH" "$MAIN_HEAD" > "$RUNNER_TEMP/bootstrap-request.json"
          EXPECTED_HEAD="$(node -e "const r=require(process.argv[1]); process.stdout.write(r.request.expectedHead)" "$RUNNER_TEMP/bootstrap-request.json")"
          test "$EXPECTED_HEAD" = "$MAIN_HEAD"
          echo "expected_head=$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"

      - name: Validate fixed pipe settings without exposing values
        shell: bash
        env:
          TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE_VALUE: ${{ secrets.TS_AUDIENCE }}
          SSH_PRIVATE_KEY: ${{ secrets.STEPHANOS_BATTLE_BRIDGE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STEPHANOS_BATTLE_BRIDGE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          SETTINGS_PROOF="$RUNNER_TEMP/bootstrap-settings-proof.json"
          node scripts/battle-bridge-tailscale-prerequisite-proof.mjs settings-proof "${{ steps.request.outputs.expected_head }}" > "$SETTINGS_PROOF"
          READY="$(node -e "const r=require(process.argv[1]); process.stdout.write(String(r.ready))" "$SETTINGS_PROOF")"
          if test "$READY" != "true"; then
            cat "$SETTINGS_PROOF"
            echo 'TAILSCALE_BOOTSTRAP_PREREQUISITES_REQUIRED'
            exit 2
          fi

      - name: Join tailnet as fixed ephemeral recovery identity
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:stephanos-github-recovery
          ping: ${{ vars.STEPHANOS_BATTLE_BRIDGE_TAILSCALE_HOST }}

      - name: Bootstrap canonical GitHub Sync over private Tailscale path
        id: bootstrap
        shell: bash
        env:
          EXPECTED_HEAD: ${{ steps.request.outputs.expected_head }}
          SSH_PRIVATE_KEY: ${{ secrets.STEPHANOS_BATTLE_BRIDGE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STEPHANOS_BATTLE_BRIDGE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/stephanos-battle-bridge-ssh-key"
          KNOWN_HOSTS_FILE="$RUNNER_TEMP/stephanos-battle-bridge-known-hosts"
          RAW_RECEIPT="$RUNNER_TEMP/bootstrap-raw-receipt.txt"
          VALIDATED_RECEIPT="$RUNNER_TEMP/bootstrap-receipt.json"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          ENCODED_COMMAND="$(node scripts/battle-bridge-tailscale-bootstrap-pipe.mjs encoded-command "$EXPECTED_HEAD")"
          ssh \
            -i "$KEY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o ConnectTimeout=15 \
            -l "$BOOTSTRAP_USER" \
            "$BOOTSTRAP_HOST" \
            powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand "$ENCODED_COMMAND" \
            > "$RAW_RECEIPT"
          node scripts/battle-bridge-tailscale-bootstrap-pipe.mjs validate-receipt "$EXPECTED_HEAD" "$RAW_RECEIPT" > "$VALIDATED_RECEIPT"
          echo "receipt_path=$VALIDATED_RECEIPT" >> "$GITHUB_OUTPUT"

      - name: Upload bounded bootstrap receipt
        uses: actions/upload-artifact@v4
        with:
          name: battle-bridge-tailscale-bootstrap-${{ steps.request.outputs.expected_head }}
          path: ${{ steps.bootstrap.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 7

  prerequisite-proof:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1507 &&
      github.actor == 'Cheekyfellastef' &&
      contains(github.event.comment.body, '```stephanos-battle-bridge-tailscale-bootstrap-prerequisites')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      id-token: write
    env:
      BOOTSTRAP_HOST: ${{ vars.STEPHANOS_BATTLE_BRIDGE_TAILSCALE_HOST }}
      BOOTSTRAP_USER: ${{ vars.STEPHANOS_BATTLE_BRIDGE_SSH_USER }}
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate exact owner-authored read-only prerequisite request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          MAIN_HEAD="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          node scripts/battle-bridge-tailscale-prerequisite-proof.mjs validate-event "$GITHUB_EVENT_PATH" "$MAIN_HEAD" > "$RUNNER_TEMP/prerequisite-request.json"
          EXPECTED_HEAD="$(node -e "const r=require(process.argv[1]); process.stdout.write(r.request.expectedHead)" "$RUNNER_TEMP/prerequisite-request.json")"
          test "$EXPECTED_HEAD" = "$MAIN_HEAD"
          echo "expected_head=$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"

      - name: Build redacted GitHub settings presence proof
        id: settings
        shell: bash
        env:
          TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE_VALUE: ${{ secrets.TS_AUDIENCE }}
          SSH_PRIVATE_KEY: ${{ secrets.STEPHANOS_BATTLE_BRIDGE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STEPHANOS_BATTLE_BRIDGE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          SETTINGS_PROOF="$RUNNER_TEMP/prerequisite-settings-proof.json"
          node scripts/battle-bridge-tailscale-prerequisite-proof.mjs settings-proof "${{ steps.request.outputs.expected_head }}" > "$SETTINGS_PROOF"
          READY="$(node -e "const r=require(process.argv[1]); process.stdout.write(String(r.ready))" "$SETTINGS_PROOF")"
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "proof_path=$SETTINGS_PROOF" >> "$GITHUB_OUTPUT"

      - name: Upload redacted settings proof
        uses: actions/upload-artifact@v4
        with:
          name: battle-bridge-tailscale-prerequisite-settings-${{ steps.request.outputs.expected_head }}
          path: ${{ steps.settings.outputs.proof_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed if prerequisite settings are absent or unsafe
        if: steps.settings.outputs.ready != 'true'
        shell: bash
        run: |
          cat "${{ steps.settings.outputs.proof_path }}"
          echo 'TAILSCALE_BOOTSTRAP_PREREQUISITE_SETTINGS_REQUIRED'
          exit 2

      - name: Join tailnet as fixed ephemeral recovery identity
        if: steps.settings.outputs.ready == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:stephanos-github-recovery
          ping: ${{ vars.STEPHANOS_BATTLE_BRIDGE_TAILSCALE_HOST }}

      - name: Prove fixed Windows SSH and Tailscale prerequisites without mutation
        if: steps.settings.outputs.ready == 'true'
        id: prerequisite
        shell: bash
        env:
          EXPECTED_HEAD: ${{ steps.request.outputs.expected_head }}
          SSH_PRIVATE_KEY: ${{ secrets.STEPHANOS_BATTLE_BRIDGE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STEPHANOS_BATTLE_BRIDGE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/stephanos-battle-bridge-ssh-key"
          KNOWN_HOSTS_FILE="$RUNNER_TEMP/stephanos-battle-bridge-known-hosts"
          RAW_REMOTE_RECEIPT="$RUNNER_TEMP/prerequisite-raw-remote-receipt.txt"
          VALIDATED_RECEIPT="$RUNNER_TEMP/prerequisite-receipt.json"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          ENCODED_COMMAND="$(node scripts/battle-bridge-tailscale-prerequisite-proof.mjs encoded-command "$EXPECTED_HEAD")"
          ssh \
            -i "$KEY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o ConnectTimeout=15 \
            -l "$BOOTSTRAP_USER" \
            "$BOOTSTRAP_HOST" \
            powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand "$ENCODED_COMMAND" \
            > "$RAW_REMOTE_RECEIPT"
          node scripts/battle-bridge-tailscale-prerequisite-proof.mjs validate-receipt \
            "$EXPECTED_HEAD" \
            "${{ steps.settings.outputs.proof_path }}" \
            "$RAW_REMOTE_RECEIPT" \
            > "$VALIDATED_RECEIPT"
          echo "receipt_path=$VALIDATED_RECEIPT" >> "$GITHUB_OUTPUT"

      - name: Upload bounded prerequisite receipt
        if: steps.settings.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: battle-bridge-tailscale-prerequisites-${{ steps.request.outputs.expected_head }}
          path: ${{ steps.prerequisite.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 7
