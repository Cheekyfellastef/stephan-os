name: One-shot Music Tile Complete Journey Audit

on:
  push:
    branches:
      - fix/music-tile-complete-journey-audit
    paths:
      - .github/workflows/one-shot-music-tile-complete-journey-audit.yml
      - scripts/.one-shot-music-audit/**
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.ref_name == 'fix/music-tile-complete-journey-audit' || github.head_ref == 'fix/music-tile-complete-journey-audit'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/music-tile-complete-journey-audit
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and apply bounded repair
        shell: bash
        run: |
          mkdir -p /tmp/music-audit-parts
          base64 --decode scripts/.one-shot-music-audit/part-00.b64 > /tmp/music-audit-parts/part-00
          cp scripts/.one-shot-music-audit/part-01 /tmp/music-audit-parts/part-01
          cp scripts/.one-shot-music-audit/part-02 /tmp/music-audit-parts/part-02
          base64 --decode scripts/.one-shot-music-audit/part-03.b64 > /tmp/music-audit-parts/part-03
          base64 --decode scripts/.one-shot-music-audit/part-04.b64 > /tmp/music-audit-parts/part-04
          base64 --decode scripts/.one-shot-music-audit/part-05.b64 > /tmp/music-audit-parts/part-05
          cat > /tmp/music-audit-part-checks <<'EOF'
          8bda271e64b74f6f68c0c5045903c7da5ce39a69d1f29e363cf582353e4d5f89  /tmp/music-audit-parts/part-00
          b6b053b768e3ce8b4a372c236acd55074f4b527e5cd20e37fdc5d7d4c1e7557c  /tmp/music-audit-parts/part-01
          ff309e393cc90ecce5ebe5e56edcad95ce7a2afae65b13a363f483ec28af322c  /tmp/music-audit-parts/part-02
          02c5c7c08176b038ce116c3f0464c0fd9986109579f7ef14495868e7d7fa3198  /tmp/music-audit-parts/part-03
          8805a5fb7119e3534b1348d3a10437b39a12b27a722218c2e06cc9fc35a5f226  /tmp/music-audit-parts/part-04
          f47ba979e345a558917e714e003cccd5aaca1730d2a25f067fabed7aed4032d0  /tmp/music-audit-parts/part-05
          EOF
          sha256sum --check /tmp/music-audit-part-checks
          cat /tmp/music-audit-parts/part-{00,01,02,03,04,05} > scripts/one-shot-music-tile-complete-journey-audit.mjs
          echo "2ddcbd8691b4bbe55002cb0feb75f77a88bea3f991febaf9e109a8e4d901d2ac  scripts/one-shot-music-tile-complete-journey-audit.mjs" | sha256sum --check
          node --check scripts/one-shot-music-tile-complete-journey-audit.mjs
          node scripts/one-shot-music-tile-complete-journey-audit.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/music-tile-journey-function-audit.test.mjs')
          source = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "  assert.match(controllerSource, /Promise.all(catalogueQueries.map/);",
                  r"  assert.match(controllerSource, /Promise\.all\(catalogueQueries\.map/);",
                  'catalogue Promise regex',
              ),
              (
                  "/localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState))/",
                  r"/localStorage\.setItem\(STORAGE_KEY, JSON\.stringify\(nextState\)\)/",
                  'load-state persistence regex',
              ),
              (
                  "/slice(0, 2)/",
                  r"/slice\(0, 2\)/",
                  'catalogue query bound regex',
              ),
          ]
          for before, after, label in replacements:
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'Expected one {label}, found {count}')
              source = source.replace(before, after)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Install focused audit dependencies
        shell: bash
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm --prefix stephanos-server install --ignore-scripts --no-audit --no-fund

      - name: Run complete journey audit tests
        shell: bash
        run: |
          node --check apps/music-tile/main.js
          node --check apps/music-tile/engine/freshJourneyController.js
          node --check apps/music-tile/engine/freshJourneyPlanner.js
          node --test \
            tests/music-intelligence-centre-vnext.test.mjs \
            tests/music-tile-journey-function-audit.test.mjs \
            tests/music-provider-neutral-catalog-search.test.mjs \
            tests/music-tile-candidate-verification-init-order.test.mjs

      - name: Publish only settled repair files
        shell: bash
        run: |
          rm -f scripts/one-shot-music-tile-complete-journey-audit.mjs
          rm -f scripts/one-shot-music-tile-complete-journey-audit.mjs.gz.b64
          rm -rf scripts/.one-shot-music-audit
          rm -f .github/workflows/one-shot-music-tile-complete-journey-audit.yml
          git diff --check
          git config user.name "Stephanos GitHub Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Repair and audit complete Music Tile journeys"
          git push origin HEAD:fix/music-tile-complete-journey-audit
