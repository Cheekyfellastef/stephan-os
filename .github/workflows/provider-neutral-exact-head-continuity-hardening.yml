name: Provider-Neutral Exact-Head Continuity Hardening

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '.github/workflows/provider-neutral-exact-head-continuity-hardening.yml'
      - 'scripts/provider-neutral-exact-head-continuity-hardening.py'

permissions:
  contents: write

concurrency:
  group: provider-neutral-exact-head-continuity-hardening
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.repository == 'Cheekyfellastef/stephan-os' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/provider-neutral-exact-head-continuity-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve exact same-repository branch identity
        id: branch
        shell: bash
        env:
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "${PR_HEAD_BRANCH}" = "agent/provider-neutral-exact-head-continuity-v1"
          [[ "${PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          echo "name=${PR_HEAD_BRANCH}" >> "${GITHUB_OUTPUT}"
          echo "sha=${PR_HEAD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify reviewed source and transformer identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object shared/agents/exactHeadReviewDispatchCoordinator.mjs)" = "7ee2997a1334b1eacdee4d7d8ee638c83f593b94"
          test "$(git hash-object scripts/exact-head-review-dispatch.mjs)" = "2cef56334ba76a05740be08f0d49782db73c11b5"
          test "$(git hash-object shared/agents/exactHeadReviewDispatchCoordinator.test.mjs)" = "c485ae881a4a79cb15b3ac52fc3d0e1fe349e3d4"
          test "$(git hash-object scripts/provider-neutral-exact-head-continuity-hardening.py)" = "1f27fc395b0a7096fe893aeb25b96446113bf468"

      - name: Repair bounded hostile-test matcher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/provider-neutral-exact-head-continuity-hardening.py')
          text = path.read_text(encoding='utf-8')
          old = r'''provider_block = r"\nfunction providerNeutralComment\(\{.*?\n\}\n\ntest\('provider-neutral handoff never dispatches the Codex reviewer'"'''
          new = r'''provider_block = r"\nfunction providerNeutralComment\(\{.*?test\('provider-neutral handoff never dispatches the Codex reviewer'"'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'hostile-test matcher repair: expected exactly one match, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply workflow-bound review hardening
        run: python3 scripts/provider-neutral-exact-head-continuity-hardening.py

      - name: Validate hardened provider-neutral continuity
        shell: bash
        run: |
          set -euo pipefail
          node --check shared/agents/exactHeadReviewDispatchCoordinator.mjs
          node --check scripts/exact-head-review-dispatch.mjs
          node --test \
            shared/agents/exactHeadReviewDispatchCoordinator.test.mjs \
            shared/agents/providerNeutralReviewV1.test.mjs \
            shared/agents/providerNeutralReviewV1IdentityRegression.test.mjs \
            shared/agents/operatorMergeApprovalGate.test.mjs
          npm run stephanos:guard:imports
          git diff --check

      - name: Commit hardened source and remove one-shot machinery
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "stephanos-provider-neutral-builder[bot]"
          git config user.email "stephanos-provider-neutral-builder[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/provider-neutral-exact-head-continuity-hardening.yml \
            scripts/provider-neutral-exact-head-continuity-hardening.py
          git add \
            shared/agents/exactHeadReviewDispatchCoordinator.mjs \
            shared/agents/exactHeadReviewDispatchCoordinator.test.mjs \
            scripts/exact-head-review-dispatch.mjs
          git diff --cached --check
          git commit -m "Bind provider-neutral review receipts to canonical workflow runs"
          git push origin "HEAD:${TARGET_BRANCH}"
