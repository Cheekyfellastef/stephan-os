name: One-shot UI M3 Focused Proof

on:
  push:
    branches:
      - agent/ui-agent-m3-experience-contract-v1

permissions:
  contents: write

concurrency:
  group: ui-m3-focused-proof-once
  cancel-in-progress: false

jobs:
  proof:
    if: github.repository == 'Cheekyfellastef/stephan-os'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused UI M3 proof
        shell: bash
        run: |
          set -euo pipefail
          node --check shared/agents/uiAgentCanonicalExperienceContractV1.mjs
          node --test shared/agents/uiAgentCanonicalExperienceContractV1.test.mjs
          git diff origin/agent/ui-agent-m2-experience-inventory-v1...HEAD --check
      - name: Remove temporary proof workflow and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ui-m3-focused-proof-temporary.yml
          git commit -m 'Remove one-shot UI M3 focused proof workflow'
          git fetch origin refs/heads/agent/ui-agent-m3-experience-contract-v1
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git push --porcelain origin HEAD:refs/heads/agent/ui-agent-m3-experience-contract-v1
