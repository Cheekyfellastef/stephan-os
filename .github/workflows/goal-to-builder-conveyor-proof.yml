name: Goal to Builder Conveyor Proof

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'shared/runtime/seedGrowthWorkV1.mjs'
      - 'shared/runtime/upliftWorkspaceProjectionV1.mjs'
      - 'stephanos-server/services/flywheelSeedGrowthConveyor.test.js'
      - 'stephanos-server/services/flywheelLearningGoalBridgeService.js'
      - 'stephanos-server/services/flywheelCanonicalGoalAdmissionService.js'
      - 'shared/agents/programmeAuthorityV1.mjs'
      - 'shared/agents/programmeAuthorityV1.test.mjs'
      - 'shared/agents/durableFlywheelControllerVNext.mjs'
      - 'shared/agents/durableFlywheelControllerVNext.test.mjs'
      - 'shared/agents/durableFlywheelControllerVNext.terminal-reconciliation.test.mjs'
      - 'shared/runtime/missionScheduler.mjs'
      - 'shared/runtime/missionScheduler.test.mjs'
      - 'shared/agents/missionControllerCapacityRouterV1.mjs'
      - 'shared/agents/missionControllerCapacityRouterV1.test.mjs'
      - 'shared/agents/openClawProviderPoolQualificationV1.mjs'
      - 'shared/agents/openClawProviderPoolQualificationV1.test.mjs'
      - 'shared/agents/sharedWorkspaceSpecializedStatusRegistryV1.mjs'
      - 'stephanos-server/services/elasticGoalMissionAdmissionService.js'
      - 'stephanos-server/services/elasticGoalMissionAdmissionService.test.js'
      - 'stephanos-server/services/criticalBacklogConveyorServiceCore.js'
      - 'stephanos-server/services/criticalBacklogConveyorService.test.js'
      - 'stephanos-server/services/missionOrchestratorWorkerService.js'
      - 'stephanos-server/services/missionOrchestratorWorkerService.test.js'
      - 'stephanos-server/services/missionOrchestratorWorkerConsumer.js'
      - 'stephanos-server/services/missionOrchestratorWorkerConsumer.test.js'
      - 'stephanos-server/services/openClawProviderPoolAdmissionService.js'
      - 'stephanos-server/services/openClawProviderPoolAdmissionService.test.js'
      - 'stephanos-server/services/providerNeutralSourceBuilderService.js'
      - 'stephanos-server/services/providerNeutralSourceBuilderService.test.js'
      - 'stephanos-server/services/programmeAuthorityService.js'
      - 'stephanos-server/services/programmeAuthorityService.test.js'
      - 'shared/agents/sovereignCommanderCapabilityParityV1.mjs'
      - 'shared/agents/sovereignCommanderCapabilityParityV1.test.mjs'
      - 'scripts/sovereign-commander-capability-parity-reconcile.mjs'
      - 'scripts/sovereign-commander-capability-parity-reconcile.test.mjs'
      - 'scripts/battle-bridge-goal-discovery-heartbeat.mjs'
      - 'scripts/battle-bridge-goal-discovery-heartbeat.test.mjs'
      - 'tests/goal-to-builder-conveyor-proof.test.mjs'
      - 'tests/all-builder-exits-proof.test.mjs'
      - 'tests/goal-completion-refill-proof.test.mjs'
      - '.github/workflows/goal-to-builder-conveyor-proof.yml'

permissions:
  contents: read

concurrency:
  group: goal-to-builder-conveyor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse conveyor sources
        run: |
          node --check shared/agents/programmeAuthorityV1.mjs
          node --check shared/agents/durableFlywheelControllerVNext.mjs
          node --check shared/runtime/missionScheduler.mjs
          node --check shared/agents/missionControllerCapacityRouterV1.mjs
          node --check shared/agents/openClawProviderPoolQualificationV1.mjs
          node --check stephanos-server/services/elasticGoalMissionAdmissionService.js
          node --check stephanos-server/services/criticalBacklogConveyorServiceCore.js
          node --check stephanos-server/services/missionOrchestratorWorkerService.js
          node --check stephanos-server/services/missionOrchestratorWorkerConsumer.js
          node --check stephanos-server/services/openClawProviderPoolAdmissionService.js
          node --check stephanos-server/services/providerNeutralSourceBuilderService.js
          node --check stephanos-server/services/programmeAuthorityService.js
          node --check shared/agents/sovereignCommanderCapabilityParityV1.mjs
          node --check scripts/sovereign-commander-capability-parity-reconcile.mjs
          node --check scripts/battle-bridge-goal-discovery-heartbeat.mjs

      - name: Prove every goal-to-builder handoff
        run: node --test tests/goal-to-builder-conveyor-proof.test.mjs

      - name: Prove every builder exit
        run: node --test tests/all-builder-exits-proof.test.mjs

      - name: Prove completion release close refill and next pickup
        run: node --test tests/goal-completion-refill-proof.test.mjs

      - name: Run supporting seam proofs
        run: >-
          node --test
          stephanos-server/services/flywheelSeedGrowthConveyor.test.js
          stephanos-server/services/flywheelLearningGoalBridgeService.test.js
          stephanos-server/services/flywheelCanonicalGoalAdmissionService.test.js
          shared/runtime/upliftWorkspaceProjectionV1.test.mjs
          shared/agents/programmeAuthorityV1.test.mjs
          shared/agents/durableFlywheelControllerVNext.terminal-reconciliation.test.mjs
          stephanos-server/services/programmeAuthorityService.test.js
          shared/runtime/missionScheduler.test.mjs
          stephanos-server/services/elasticGoalMissionAdmissionService.test.js
          shared/agents/missionControllerCapacityRouterV1.test.mjs
          shared/agents/openClawProviderPoolQualificationV1.test.mjs
          stephanos-server/services/openClawProviderPoolAdmissionService.test.js
          stephanos-server/services/providerNeutralSourceBuilderService.test.js
          shared/agents/sovereignCommanderCapabilityParityV1.test.mjs
          scripts/sovereign-commander-capability-parity-reconcile.test.mjs
          stephanos-server/services/missionOrchestratorWorkerService.test.js
          stephanos-server/services/missionOrchestratorWorkerConsumer.test.js
          stephanos-server/services/criticalBacklogConveyorService.test.js
          scripts/battle-bridge-goal-discovery-heartbeat.test.mjs

      - name: Check pull request diff
        if: always()
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
