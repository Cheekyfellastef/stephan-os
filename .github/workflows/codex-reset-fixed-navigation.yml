name: Codex Reset Fixed Navigation

on:
  pull_request:
    paths:
      - 'scripts/windows/codex-banked-reset-ui-navigation.psm1'
      - 'scripts/windows/compat/codex-banked-reset-ui-navigation.psm1'
      - 'scripts/windows/read-codex-banked-reset-status-with-navigation.ps1'
      - 'scripts/windows/invoke-codex-banked-reset-ui-with-navigation.ps1'
      - 'scripts/windows/read-codex-banked-reset-status.ps1'
      - 'scripts/windows/invoke-codex-banked-reset-ui.ps1'
      - 'shared/agents/codexBankedResetStatusBattleBridgeReader.mjs'
      - 'shared/agents/codexBankedResetStatusBattleBridgeReader.test.mjs'
      - 'shared/agents/codexBankedResetBattleBridgeExecutor.mjs'
      - 'shared/agents/codexBankedResetBattleBridgeExecutor.test.mjs'
      - 'shared/agents/codexBankedResetFixedNavigation.test.mjs'
      - 'shared/agents/codexBankedResetTelemetryMirror.mjs'
      - 'shared/agents/codexBankedResetTelemetryMirror.test.mjs'
      - '.github/workflows/codex-reset-fixed-navigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Parse PowerShell source
        shell: pwsh
        run: |
          $files = @(
            'scripts/windows/codex-banked-reset-ui-navigation.psm1',
            'scripts/windows/compat/codex-banked-reset-ui-navigation.psm1',
            'scripts/windows/read-codex-banked-reset-status-with-navigation.ps1',
            'scripts/windows/invoke-codex-banked-reset-ui-with-navigation.ps1',
            'scripts/windows/read-codex-banked-reset-status.ps1',
            'scripts/windows/invoke-codex-banked-reset-ui.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parse failed: $file"
            }
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run fixed-navigation contracts
        shell: pwsh
        run: >-
          node --test
          shared/agents/codexBankedResetFixedNavigation.test.mjs
          shared/agents/codexBankedResetStatusBattleBridgeReader.test.mjs
          shared/agents/codexBankedResetBattleBridgeExecutor.test.mjs
          shared/agents/codexBankedResetTelemetryMirror.test.mjs
          shared/agents/battleBridgeGitHubCommandMailbox.test.mjs

      - name: Import structure proof
        shell: pwsh
        run: node scripts/guard-import-structure.mjs

      - name: Diff check
        if: always()
        shell: pwsh
        run: git diff --check origin/main...HEAD
