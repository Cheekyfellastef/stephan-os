name: Build Stephanos UI

on:
  push:
    branches:
      - main
    paths:
      - 'stephanos-ui/**'
      - 'shared/ai/**'
      - 'shared/runtime/**'
      - 'shared/agents/**'
      - 'shared/agents/vrResearchAgentV1*.mjs'
      - 'shared/agents/vrResearchWorkspaceProjectionV1*.mjs'
      - 'VR-Research-Lab/lab-workspace.json'
      - 'system/apps/app_validator.js'
      - 'scripts/**'
      - 'windows/**'
      - '!scripts/codex-patch-escrow-attest.mjs'
      - '!scripts/codex-patch-escrow-export.mjs'
      - '!scripts/codex-patch-escrow-prepare.mjs'
      - '!scripts/codex-patch-escrow-publish-validated.mjs'
      - '!scripts/codex-patch-escrow-publisher.mjs'
      - '!scripts/codex-patch-escrow-validate-prepared.mjs'
      - '!scripts/codex-patch-escrow-validated-artifact.mjs'
      - '!scripts/battle-bridge-github-sync-*.mjs'
      - '!scripts/windows/install-battle-bridge-github-sync.ps1'
      - '!scripts/windows/status-battle-bridge-github-sync.ps1'
      - '!scripts/windows/uninstall-battle-bridge-github-sync.ps1'
      - 'package.json'
      - 'apps/stephanos/app.json'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  issue_comment:
    types:
      - created

permissions:
  contents: read

jobs:
  scheduler-tests:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.comment.user.login == 'Cheekyfellastef' &&
       github.event.comment.body == '/stephanos-deploy-pages')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run mission scheduler and elastic-capacity tests
        run: |
          node --test --test-concurrency=1 \
            shared/runtime/missionScheduler*.test.mjs \
            shared/runtime/missionEngineV1.test.mjs \
            shared/agents/elasticBuildCapacityV1.test.mjs \
            shared/agents/boundedParallelConstructionLanesV1.test.mjs \
            stephanos-server/services/criticalBacklogConveyorSelectedMissionRefill.test.js

  runtime-guardrail-tests:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.comment.user.login == 'Cheekyfellastef' &&
       github.event.comment.body == '/stephanos-deploy-pages')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run runtime guardrail and provider tests
        run: |
          node --test --test-concurrency=1 \
            shared/runtime/runtimeGuardrails.test.mjs \
            shared/runtime/runtimeStatusModel.test.mjs \
            shared/runtime/stephanosHomeNode.test.mjs \
            shared/runtime/stephanosSessionMemory.test.mjs \
            stephanos-server/tests/runtime-status-model.test.js \
            stephanos-server/tests/provider-routing.test.js

  surface-ignition-tests:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.comment.user.login == 'Cheekyfellastef' &&
       github.event.comment.body == '/stephanos-deploy-pages')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run surface, ignition, autonomy, and dashboard tests
        run: |
          node --test --test-concurrency=1 \
            scripts/stephanos-build-utils.test.mjs \
            shared/agents/buildStephanosUiParallelWorkflow.test.mjs \
            scripts/windows-ignition-browser-surfaces.test.mjs \
            scripts/run-battle-bridge-ignition.test.mjs \
            scripts/refresh-stephanos-ui-4173.test.mjs \
            scripts/sovereign-commander-ui-4173-repair.test.mjs \
            scripts/battle-bridge-goal-discovery-heartbeat.test.mjs \
            scripts/battle-bridge-goal-discovery-heartbeat-autonomy-track.test.mjs \
            shared/agents/autonomyBuildTrackV1.test.mjs \
            shared/agents/unattendedReadinessV1.test.mjs \
            shared/agents/operatorLaneContainmentV1.test.mjs \
            shared/agents/exactHeadReviewDispatchCoordinator.test.mjs \
            shared/agents/missionControllerCapacityRouterV1.test.mjs \
            shared/agents/goalDashboardEstateSummaryV1.test.mjs \
            shared/agents/flywheelAgentUpliftV1.test.mjs \
            shared/agents/starfieldVrOutcomeOwnershipSeedV1.test.mjs \
            shared/agents/agentSystem.test.mjs \
            shared/runtime/upliftWorkspaceProjectionV1.test.mjs \
            shared/runtime/fullSovereigntySeedV1.test.mjs \
            shared/ai/missionKernelV1.test.mjs \
            stephanos-ui/src/components/upliftWorkspaceSurfaces.test.mjs \
            tests/command-deck-protected-canon.test.mjs \
            stephanos-ui/src/ai/missionExecutionEngine.test.mjs \
            stephanos-ui/src/state/missionBridge.test.mjs \
            stephanos-server/services/programmeAuthorityGoalScopeCarry.test.js \
            stephanos-server/services/elasticGoalMissionAdmissionService.test.js \
            stephanos-server/services/flywheelCanonicalGoalAdmissionService.test.js \
            stephanos-server/services/flywheelLearningGoalBridgeService.test.js \
            stephanos-server/services/sharedWorkspaceDashboardFeedService.test.js \
            tests/goal-dashboard-remote-live.test.mjs

  vr-research-tests:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.comment.user.login == 'Cheekyfellastef' &&
       github.event.comment.body == '/stephanos-deploy-pages')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run VR Research Agent and workspace projection tests
        run: |
          node --test --test-concurrency=1 \
            shared/agents/vrResearchAgentV1.test.mjs \
            shared/agents/vrResearchWorkspaceProjectionV1.test.mjs \
            shared/agents/sovereignCommanderVrResourceGovernor.test.mjs \
            shared/agents/chatGptParticipantBridgeV1.test.mjs \
            scripts/chatgpt-shared-workspace-github-relay.test.mjs \
            scripts/starfield-vr-launcher-source.test.mjs \
            scripts/starfield-vr-storage-telemetry.test.mjs \
            scripts/starfield-vr-project-performance-loop.test.mjs \
            scripts/starfield-vr-crash-recovery.test.mjs \
            scripts/starfield-vr-telemetry-reporter-runtime.test.mjs

  spatial-browser-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select Spatial Workspace browser proof
        id: spatial
        env:
          SPATIAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SPATIAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SPATIAL_HEAD_SHA"
          if git diff --quiet "$SPATIAL_BASE_SHA" "$SPATIAL_HEAD_SHA" -- \
            apps/spatial-bridge 'tests/spatial-*' \
            .github/workflows/build-stephanos-ui.yml package.json; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node.js
        if: steps.spatial.outputs.required == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Spatial Workspace source tests
        if: steps.spatial.outputs.required == 'true'
        run: node --test tests/spatial-*.test.mjs
      - name: Install declared browser-test dependency
        if: steps.spatial.outputs.required == 'true'
        run: npm install --ignore-scripts --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.54.0
      - name: Install Chromium for Spatial Workspace proof
        if: steps.spatial.outputs.required == 'true'
        run: npx --no-install playwright install --with-deps chromium
      - name: Run Spatial Workspace browser proof
        if: steps.spatial.outputs.required == 'true'
        env:
          CI: 'true'
        run: node tests/spatial-workspace-comfort.browser.mjs --output-dir "${{ runner.temp }}/spatial-comfort-browser-proof"
      - name: Upload Spatial Workspace browser evidence
        if: always() && steps.spatial.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spatial-comfort-browser-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/spatial-comfort-browser-proof
          if-no-files-found: error
          retention-days: 14

  build:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.comment.user.login == 'Cheekyfellastef' &&
       github.event.comment.body == '/stephanos-deploy-pages')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: stephanos-ui/package-lock.json
      - name: Preflight frontend path and lockfile
        run: |
          echo "Frontend package path: stephanos-ui"
          test -f stephanos-ui/package.json || (echo "Missing required file: stephanos-ui/package.json" && exit 1)
          test -f stephanos-ui/package-lock.json || (echo "Missing required file: stephanos-ui/package-lock.json (run npm install in stephanos-ui and commit lockfile)" && exit 1)
      - name: Install dependencies
        working-directory: stephanos-ui
        run: npm ci
      - name: Run dependency-backed surface render test
        run: node --test --test-concurrency=1 stephanos-ui/src/components/StatusPanel.render.test.mjs
      - name: Build Stephanos UI pipeline from repo root
        run: npm run stephanos:build
      - name: Verify generated Stephanos dist from repo root
        run: npm run stephanos:verify
      - name: Upload built Stephanos dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: stephanos-ui-dist
          path: apps/stephanos/dist
          if-no-files-found: error
