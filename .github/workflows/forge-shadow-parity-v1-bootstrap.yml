name: Forge Shadow Parity V1 Bootstrap

on:
  push:
    branches:
      - feat/stephanos-forge-sidecar-v1

permissions:
  contents: write

concurrency:
  group: forge-shadow-parity-v1-bootstrap
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stephanos-forge-sidecar-v1
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact draft checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '1a7474cb00179a301a57fc06be1acb3159ba18c4'
          test "$(git diff --name-only HEAD^..HEAD)" = '.github/workflows/forge-shadow-parity-v1-bootstrap.yml'
          git merge-base --is-ancestor 245d53ba4e7caa91307859af6b7126b0a96b8faa origin/main
      - name: Add read-only shadow parity contract
        shell: bash
        run: |
          set -euo pipefail
          cat > shared/agents/forgeShadowParityV1.mjs <<'EOF'
          const SHA40 = /^[a-f0-9]{40}$/;
          const SHA256 = /^[a-f0-9]{64}$/;
          const REPOSITORY = /^[a-z0-9_.-]+\/[a-z0-9_.-]+$/i;
          const EXPLICIT_TIMEZONE = /(?:Z|[+-]\d{2}:\d{2})$/i;

          export const FORGE_SHADOW_PARITY_SCHEMA = 'stephanos.forge-shadow-parity.v1';
          export const FORGE_SHADOW_PARITY_DECISIONS = Object.freeze({
            BLOCKED: 'FORGE_SHADOW_BLOCKED',
            PARITY_REQUIRED: 'FORGE_SHADOW_PARITY_REQUIRED',
            BACKUP_REQUIRED: 'FORGE_SHADOW_BACKUP_REQUIRED',
            READY: 'FORGE_SHADOW_READ_ONLY_READY',
          });

          function text(value) {
            return String(value ?? '').trim();
          }

          function instant(value) {
            const normalized = text(value);
            const parsed = Date.parse(normalized);
            return EXPLICIT_TIMEZONE.test(normalized) && Number.isFinite(parsed) ? parsed : Number.NaN;
          }

          function integer(value) {
            return typeof value === 'number' && Number.isSafeInteger(value) ? value : Number.NaN;
          }

          function authority() {
            return Object.freeze({
              sourceMutation: false,
              githubRefWrite: false,
              forgeRefWrite: false,
              forcePush: false,
              merge: false,
              deployment: false,
              runtimeMutation: false,
              runnerRegistration: false,
              credentialCreation: false,
              publicExposure: false,
              arbitraryCommand: false,
            });
          }

          export function evaluateForgeShadowParity(input = {}) {
            const repository = text(input.repository);
            const nowMs = instant(input.nowUtc);
            const maxObservationAgeMs = integer(input.maxObservationAgeMs ?? 10 * 60 * 1000);
            const maxBackupAgeMs = integer(input.maxBackupAgeMs ?? 24 * 60 * 60 * 1000);
            const github = input.github && typeof input.github === 'object' ? input.github : {};
            const forge = input.forge && typeof input.forge === 'object' ? input.forge : {};
            const backup = input.backup && typeof input.backup === 'object' ? input.backup : {};
            const githubHead = text(github.head).toLowerCase();
            const githubTree = text(github.tree).toLowerCase();
            const forgeHead = text(forge.head).toLowerCase();
            const forgeTree = text(forge.tree).toLowerCase();
            const observedAtMs = instant(forge.observedAtUtc);
            const backupAtMs = instant(backup.completedAtUtc);
            const blockers = [];

            if (!REPOSITORY.test(repository)) blockers.push('repository-invalid');
            for (const [label, value] of [
              ['github-head', githubHead],
              ['github-tree', githubTree],
              ['forge-head', forgeHead],
              ['forge-tree', forgeTree],
              ['backup-repository-head', text(backup.repositoryHead).toLowerCase()],
            ]) {
              if (!SHA40.test(value)) blockers.push(`${label}-invalid`);
            }
            for (const [label, value] of [
              ['backup-database-digest', text(backup.databaseDigest).toLowerCase()],
              ['backup-repository-digest', text(backup.repositoryDigest).toLowerCase()],
              ['backup-artifact-digest', text(backup.artifactDigest).toLowerCase()],
            ]) {
              if (!SHA256.test(value)) blockers.push(`${label}-invalid`);
            }
            if (!Number.isFinite(nowMs)) blockers.push('now-invalid');
            if (!Number.isFinite(observedAtMs)) blockers.push('forge-observation-time-invalid');
            if (!Number.isFinite(backupAtMs)) blockers.push('backup-time-invalid');
            if (!Number.isSafeInteger(maxObservationAgeMs) || maxObservationAgeMs < 1000 || maxObservationAgeMs > 60 * 60 * 1000) {
              blockers.push('observation-age-bound-invalid');
            }
            if (!Number.isSafeInteger(maxBackupAgeMs) || maxBackupAgeMs < 60 * 1000 || maxBackupAgeMs > 7 * 24 * 60 * 60 * 1000) {
              blockers.push('backup-age-bound-invalid');
            }
            if (text(forge.mirrorMode) !== 'fetch-only') blockers.push('forge-mirror-mode-not-fetch-only');
            if (forge.writeEnabled !== false) blockers.push('forge-write-authority-not-disabled');
            if (forge.publicExposure !== false) blockers.push('forge-public-exposure-not-disabled');
            if (forge.runnerRegistrationEnabled !== false) blockers.push('forge-runner-registration-not-disabled');
            if (forge.serviceHealthy !== true) blockers.push('forge-service-health-not-proved');
            if (backup.restorable !== true) blockers.push('backup-restorability-not-proved');
            if (Number.isFinite(observedAtMs) && Number.isFinite(nowMs)) {
              if (observedAtMs > nowMs) blockers.push('forge-observation-in-future');
              else if (nowMs - observedAtMs > maxObservationAgeMs) blockers.push('forge-observation-stale');
            }
            if (Number.isFinite(backupAtMs) && Number.isFinite(nowMs)) {
              if (backupAtMs > nowMs) blockers.push('backup-in-future');
            }

            const resultBase = {
              schemaVersion: FORGE_SHADOW_PARITY_SCHEMA,
              repository,
              github: Object.freeze({ head: githubHead, tree: githubTree }),
              forge: Object.freeze({ head: forgeHead, tree: forgeTree }),
              authority: authority(),
            };

            if (blockers.length) {
              return Object.freeze({
                ...resultBase,
                valid: false,
                decision: FORGE_SHADOW_PARITY_DECISIONS.BLOCKED,
                blockers: Object.freeze([...new Set(blockers)]),
                parity: false,
                backupCurrent: false,
              });
            }

            if (githubHead !== forgeHead || githubTree !== forgeTree) {
              return Object.freeze({
                ...resultBase,
                valid: true,
                decision: FORGE_SHADOW_PARITY_DECISIONS.PARITY_REQUIRED,
                blockers: Object.freeze([]),
                parity: false,
                backupCurrent: false,
              });
            }

            const backupCurrent = text(backup.repositoryHead).toLowerCase() === githubHead
              && nowMs - backupAtMs <= maxBackupAgeMs;
            if (!backupCurrent) {
              return Object.freeze({
                ...resultBase,
                valid: true,
                decision: FORGE_SHADOW_PARITY_DECISIONS.BACKUP_REQUIRED,
                blockers: Object.freeze([]),
                parity: true,
                backupCurrent: false,
              });
            }

            return Object.freeze({
              ...resultBase,
              valid: true,
              decision: FORGE_SHADOW_PARITY_DECISIONS.READY,
              blockers: Object.freeze([]),
              parity: true,
              backupCurrent: true,
              proof: Object.freeze({
                exactObjectParity: true,
                exactTreeParity: true,
                fetchOnlyMirror: true,
                isolatedReadOnly: true,
                currentRestorableBackup: true,
              }),
            });
          }
          EOF

          cat > shared/agents/forgeShadowParityV1.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {
            FORGE_SHADOW_PARITY_DECISIONS,
            evaluateForgeShadowParity,
          } from './forgeShadowParityV1.mjs';

          const head = 'a'.repeat(40);
          const tree = 'b'.repeat(40);
          const digest = 'c'.repeat(64);

          function observation(patch = {}) {
            return {
              repository: 'Cheekyfellastef/stephan-os',
              nowUtc: '2026-08-06T13:00:00.000Z',
              maxObservationAgeMs: 600000,
              maxBackupAgeMs: 86400000,
              github: { head, tree },
              forge: {
                head,
                tree,
                observedAtUtc: '2026-08-06T12:59:00.000Z',
                mirrorMode: 'fetch-only',
                writeEnabled: false,
                publicExposure: false,
                runnerRegistrationEnabled: false,
                serviceHealthy: true,
              },
              backup: {
                completedAtUtc: '2026-08-06T12:00:00.000Z',
                repositoryHead: head,
                databaseDigest: digest,
                repositoryDigest: digest,
                artifactDigest: digest,
                restorable: true,
              },
              ...patch,
            };
          }

          test('exact read-only shadow parity with a current restorable backup becomes ready', () => {
            const result = evaluateForgeShadowParity(observation());
            assert.equal(result.valid, true);
            assert.equal(result.decision, FORGE_SHADOW_PARITY_DECISIONS.READY);
            assert.equal(result.parity, true);
            assert.equal(result.backupCurrent, true);
            assert.deepEqual(new Set(Object.values(result.authority)), new Set([false]));
          });

          test('head or tree mismatch requires parity without claiming readiness', () => {
            for (const forge of [
              { ...observation().forge, head: 'd'.repeat(40) },
              { ...observation().forge, tree: 'e'.repeat(40) },
            ]) {
              const result = evaluateForgeShadowParity(observation({ forge }));
              assert.equal(result.valid, true);
              assert.equal(result.decision, FORGE_SHADOW_PARITY_DECISIONS.PARITY_REQUIRED);
              assert.equal(result.parity, false);
            }
          });

          test('force-style mirror, writes, public exposure and runner registration fail closed', () => {
            for (const patch of [
              { mirrorMode: 'push-mirror' },
              { writeEnabled: true },
              { publicExposure: true },
              { runnerRegistrationEnabled: true },
            ]) {
              const result = evaluateForgeShadowParity(observation({ forge: { ...observation().forge, ...patch } }));
              assert.equal(result.valid, false);
              assert.equal(result.decision, FORGE_SHADOW_PARITY_DECISIONS.BLOCKED);
            }
          });

          test('stale or future Forge observations fail closed', () => {
            for (const observedAtUtc of ['2026-08-06T12:00:00.000Z', '2026-08-06T13:01:00.000Z']) {
              const result = evaluateForgeShadowParity(observation({
                forge: { ...observation().forge, observedAtUtc },
              }));
              assert.equal(result.valid, false);
            }
          });

          test('missing, stale or wrong-head backup requires proof or blocks malformed evidence', () => {
            const stale = evaluateForgeShadowParity(observation({
              backup: { ...observation().backup, completedAtUtc: '2026-08-04T12:00:00.000Z' },
            }));
            assert.equal(stale.valid, true);
            assert.equal(stale.decision, FORGE_SHADOW_PARITY_DECISIONS.BACKUP_REQUIRED);

            const wrongHead = evaluateForgeShadowParity(observation({
              backup: { ...observation().backup, repositoryHead: 'f'.repeat(40) },
            }));
            assert.equal(wrongHead.valid, true);
            assert.equal(wrongHead.decision, FORGE_SHADOW_PARITY_DECISIONS.BACKUP_REQUIRED);

            const unproved = evaluateForgeShadowParity(observation({
              backup: { ...observation().backup, restorable: false },
            }));
            assert.equal(unproved.valid, false);
          });

          test('malformed digests and timestamps never become shadow truth', () => {
            for (const patch of [
              { backup: { ...observation().backup, databaseDigest: 'bad' } },
              { nowUtc: 'not-a-time' },
              { forge: { ...observation().forge, observedAtUtc: 'not-a-time' } },
            ]) {
              const result = evaluateForgeShadowParity(observation(patch));
              assert.equal(result.valid, false);
              assert.equal(result.decision, FORGE_SHADOW_PARITY_DECISIONS.BLOCKED);
            }
          });
          EOF

          cat >> docs/architecture/stephanos-dual-forge-sidecar-v1.md <<'EOF'

          ## M2 read-only shadow parity contract

          `stephanos.forge-shadow-parity.v1` admits no installation or runtime authority. It can call a future isolated Forge shadow ready only when the observed Git commit and tree equal canonical GitHub exactly, the mirror is fetch-only, writes/public exposure/runner registration are disabled, the service observation is fresh, and a current restorable backup is bound to the same repository head. Drift becomes `FORGE_SHADOW_PARITY_REQUIRED`; missing or stale backup proof becomes `FORGE_SHADOW_BACKUP_REQUIRED`; malformed or authority-bearing evidence fails closed.
          EOF

      - name: Remove bootstrap, test and publish exact five-file draft estate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/forge-shadow-parity-v1-bootstrap.yml
          node --check shared/agents/dualForgeConstructionSidecarV1.mjs
          node --check shared/agents/dualForgeConstructionSidecarV1.test.mjs
          node --check shared/agents/forgeShadowParityV1.mjs
          node --check shared/agents/forgeShadowParityV1.test.mjs
          node --test \
            shared/agents/dualForgeConstructionSidecarV1.test.mjs \
            shared/agents/forgeShadowParityV1.test.mjs
          git add --all
          expected="$(printf '%s\n' \
            docs/architecture/stephanos-dual-forge-sidecar-v1.md \
            shared/agents/dualForgeConstructionSidecarV1.mjs \
            shared/agents/dualForgeConstructionSidecarV1.test.mjs \
            shared/agents/forgeShadowParityV1.mjs \
            shared/agents/forgeShadowParityV1.test.mjs | sort)"
          actual="$(git diff --cached --name-only 245d53ba4e7caa91307859af6b7126b0a96b8faa | sort)"
          test "$actual" = "$expected"
          git diff --cached --check 245d53ba4e7caa91307859af6b7126b0a96b8faa
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add read-only Forge shadow parity V1'
          git push origin HEAD:feat/stephanos-forge-sidecar-v1
          echo "FORGE_SHADOW_PARITY_HEAD=$(git rev-parse HEAD)"
