<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Tile</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <script type="module" src="../../shared/runtime/commandDeckReturnControls.mjs"></script>
  <script type="module" src="../../shared/runtime/tileDataContract.mjs"></script>
  <main class="music-cockpit" id="music-cockpit-root">
    <header class="cockpit-header">
      <div>
        <h1>Music Taste Cockpit</h1>
        <p>Dark Courtyard / Ghost Vocal / Serious Trance DNA</p>
      </div>
      <a class="return-link" href="../../index.html">Return to Command Deck</a>
    </header>

    <section class="top-controls">
      <label>
        Artist input
        <input id="artist-input" placeholder="Anyma, Tale Of Us, Layla Benitez" />
      </label>
      <button id="build-journey-btn" type="button">Build Journey</button>
      <button id="start-journey-btn" type="button">Start Journey</button>
      <button id="reset-btn" type="button" class="ghost">Reset</button>
      <label>
        Add track by URL
        <input id="add-track-url-input" placeholder="Spotify or YouTube URL" />
      </label>
      <button id="add-track-url-btn" type="button">Add Track</button>
      <p id="status-text" aria-live="polite">Ready. Build a journey to generate candidates.</p>
    </section>

    <section class="dashboard-grid">
      <section class="col" id="taste-col">
        <h2>Taste DNA</h2>
        <div id="positive-anchors"></div>
        <div id="reject-patterns"></div>
        <div id="rating-counts"></div>
        <div id="taste-dna-editor" class="card"><h3>Taste DNA Editor</h3><div class="actions"><input id="trait-name-input" placeholder="trait name input" /><input id="trait-weight-input" type="number" step="0.2" value="1" placeholder="optional weight input" /><select id="trait-polarity-input"><option value="positive">Add positive trait</option><option value="negative">Add negative trait</option></select><button id="save-trait-btn" type="button">save trait button</button></div><button id="ask-ai-feedback-btn" type="button" disabled>Ask AI to interpret feedback</button><div id="taste-dna-traits" class="stack"></div></div><div id="learning-signals"></div>
      </section>

      <section class="col" id="journey-col">
        <h2>Discovery Journey</h2>
        <div id="candidate-list" class="stack"></div>
      </section>

      <section class="col" id="deck-col">
        <h2>Listening Deck</h2>
        <div id="listening-deck" class="stack"></div>
      </section>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
