<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#02040a" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <title>Stephanos Spatial Bridge</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #e6f5ff; background: radial-gradient(circle at 50% -10%, rgba(51,107,178,.35), transparent 42%), #02040a; }
    .shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    header { padding: 10px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(120,216,255,.35); background: rgba(5,13,27,.94); }
    .status { color: #8ff7c1; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
    .pending { color: #ffd38a; }
    iframe { width: 100%; height: 100%; min-height: 0; border: 0; background: #02040a; }
    .error { padding: 24px; color: #ffb1b1; }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <strong>Stephanos Spatial Bridge</strong>
      <span class="status pending" id="entry-status">Quest entry shell · immersive renderer pending proof</span>
    </header>
    <iframe title="Stephanos Spatial Bridge flat staging surface" src="./index.html?quest-entry=1"></iframe>
  </main>
  <script>
    const statusNode = document.getElementById('entry-status');

    async function inspectQuestCapabilities() {
      const xrAvailable = Boolean(navigator.xr);
      let immersiveSupported = false;
      try {
        immersiveSupported = xrAvailable && await navigator.xr.isSessionSupported('immersive-vr');
      } catch {
        immersiveSupported = false;
      }

      statusNode.textContent = immersiveSupported
        ? 'Quest entry shell · immersive runtime supported · bridge renderer not connected'
        : 'Quest entry shell · flat staging mode';
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js', { scope: './' })
        .catch((error) => {
          statusNode.textContent = `Offline shell registration failed: ${error.message}`;
          statusNode.classList.add('error');
        });
    }

    inspectQuestCapabilities();
  </script>
</body>
</html>
